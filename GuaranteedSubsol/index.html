on `k`, with `T = kτ`: `u̲~_k = u̲_k`; `ū_k = ũ_k^{⋄→(k-1)τ}` (`AnbLazyState.uSub`); `ǔ_k^init = (û_k^init)^{<T}` and `û_k^init = min {ǔ_k^init, max {ū_k, T}}` (`AnbLazyState.uHatInit`); `ǔ_k = û_k^{<T}` and `û_k = max {ū_k, min {T, ǔ_k}}`; `(ũ^init)^{⋄→T} = û_k`; `t_k`, `Δ_k`, `B_k`, `η_k` and the three counters are equal; and the two programs stop at the same iteration. Hypotheses: `Γ` monotone and causal, `α > 0`, `τ ≥ 0` (those of Prop. prop:Dijkstra_band, used for the initial guesses; no property of `Λ` nor of the inner solver is needed, since both programs call the inner solver on the same data). The placeholder `⋄` is `none`. `X` is finite and linearly ordered (tie-breaking).", "notes": ["`Claude_AnbEquivalence.tex`; target of Prop. prop:correct_anb_lazy without the heaps, author's request", "placeholder `none`; author's ruling 2026-10-17", "author's request", "`ũ` in `Option ℝ`, author's ruling 2026-10-17"], "title": "the ANB with a placeholder is equivalent to the ANB", "source": "Papers/AnbEquivalence (`Claude_AnbEquivalence.tex`; target of Prop. prop:correct_anb_lazy without the heaps, author's request): the ANB with the `⋄` placeholder (`anbLazyRunWith`) is equivalent to the ANB, for any inner solver: `u̲~ = u̲`, `ũ^{⋄→(n-1)τ} = ū`, `ǔ^init = (û^init)^{<nτ}`, `û^init = min {ǔ^init, max {ū, nτ}}`, `ǔ = û^{<nτ}`, `û = max {ū, min {nτ, ǔ}}`, same `t_n`, `Δ_n`, `B_n`, `η_n`, counters and stopping index; hypotheses `Γ` monotone and causal, `α > 0`, `τ ≥ 0` (no assumption on `Λ` nor on the solver needed); `ũ` takes values in `Option ℝ` (placeholder `none`; author's ruling 2026-10-17)", "state": "PROVED", "provider": "GuaranteedSubsol.AnbLazyProof.equiv", "chapter": "Notes", "statement": "theorem anbLazyRun_equiv {X : Type*} [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    {p : AnbParams X} (hΓmono : ∀ x, Monotone (p.Γ · x)) (hΓcaus : ∀ x, Causal (p.Γ · x))\n    (hα : 0 < p.α) (hτ : 0 ≤ p.τ) :\n    (∀ k : ℕ,\n      (anbLazyRunWith S p k).uSup = (anbRunWith S p k).uSup ∧\n      (anbLazyRunWith S p k).uSub p.τ = (anbRunWith S p k).uSub ∧\n      (anbLazyRunWith S p k).uCheckInit =\n        (fun x => cutoffLt (k * p.τ) ((anbRunWith S p k).uHatInit x)) ∧\n      (anbRunWith S p k).uHatInit = (anbLazyRunWith S p k).uHatInit p.τ ∧\n      (anbLazyRunDataWith S p k).uCheck =\n        (fun x => cutoffLt (k * p.τ) ((anbRunDataWith S p k).uHat x : WithTop ℝ)) ∧\n      (∀ x, ((anbRunDataWith S p k).uHat x : WithTop ℝ) =\n        max ((anbLazyRunWith S p k).uSub p.τ x : WithTop ℝ)\n          (min ((k * p.τ : ℝ) : WithTop ℝ) ((anbLazyRunDataWith S p k).uCheck x))) ∧\n      (anbLazyRunDataWith S p k).uHat = (anbRunDataWith S p k).uHat ∧\n      (anbLazyRunDataWith S p k).t = (anbRunDataWith S p k).t ∧\n      (anbLazyRunDataWith S p k).Δ = (anbRunDataWith S p k).Δ ∧\n      (anbLazyRunDataWith S p k).band = (anbRunDataWith S p k).band ∧\n      (anbLazyRunDataWith S p k).η = (anbRunDataWith S p k).η ∧\n      (anbLazyRunWith S p k).countSub = (anbRunWith S p k).countSub ∧\n      (anbLazyRunWith S p k).countSup = (anbRunWith S p k).countSup ∧\n      (anbLazyRunWith S p k).countHat = (anbRunWith S p k).countHat) ∧\n    anbLazyStopIndexWith S p = anbStopIndexWith S p", "doc": "Source: Papers/AnbEquivalence (`Claude_AnbEquivalence.tex`), the program with the `⋄` placeholder\n(`anbLazyRunWith`, `AnbLazy.lean`), and the target of Prop. prop:correct_anb_lazy\n(Complexity.tex) without the heaps (author's request). For any inner solver `S` (in particular the\nglobal iteration of algo:anb and the parallel AGSI of th:complexity_with_agsi), at every iteration\n`k`, with `T = kτ`: `u̲~_k = u̲_k`; `ū_k = ũ_k^{⋄→(k-1)τ}` (`AnbLazyState.uSub`); `ǔ_k^init =\n(û_k^init)^{<T}` and `û_k^init = min {ǔ_k^init, max {ū_k, T}}` (`AnbLazyState.uHatInit`);\n`ǔ_k = û_k^{<T}` and `û_k = max {ū_k, min {T, ǔ_k}}`; `(ũ^init)^{⋄→T} = û_k`; `t_k`, `Δ_k`, `B_k`,\n`η_k` and the three counters are equal; and the two programs stop at the same iteration.\nHypotheses: `Γ` monotone and causal, `α > 0`, `τ ≥ 0` (those of Prop. prop:Dijkstra_band, used for\nthe initial guesses; no property of `Λ` nor of the inner solver is needed, since both programs\ncall the inner solver on the same data). The placeholder `⋄` is `none` (`ũ` in `Option ℝ`, author's\nruling 2026-10-17). `X` is finite and linearly ordered (tie-breaking).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_count_le_one", "GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq", "GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq", "GuaranteedSubsol.le_of_causal_ext", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbStep_eq_of_notMem_band", "GuaranteedSubsol.anbRun_guess_superSolution"], "labels": ["prop:correct_anb_lazy"], "direct": ["GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "GuaranteedSubsol.dijkstraRun_count_le_one", "GuaranteedSubsol.le_of_causal_ext"]}, {"id": "GuaranteedSubsol.anbLazyRun_placeholder", "short": "anbLazyRun_placeholder", "file": "Anchors/AnbLazyRunPlaceholder.lean", "pub_source": "Papers/AnbEquivalence, relation for `ũ_n`: `ũ_0 = ū_0`, and `ũ_{k+1} = ⋄` exactly where `û_k = kτ` and `ū_k < kτ`, `ũ_{k+1} = ū_{k+1}` elsewhere; any inner solver; hypotheses as for `anbLazyRun_equiv`; `ũ` takes values in `Option ℝ`", "pub_doc": "Source: Papers/AnbEquivalence (``), the relation for `ũ_n`: `ũ_n = ⋄` where `û_{n-1} = (n-1)τ` and `ū_{n-1} < (n-1)τ`, and `ũ_n = ū_n` otherwise, with `ū`, `û` from the ANB (`anbRunWith`, `anbRunDataWith`) and `ũ` from the ANB with a placeholder (`anbLazyRunWith`), for any inner solver `S`. Written for `n = k + 1`; at `n = 0` there is no placeholder (`ũ_0 = ū_0`). Hypotheses as for `anbLazyRun_equiv`. The placeholder `⋄` is `none`. `X` is finite and linearly ordered (tie-breaking).", "notes": ["author's request, separate anchor", "placeholder `none`; author's ruling 2026-10-17", "author's request, as an anchor separate from `anbLazyRun_equiv`", "`ũ` takes values in `Option ℝ`, author's ruling 2026-10-17"], "title": "where the placeholder of the ANB with a placeholder sits", "source": "Papers/AnbEquivalence, relation for `ũ_n` (author's request, separate anchor): `ũ_0 = ū_0`, and `ũ_{k+1} = ⋄` exactly where `û_k = kτ` and `ū_k < kτ`, `ũ_{k+1} = ū_{k+1}` elsewhere; any inner solver; hypotheses as for `anbLazyRun_equiv`; `ũ` takes values in `Option ℝ` (placeholder `none`; author's ruling 2026-10-17)", "state": "PROVED", "provider": "GuaranteedSubsol.AnbLazyProof.placeholder", "chapter": "Notes", "statement": "theorem anbLazyRun_placeholder {X : Type*} [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    {p : AnbParams X} (hΓmono : ∀ x, Monotone (p.Γ · x)) (hΓcaus : ∀ x, Causal (p.Γ · x))\n    (hα : 0 < p.α) (hτ : 0 ≤ p.τ) :\n    (∀ x, (anbLazyRunWith S p 0).uTilde x = some ((anbRunWith S p 0).uSub x)) ∧\n      ∀ (k : ℕ) (x : X), (anbLazyRunWith S p (k + 1)).uTilde x =\n        if (anbRunDataWith S p k).uHat x = k * p.τ ∧ (anbRunWith S p k).uSub x < k * p.τ then none\n        else some ((anbRunWith S p (k + 1)).uSub x)", "doc": "Source: Papers/AnbEquivalence (`Claude_AnbEquivalence.tex`), the relation for `ũ_n` (author's\nrequest, as an anchor separate from `anbLazyRun_equiv`): `ũ_n = ⋄` where `û_{n-1} = (n-1)τ` and\n`ū_{n-1} < (n-1)τ`, and `ũ_n = ū_n` otherwise, with `ū`, `û` from the ANB (`anbRunWith`,\n`anbRunDataWith`) and `ũ` from the ANB with a placeholder (`anbLazyRunWith`), for any inner solver\n`S`. Written for `n = k + 1`; at `n = 0` there is no placeholder (`ũ_0 = ū_0`). Hypotheses as for\n`anbLazyRun_equiv`. The placeholder `⋄` is `none` (`ũ` takes values in `Option ℝ`, author's\nruling 2026-10-17). `X` is finite and linearly ordered (tie-breaking).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_count_le_one", "GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq", "GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq", "GuaranteedSubsol.le_of_causal_ext", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbStep_eq_of_notMem_band", "GuaranteedSubsol.anbRun_guess_superSolution"], "labels": [], "direct": ["GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "GuaranteedSubsol.dijkstraRun_count_le_one", "GuaranteedSubsol.le_of_causal_ext"]}, {"id": "GuaranteedSubsol.anbHeapRun_equiv", "short": "anbHeapRun_equiv", "file": "Anchors/AnbHeapRunEquiv.lean", "pub_source": "Prop. prop:correct_anb_lazy: algo:anb_lazy with the sorted lists `L`, `M`, `S` in ordered partial maps is equivalent to the ANB with a placeholder; `τ > 0`; `ũ` takes values in `Option ℝ`", "pub_doc": "Source: Prop. prop:correct_anb_lazy, for algo:anb_lazy with the sorted lists `L`, `M`, `S` stored in ordered partial maps (`anbHeapRunWith`, `AnbHeap.lean`), compared with the ANB with a placeholder, itself equivalent to algo:anb by `anbLazyRun_equiv`. As in the paper: line anb_lazy:olu_gets_hatu also updates the points of `S` with key in `[(n-1)τ, nτ[`; there, the placeholder is set exactly when `nτ` is selected in `min {nτ, ǔ}`; a fourth list `Sc` (the keys `u̲~` of the placeholders, eq. eqdef:Sc_heap) makes the stopping test exactly that of algo:anb. For any inner solver `S`, at every iteration `k`: the super-solutions coincide; the sub-solutions `ũ^{⋄→(k-1)τ}` coincide for `k ≥ 1`; the maps `ǔ` at the start of the iteration and after Dijkstra's method coincide; after line anb_lazy:olu_gets_hatu, `ũ^{⋄→kτ} = û` and (for `k ≥ 1`) `ũ` coincides; `t_k`, `Δ_k`, `B_k`, `η_k` and the three counters coincide; the lists hold the keys of eqs. eqdef:L_heap, eqdef:M_heap, eqdef:S_heap (and of `Sc`); and the two programs stop at the same iteration. Hypotheses: `Γ` monotone, causal, with stencils `𝒱` (eq. eqdef:stencil), `α > 0`, `τ > 0`. The placeholder `⋄` is `none`. `X` is finite and linearly ordered (tie-breaking).", "notes": ["author's request", "fixes of V0, as in V1", "placeholder `none`; author's ruling 2026-10-17", "author's rulings 2026-10-16 : line anb_lazy:olu_gets_hatu also updates the points of `S` in `[(n-1)τ, nτ[`, the placeholder is set exactly when `nτ` is selected in `min {nτ, ǔ}`, and a fourth list `Sc` makes the stopping test exact", "`anbLazyRunWith`; author's request", "author's rulings 2026-10-16, fixes of V0, now in the paper", "`ũ` in `Option ℝ`, author's ruling 2026-10-17"], "title": "the ANB with sorted lists is equivalent to the ANB with a placeholder", "source": "Prop. prop:correct_anb_lazy (Complexity.tex, V1): algo:anb_lazy with the sorted lists `L`, `M`, `S` in ordered partial maps is equivalent to the ANB with a placeholder (author's request); author's rulings 2026-10-16 (fixes of V0, as in V1): line anb_lazy:olu_gets_hatu also updates the points of `S` in `[(n-1)τ, nτ[`, the placeholder is set exactly when `nτ` is selected in `min {nτ, ǔ}`, and a fourth list `Sc` makes the stopping test exact; `τ > 0`; `ũ` takes values in `Option ℝ` (placeholder `none`; author's ruling 2026-10-17)", "state": "PROVED", "provider": "GuaranteedSubsol.AnbHeapProof.equiv", "chapter": "Complexity", "statement": "theorem anbHeapRun_equiv {X : Type*} [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    {p : AnbParams X} {𝒱 : X → Set X}\n    (hst : Global.Ext.HasStencil 𝒱 (Global.monotoneExtension p.Γ))\n    (hΓmono : ∀ x, Monotone (p.Γ · x)) (hΓcaus : ∀ x, Causal (p.Γ · x)) (hα : 0 < p.α)\n    (hτ : 0 < p.τ) :\n    (∀ k : ℕ,\n      (anbHeapRunWith S p 𝒱 k).uSup = (anbLazyRunWith S p k).uSup ∧\n      (0 < k → (anbHeapRunWith S p 𝒱 k).uSub p.τ = (anbLazyRunWith S p k).uSub p.τ) ∧\n      (anbHeapRunWith S p 𝒱 k).dij.u = (anbLazyRunWith S p k).uCheckInit ∧\n      (anbHeapRunDataWith S p 𝒱 k).dij.u = (anbLazyRunDataWith S p k).uCheck ∧\n      (fun x => ((anbHeapRunDataWith S p 𝒱 k).uTildeInit x).getD (k * p.τ)) =\n        (anbLazyRunDataWith S p k).uHat ∧\n      (0 < k → (anbHeapRunDataWith S p 𝒱 k).uTildeInit = (anbLazyRunDataWith S p k).uTildeInit) ∧\n      (anbHeapRunDataWith S p 𝒱 k).t = (anbLazyRunDataWith S p k).t ∧\n      (anbHeapRunDataWith S p 𝒱 k).Δ = (anbLazyRunDataWith S p k).Δ ∧\n      ((anbHeapRunDataWith S p 𝒱 k).band : Set X) = (anbLazyRunDataWith S p k).band ∧\n      (anbHeapRunDataWith S p 𝒱 k).η = (anbLazyRunDataWith S p k).η ∧\n      (anbHeapRunWith S p 𝒱 k).countSub = (anbLazyRunWith S p k).countSub ∧\n      (anbHeapRunWith S p 𝒱 k).countSup = (anbLazyRunWith S p k).countSup ∧\n      (anbHeapRunWith S p 𝒱 k).dij.count = (anbLazyRunWith S p k).countHat ∧\n      (anbHeapRunWith S p 𝒱 k).dij.L.v = dijkstraKey\n        (anbHeapOp p.Γ ((anbLazyRunWith S p k).uSub p.τ)) (anbHeapRunWith S p 𝒱 k).dij.u ∧\n      (anbHeapRunWith S p 𝒱 k).M.v =\n        anbKeyM p.ε (anbHeapRunWith S p 𝒱 k).uTilde (anbHeapRunWith S p 𝒱 k).uSup ∧\n      (anbHeapRunWith S p 𝒱 k).S.v = anbKeyS (anbHeapRunWith S p 𝒱 k).uTilde ∧\n      (anbHeapRunWith S p 𝒱 k).Sc.v =\n        anbKeySc (anbHeapRunWith S p 𝒱 k).uTilde (anbHeapRunWith S p 𝒱 k).uSup) ∧\n    anbHeapStopIndexWith S p 𝒱 = anbLazyStopIndexWith S p", "doc": "Source: Prop. prop:correct_anb_lazy (Complexity.tex, V1), for algo:anb_lazy with the sorted lists\n`L`, `M`, `S` stored in ordered partial maps (`anbHeapRunWith`, `AnbHeap.lean`), compared with the\nANB with a placeholder (`anbLazyRunWith`; author's request), itself equivalent to algo:anb by\n`anbLazyRun_equiv`. As in V1 (author's rulings 2026-10-16, fixes of V0, now in the paper): line\nanb_lazy:olu_gets_hatu also updates the points of `S` with key in `[(n-1)τ, nτ[`; there, the\nplaceholder is set exactly when `nτ` is selected in `min {nτ, ǔ}`; a fourth list `Sc` (the keys\n`u̲~` of the placeholders, eq. eqdef:Sc_heap) makes the stopping test exactly that of algo:anb. For\nany inner solver `S`, at every iteration `k`: the super-solutions coincide; the sub-solutions\n`ũ^{⋄→(k-1)τ}` coincide for `k ≥ 1`; the maps `ǔ` at the start of the iteration and after Dijkstra's\nmethod coincide; after line anb_lazy:olu_gets_hatu, `ũ^{⋄→kτ} = û` and (for `k ≥ 1`) `ũ` coincides;\n`t_k`, `Δ_k`, `B_k`, `η_k` and the three counters coincide; the lists hold the keys of eqs.\neqdef:L_heap, eqdef:M_heap, eqdef:S_heap (and of `Sc`); and the two programs stop at the same\niteration. Hypotheses: `Γ` monotone, causal, with stencils `𝒱` (eq. eqdef:stencil), `α > 0`,\n`τ > 0`. The placeholder `⋄` is `none` (`ũ` in `Option ℝ`, author's ruling 2026-10-17). `X` is\nfinite and linearly ordered (tie-breaking).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_count_le_one", "GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq", "GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq", "GuaranteedSubsol.le_of_causal_ext", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbStep_eq_of_notMem_band", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.dijkstraHeapRun_eq", "GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff", "GuaranteedSubsol.OrderedPartialMap.entriesIco_fst", "GuaranteedSubsol.dijkstraHeapLoop_correct"], "labels": ["prop:correct_anb_lazy", "algo:anb_lazy", "anb_lazy:olu_gets_hatu"], "direct": ["GuaranteedSubsol.OrderedPartialMap.entriesIco_fst", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.dijkstraHeapLoop_correct", "GuaranteedSubsol.le_of_causal_ext"]}, {"id": "GuaranteedSubsol.anbHeapRun_cost", "short": "anbHeapRun_cost", "file": "Anchors/AnbHeapRunCost.lean", "pub_source": "Prop. prop:complexity_lazy, generic cost accounting of algo:anb_lazy with sorted lists: evaluations of `Γ` and operations on `L`, `M`, `S`, `Sc` after `K` iterations, per point, in terms of `countB'` (selections by Dijkstra's method, `anbHeapCountB'`) and `countB` (iterations in the band, `anbHeapCountB`); `ũ` takes values in `Option ℝ`", "pub_doc": "Source: Prop. prop:complexity_lazy, generic part, for algo:anb_lazy with sorted lists (`anbHeapRunWith`, `AnbHeap.lean`) and any inner solver `S`. After `K` iterations, with `N:= #X`, `𝒱̃` the reversed stencils, `countB'(x)` the number of selections of `x` in line anb_lazy:Dijkstra (line Dijkstra:accept; updates by Dijkstra's method, which only occur in the bands `B'_n`; `anbHeapCountB'`) and `countB(x)` the number of iterations `k < K` with `x ∈ B_k`: * the number of evaluations of `Γ` is at most `N + ∑ₓ countB'(x) #𝒱̃(x) + ∑ₓ countB(x) (1 + #𝒱̃(x))` (`N` evaluations to build `L`); * the number of operations on the lists `L`, `M`, `S`, `Sc` is at most `2N + 4K + ∑ₓ countB'(x) (5 + #𝒱̃(x)) + ∑ₓ countB(x) (12 + #𝒱̃(x))` (`2N` to build `L` and `Sc`). Hypotheses: those of `anbHeapRun_equiv` (`Γ` monotone, causal, with stencils `𝒱`, `α > 0`, `τ > 0`). `X` is finite and linearly ordered (tie-breaking).", "notes": ["author's request", "placeholder `none`; author's ruling 2026-10-17", "names chosen by the author (2026-10-16)", "author's request", "`anbHeapCountB`; names chosen by the author"], "title": "cost accounting of the ANB with sorted lists", "source": "Prop. prop:complexity_lazy (Complexity.tex, V1), generic cost accounting of algo:anb_lazy with sorted lists (author's request): evaluations of `Γ` and operations on `L`, `M`, `S`, `Sc` after `K` iterations, per point, in terms of `countB'` (selections by Dijkstra's method, `anbHeapCountB'`) and `countB` (iterations in the band, `anbHeapCountB`); names chosen by the author (2026-10-16); `ũ` takes values in `Option ℝ` (placeholder `none`; author's ruling 2026-10-17)", "state": "PROVED", "provider": "GuaranteedSubsol.AnbHeapCostProof.cost", "chapter": "Complexity", "statement": "theorem anbHeapRun_cost {X : Type*} [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    {p : AnbParams X} {𝒱 : X → Set X}\n    (hst : Global.Ext.HasStencil 𝒱 (Global.monotoneExtension p.Γ))\n    (hΓmono : ∀ x, Monotone (p.Γ · x)) (hΓcaus : ∀ x, Causal (p.Γ · x)) (hα : 0 < p.α)\n    (hτ : 0 < p.τ) (K : ℕ) :\n    (anbHeapRunWith S p 𝒱 K).dij.evalCount ≤ Fintype.card X +\n      ∑ x, anbHeapCountB' S p 𝒱 K x * (Global.Ext.revStencil 𝒱 x).card +\n      ∑ x, anbHeapCountB S p 𝒱 K x * (1 + (Global.Ext.revStencil 𝒱 x).card) ∧\n    (anbHeapRunWith S p 𝒱 K).dij.L.count + (anbHeapRunWith S p 𝒱 K).M.count +\n      (anbHeapRunWith S p 𝒱 K).S.count + (anbHeapRunWith S p 𝒱 K).Sc.count ≤\n      2 * Fintype.card X + 4 * K +\n      ∑ x, anbHeapCountB' S p 𝒱 K x * (5 + (Global.Ext.revStencil 𝒱 x).card) +\n      ∑ x, anbHeapCountB S p 𝒱 K x * (12 + (Global.Ext.revStencil 𝒱 x).card)", "doc": "Source: Prop. prop:complexity_lazy (Complexity.tex, V1), generic part (author's request), for\nalgo:anb_lazy with sorted lists (`anbHeapRunWith`, `AnbHeap.lean`) and any inner solver `S`. After\n`K` iterations, with `N := #X`, `𝒱̃` the reversed stencils, `countB'(x)` the number of selections of\n`x` in line anb_lazy:Dijkstra (line Dijkstra:accept; updates by Dijkstra's method, which only occur\nin the bands `B'_n`; `anbHeapCountB'`) and `countB(x)` the number of iterations `k < K` with\n`x ∈ B_k` (`anbHeapCountB`; names chosen by the author):\n* the number of evaluations of `Γ` is at most `N + ∑ₓ countB'(x) #𝒱̃(x) + ∑ₓ countB(x) (1 + #𝒱̃(x))`\n  (`N` evaluations to build `L`);\n* the number of operations on the lists `L`, `M`, `S`, `Sc` is at most\n  `2N + 4K + ∑ₓ countB'(x) (5 + #𝒱̃(x)) + ∑ₓ countB(x) (12 + #𝒱̃(x))` (`2N` to build `L` and\n  `Sc`).\nHypotheses: those of `anbHeapRun_equiv` (`Γ` monotone, causal, with stencils `𝒱`, `α > 0`,\n`τ > 0`). `X` is finite and linearly ordered (tie-breaking).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_count_le_one", "GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq", "GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq", "GuaranteedSubsol.le_of_causal_ext", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbStep_eq_of_notMem_band", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.dijkstraHeapRun_eq", "GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff", "GuaranteedSubsol.OrderedPartialMap.entriesIco_fst", "GuaranteedSubsol.dijkstraHeapLoop_correct"], "labels": ["prop:complexity_lazy", "algo:anb_lazy"], "direct": ["GuaranteedSubsol.OrderedPartialMap.entriesIco_fst", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.dijkstraHeapLoop_correct", "GuaranteedSubsol.le_of_causal_ext"]}, {"id": "GuaranteedSubsol.anbHeapRun_cost_le", "short": "anbHeapRun_cost_le", "file": "Anchors/AnbHeapRunCostLe.lean", "pub_source": "Prop. prop:complexity_lazy, eq. eq:anb_cost from uniform bounds `NΓ` (on `countB'`), `NΛ'` (on `countB`), `NΛ` (updates by the inner loops), `Kmax` (iterations); `ũ` takes values in `Option ℝ`", "pub_doc": "Source: Prop. prop:complexity_lazy, eq. eq:anb_cost, from uniform bounds. For algo:anb_lazy with sorted lists and any inner solver `S`: if `countB' ≤ N_Γ` (selections by Dijkstra's method, `anbHeapCountB'`), `countB ≤ N'_Λ` (iterations in the band, `anbHeapCountB`), each point is updated at most `N_Λ` times by each of the two inner loops (in total, `N_Λ = N'_Λ N''_Λ` in the instances), and the method stops within `Kmax` iterations (`⌈n_max⌉ + 1`), then at termination, with `N:= #X` and `Ñ:= ∑ₓ #𝒱̃(x)` (eq. eqdef:stencil_card): at most `2 N N_Λ` updates by the inner loops (evaluations of `Λ`), at most `N + Ñ N_Γ + (N + Ñ) N'_Λ` evaluations of `Γ`, and at most `2N + 4 Kmax + N_Γ (5N + Ñ) + N'_Λ (12N + Ñ)` operations on the lists `L`, `M`, `S`, `Sc`, each of cost `O(ln N)`. The cost `O(Ñ ln Ñ)` of the reversed stencils is not modelled. Hypotheses: those of `anbHeapRun_equiv`. `X` is finite and linearly ordered (tie-breaking).", "notes": ["author's request; the instances for th:complexity, th:complexity_withUnknown, th:complexity_with_agsi are ordinary theorems in `AnbHeapComplexity.lean`, author's decision", "placeholder `none`; author's ruling 2026-10-17", "names chosen by the author (2026-10-16)", "author's request; the instances for Theorems th:complexity, th:complexity_withUnknown and th:complexity_with_agsi are in `AnbHeapComplexity.lean`", "Names chosen by the author"], "title": "complexity of the ANB with sorted lists under uniform bounds", "source": "Prop. prop:complexity_lazy (Complexity.tex, V1), eq. eq:anb_cost from uniform bounds `NΓ` (on `countB'`), `NΛ'` (on `countB`), `NΛ` (updates by the inner loops), `Kmax` (iterations); names chosen by the author (2026-10-16) (author's request; the instances for th:complexity, th:complexity_withUnknown, th:complexity_with_agsi are ordinary theorems in `AnbHeapComplexity.lean`, author's decision); `ũ` takes values in `Option ℝ` (placeholder `none`; author's ruling 2026-10-17)", "state": "PROVED", "provider": "GuaranteedSubsol.AnbHeapCostProof.cost_le", "chapter": "Complexity", "statement": "theorem anbHeapRun_cost_le {X : Type*} [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    {p : AnbParams X} {𝒱 : X → Set X}\n    (hst : Global.Ext.HasStencil 𝒱 (Global.monotoneExtension p.Γ))\n    (hΓmono : ∀ x, Monotone (p.Γ · x)) (hΓcaus : ∀ x, Causal (p.Γ · x)) (hα : 0 < p.α)\n    (hτ : 0 < p.τ) (NΓ NΛ' NΛ Kmax : ℕ) (hcountB' : ∀ K x, anbHeapCountB' S p 𝒱 K x ≤ NΓ)\n    (hcountB : ∀ K x, anbHeapCountB S p 𝒱 K x ≤ NΛ')\n    (hcountΛ : ∀ K x, (anbHeapRunWith S p 𝒱 K).countSub x ≤ NΛ ∧\n      (anbHeapRunWith S p 𝒱 K).countSup x ≤ NΛ)\n    (hstop : anbHeapStopIndexWith S p 𝒱 ≤ Kmax) :\n    ∑ x, ((anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).countSub x +\n        (anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).countSup x) ≤\n      ((2 * Fintype.card X * NΛ : ℕ) : ℕ∞) ∧\n    (anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).dij.evalCount ≤\n      Fintype.card X + (∑ x, (Global.Ext.revStencil 𝒱 x).card) * NΓ +\n        (Fintype.card X + ∑ x, (Global.Ext.revStencil 𝒱 x).card) * NΛ' ∧\n    (anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).dij.L.count +\n      (anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).M.count +\n      (anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).S.count +\n      (anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).Sc.count ≤\n      2 * Fintype.card X + 4 * Kmax +\n        NΓ * (5 * Fintype.card X + ∑ x, (Global.Ext.revStencil 𝒱 x).card) +\n        NΛ' * (12 * Fintype.card X + ∑ x, (Global.Ext.revStencil 𝒱 x).card)", "doc": "Source: Prop. prop:complexity_lazy (Complexity.tex, V1), eq. eq:anb_cost, from uniform bounds\n(author's request; the instances for Theorems th:complexity, th:complexity_withUnknown and\nth:complexity_with_agsi are in `AnbHeapComplexity.lean`). For algo:anb_lazy with sorted lists and\nany inner solver `S`: if `countB' ≤ N_Γ` (selections by Dijkstra's method, `anbHeapCountB'`),\n`countB ≤ N'_Λ` (iterations in the band, `anbHeapCountB`), each point is updated at most `N_Λ`\ntimes by each of the two inner loops (in total, `N_Λ = N'_Λ N''_Λ` in the instances), and the method\nstops within `Kmax` iterations (`⌈n_max⌉ + 1`), then at termination, with `N := #X` and\n`Ñ := ∑ₓ #𝒱̃(x)` (eq. eqdef:stencil_card): at most `2 N N_Λ` updates by the inner loops (evaluations\nof `Λ`), at most `N + Ñ N_Γ + (N + Ñ) N'_Λ` evaluations of `Γ`, and at most\n`2N + 4 Kmax + N_Γ (5N + Ñ) + N'_Λ (12N + Ñ)` operations on the lists `L`, `M`, `S`, `Sc`, each of\ncost `O(ln N)`. The cost `O(Ñ ln Ñ)` of the reversed stencils is not modelled. Names chosen by the\nauthor.\nHypotheses: those of `anbHeapRun_equiv`. `X` is finite and linearly ordered (tie-breaking).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_count_le_one", "GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq", "GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq", "GuaranteedSubsol.le_of_causal_ext", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbStep_eq_of_notMem_band", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.anbHeapRun_cost", "GuaranteedSubsol.dijkstraHeapRun_eq", "GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff", "GuaranteedSubsol.OrderedPartialMap.entriesIco_fst", "GuaranteedSubsol.dijkstraHeapLoop_correct"], "labels": ["prop:complexity_lazy", "eq:anb_cost", "th:complexity", "th:complexity_withUnknown", "th:complexity_with_agsi"], "direct": ["GuaranteedSubsol.anbHeapRun_cost"]}, {"id": "GuaranteedSubsol.dijkstraHeapRun_eq", "short": "dijkstraHeapRun_eq", "file": "Anchors/DijkstraHeapRunEq.lean", "pub_source": "algo:Dijkstra with the sorted list `L` (invariant eq. eq:Dijkstra_prop) stored in an ordered partial map (Papers/OrderedPartialMap), stencils (eq. eqdef:stencil) and the stopping time `T` of algo:Dijkstra: from any state with `L.v = dijkstraKey Γ u`, it follows `dijkstraRun` for `Γ^{<T}` (same `u`, counts), keeps the keys, and costs `∑ count · #𝒱̃` evaluations of `Γ` and `n + ∑ count · (1 + #𝒱̃)` operations on `L`; hypothesis: stencil property of `Γ`", "pub_doc": "Source: algo:Dijkstra  with the sorted list `L` (its invariant is eq. eq:Dijkstra_prop, right) stored in an ordered partial map, with the stencils `𝒱` of eq. eqdef:stencil and the stopping time `T` of algo:Dijkstra (the paper: the method stops when the smallest key is `≥ T`, as needed in the ANB). Starting from any state whose list holds the keys of the active points (`L.v = dijkstraKey Γ u`, as in the ANB where `L` is given), after `n` iterations: the map `u` and the acceptance counts coincide with those of algo:Dijkstra without stopping time (`dijkstraRun`) applied to `Γ^{<T}` (`dijkstraCutOp`; `Γ^{<⊤} = Γ`), as in the proof of Prop. prop:Dijkstra_correct; the list still holds the keys of the active points; the number of evaluations of `Γ` has increased by `∑ₓ count(x) · #𝒱̃(x)`, and the number of operations on `L` by `n + ∑ₓ count(x) · (1 + #𝒱̃(x))`, where `count` is the number of acceptances in algo:Dijkstra and `𝒱̃` the reversed stencil. The only hypothesis is the stencil property of `Γ`. `X` is finite and linearly ordered (tie-breaking).", "notes": ["V1; author's request", "two counters, author's ruling", "Papers/OrderedPartialMap, author's request; `dijkstraHeapRun`", "author's ruling: two separate counters"], "title": "Dijkstra's method with a sorted list and a threshold", "source": "algo:Dijkstra with the sorted list `L` (invariant eq. eq:Dijkstra_prop) stored in an ordered partial map (Papers/OrderedPartialMap), stencils (eq. eqdef:stencil) and the stopping time `T` of algo:Dijkstra (V1; author's request): from any state with `L.v = dijkstraKey Γ u`, it follows `dijkstraRun` for `Γ^{<T}` (same `u`, counts), keeps the keys, and costs `∑ count · #𝒱̃` evaluations of `Γ` and `n + ∑ count · (1 + #𝒱̃)` operations on `L` (two counters, author's ruling); hypothesis: stencil property of `Γ`", "state": "PROVED", "provider": "GuaranteedSubsol.DijkstraHeapProof.run_spec", "chapter": "Notes", "statement": "theorem dijkstraHeapRun_eq {X : Type*} [Fintype X] [LinearOrder X]\n    {Γ : (X → WithTop ℝ) → X → WithTop ℝ} {𝒱 : X → Set X} (hst : Global.Ext.HasStencil 𝒱 Γ)\n    (T : WithTop ℝ) (s₀ : DijkstraHeapState X) (hL : s₀.L.v = dijkstraKey Γ s₀.u) (n : ℕ) :\n    (dijkstraHeapRun Γ 𝒱 T s₀ n).u = (dijkstraRun (dijkstraCutOp T Γ) s₀.u n).u ∧\n    (dijkstraHeapRun Γ 𝒱 T s₀ n).count =\n      s₀.count + (dijkstraRun (dijkstraCutOp T Γ) s₀.u n).count ∧\n    (dijkstraHeapRun Γ 𝒱 T s₀ n).L.v = dijkstraKey Γ (dijkstraHeapRun Γ 𝒱 T s₀ n).u ∧\n    (dijkstraHeapRun Γ 𝒱 T s₀ n).evalCount = s₀.evalCount +\n      ∑ x, (dijkstraRun (dijkstraCutOp T Γ) s₀.u n).count x * (Global.Ext.revStencil 𝒱 x).card ∧\n    (dijkstraHeapRun Γ 𝒱 T s₀ n).L.count = s₀.L.count + n +\n      ∑ x, (dijkstraRun (dijkstraCutOp T Γ) s₀.u n).count x *\n        (1 + (Global.Ext.revStencil 𝒱 x).card)", "doc": "Source: algo:Dijkstra (Complexity.tex) with the sorted list `L` (its invariant is eq.\neq:Dijkstra_prop, right) stored in an ordered partial map (Papers/OrderedPartialMap, author's\nrequest; `dijkstraHeapRun`), with the stencils `𝒱` of eq. eqdef:stencil and the stopping time `T`\nof algo:Dijkstra (V1: the method stops when the smallest key is `≥ T`, as needed in the ANB).\nStarting from any state whose list holds the keys of the active points (`L.v = dijkstraKey Γ u`, as\nin the ANB where `L` is given), after `n` iterations: the map `u` and the acceptance counts coincide\nwith those of algo:Dijkstra without stopping time (`dijkstraRun`) applied to `Γ^{<T}`\n(`dijkstraCutOp`; `Γ^{<⊤} = Γ`), as in the proof of Prop. prop:Dijkstra_correct; the list still\nholds the keys of the active points; the number of evaluations of `Γ` has increased by\n`∑ₓ count(x) · #𝒱̃(x)`, and the number of operations on `L` by `n + ∑ₓ count(x) · (1 + #𝒱̃(x))`,\nwhere `count` is the number of acceptances in algo:Dijkstra and `𝒱̃` the reversed stencil (author's\nruling: two separate counters). The only hypothesis is the stencil property of `Γ`. `X` is finite\nand linearly ordered (tie-breaking).", "deps": ["GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff"], "labels": ["algo:Dijkstra", "eq:Dijkstra_prop", "eqdef:stencil"], "direct": ["GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff"]}, {"id": "GuaranteedSubsol.dijkstraHeapInit_run_eq", "short": "dijkstraHeapInit_run_eq", "file": "Anchors/DijkstraHeapInitRunEq.lean", "pub_source": "Same, started from scratch (`dijkstraHeapInit`) with stopping time `T = ∞`: follows `dijkstraRun`, with `#X + ∑ count · #𝒱̃` evaluations of `Γ` and `#X + n + ∑ count · (1 + #𝒱̃)` operations on `L`", "pub_doc": "Source: algo:Dijkstra  with the sorted list `L` (its invariant is eq. eq:Dijkstra_prop, right) stored in an ordered partial map, started from scratch (`dijkstraHeapInit`: `L` filled with the keys of all the points) and with the stopping time `T = ∞` (`⊤`) of algo:Dijkstra: after `n` iterations, the map `u` and the acceptance counts coincide with those of algo:Dijkstra (`dijkstraRun`), the list holds the keys of the active points, the number of evaluations of `Γ` is `#X + ∑ₓ count(x) · #𝒱̃(x)` and the number of operations on `L` is `#X + n + ∑ₓ count(x) · (1 + #𝒱̃(x))`, where `𝒱̃` is the reversed stencil. The only hypothesis is the stencil property of `Γ`. `X` is finite and linearly ordered (tie-breaking).", "notes": ["Papers/OrderedPartialMap, author's request"], "title": "Dijkstra's method with a sorted list, from scratch", "source": "Same, started from scratch (`dijkstraHeapInit`) with stopping time `T = ∞`: follows `dijkstraRun`, with `#X + ∑ count · #𝒱̃` evaluations of `Γ` and `#X + n + ∑ count · (1 + #𝒱̃)` operations on `L`", "state": "PROVED", "provider": "GuaranteedSubsol.DijkstraHeapProof.init_run_spec", "chapter": "Notes", "statement": "theorem dijkstraHeapInit_run_eq {X : Type*} [Fintype X] [LinearOrder X]\n    {Γ : (X → WithTop ℝ) → X → WithTop ℝ} {𝒱 : X → Set X} (hst : Global.Ext.HasStencil 𝒱 Γ)\n    (u₀ : X → WithTop ℝ) (n : ℕ) :\n    (dijkstraHeapRun Γ 𝒱 ⊤ (dijkstraHeapInit Γ u₀) n).u = (dijkstraRun Γ u₀ n).u ∧\n    (dijkstraHeapRun Γ 𝒱 ⊤ (dijkstraHeapInit Γ u₀) n).count = (dijkstraRun Γ u₀ n).count ∧\n    (dijkstraHeapRun Γ 𝒱 ⊤ (dijkstraHeapInit Γ u₀) n).L.v =\n      dijkstraKey Γ (dijkstraHeapRun Γ 𝒱 ⊤ (dijkstraHeapInit Γ u₀) n).u ∧\n    (dijkstraHeapRun Γ 𝒱 ⊤ (dijkstraHeapInit Γ u₀) n).evalCount = Fintype.card X +\n      ∑ x, (dijkstraRun Γ u₀ n).count x * (Global.Ext.revStencil 𝒱 x).card ∧\n    (dijkstraHeapRun Γ 𝒱 ⊤ (dijkstraHeapInit Γ u₀) n).L.count = Fintype.card X + n +\n      ∑ x, (dijkstraRun Γ u₀ n).count x * (1 + (Global.Ext.revStencil 𝒱 x).card)", "doc": "Source: algo:Dijkstra (Complexity.tex) with the sorted list `L` (its invariant is eq.\neq:Dijkstra_prop, right) stored in an ordered partial map (Papers/OrderedPartialMap, author's\nrequest), started from scratch (`dijkstraHeapInit`: `L` filled with the keys of all the points)\nand with the stopping time `T = ∞` (`⊤`) of algo:Dijkstra:\nafter `n` iterations, the map `u` and the acceptance counts coincide with those of algo:Dijkstra\n(`dijkstraRun`), the list holds the keys of the active points, the number of evaluations of `Γ` is\n`#X + ∑ₓ count(x) · #𝒱̃(x)` and the number of operations on `L` is\n`#X + n + ∑ₓ count(x) · (1 + #𝒱̃(x))`, where `𝒱̃` is the reversed stencil. The only hypothesis is\nthe stencil property of `Γ`. `X` is finite and linearly ordered (tie-breaking).", "deps": ["GuaranteedSubsol.dijkstraHeapRun_eq", "GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff"], "labels": ["algo:Dijkstra", "eq:Dijkstra_prop", "eqdef:stencil"], "direct": ["GuaranteedSubsol.dijkstraHeapRun_eq"]}, {"id": "GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff", "short": "OrderedPartialMap.botVal_eq_none_iff", "file": "Anchors/OrderedPartialMapBotValEqNoneIff.lean", "pub_source": "Papers/OrderedPartialMap, operation bot: `bot` returns nothing iff the map is empty", "pub_doc": "Source: Papers/OrderedPartialMap (``), operation bot: `botVal v` (the first component of `bot`) is `none` iff `v x = ⋄` (`none`) for all `x`. `X` is finite and linearly ordered, `V` linearly ordered.", "notes": ["author's request", "author's request"], "title": "`bot` of an ordered partial map returns nothing iff the map is empty", "source": "Papers/OrderedPartialMap, operation bot (author's request): `bot` returns nothing iff the map is empty", "state": "PROVED", "provider": "GuaranteedSubsol.OrderedPartialMapProof.botVal_eq_none_iff", "chapter": "Notes", "statement": "theorem botVal_eq_none_iff {X V : Type*} [Fintype X] [LinearOrder X] [LinearOrder V]\n    {v : X → Option V} :\n    botVal v = none ↔ ∀ x, v x = none", "doc": "Source: Papers/OrderedPartialMap (`OrderedPartialMap.tex`), operation bot (author's request):\n`botVal v` (the first component of `bot`) is `none` iff `v x = ⋄` (`none`) for all `x`. `X` is\nfinite and linearly ordered, `V` linearly ordered.", "deps": [], "labels": [], "direct": []}, {"id": "GuaranteedSubsol.OrderedPartialMap.botVal_eq_some_iff", "short": "OrderedPartialMap.botVal_eq_some_iff", "file": "Anchors/OrderedPartialMapBotValEqSomeIff.lean", "pub_source": "Papers/OrderedPartialMap, operation bot: `bot` returns `(t, x)` iff `v x = t` and `(t, x)` is lexicographically minimal among the entries (value first)", "pub_doc": "Source: Papers/OrderedPartialMap (``), operation bot: `botVal v` (the first component of `bot`) is `(t, x)` iff `v x = t` and `(t, x)` is minimal among the entries `(t', y)` (`v y = t'`) for the lexicographic order of `V ×ₗ X` (value first, ties broken by the order of `X`). `X` is finite and linearly ordered, `V` linearly ordered.", "notes": ["author's request", "author's request"], "title": "`bot` of an ordered partial map returns the smallest entry", "source": "Papers/OrderedPartialMap, operation bot (author's request): `bot` returns `(t, x)` iff `v x = t` and `(t, x)` is lexicographically minimal among the entries (value first)", "state": "PROVED", "provider": "GuaranteedSubsol.OrderedPartialMapProof.botVal_eq_some_iff", "chapter": "Notes", "statement": "theorem botVal_eq_some_iff {X V : Type*} [Fintype X] [LinearOrder X] [LinearOrder V]\n    {v : X → Option V} {t : V} {x : X} :\n    botVal v = some (t, x) ↔\n      v x = some t ∧ ∀ y t', v y = some t' → toLex (t, x) ≤ toLex (t', y)", "doc": "Source: Papers/OrderedPartialMap (`OrderedPartialMap.tex`), operation bot (author's request):\n`botVal v` (the first component of `bot`) is `(t, x)` iff `v x = t` and `(t, x)` is minimal among\nthe entries `(t', y)` (`v y = t'`) for the lexicographic order of `V ×ₗ X` (value first, ties\nbroken by the order of `X`). `X` is finite and linearly ordered, `V` linearly ordered.", "deps": ["GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff"], "labels": [], "direct": ["GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff"]}, {"id": "GuaranteedSubsol.OrderedPartialMap.entriesIco_fst", "short": "OrderedPartialMap.entriesIco_fst", "file": "Anchors/OrderedPartialMapEntriesIcoFst.lean", "pub_source": "Papers/OrderedPartialMap, operation range named `entriesIco`: the output is the set of points with an entry in `[Tm, Tp)`", "pub_doc": "Source: Papers/OrderedPartialMap (``), operation range, named `entriesIco` following Mathlib's naming of intervals: its output is the set of points `x` with an entry `v x = t` such that `Tm ≤ t < Tp`. `X` is finite, `V` linearly ordered.", "notes": ["author's request", "author's request"], "title": "`entriesIco` of an ordered partial map returns the entries in `[Tm, Tp)`", "source": "Papers/OrderedPartialMap, operation range named `entriesIco` (author's request): the output is the set of points with an entry in `[Tm, Tp)`", "state": "PROVED", "provider": "GuaranteedSubsol.OrderedPartialMapProof.entriesIco_fst", "chapter": "Notes", "statement": "theorem entriesIco_fst {X V : Type*} [Fintype X] [LinearOrder V] (m : OrderedPartialMap X V)\n    (Tm Tp : V) (x : X) :\n    x ∈ (m.entriesIco Tm Tp).1 ↔ ∃ t, m.v x = some t ∧ Tm ≤ t ∧ t < Tp", "doc": "Source: Papers/OrderedPartialMap (`OrderedPartialMap.tex`), operation range, named `entriesIco`\nfollowing Mathlib's naming of intervals (author's request): its output is the set of points `x`\nwith an entry `v x = t` such that `Tm ≤ t < Tp`. `X` is finite, `V` linearly ordered.", "deps": [], "labels": [], "direct": []}, {"id": "GuaranteedSubsol.agsikStep_superSolution", "short": "agsikStep_superSolution", "file": "Anchors/AgsikStepSuperSolution.lean", "pub_source": "Algo. algo:agsik, invariant `Λ u ≤ u`", "pub_doc": "Source: Algorithm algo:agsik, \"Ensures at termination: `Λ u ≤ u`\": for a monotone `Λ` on `ℝ_∞`, if `Λ u ≤ u` (e.g. `u = +∞` at initialization), this remains true at all times.", "notes": [], "title": "the AGSIK preserves super-solutions", "source": "Algo. algo:agsik (AGSI2.tex), invariant `Λ u ≤ u`", "state": "PROVED", "provider": "GuaranteedSubsol.AgsikProof.superSolution", "chapter": "AGSI2", "statement": "theorem agsikStep_superSolution {X : Type*} {Λ : (X → WithTop ℝ) → X → WithTop ℝ}\n    (hmono : Monotone Λ) (αinv ε : ℝ) {s : AgsikState X} (hs : Λ s.u ≤ s.u) (k : ℕ) :\n    Λ ((agsikStep Λ αinv ε)^[k] s).u ≤ ((agsikStep Λ αinv ε)^[k] s).u", "doc": "Source: Algorithm algo:agsik (AGSI2.tex), \"Ensures at termination: `Λ u ≤ u`\": for a monotone\n`Λ` on `ℝ_∞`, if `Λ u ≤ u` (e.g. `u = +∞` at initialization), this remains true at all times.", "deps": [], "labels": ["algo:agsik"], "direct": []}, {"id": "GuaranteedSubsol.agsikRun_terminates", "short": "agsikRun_terminates", "file": "Anchors/AgsikRunTerminates.lean", "pub_source": "Algo. algo:agsik, termination", "pub_doc": "Source: Algorithm algo:agsik; `X` is finite.", "notes": ["V0 formalizationInstruction, removed in V1; author's request", "author ruling", "renamed to the naming scheme", "author's request", "the termination claim is from a V0 `\\formalizationInstruction`, removed in V1 : if `Λ` is monotone on `ℝ_∞`, satisfies the comparison principle and admits a finite sub-solution `w`, then the AGSIK started from `u = +∞`, with `ε > 0` and `α > 0` (`αinv = 1/α`), reaches the stopping criterion `u ≤ Λ u + ε` after finitely many steps (no a-priori bound)"], "title": "termination of the AGSIK", "source": "Algo. algo:agsik (AGSI2.tex), termination (V0 formalizationInstruction, removed in V1; author's request); renamed to the naming scheme (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.AgsikProof.terminates", "chapter": "AGSI2", "statement": "theorem agsikRun_terminates {X : Type*} [Finite X] {Λ : (X → WithTop ℝ) → X → WithTop ℝ}\n    (hmono : Monotone Λ) (hcomp : Ext.HasComparisonPrinciple Set.univ Λ) {w : X → ℝ}\n    (hw : ∀ x, (w x : WithTop ℝ) ≤ Λ (fun y => (w y : WithTop ℝ)) x) {αinv ε : ℝ}\n    (hαinv : 0 < αinv) (hε : 0 < ε) :\n    ∃ k, agsikDone Λ ε (agsikRun Λ αinv ε k).u", "doc": "Source: Algorithm algo:agsik (AGSI2.tex); the termination claim is from a V0\n`\\formalizationInstruction`, removed in V1 (author's request): if `Λ` is monotone on `ℝ_∞`,\nsatisfies the comparison principle and admits a finite sub-solution `w`, then the AGSIK started from\n`u = +∞`, with `ε > 0` and `α > 0` (`αinv = 1/α`), reaches the stopping criterion `u ≤ Λ u + ε`\nafter finitely many steps (no a-priori bound). `X` is finite.", "deps": ["GuaranteedSubsol.agsikStep_superSolution"], "labels": ["algo:agsik"], "direct": ["GuaranteedSubsol.agsikStep_superSolution"]}, {"id": "GuaranteedSubsol.agsikRun_terminates_of_kruzkov", "short": "agsikRun_terminates_of_kruzkov", "file": "Anchors/AgsikRunTerminatesOfKruzkov.lean", "pub_source": "Algo. algo:agsik, termination  for `Λ_∞` with `Φ_β` `ρ`-sub-additive; restated with `Global.monotoneExtension` in place of the inline extension, equal by definition", "pub_doc": "Source: Algorithm algo:agsik; Stated for the extension `Λ_∞` of a real operator `Λ`: if `Λ` is monotone, its Kruzkov transform `Φ_β` is `ρ`-sub-additive with `β > 0` and `ρ < 1`, and `Λ` admits a finite sub-solution `w`, then the AGSIK applied to `Λ_∞` (timescale `α = 1/αinv > 0`, unrelated to `β`, tolerance `ε > 0`) reaches its stopping criterion after finitely many steps. No causality is assumed. `X` is finite.", "notes": ["V0 formalizationInstruction, removed in V1", "author's request", "author ruling", "author ruling", "renamed to the naming scheme", "author's request", "the termination claim is from a V0 `\\formalizationInstruction`, removed in V1"], "title": "termination of the AGSIK for the extension of a real scheme", "source": "Algo. algo:agsik (AGSI2.tex), termination (V0 formalizationInstruction, removed in V1) for `Λ_∞` with `Φ_β` `ρ`-sub-additive (author's request); restated with `Global.monotoneExtension` in place of the inline extension, equal by definition (author ruling); renamed to the naming scheme (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.AgsikKruzkovProof.agsikRun_terminates_of_kruzkov", "chapter": "AGSI2", "statement": "theorem agsikRun_terminates_of_kruzkov {X : Type*} [Finite X] {Λ : (X → ℝ) → X → ℝ}\n    (hmono : ∀ x, Monotone (Λ · x)) {β ρ : ℝ} (hβ : 0 < β) (hρ : ρ < 1)\n    (hsub : ∀ x, SubAdditive ρ (kruzkovOp β (Λ · x))) {w : X → ℝ} (hw : w ≤ Λ w)\n    {αinv ε : ℝ} (hαinv : 0 < αinv) (hε : 0 < ε) :\n    ∃ k, agsikDone (Global.monotoneExtension Λ) ε\n      (agsikRun (Global.monotoneExtension Λ) αinv ε k).u", "doc": "Source: Algorithm algo:agsik (AGSI2.tex); the termination claim is from a V0\n`\\formalizationInstruction`, removed in V1. Stated for the extension `Λ_∞` of a real operator `Λ`\n(author's request): if `Λ` is monotone, its Kruzkov transform `Φ_β` is `ρ`-sub-additive with `β > 0`\nand `ρ < 1`, and `Λ` admits a finite sub-solution `w`, then the AGSIK applied to `Λ_∞` (timescale\n`α = 1/αinv > 0`, unrelated to `β`, tolerance `ε > 0`) reaches its stopping criterion after finitely\nmany steps. No causality is assumed. `X` is finite.", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.agsikStep_superSolution", "GuaranteedSubsol.agsikRun_terminates"], "labels": ["algo:agsik"], "direct": ["GuaranteedSubsol.agsikRun_terminates", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_kruzkovOp"]}, {"id": "GuaranteedSubsol.agsik_until_iff", "short": "agsik_until_iff", "file": "Anchors/AgsikUntilIff.lean", "pub_source": "Algo. algo:agsik, line agsik:until ⇔ its reformulation with `<`, strict as in the paper", "pub_doc": "Source: Algorithm algo:agsik, line agsik:until, and the displayed reformulation in the paragraph before the algorithm (with the convention `ln t = -∞` for `t ≤ 0`), at a point with `u = b` and `Λ u = a` real, level `n`, timescale `α > 0`: the criterion `exp(-a/α) < exp((ε-b)/α) + 2^{-n}` holds iff `a ≥ n α ln 2` or `b < a + ε - α ln(1 - exp((a - n α ln 2)/α))`, with a strict second inequality as in the paper.", "notes": ["author's request", "V0 had `≤` there"], "title": "reformulation of the intermediate stopping criterion of the AGSIK", "source": "Algo. algo:agsik (AGSI2.tex), line agsik:until ⇔ its reformulation with `<` (author's request), strict as in V1", "state": "PROVED", "provider": "GuaranteedSubsol.AgsikCriterionProof.agsik_until_iff", "chapter": "AGSI2", "statement": "theorem agsik_until_iff {α : ℝ} (hα : 0 < α) (a b ε : ℝ) (n : ℕ) :\n    Real.exp (-a / α) < Real.exp ((ε - b) / α) + (2 : ℝ)⁻¹ ^ n ↔\n      (n * α * Real.log 2 ≤ a ∨\n        b < a + ε - α * Real.log (1 - Real.exp ((a - n * α * Real.log 2) / α)))", "doc": "Source: Algorithm algo:agsik (AGSI2.tex), line agsik:until, and the displayed reformulation in the\nparagraph before the algorithm (with the convention `ln t = -∞` for `t ≤ 0`), at a point with\n`u = b` and `Λ u = a` real, level `n`, timescale `α > 0`: the criterion\n`exp(-a/α) < exp((ε-b)/α) + 2^{-n}` holds iff `a ≥ n α ln 2` or\n`b < a + ε - α ln(1 - exp((a - n α ln 2)/α))`, with a strict second inequality as in V1 (V0 had\n`≤` there).", "deps": [], "labels": ["algo:agsik", "agsik:until"], "direct": []}, {"id": "GuaranteedSubsol.apply_zero_pos_of_causal", "short": "apply_zero_pos_of_causal", "file": "Anchors/ApplyZeroPosOfCausal.lean", "pub_source": "Prop. prop:cst_subsol, item enum:Lambda0_delta, causal case: `Γ[0] > 0`", "pub_doc": "Source: Prop. prop:cst_subsol, item enum:Lambda0_delta, causal case: if `Γ` is causal (and additively invariant), then `Γ[0] > 0` (scalar form, at a point of `Int X`).", "notes": ["scalar form; author's request 2026-10-20"], "title": "a causal operator is positive on `0`", "source": "Prop. prop:cst_subsol (Intro.tex, V1), item enum:Lambda0_delta, causal case: `Γ[0] > 0` (scalar form; author's request 2026-10-20)", "state": "PROVED", "provider": "GuaranteedSubsol.ApplyZeroNonnegProof.apply_zero_pos_of_causal", "chapter": "Intro", "statement": "theorem apply_zero_pos_of_causal {X : Type*} {Γ : (X → ℝ) → ℝ} (hcaus : Causal Γ)\n    (hadd : AdditivelyInvariant Γ) : 0 < Γ 0", "doc": "Source: Prop. prop:cst_subsol (Intro.tex, V1), item enum:Lambda0_delta, causal case: if `Γ` is\ncausal (and additively invariant), then `Γ[0] > 0` (scalar form, at a point of `Int X`).", "deps": [], "labels": ["prop:cst_subsol", "enum:Lambda0_delta"], "direct": []}, {"id": "GuaranteedSubsol.le_apply_zero_of_strictlyCausal", "short": "le_apply_zero_of_strictlyCausal", "file": "Anchors/LeApplyZeroOfStrictlyCausal.lean", "pub_source": "Prop. prop:cst_subsol, item enum:Lambda0_delta, strictly causal case: `Γ[0] ≥ δ`", "pub_doc": "Source: Prop. prop:cst_subsol, item enum:Lambda0_delta, strictly causal case: if `Γ` is `δ`-strictly causal (and additively invariant), then `Γ[0] ≥ δ` (scalar form, at a point of `Int X`; no sign condition on `δ` is needed).", "notes": ["no sign condition on `δ`; author's request 2026-10-20"], "title": "a `δ`-strictly causal operator is `≥ δ` on `0`", "source": "Prop. prop:cst_subsol (Intro.tex, V1), item enum:Lambda0_delta, strictly causal case: `Γ[0] ≥ δ` (no sign condition on `δ`; author's request 2026-10-20)", "state": "PROVED", "provider": "GuaranteedSubsol.CstSubsolProof.le_apply_zero_of_strictlyCausal", "chapter": "Intro", "statement": "theorem le_apply_zero_of_strictlyCausal {X : Type*} {Γ : (X → ℝ) → ℝ} {δ : ℝ}\n    (hcaus : StrictlyCausal δ Γ) (hadd : AdditivelyInvariant Γ) : δ ≤ Γ 0", "doc": "Source: Prop. prop:cst_subsol (Intro.tex, V1), item enum:Lambda0_delta, strictly causal case: if\n`Γ` is `δ`-strictly causal (and additively invariant), then `Γ[0] ≥ δ` (scalar form, at a point of\n`Int X`; no sign condition on `δ` is needed).", "deps": [], "labels": ["prop:cst_subsol", "enum:Lambda0_delta"], "direct": []}, {"id": "GuaranteedSubsol.apply_zero_le_of_hasMemory", "short": "apply_zero_le_of_hasMemory", "file": "Anchors/ApplyZeroLeOfHasMemory.lean", "pub_source": "Remark after Prop. prop:cst_subsol: `C_past`-memory and additive invariance give `Λ[0] ≤ C_past`", "pub_doc": "Source: the remark following Prop. prop:cst_subsol: `C_past`-memory and additive invariance together imply `Λ[0] ≤ C_past` (scalar form, at a point of `Int X`).", "notes": ["author's request 2026-10-20"], "title": "an operator with `C_past`-memory is `≤ C_past` on `0`", "source": "Remark after Prop. prop:cst_subsol (Intro.tex, V1): `C_past`-memory and additive invariance give `Λ[0] ≤ C_past` (author's request 2026-10-20)", "state": "PROVED", "provider": "GuaranteedSubsol.CstSubsolProof.apply_zero_le_of_hasMemory", "chapter": "Intro", "statement": "theorem apply_zero_le_of_hasMemory {X : Type*} {Λ : (X → ℝ) → ℝ} {C : ℝ}\n    (hmem : HasMemory C Λ) (hadd : AdditivelyInvariant Λ) : Λ 0 ≤ C", "doc": "Source: the remark following Prop. prop:cst_subsol (Intro.tex, V1): `C_past`-memory and additive\ni  form at each point of `B`).", "deps": [], "labels": ["lem:monDom"], "direct": []}, {"id": "GuaranteedSubsol.parallelAgsiPasses_lt_top_of_subAdditive", "short": "parallelAgsiPasses_lt_top_of_subAdditive", "file": "Anchors/ParallelAgsiPassesLtTopOfSubAdditive.lean", "pub_source": "Prop. prop:cplx_agsi_parallel, termination claim, super-solution version, `0 < ρ < 1`", "pub_doc": "Source: Prop. prop:cplx_agsi_parallel, termination claim: if `Φ` is monotone and `ρ`-sub-additive with `0 < ρ < 1`, Algorithm algo:agsi_parallel, started from `v` with `0 ≤ v - Φ v ≤ C`, terminates (the number of passes is finite). The bound on the number of updates at each point is `parallelAgsiRun_count_le_of_subAdditive`.", "notes": ["author's request 2026-10-20"], "title": "the parallel AGSI terminates (super-solution version)", "source": "Prop. prop:cplx_agsi_parallel (AGSI2.tex, V1), termination claim, super-solution version, `0 < ρ < 1` (author's request 2026-10-20)", "state": "PROVED", "provider": "GuaranteedSubsol.ParallelAgsiTermProof.passes_lt_top", "chapter": "AGSI2", "statement": "theorem parallelAgsiPasses_lt_top_of_subAdditive {X : Type*} [Finite X]\n    {Φ : (X → ℝ) → X → ℝ} (hmono : Monotone Φ) {ρ : ℝ} (hρ0 : 0 < ρ) (hρ1 : ρ < 1)\n    (hsub : ∀ x, SubAdditive ρ (Φ · x)) {η C : ℝ} (hη : 0 < η) {v : X → ℝ}\n    (hv : Φ v ≤ v) (hvC : ∀ x, v x - Φ v x ≤ C) : parallelAgsiPasses Φ η v < ⊤", "doc": "Source: Prop. prop:cplx_agsi_parallel (AGSI2.tex, V1), termination claim: if `Φ` is monotone and\n`ρ`-sub-additive with `0 < ρ < 1`, Algorithm algo:agsi_parallel, started from `v` with\n`0 ≤ v - Φ v ≤ C`, terminates (the number of passes is finite). The bound on the number of updates\nat each point is `parallelAgsiRun_count_le_of_subAdditive`.", "deps": ["GuaranteedSubsol.restrictOp_superSolution", "GuaranteedSubsol.norm_sub_le_of_subAdditive", "GuaranteedSubsol.existsUnique_fixedPoint_of_subAdditive", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.parallelAgsiStep_superSolution" T : WithTop ℝ)\n    (s₀ : DijkstraHeapState X) (hL : s₀.L.v = dijkstraKey Γ s₀.u)\n    (hsup : dijkstraCutOp T Γ s₀.u ≤ s₀.u) :\n    dijkstraHeapStopIndex Γ 𝒱 T s₀ ≤ Fintype.card X ∧\n    dijkstraHeapStopIndex Γ 𝒱 T s₀ =\n      ((∑ x, ((dijkstraHeapLoop Γ 𝒱 T s₀).count x - s₀.count x) : ℕ) : ℕ∞) ∧\n    dijkstraCutOp T Γ (dijkstraHeapLoop Γ 𝒱 T s₀).u = (dijkstraHeapLoop Γ 𝒱 T s₀).u ∧\n    (dijkstraHeapLoop Γ 𝒱 T s₀).L.v = dijkstraKey Γ (dijkstraHeapLoop Γ 𝒱 T s₀).u ∧\n    (∀ y t, (dijkstraHeapLoop Γ 𝒱 T s₀).L.v y = some t → T ≤ t) ∧\n    (∀ x, (dijkstraHeapLoop Γ 𝒱 T s₀).count x ≤ s₀.count x + 1 ∧\n      ((dijkstraHeapLoop Γ 𝒱 T s₀).count x = s₀.count x + 1 ↔\n        (dijkstraHeapLoop Γ 𝒱 T s₀).u x < s₀.u x)) ∧\n    (dijkstraHeapLoop Γ 𝒱 T s₀).evalCount = s₀.evalCount +\n      ∑ x, ((dijkstraHeapLoop Γ 𝒱 T s₀).count x - s₀.count x) * (Global.Ext.revStencil 𝒱 x).card ∧\n    (dijkstraHeapLoop Γ 𝒱 T s₀).L.count = s₀.L.count + 1 +\n      ∑ x, ((dijkstraHeapLoop Γ 𝒱 T s₀).count x - s₀.count x) *\n        (2 + (Global.Ext.revStencil 𝒱 x).card)", "doc": "Source: Prop. prop:Dijkstra_correct and algo:Dijkstra (Complexity.tex, V1), for the while loop\nwith the sorted list `L` and the stopping time `T ∈ ℝ_∞` (`dijkstraHeapLoop`; author's request\n2026-10-20). Hypotheses: `Γ : ℝ_∞^X → ℝ_∞^X` monotone and causal, with stencils `𝒱`; the initial\n`u` satisfies `(Γ u)^{<T} ≤ u`; `L` holds the keys of the active points,\n`L = {(Γ u(x), x) | Γ u(x) < u(x)}` (eq. eq:Dijkstra_prop). Conclusions: the loop stops (the stop\nindex, in `ℕ∞`, is finite) after at most `#X` acceptances, one per point where `u` decreased\n(re-frozen 2026-10-20, author's approval: stop index in `ℕ∞`); `u` is then a fixed point of\n`Γ^{<T}` (`dijkstraCutOp`); `L` still holds the keys of the active points, and all of them are\n`≥ T`; each point is accepted at most once, exactly where `u` decreased; the evaluations of `Γ`\nand the operations on `L`. This is the form used in the ANB with sorted lists\n(`anbHeapRun_equiv`). `X` is finite and linearly ordered (tie-breaking).", "deps": ["GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_count_le_one", "GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq", "GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq", "GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.dijkstraHeapRun_eq", "GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff"], "labels": ["prop:Dijkstra_correct", "algo:Dijkstra"], "direct": ["GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.dijkstraHeapRun_eq", "GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "GuaranteedSubsol.dijkstraRun_count_le_one", "GuaranteedSubsol.dijkstraRun_fixedPoint"]}]</script>
<script id="algos" type="application/json">{"algos": {"algo:Dijkstra": {"title": "Generalized Dijkstra algorithm, with stopping time T", "termination": ["GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.dijkstraHeapLoop_correct"], "variants": [{"name": "Set of active points (the list L is implicit)", "state": [{"name": "DijkstraState", "file": "Dijkstra.lean", "doc": "State of the generalized Dijkstra algorithm (algo:Dijkstra): the map `u` and the number `count x` of Dijkstra updates performed at each point. The list `L` is not stored: by Prop. prop:Dijkstra_correct it equals `{(Γ u x, x) | Γ u x < u x}`.", "notes": [], "code": "structure DijkstraState (X : Type*) where\n  u : X → WithTop ℝ\n  count : X → ℕ"}, {"name": "dijkstraInit", "file": "Dijkstra.lean", "doc": "Initialization with the initial guess `u₀` and no updates.", "notes": [], "code": "def dijkstraInit (u₀ : X → WithTop ℝ) : DijkstraState X := ⟨u₀, 0⟩"}], "step": [{"name": "dijkstraSelect", "file": "Dijkstra.lean", "doc": "Line Dijkstra:accept: `x` is the active point whose pair `(t, x) = (Γ u x, x)` is minimal for the lexicographic order.", "notes": [], "code": "def dijkstraSelect [LinearOrder X] (Γ : (X → WithTop ℝ) → X → WithTop ℝ) (u : X → WithTop ℝ)\n    (x : X) : Prop :=\n  Γ u x < u x ∧ ∀ y, Γ u y < u y → Γ u x < Γ u y ∨ (Γ u x = Γ u y ∧ x ≤ y)"}, {"name": "dijkstraStep", "file": "Dijkstra.lean", "doc": "One iteration of the while loop of algo:Dijkstra: the Dijkstra update `u(x) ← Γ u(x)` at the selected point (and `count x ← count x + 1`); if `L` is empty, stay put.", "notes": [], "code": "open Classical in\nnoncomputable def dijkstraStep [LinearOrder X] (Γ : (X → WithTop ℝ) → X → WithTop ℝ)\n    (s : DijkstraState X) : DijkstraState X :=\n  if h : ∃ x, dijkstraSelect Γ s.u x then\n    { u := Function.update s.u (Classical.choose h) (Γ s.u (Classical.choose h))\n      count := Function.update s.count (Classical.choose h) (s.count (Classical.choose h) + 1) }\n  else s"}], "loop": [{"name": "dijkstraRun", "file": "Dijkstra.lean", "doc": "The state of algo:Dijkstra after `n` iterations, started from the initial guess `u₀`.", "notes": [], "code": "noncomputable def dijkstraRun [LinearOrder X] (Γ : (X → WithTop ℝ) → X → WithTop ℝ)\n    (u₀ : X → WithTop ℝ) (n : ℕ) : DijkstraState X :=\n  (dijkstraStep Γ)^[n] (dijkstraInit u₀)"}]}, {"name": "Sorted list L and stopping time T", "state": [{"name": "DijkstraHeapState", "file": "DijkstraHeap.lean", "doc": "State of Dijkstra's method with a sorted list: the map `u`, the number of acceptances at each point, the list `L` (with its operation counter), and the number of evaluations of `Γ`.", "notes": [], "code": "structure DijkstraHeapState (X : Type*) where\n  u : X → WithTop ℝ\n  count : X → ℕ\n  L : OrderedPartialMap X (WithTop ℝ)\n  evalCount : ℕ"}, {"name": "dijkstraHeapInit", "file": "DijkstraHeap.lean", "doc": "Initial state built from scratch: `u₀`, no acceptance, `L` filled with the keys of all the points (`#X` evaluations of `Γ` and `#X` operations on `L`).", "notes": [], "code": "noncomputable def dijkstraHeapInit (Γ : (X → WithTop ℝ) → X → WithTop ℝ) (u₀ : X → WithTop ℝ) :\n    DijkstraHeapState X :=\n  ⟨u₀, 0, (⟨fun _ => none, 0⟩ : OrderedPartialMap X (WithTop ℝ)).set Finset.univ\n    (dijkstraKey Γ u₀), Fintype.card X⟩"}], "step": [{"name": "dijkstraKey", "file": "DijkstraHeap.lean", "doc": "The key of `y` in the list `L`: `Γ u y` if `y` is active (`Γ u y < u y`), absent otherwise.", "notes": [], "code": "noncomputable def dijkstraKey (Γ : (X → WithTop ℝ) → X → WithTop ℝ) (u : X → WithTop ℝ) :\n    X → Option (WithTop ℝ) :=\n  fun y => if Γ u y < u y then some (Γ u y) else none"}, {"name": "dijkstraCutOp", "file": "DijkstraHeap.lean", "doc": "The operator `Γ^{<T}`: `Γ u x` if `Γ u x < T`, and `∞` otherwise (for `T = ⊤`, this is `Γ`).", "notes": [], "code": "noncomputable def dijkstraCutOp (T : WithTop ℝ) (Γ : (X → WithTop ℝ) → X → WithTop ℝ) :\n    (X → WithTop ℝ) → X → WithTop ℝ :=\n  fun u x => if Γ u x < T then Γ u x else ⊤"}, {"name": "dijkstraHeapStep", "file": "DijkstraHeap.lean", "doc": "One iteration of Dijkstra's method with a sorted list, stencil `𝒱` and threshold `T`.", "notes": [], "code": "noncomputable def dijkstraHeapStep (Γ : (X → WithTop ℝ) → X → WithTop ℝ) (𝒱 : X → Set X)\n    (T : WithTop ℝ) (s : DijkstraHeapState X) : DijkstraHeapState X :=\n  match s.L.bot with\n  | (none, L₁) => { s with L := L₁ }\n  | (some (t, x), L₁) =>\n    if T ≤ t then { s with L := L₁ }\n    else\n      let u' := Function.update s.u x t\n      { u := u'\n        count := Function.update s.count x (s.count x + 1)\n        L := (L₁.erase1 x).set (Global.Ext.revStencil 𝒱 x) (dijkstraKey Γ u')\n        evalCount := s.evalCount + (Global.Ext.revStencil 𝒱 x).card }"}], "loop": [{"name": "dijkstraHeapRun", "file": "DijkstraHeap.lean", "doc": "The state after `n` iterations, from the state `s₀`.", "notes": [], "code": "noncomputable def dijkstraHeapRun (Γ : (X → WithTop ℝ) → X → WithTop ℝ) (𝒱 : X → Set X)\n    (T : WithTop ℝ) (s₀ : DijkstraHeapState X) (n : ℕ) : DijkstraHeapState X :=\n  (dijkstraHeapStep Γ 𝒱 T)^[n] s₀"}, {"name": "DijkstraHeapState.Stopped", "file": "DijkstraHeap.lean", "doc": "Whether Dijkstra's method with a sorted list and threshold `T` stops at the state `s`: the list `L` is empty, or its smallest key is `≥ T`.", "notes": [], "code": "def DijkstraHeapState.Stopped (T : WithTop ℝ) (s : DijkstraHeapState X) : Prop :=\n  ∀ t x, OrderedPartialMap.botVal s.L.v = some (t, x) → T ≤ t"}, {"name": "dijkstraHeapStopIndex", "file": "DijkstraHeap.lean", "doc": "The number of acceptances before Dijkstra's method with a sorted list stops, from the state `s₀` (`⊤` if it never stops).", "notes": [], "code": "open Classical in\nnoncomputable def dijkstraHeapStopIndex (Γ : (X → WithTop ℝ) → X → WithTop ℝ) (𝒱 : X → Set X)\n    (T : WithTop ℝ) (s₀ : DijkstraHeapState X) : ℕ∞ :=\n  if h : ∃ n, (dijkstraHeapRun Γ 𝒱 T s₀ n).Stopped T then Nat.find h else ⊤"}, {"name": "dijkstraHeapLoop", "file": "DijkstraHeap.lean", "doc": "The while loop of algo:Dijkstra with a sorted list and threshold `T`, from the state `s₀`: the acceptances, then the final test (one more call to `bot`, which finds the list empty or its smallest key `≥ T`). Meaningful when the stop index is finite.", "notes": [], "code": "noncomputable def dijkstraHeapLoop (Γ : (X → WithTop ℝ) → X → WithTop ℝ) (𝒱 : X → Set X)\n    (T : WithTop ℝ) (s₀ : DijkstraHeapState X) : DijkstraHeapState X :=\n  dijkstraHeapRun Γ 𝒱 T s₀ ((dijkstraHeapStopIndex Γ 𝒱 T s₀).toNat + 1)"}]}]}, "algo:global_iteration": {"title": "Global iteration, for computing a super-solution (and its sub-solution variant)", "termination": ["GuaranteedSubsol.globalIterRun_terminates", "GuaranteedSubsol.globalIterSubRun_terminates", "GuaranteedSubsol.globalIterRun_passes_le_withUnknown"], "variants": [{"name": "The state is the map v : X → ℝ", "state": [], "step": [{"name": "globalIterStep", "file": "GlobalIteration.lean", "doc": "One iteration of algo:global_iteration, super-solution version: `v ← Φ v`, unless the stopping criterion `v - Φ v ≤ η` holds, in which case `v` is unchanged.", "notes": [], "code": "open Classical in\nnoncomputable def globalIterStep (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : X → ℝ :=\n  if ∀ x, v x - Φ v x ≤ η then v else Φ v"}, {"name": "globalIterSubStep", "file": "GlobalIteration.lean", "doc": "One iteration of algo:global_iteration, sub-solution variant: `v ← Φ v`, unless the stopping criterion `Φ v - v ≤ η` holds, in which case `v` is unchanged.", "notes": [], "code": "open Classical in\nnoncomputable def globalIterSubStep (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : X → ℝ :=\n  if ∀ x, Φ v x - v x ≤ η then v else Φ v"}], "loop": [{"name": "globalIterRun", "file": "GlobalIteration.lean", "doc": "The map of algo:global_iteration (super-solution version) after `n` iterations from `v`.", "notes": [], "code": "noncomputable def globalIterRun (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) (n : ℕ) : X → ℝ :=\n  (globalIterStep Φ η)^[n] v"}, {"name": "globalIterPasses", "file": "GlobalIteration.lean", "doc": "Number of iterations of algo:global_iteration (super-solution version) until its stopping criterion holds, i.e. when the while loop exits (`⊤` if it never holds).", "notes": [], "code": "open Classical in\nnoncomputable def globalIterPasses (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : ℕ∞ :=\n  if h : ∃ n, ∀ x, globalIterRun Φ η v n x - Φ (globalIterRun Φ η v n) x ≤ η then\n    (Nat.find h : ℕ∞)\n  else ⊤"}, {"name": "globalIterResult", "file": "GlobalIteration.lean", "doc": "The output of algo:global_iteration (super-solution version), started from `v` (meaningful when the loop exits, i.e. when `globalIterPasses Φ η v < ⊤`).", "notes": [], "code": "noncomputable def globalIterResult (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : X → ℝ :=\n  globalIterRun Φ η v (globalIterPasses Φ η v).toNat"}, {"name": "globalIterSubRun", "file": "GlobalIteration.lean", "doc": "The map of algo:global_iteration (sub-solution variant) after `n` iterations from `v`.", "notes": [], "code": "noncomputable def globalIterSubRun (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) (n : ℕ) : X → ℝ :=\n  (globalIterSubStep Φ η)^[n] v"}, {"name": "globalIterSubPasses", "file": "GlobalIteration.lean", "doc": "Number of iterations of algo:global_iteration (sub-solution variant) until its stopping criterion holds (`⊤` if it never holds).", "notes": [], "code": "open Classical in\nnoncomputable def globalIterSubPasses (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : ℕ∞ :=\n  if h : ∃ n, ∀ x, Φ (globalIterSubRun Φ η v n) x - globalIterSubRun Φ η v n x ≤ η then\n    (Nat.find h : ℕ∞)\n  else ⊤"}, {"name": "globalIterSubResult", "file": "GlobalIteration.lean", "doc": "The output of algo:global_iteration (sub-solution variant), started from `v` (meaningful when the loop exits, i.e. when `globalIterSubPasses Φ η v < ⊤`).", "notes": [], "code": "noncomputable def globalIterSubResult (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : X → ℝ :=\n  globalIterSubRun Φ η v (globalIterSubPasses Φ η v).toNat"}]}]}, "algo:agsi_parallel": {"title": "Parallel AGSI, for computing a super-solution (and its sub-solution variant)", "termination": ["GuaranteedSubsol.parallelAgsiRun_terminates", "GuaranteedSubsol.parallelAgsiSubRun_terminates", "GuaranteedSubsol.parallelAgsiPasses_lt_top_of_subAdditive", "GuaranteedSubsol.parallelAgsiSubPasses_lt_top_of_subAdditive"], "variants": [{"name": "", "state": [{"name": "ParallelAgsiState", "file": "ParallelAGSI.lean", "doc": "State of the parallel AGSI (algo:agsi_parallel): the current map `v` and, for each point, the number `count x` of updates `v(x) ← Φ v(x)` performed so far.", "notes": [], "code": "structure ParallelAgsiState (X : Type*) where\n  v : X → ℝ\n  count : X → ℕ"}], "step": [{"name": "parallelAgsiStep", "file": "ParallelAGSI.lean", "doc": "One pass of the parallel AGSI (algo:agsi_parallel, line algoline:agsi_parallel_for), super-solution version: on `B:= {x | v x - Φ v x > η}`, `v(x) ← Φ v(x)` and `count x ← count x + 1`; elsewhere both are unchanged.", "notes": [], "code": "open Classical in\nnoncomputable def parallelAgsiStep (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (s : ParallelAgsiState X) :\n    ParallelAgsiState X where\n  v := restrictOp Φ {x | η < s.v x - Φ s.v x} s.v\n  count x := if η < s.v x - Φ s.v x then s.count x + 1 else s.count x"}, {"name": "parallelAgsiSubStep", "file": "ParallelAGSI.lean", "doc": "One pass of the parallel AGSI, sub-solution variant (algo:agsi_parallel, with `v - Φ v` replaced by `Φ v - v`): on `B:= {x | Φ v x - v x > η}`, `v(x) ← Φ v(x)` and `count x ← count x + 1`; elsewhere both are unchanged.", "notes": [], "code": "open Classical in\nnoncomputable def parallelAgsiSubStep (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (s : ParallelAgsiState X) :\n    ParallelAgsiState X where\n  v := restrictOp Φ {x | η < Φ s.v x - s.v x} s.v\n  count x := if η < Φ s.v x - s.v x then s.count x + 1 else s.count x"}, {"name": "ParallelAgsiState.neg", "file": "ParallelAGSI.lean", "doc": "The state with `v` replaced by `-v` (same counter).", "notes": [], "code": "def ParallelAgsiState.neg (s : ParallelAgsiState X) : ParallelAgsiState X :=\n  ⟨-s.v, s.count⟩"}], "loop": [{"name": "parallelAgsiRun", "file": "ParallelAGSI.lean", "doc": "The state of algo:agsi_parallel (super-solution version) after `n` passes, started from `v` with no updates.", "notes": [], "code": "noncomputable def parallelAgsiRun (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) (n : ℕ) :\n    ParallelAgsiState X :=\n  (parallelAgsiStep Φ η)^[n] ⟨v, 0⟩"}, {"name": "parallelAgsiPasses", "file": "ParallelAGSI.lean", "doc": "Number of passes of algo:agsi_parallel (super-solution version) until its stopping criterion `v - Φ v ≤ η` holds (`⊤` if it never holds).", "notes": [], "code": "open Classical in\nnoncomputable def parallelAgsiPasses (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : ℕ∞ :=\n  if h : ∃ n, ∀ x, (parallelAgsiRun Φ η v n).v x - Φ (parallelAgsiRun Φ η v n).v x ≤ η then\n    (Nat.find h : ℕ∞)\n  else ⊤"}, {"name": "parallelAgsiResult", "file": "ParallelAGSI.lean", "doc": "The output of algo:agsi_parallel (super-solution version), started from `v` (meaningful when the loop exits, i.e. when `parallelAgsiPasses Φ η v < ⊤`).", "notes": [], "code": "noncomputable def parallelAgsiResult (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : X → ℝ :=\n  (parallelAgsiRun Φ η v (parallelAgsiPasses Φ η v).toNat).v"}, {"name": "parallelAgsiCount", "file": "ParallelAGSI.lean", "doc": "The number of updates `v(x) ← Φ v(x)` performed at each point by algo:agsi_parallel (super-solution version) until the loop stops (`⊤` if it never stops).", "notes": [], "code": "open Classical in\nnoncomputable def parallelAgsiCount (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : X → ℕ∞ :=\n  fun x => if parallelAgsiPasses Φ η v = ⊤ then ⊤\n    else ((parallelAgsiRun Φ η v (parallelAgsiPasses Φ η v).toNat).count x : ℕ∞)"}, {"name": "parallelAgsiSubRun", "file": "ParallelAGSI.lean", "doc": "The state of the sub-solution variant of algo:agsi_parallel after `n` passes, started from `v` with no updates.", "notes": [], "code": "noncomputable def parallelAgsiSubRun (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) (n : ℕ) :\n    ParallelAgsiState X :=\n  (parallelAgsiSubStep Φ η)^[n] ⟨v, 0⟩"}, {"name": "parallelAgsiSubPasses", "file": "ParallelAGSI.lean", "doc": "Number of passes of the sub-solution variant of algo:agsi_parallel until its stopping criterion `Φ v - v ≤ η` holds (`⊤` if it never holds).", "notes": [], "code": "open Classical in\nnoncomputable def parallelAgsiSubPasses (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : ℕ∞ :=\n  if h : ∃ n, ∀ x, Φ (parallelAgsiSubRun Φ η v n).v x - (parallelAgsiSubRun Φ η v n).v x ≤ η then\n    (Nat.find h : ℕ∞)\n  else ⊤"}, {"name": "parallelAgsiSubResult", "file": "ParallelAGSI.lean", "doc": "The output of the sub-solution variant of algo:agsi_parallel, started from `v` (meaningful when the loop exits, i.e. when `parallelAgsiSubPasses Φ η v < ⊤`).", "notes": [], "code": "noncomputable def parallelAgsiSubResult (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : X → ℝ :=\n  (parallelAgsiSubRun Φ η v (parallelAgsiSubPasses Φ η v).toNat).v"}, {"name": "parallelAgsiSubCount", "file": "ParallelAGSI.lean", "doc": "The number of updates `v(x) ← Φ v(x)` performed at each point by the sub-solution variant of algo:agsi_parallel until the loop stops (`⊤` if it never stops).", "notes": [], "code": "open Classical in\nnoncomputable def parallelAgsiSubCount (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : X → ℕ∞ :=\n  fun x => if parallelAgsiSubPasses Φ η v = ⊤ then ⊤\n    else ((parallelAgsiSubRun Φ η v (parallelAgsiSubPasses Φ η v).toNat).count x : ℕ∞)"}]}]}, "algo:agsik": {"title": "AGSI with Kruzkov based intermediate stopping criteria (AGSIK)", "termination": ["GuaranteedSubsol.agsikRun_terminates", "GuaranteedSubsol.agsikRun_terminates_of_kruzkov"], "variants": [{"name": "", "state": [{"name": "AgsikState", "file": "AGSIK.lean", "doc": "State of the AGSIK (algo:agsik): the main iteration index `n`, the map `u`, and the number `count x` of updates `u(x) ← Λ u(x)` performed so far at each point.", "notes": [], "code": "structure AgsikState (X : Type*) where\n  n : ℕ\n  u : X → WithTop ℝ\n  count : X → ℕ"}, {"name": "agsikInit", "file": "AGSIK.lean", "doc": "Initialization of algo:agsik: `n = 0`, `u = +∞`, no updates.", "notes": [], "code": "def agsikInit : AgsikState X := ⟨0, fun _ => ⊤, 0⟩"}], "step": [{"name": "agsikSelect", "file": "AGSIK.lean", "doc": "Selection criterion of line agsik:parallel_for at level `n`: `exp(-Λu(x)/α) ≥ exp((ε-u(x))/α) + 2^{-n}`, with `αinv = 1/α`.", "notes": [], "code": "def agsikSelect (Λ : (X → WithTop ℝ) → X → WithTop ℝ) (αinv ε : ℝ) (n : ℕ)\n    (u : X → WithTop ℝ) (x : X) : Prop :=\n  (2 : ℝ)⁻¹ ^ n + Real.exp (αinv * ε) * -kruzkov αinv (u x) ≤ -kruzkov αinv (Λ u x)"}, {"name": "agsikStep", "file": "AGSIK.lean", "doc": "One step of the AGSIK (algo:agsik): a parallel pass `u(x) ← Λ u(x)` on the selected points at level `n` if there are any; otherwise stay put if `u ≤ Λ u + ε`; otherwise `n ← n + 1`.", "notes": [], "code": "open Classical in\nnoncomputable def agsikStep (Λ : (X → WithTop ℝ) → X → WithTop ℝ) (αinv ε : ℝ)\n    (s : AgsikState X) : AgsikState X :=\n  if ∃ x, agsikSelect Λ αinv ε s.n s.u x then\n    { n := s.n\n      u := fun x => if agsikSelect Λ αinv ε s.n s.u x then Λ s.u x else s.u x\n      count := fun x => if agsikSelect Λ αinv ε s.n s.u x then s.count x + 1 else s.count x }\n  else if agsikDone Λ ε s.u then s\n  else { s with n := s.n + 1 }"}], "loop": [{"name": "agsikDone", "file": "AGSIK.lean", "doc": "Stopping criterion of the main loop of algo:agsik: `u ≤ Λ u + ε` on `X`.", "notes": [], "code": "def agsikDone (Λ : (X → WithTop ℝ) → X → WithTop ℝ) (ε : ℝ) (u : X → WithTop ℝ) : Prop :=\n  ∀ x, u x ≤ Λ u x + (ε : WithTop ℝ)"}, {"name": "agsikRun", "file": "AGSIK.lean", "doc": "The state of algo:agsik after `k` steps, started from `u = +∞` (`agsikInit`).", "notes": [], "code": "noncomputable def agsikRun (Λ : (X → WithTop ℝ) → X → WithTop ℝ) (αinv ε : ℝ) (k : ℕ) :\n    AgsikState X :=\n  (agsikStep Λ αinv ε)^[k] agsikInit"}]}]}, "algo:anb": {"title": "Adaptive Narrow Band (ANB)", "termination": ["GuaranteedSubsol.anbStopIndex_le", "GuaranteedSubsol.anbStopIndex_le_withUnknown", "GuaranteedSubsol.anbRun_done_of_maxWidth", "GuaranteedSubsol.anbRunData_passes_le", "GuaranteedSubsol.anbRunData_passes_le_withUnknown"], "variants": [{"name": "", "state": [{"name": "AnbParams", "file": "Anb.lean", "doc": "Parameters of algo:anb: the scheme `Λ`, its causal underestimate `Γ` (line anb:hatu), the tolerance `ε`, and the constants `τ`, `α`, `ρ` of line anb:input.", "notes": [], "code": "structure AnbParams (X : Type*) where\n  Λ : (X → ℝ) → X → ℝ\n  Γ : (X → ℝ) → X → ℝ\n  ε : ℝ\n  τ : ℝ\n  α : ℝ\n  ρ : ℝ"}, {"name": "AnbState", "file": "Anb.lean", "doc": "State of algo:anb: iteration index `n`, sub-solution `ū`, super-solution `u̲`, the initial guess `uHatInit` for Dijkstra's method at line anb:hatu (built at the end of the previous iteration, see Prop. prop:Dijkstra_band and `anbDijkstraGuess`), and the number of updates of `ū`, `u̲` and `û` performed so far at each point. The counters of `ū` and `u̲` take values in `ℕ∞`: they become `⊤` when an inner loop (lines anb:while_sub, anb:while_sup) involving the point never exits, so that a bound on them also expresses termination; Dijkstra's method always performs `card X` steps, and the counter of `û` is in `ℕ`.", "notes": [], "code": "structure AnbState (X : Type*) where\n  n : ℕ\n  uSub : X → ℝ\n  uSup : X → WithTop ℝ\n  uHatInit : X → WithTop ℝ\n  countSub : X → ℕ∞\n  countSup : X → ℕ∞\n  countHat : X → ℕ"}, {"name": "anbInit", "file": "Anb.lean", "doc": "Line anb:init, starting at `n = 0` (Remark rem:anb_npos: the iteration `n = 0` is vacuous): `ū = 0`, `u̲ = ∞`, initial guess `0` for `û` (the natural super-solution at the start; the iteration `n = 0` then computes `û_0 = 0` and `t⁻_0 = 0`, the conventions of Prop. prop:Dijkstra_band), no updates.", "notes": [], "code": "def anbInit : AnbState X := ⟨0, 0, fun _ => ⊤, 0, 0, 0, 0⟩"}], "step": [{"name": "anbHatOp", "file": "Anb.lean", "doc": "Line anb:hatu: the operator `Γ' u:= max (ū, min (T, Γ_∞ u))`, with `T = nτ`, whose fixed point is `û_n` (Prop. prop:Dijkstra_band).", "notes": [], "code": "noncomputable def anbHatOp (Γ : (X → ℝ) → X → ℝ) (uSub : X → ℝ) (T : ℝ) :\n    (X → WithTop ℝ) → X → WithTop ℝ :=\n  fun u x => max (uSub x : WithTop ℝ) (min (T : WithTop ℝ) (Global.monotoneExtension Γ u x))"}, {"name": "anbLevel", "file": "Anb.lean", "doc": "Line anb:tn: `t_n:= min (T, min {û(x) | (1 + ε) û(x) < u̲(x)})`, with `T = nτ`; it is `T` if this set is empty.", "notes": [], "code": "open Classical in\nnoncomputable def anbLevel [Fintype X] (ε T : ℝ) (uHat : X → ℝ) (uSup : X → WithTop ℝ) : ℝ :=\n  let S := Finset.univ.filter fun x => (((1 + ε) * uHat x : ℝ) : WithTop ℝ) < uSup x\n  if h : S.Nonempty then min T (S.inf' h uHat) else T"}, {"name": "anbBand", "file": "Anb.lean", "doc": "Line anb:Bn: `B_n:= {x | T - 2Δ ≤ û(x) < T}`, with `T = nτ` and `Δ = Δ_n`.", "notes": [], "code": "def anbBand (T Δ : ℝ) (uHat : X → ℝ) : Set X :=\n  {x | T - 2 * Δ ≤ uHat x ∧ uHat x < T}"}, {"name": "AnbStepData", "file": "Anb.lean", "doc": "The quantities of one iteration of algo:anb, computed from the state at its start: Dijkstra's run for `û_n`, `û_n`, `t_n`, `Δ_n`, `B_n`, `η_n`, the inputs `E_α û_n`, `E_α u̲` of the two global iterations, and the operators `Φ_α` acting on the band `B_n`, the values outside `B_n` being frozen to `E_α û_n` (sub-solution variant) and to `E_α u̲` (super-solution version).", "notes": [], "code": "structure AnbStepData (X : Type*) where\n  hatRun : DijkstraState X\n  uHat : X → ℝ\n  t : ℝ\n  Δ : ℝ\n  band : Set X\n  η : ℝ\n  vSub : X → ℝ\n  vSup : X → ℝ\n  ΦSub : (band → ℝ) → band → ℝ\n  ΦSup : (band → ℝ) → band → ℝ"}, {"name": "anbStepData", "file": "Anb.lean", "doc":

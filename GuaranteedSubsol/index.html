) {V : X → Set X} {Cpast M : ℝ} (hCpast : 0 ≤ Cpast)\n    (hM : ∀ x ∉ I, ubd x ≤ M) (hdep : ∀ x ∈ I, HasDependency Cpast (V x) (Λ · x))\n    (hconn : ∀ x ∈ I, ∃ z ∉ I, Relation.TransGen (fun a b => a ∈ I ∧ b ∈ V a) x z) :\n    Λ (fun x => Cpast * stencilDist I V x + M) ≤ fun x => Cpast * stencilDist I V x + M", "doc": "Source: proof of Prop. prop:constr_Gamma (Effective.tex), \"Construction of a super-solution to\n`Λ`\", global form with Dirichlet data `Λ u = u_bd` outside the interior `I`: if\n`Λ u(x) ≤ C_past + u(y)` for all `y ∈ V(x)` at interior points (`C_past`-dependency, with\n`C_past ≥ 0`) and the stencils are connected to the boundary (footnote of prop:constr_Gamma),\nthen `C_past d_V(x, ∂X) + M` is a super-solution for any `M ≥ u_bd`. The paper's other\nassumptions (monotonicity, additive invariance, `Λ[0] ≥ δ`) are not needed.", "deps": [], "labels": ["prop:constr_Gamma"], "direct": []}, {"id": "GuaranteedSubsol.exists_superSolution_of_connected", "short": "exists_superSolution_of_connected", "file": "Anchors/ExistsSuperSolutionOfConnected.lean", "pub_source": "Prop. prop:constr_Gamma, existence of a super-solution under connectivity, global form", "pub_doc": "Source: Prop. prop:constr_Gamma, \"admits a super-solution if the stencils are connected to the boundary\" (footnote), global form with Dirichlet data `Λ u = u_bd` outside the interior `I`, under `C_past`-dependency with `C_past ≥ 0`. The paper's other assumptions (monotonicity, additive invariance, `Λ[0] ≥ δ`) are not needed. `X` is finite.", "notes": [], "title": "existence of a super-solution when the stencils reach the boundary", "source": "Prop. prop:constr_Gamma (Intro.tex), existence of a super-solution under connectivity, global form", "state": "PROVED", "provider": "GuaranteedSubsol.StencilDistProof.exists_superSolution_of_connected", "chapter": "Intro", "statement": "theorem exists_superSolution_of_connected {X : Type*} [Finite X] {Λ : (X → ℝ) → X → ℝ}\n    {I : Set X} {ubd : X → ℝ} (hbd : ∀ u, ∀ x ∉ I, Λ u x = ubd x) {V : X → Set X} {Cpast : ℝ}\n    (hCpast : 0 ≤ Cpast) (hdep : ∀ x ∈ I, HasDependency Cpast (V x) (Λ · x))\n    (hconn : ∀ x ∈ I, ∃ z ∉ I, Relation.TransGen (fun a b => a ∈ I ∧ b ∈ V a) x z) :\n    ∃ u : X → ℝ, Λ u ≤ u", "doc": "Source: Prop. prop:constr_Gamma (Intro.tex), \"admits a super-solution if the stencils are\nconnected to the boundary\" (footnote), global form with Dirichlet data `Λ u = u_bd` outside the\ninterior `I`, under `C_past`-dependency with `C_past ≥ 0`. The paper's other assumptions\n(monotonicity, additive invariance, `Λ[0] ≥ δ`) are not needed. `X` is finite.", "deps": ["GuaranteedSubsol.superSolution_stencilDist"], "labels": ["prop:constr_Gamma"], "direct": ["GuaranteedSubsol.superSolution_stencilDist"]}, {"id": "GuaranteedSubsol.dijkstraStep_superSolution", "short": "dijkstraStep_superSolution", "file": "Anchors/DijkstraStepSuperSolution.lean", "pub_source": "Prop. prop:Dijkstra_correct, invariant `Γ u_n ≤ u_n`; the paper adds a stopping time `T`: this is the case `T = ∞`, the general case being `Γ^{<T}` (`dijkstraCutOp`)", "pub_doc": "Source: Prop. prop:Dijkstra_correct, eq. (Dijkstra_prop), first part: `Γ u_n ≤ u_n` at each iteration, from `Γ u_0 ≤ u_0`. Only the monotonicity of `Γ` is needed. the paper prop:Dijkstra_correct adds a stopping time `T`; these statements are the case `T = ∞`, and imply the general case applied to `Γ^{<T}` (`dijkstraCutOp`).", "notes": [], "title": "the generalized Dijkstra algorithm preserves super-solutions", "source": "Prop. prop:Dijkstra_correct (Complexity.tex), invariant `Γ u_n ≤ u_n`; V1 adds a stopping time `T`: this is the case `T = ∞`, the general case being `Γ^{<T}` (`dijkstraCutOp`)", "state": "PROVED", "provider": "GuaranteedSubsol.DijkstraProof.superSolution", "chapter": "Complexity", "statement": "theorem dijkstraStep_superSolution {X : Type*} [LinearOrder X]\n    {Γ : (X → WithTop ℝ) → X → WithTop ℝ} (hmono : Monotone Γ) {s : DijkstraState X}\n    (hs : Γ s.u ≤ s.u) (n : ℕ) :\n    Γ ((dijkstraStep Γ)^[n] s).u ≤ ((dijkstraStep Γ)^[n] s).u", "doc": "Source: Prop. prop:Dijkstra_correct (Complexity.tex), eq. (Dijkstra_prop), first part:\n`Γ u_n ≤ u_n` at each iteration, from `Γ u_0 ≤ u_0`. Only the monotonicity of `Γ` is needed.\nV1 prop:Dijkstra_correct adds a stopping time `T`; these statements are the case `T = ∞`, and\nimply the general case applied to `Γ^{<T}` (`dijkstraCutOp`).", "deps": [], "labels": ["prop:Dijkstra_correct"], "direct": []}, {"id": "GuaranteedSubsol.dijkstraRun_count_le_one", "short": "dijkstraRun_count_le_one", "file": "Anchors/DijkstraRunCountLeOne.lean", "pub_source": "Prop. prop:Dijkstra_correct, selected points pairwise distinct; monotonicity, `Γ u₀ ≤ u₀` and finiteness dropped; the paper adds a stopping time `T`: this is the case `T = ∞`, the general case being `Γ^{<T}` (`dijkstraCutOp`)", "pub_doc": "Source: Prop. prop:Dijkstra_correct: for `Γ` causal on `ℝ_∞`, the selected points `(x_n)` are pairwise distinct, i.e. each point is updated at most once. `X` is linearly ordered (tie-breaking). the paper prop:Dijkstra_correct adds a stopping time `T`; these statements are the case `T = ∞`, and imply the general case applied to `Γ^{<T}` (`dijkstraCutOp`).", "notes": ["author ruling", "author ruling", "renamed to the naming scheme", "Author ruling: the paper's assumptions that `Γ` is monotone, that `Γ u_0 ≤ u_0` and that `X` is finite are dropped, being unneeded here (they are used for termination at a fixed point)"], "title": "each point is updated at most once by the generalized Dijkstra algorithm", "source": "Prop. prop:Dijkstra_correct (Complexity.tex), selected points pairwise distinct; monotonicity, `Γ u₀ ≤ u₀` and finiteness dropped (author ruling); renamed to the naming scheme (author ruling); V1 adds a stopping time `T`: this is the case `T = ∞`, the general case being `Γ^{<T}` (`dijkstraCutOp`)", "state": "PROVED", "provider": "GuaranteedSubsol.DijkstraProof.count_le_one", "chapter": "Complexity", "statement": "theorem dijkstraRun_count_le_one {X : Type*} [LinearOrder X]\n    {Γ : (X → WithTop ℝ) → X → WithTop ℝ} (hcaus : ∀ x, Ext.Causal (Γ · x))\n    (u₀ : X → WithTop ℝ) (n : ℕ) (x : X) :\n    (dijkstraRun Γ u₀ n).count x ≤ 1", "doc": "Source: Prop. prop:Dijkstra_correct (Complexity.tex): for `Γ` causal on `ℝ_∞`, the selected\npoints `(x_n)` are pairwise distinct, i.e. each point is updated at most once. `X` is linearly\nordered (tie-breaking).\nAuthor ruling: the paper's assumptions that `Γ` is monotone, that `Γ u_0 ≤ u_0` and that `X` is\nfinite are dropped, being unneeded here (they are used for termination at a fixed point).\nV1 prop:Dijkstra_correct adds a stopping time `T`; these statements are the case `T = ∞`, and\nimply the general case applied to `Γ^{<T}` (`dijkstraCutOp`).", "deps": [], "labels": ["prop:Dijkstra_correct"], "direct": []}, {"id": "GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "short": "dijkstraRun_count_eq_one_iff", "file": "Anchors/DijkstraRunCountEqOneIff.lean", "pub_source": "Prop. prop:Dijkstra_correct, updated points = points whose value decreased; monotonicity, `Γ u₀ ≤ u₀` and finiteness dropped; the paper adds a stopping time `T`: this is the case `T = ∞`, the general case being `Γ^{<T}` (`dijkstraCutOp`)", "pub_doc": "Source: Prop. prop:Dijkstra_correct, last statement `{x_0, …, x_{N-1}} = {x | u_*(x) < u_0(x)}`, stated at every iteration `n`: a point has been updated iff its value has decreased. `X` is linearly ordered (tie-breaking). the paper prop:Dijkstra_correct adds a stopping time `T`; these statements are the case `T = ∞`, and imply the general case applied to `Γ^{<T}` (`dijkstraCutOp`).", "notes": ["author ruling", "author ruling", "renamed to the naming scheme", "Author ruling: the paper's assumptions that `Γ` is monotone, that `Γ u_0 ≤ u_0` and that `X` is finite are dropped, being unneeded here (they are used for termination at a fixed point)"], "title": "the points updated by the generalized Dijkstra algorithm", "source": "Prop. prop:Dijkstra_correct (Complexity.tex), updated points = points whose value decreased; monotonicity, `Γ u₀ ≤ u₀` and finiteness dropped (author ruling); renamed to the naming scheme (author ruling); V1 adds a stopping time `T`: this is the case `T = ∞`, the general case being `Γ^{<T}` (`dijkstraCutOp`)", "state": "PROVED", "provider": "GuaranteedSubsol.DijkstraProof.count_eq_one_iff", "chapter": "Complexity", "statement": "theorem dijkstraRun_count_eq_one_iff {X : Type*} [LinearOrder X]\n    {Γ : (X → WithTop ℝ) → X → WithTop ℝ} (hcaus : ∀ x, Ext.Causal (Γ · x))\n    (u₀ : X → WithTop ℝ) (n : ℕ) (x : X) :\n    (dijkstraRun Γ u₀ n).count x = 1 ↔\n      (dijkstraRun Γ u₀ n).u x < u₀ x", "doc": "Source: Prop. prop:Dijkstra_correct (Complexity.tex), last statement\n`{x_0, …, x_{N-1}} = {x | u_*(x) < u_0(x)}`, stated at every iteration `n`: a point has been\nupdated iff its value has decreased. `X` is linearly ordered (tie-breaking).\nAuthor ruling: the paper's assumptions that `Γ` is monotone, that `Γ u_0 ≤ u_0` and that `X` is\nfinite are dropped, being unneeded here (they are used for termination at a fixed point).\nV1 prop:Dijkstra_correct adds a stopping time `T`; these statements are the case `T = ∞`, and\nimply the general case applied to `Γ^{<T}` (`dijkstraCutOp`).", "deps": [], "labels": ["prop:Dijkstra_correct"], "direct": []}, {"id": "GuaranteedSubsol.dijkstraRun_fixedPoint", "short": "dijkstraRun_fixedPoint", "file": "Anchors/DijkstraRunFixedPoint.lean", "pub_source": "Prop. prop:Dijkstra_correct, termination within `card X` iterations at a fixed point; the paper adds a stopping time `T`: this is the case `T = ∞`, the general case being `Γ^{<T}` (`dijkstraCutOp`)", "pub_doc": "Source: Prop. prop:Dijkstra_correct: the algorithm terminates (`L_N = ∅`), here within `N ≤ card X` iterations, and `u_*:= u_N` is a fixed point of `Γ`. `X` is finite and linearly ordered (tie-breaking). the paper prop:Dijkstra_correct adds a stopping time `T`; these statements are the case `T = ∞`, and imply the general case applied to `Γ^{<T}` (`dijkstraCutOp`).", "notes": ["author ruling", "renamed to the naming scheme"], "title": "termination of the generalized Dijkstra algorithm at a fixed point", "source": "Prop. prop:Dijkstra_correct (Complexity.tex), termination within `card X` iterations at a fixed point; renamed to the naming scheme (author ruling); V1 adds a stopping time `T`: this is the case `T = ∞`, the general case being `Γ^{<T}` (`dijkstraCutOp`)", "state": "PROVED", "provider": "GuaranteedSubsol.DijkstraProof.fixedPoint", "chapter": "Complexity", "statement": "theorem dijkstraRun_fixedPoint {X : Type*} [LinearOrder X] [Finite X]\n    {Γ : (X → WithTop ℝ) → X → WithTop ℝ} (hmono : Monotone Γ) (hcaus : ∀ x, Ext.Causal (Γ · x))\n    {u₀ : X → WithTop ℝ} (hu₀ : Γ u₀ ≤ u₀) :\n    ∃ N ≤ Nat.card X, Γ (dijkstraRun Γ u₀ N).u = (dijkstraRun Γ u₀ N).u", "doc": "Source: Prop. prop:Dijkstra_correct (Complexity.tex): the algorithm terminates (`L_N = ∅`), here\nwithin `N ≤ card X` iterations, and `u_* := u_N` is a fixed point of `Γ`. `X` is finite and\nlinearly ordered (tie-breaking). V1 prop:Dijkstra_correct adds a stopping time `T`; these statements\nare the case `T = ∞`, and imply the general case applied to `Γ^{<T}` (`dijkstraCutOp`).", "deps": ["GuaranteedSubsol.dijkstraStep_superSolution"], "labels": ["prop:Dijkstra_correct"], "direct": ["GuaranteedSubsol.dijkstraStep_superSolution"]}, {"id": "GuaranteedSubsol.dijkstraRun_ext_of_causal", "short": "dijkstraRun_ext_of_causal", "file": "Anchors/DijkstraRunExtOfCausal.lean", "pub_source": "Prop. prop:Dijkstra_correct, for `Γ_∞` with `Γ` monotone and causal; restated with `Global.monotoneExtension` in place of `extOp`, equal by definition; the paper adds a stopping time `T`: this is the case `T = ∞`, the general case being `Γ^{<T}` (`dijkstraCutOp`)", "pub_doc": "Source: Prop. prop:Dijkstra_correct, for the extension `Γ_∞ = Global.monotoneExtension Γ` of a real operator `Γ` that is monotone and causal at each point: if `Γ_∞ u₀ ≤ u₀`, then each point is updated at most once, the updated points are those whose value has decreased, and the algorithm reaches a fixed point of `Γ_∞` within `card X` iterations. `X` is finite and linearly ordered (tie-breaking). the paper prop:Dijkstra_correct adds a stopping time `T`; these statements are the case `T = ∞`, and imply the general case applied to `Γ^{<T}` (`dijkstraCutOp`).", "notes": ["author's request", "author ruling", "author's request"], "title": "generalized Dijkstra for the extension of a real causal scheme", "source": "Prop. prop:Dijkstra_correct (Complexity.tex), for `Γ_∞` with `Γ` monotone and causal (author's request); restated with `Global.monotoneExtension` in place of `extOp`, equal by definition (author ruling); V1 adds a stopping time `T`: this is the case `T = ∞`, the general case being `Γ^{<T}` (`dijkstraCutOp`)", "state": "PROVED", "provider": "GuaranteedSubsol.DijkstraExtProof.dijkstraRun_ext_of_causal", "chapter": "Complexity", "statement": "theorem dijkstraRun_ext_of_causal {X : Type*} [LinearOrder X] [Finite X]\n    {Γ : (X → ℝ) → X → ℝ} (hmono : ∀ x, Monotone (Γ · x)) (hcaus : ∀ x, Causal (Γ · x))\n    {u₀ : X → WithTop ℝ} (hu₀ : Global.monotoneExtension Γ u₀ ≤ u₀) :\n    (∀ n x, (dijkstraRun (Global.monotoneExtension Γ) u₀ n).count x ≤ 1 ∧\n      ((dijkstraRun (Global.monotoneExtension Γ) u₀ n).count x = 1 ↔\n        (dijkstraRun (Global.monotoneExtension Γ) u₀ n).u x < u₀ x)) ∧\n    ∃ N ≤ Nat.card X, Global.monotoneExtension Γ (dijkstraRun (Global.monotoneExtension Γ) u₀ N).u =\n      (dijkstraRun (Global.monotoneExtension Γ) u₀ N).u", "doc": "Source: Prop. prop:Dijkstra_correct (Complexity.tex), for the extension\n`Γ_∞ = Global.monotoneExtension Γ` of a real operator `Γ` that is monotone and causal at each point\n(author's request): if `Γ_∞ u₀ ≤ u₀`, then each point is updated at most once, the updated points\nare those whose value has decreased, and the algorithm reaches a fixed point of `Γ_∞` within\n`card X` iterations. `X` is finite and linearly ordered (tie-breaking). V1 prop:Dijkstra_correct\nadds a stopping time `T`; these statements are the case `T = ∞`, and imply the general case applied\nto `Γ^{<T}` (`dijkstraCutOp`).", "deps": ["GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_count_le_one", "GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension"], "labels": ["prop:Dijkstra_correct"], "direct": ["GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "GuaranteedSubsol.dijkstraRun_count_le_one", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension"]}, {"id": "GuaranteedSubsol.monotone_monotoneExtension", "short": "monotone_monotoneExtension", "file": "Anchors/MonotoneMonotoneExtension.lean", "pub_source": "Prop. prop:monotonic_Phi: `Λ_∞` monotone (no monotonicity of `Λ` needed)", "pub_doc": "Source: Prop. prop:monotonic_Phi, \"`Λ_∞` and `Φ_α` are monotone\", scalar form (`Λ: (X → ℝ) → ℝ` stands for `(Λ · x)`).\n\nThe paper assumes `Λ` monotone. With the generalized `monotoneExtension` (supremum over finite minorants) this hypothesis is not needed, so it is omitted.", "notes": [], "title": "`Λ_∞` is monotone", "source": "Prop. prop:monotonic_Phi (Complexity.tex): `Λ_∞` monotone (no monotonicity of `Λ` needed)", "state": "PROVED", "provider": "GuaranteedSubsol.KruzkovProof.monotone_monotoneExtension", "chapter": "Complexity", "statement": "theorem monotone_monotoneExtension {X : Type*} (Λ : (X → ℝ) → ℝ) :\n    Monotone (monotoneExtension Λ)", "doc": "Source: Prop. prop:monotonic_Phi (Complexity.tex), \"`Λ_∞` and `Φ_α` are monotone\", scalar form\n(`Λ : (X → ℝ) → ℝ` stands for `(Λ · x)`).\n\nThe paper assumes `Λ` monotone. With the generalized `monotoneExtension` (supremum over finite\nminorants) this hypothesis is not needed, so it is omitted.", "deps": [], "labels": ["prop:monotonic_Ph bMultiplicative.lean", "pub_source": "Analogue of prop:pertSubSuper, sub-multiplicative, super-solution (from proof of corol:tol), pointwise", "pub_doc": "Analogue of Prop. prop:pertSubSuper with sub-multiplicativity in place of sub-additivity, from the proof of Corol. corol:tol (, second point): if `Λ` is `ν`-sub-multiplicative, `0 ≤ ε < ν` and `Λ u ≤ u x + ε`, then `(1 + η) u` with `η:= ε / (ν - ε)`, i.e. `ν / (ν - ε) • u`, satisfies the super-solution inequality at `x`. Scalar form: `Λ: (X → ℝ) → ℝ` stands for `(Λ · x)`.", "notes": [], "title": "rescaling into a super-solution, sub-multiplicative case", "source": "Analogue of prop:pertSubSuper, sub-multiplicative, super-solution (from proof of corol:tol), pointwise", "state": "PROVED", "provider": "GuaranteedSubsol.TolProof.superSolution_of_subMultiplicative", "chapter": "Notes", "statement": "theorem superSolution_of_subMultiplicative {X : Type*} {Λ : (X → ℝ) → ℝ} {ν : ℝ}\n    (hmul : SubMultiplicative ν Λ) {u : X → ℝ} {x : X} {ε : ℝ} (hε : 0 ≤ ε) (hεν : ε < ν)\n    (hu : Λ u ≤ u x + ε) :\n    Λ (fun y => ν / (ν - ε) * u y) ≤ ν / (ν - ε) * u x", "doc": "Analogue of Prop. prop:pertSubSuper with sub-multiplicativity in place of sub-additivity, from the\nproof of Corol. corol:tol (Complexity.tex, second point): if `Λ` is `ν`-sub-multiplicative,\n`0 ≤ ε < ν` and `Λ u ≤ u x + ε`, then `(1 + η) u` with `η := ε / (ν - ε)`, i.e.\n`ν / (ν - ε) • u`, satisfies the super-solution inequality at `x`. Scalar form:\n`Λ : (X → ℝ) → ℝ` stands for `(Λ · x)`.", "deps": [], "labels": ["prop:pertSubSuper", "corol:tol"], "direct": []}, {"id": "GuaranteedSubsol.tol_of_subSolution_superSolution", "short": "tol_of_subSolution_superSolution", "file": "Anchors/TolOfSubSolutionSuperSolution.lean", "pub_source": "Corol. corol:tol, first point", "pub_doc": "Source: Corol. corol:tol, first point. `Λ` is monotone, obeys the comparison principle (in the sub-solution vs. super-solution form of the paper eq:comparison_Lambda, `hcomp`), and has a fixed point `u_*`. If `ū ≤ Λ ū`, `Λ u̲ ≤ u̲` and `(1 + ε) ū ≥ u̲` with `ε ≥ 0`, then `(1+ε)⁻¹ u_* ≤ ū ≤ u_*`, `u_* ≤ u̲ ≤ (1+ε) u_*`, `0 ≤ Λ ū - ū ≤ ε u_*`, `0 ≤ u̲ - Λ u̲ ≤ ε u_*`.", "notes": ["author ruling", "bound variables renamed to lowerCamelCase"], "title": "tolerance from a sub- and a super-solution", "source": "Corol. corol:tol (Complexity.tex), first point; bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.TolProof.tol_of_subSolution_superSolution", "chapter": "Complexity", "statement": "theorem tol_of_subSolution_superSolution {X : Type*} {Λ : (X → ℝ) → X → ℝ}\n    (hmono : Monotone Λ) (hcomp : HasComparisonPrinciple Set.univ Λ)\n    {uFix : X → ℝ} (hfix : Λ uFix = uFix) {ε : ℝ} (hε : 0 ≤ ε) {uSub uSup : X → ℝ}\n    (hsub : uSub ≤ Λ uSub) (hsup : Λ uSup ≤ uSup) (htol : ∀ x, uSup x ≤ (1 + ε) * uSub x) :\n    ∀ x, ((1 + ε)⁻¹ * uFix x ≤ uSub x ∧ uSub x ≤ uFix x) ∧\n      (uFix x ≤ uSup x ∧ uSup x ≤ (1 + ε) * uFix x) ∧\n      (0 ≤ Λ uSub x - uSub x ∧ Λ uSub x - uSub x ≤ ε * uFix x) ∧\n      (0 ≤ uSup x - Λ uSup x ∧ uSup x - Λ uSup x ≤ ε * uFix x)", "doc": "Source: Corol. corol:tol (Complexity.tex), first point. `Λ` is monotone, obeys the comparison\nprinciple (in the sub-solution vs. super-solution form of V1 eq:comparison_Lambda, `hcomp`),\nand has a fixed point `u_*`. If `ū ≤ Λ ū`, `Λ u̲ ≤ u̲` and `(1 + ε) ū ≥ u̲` with `ε ≥ 0`, then\n`(1+ε)⁻¹ u_* ≤ ū ≤ u_*`, `u_* ≤ u̲ ≤ (1+ε) u_*`, `0 ≤ Λ ū - ū ≤ ε u_*`, `0 ≤ u̲ - Λ u̲ ≤ ε u_*`.", "deps": [], "labels": ["corol:tol"], "direct": []}, {"id": "GuaranteedSubsol.tol_of_superSolution_subMultiplicative", "short": "tol_of_superSolution_subMultiplicative", "file": "Anchors/TolOfSuperSolutionSubMultiplicative.lean", "pub_source": "Corol. corol:tol, second point, super-solution", "pub_doc": "Source: Corol. corol:tol, second point, super-solution case. `Λ` obeys the comparison principle (sub-solution vs. super-solution form of the paper eq:comparison_Lambda, `hcomp`), has a fixed point `u_*`, Dirichlet boundary conditions `ubd ≥ 0` on `∂X` (complement of `I = Int X`), and is `ν`-sub-multiplicative on `Int X` with `ν > 0`. If `0 ≤ u̲ - Λ u̲ ≤ ε` and `u̲ = ubd` on `∂X`, then `u_* ≤ u̲ ≤ (1 + ε/ν) u_*`.", "notes": ["author ruling", "bound variables renamed to lowerCamelCase"], "title": "tolerance from a super-solution, sub-multiplicative case", "source": "Corol. corol:tol (Complexity.tex), second point, super-solution; bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.TolProof.tol_of_superSolution_subMultiplicative", "chapter": "Complexity", "statement": "theorem tol_of_superSolution_subMultiplicative {X : Type*} {Λ : (X → ℝ) → X → ℝ} {I : Set X}\n    {ubd : X → ℝ} (hbd : ∀ u, ∀ x ∉ I, Λ u x = ubd x) (hubd : ∀ x ∉ I, 0 ≤ ubd x)\n    {ν : ℝ} (hν : 0 < ν) (hmul : ∀ x ∈ I, SubMultiplicative ν (Λ · x))\n    (hcomp : HasComparisonPrinciple Set.univ Λ)\n    {uFix : X → ℝ} (hfix : Λ uFix = uFix) {ε : ℝ} (hε : 0 ≤ ε) {uSup : X → ℝ}\n    (hsup : Λ uSup ≤ uSup) (htol : ∀ x, uSup x - Λ uSup x ≤ ε)\n    (hsupbd : ∀ x ∉ I, uSup x = ubd x) :\n    ∀ x, uFix x ≤ uSup x ∧ uSup x ≤ (1 + ε / ν) * uFix x", "doc": "Source: Corol. corol:tol (Complexity.tex), second point, super-solution case. `Λ` obeys the\ncomparison principle (sub-solution vs. super-solution form of V1 eq:comparison_Lambda, `hcomp`), has\na fixed point `u_*`, Dirichlet boundary conditions `ubd ≥ 0` on `∂X` (complement of `I = Int X`),\nand is `ν`-sub-multiplicative on `Int X` with `ν > 0`. If `0 ≤ u̲ - Λ u̲ ≤ ε` and `u̲ = ubd` on\n`∂X`, then `u_* ≤ u̲ ≤ (1 + ε/ν) u_*`.", "deps": ["GuaranteedSubsol.subSolution_of_subMultiplicative"], "labels": ["corol:tol"], "direct": ["GuaranteedSubsol.subSolution_of_subMultiplicative"]}, {"id": "GuaranteedSubsol.tol_of_subSolution_subMultiplicative", "short": "tol_of_subSolution_subMultiplicative", "file": "Anchors/TolOfSubSolutionSubMultiplicative.lean", "pub_source": "Corol. corol:tol, second point, sub-solution", "pub_doc": "Source: Corol. corol:tol, second point, sub-solution case. `Λ` obeys the comparison principle (sub-solution vs. super-solution form of the paper eq:comparison_Lambda, `hcomp`), has a fixed point `u_*`, Dirichlet boundary conditions `ubd ≥ 0` on `∂X` (complement of `I = Int X`), and is `ν`-sub-multiplicative on `Int X`. If `0 ≤ Λ ū - ū ≤ ε` with `0 ≤ ε < ν`, and `ū = ubd` on `∂X`, then `(1 - ε/ν) u_* ≤ ū ≤ u_*`.", "notes": ["author ruling", "bound variables renamed to lowerCamelCase"], "title": "tolerance from a sub-solution, sub-multiplicative case", "source": "Corol. corol:tol (Complexity.tex), second point, sub-solution; bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.TolProof.tol_of_subSolution_subMultiplicative", "chapter": "Complexity", "statement": "theorem tol_of_subSolution_subMultiplicative {X : Type*} {Λ : (X → ℝ) → X → ℝ} {I : Set X}\n    {ubd : X → ℝ} (hbd : ∀ u, ∀ x ∉ I, Λ u x = ubd x) (hubd : ∀ x ∉ I, 0 ≤ ubd x)\n    {ν : ℝ} (hmul : ∀ x ∈ I, SubMultiplicative ν (Λ · x))\n    (hcomp : HasComparisonPrinciple Set.univ Λ)\n    {uFix : X → ℝ} (hfix : Λ uFix = uFix) {ε : ℝ} (hε : 0 ≤ ε) (hεν : ε < ν)\n    {uSub : X → ℝ} (hsub : uSub ≤ Λ uSub) (htol : ∀ x, Λ uSub x - uSub x ≤ ε)\n    (hsubbd : ∀ x ∉ I, uSub x = ubd x) :\n    ∀ x, (1 - ε / ν) * uFix x ≤ uSub x ∧ uSub x ≤ uFix x", "doc": "Source: Corol. corol:tol (Complexity.tex), second point, sub-solution case. `Λ` obeys the comparison\nprinciple (sub-solution vs. super-solution form of V1 eq:comparison_Lambda, `hcomp`), has a fixed\npoint `u_*`, Dirichlet boundary conditions `ubd ≥ 0` on `∂X` (complement of `I = Int X`), and is\n`ν`-sub-multiplicative on `Int X`. If `0 ≤ Λ ū - ū ≤ ε` with `0 ≤ ε < ν`, and `ū = ubd` on `∂X`,\nthen `(1 - ε/ν) u_* ≤ ū ≤ u_*`.", "deps": ["GuaranteedSubsol.superSolution_of_subMultiplicative"], "labels": ["corol:tol"], "direct": ["GuaranteedSubsol.superSolution_of_subMultiplica ld), scalar form: causality is\nequivalent to `∀ u v t, u^{<t} = v^{<t} ⇒ (Γ u)^{≤t} = (Γ v)^{≤t}`. The scalar operator\n`Γ : (X → ℝ) → ℝ` stands for `(Γ · x)`; values are compared in `ℝ_∞ = WithTop ℝ` through the\ncutoffs `cutoffLt`, `cutoffLe`.", "deps": ["GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq", "GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq"], "labels": ["prop:causal_formulation", "eq:causal_old"], "direct": ["GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq", "GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq"]}, {"id": "GuaranteedSubsol.Ext.causal_iff_cutoff", "short": "Ext.causal_iff_cutoff", "file": "Anchors/ExtCausalIffCutoff.lean", "pub_source": "Prop. prop:causal_formulation, eq. (causal_old), scalar form on `ℝ_∞`", "pub_doc": "Source: Prop. prop:causal_formulation, eq. (causal_old), scalar form on `ℝ_∞ = WithTop ℝ`: `Ext.Causal Γ` is equivalent to `∀ u v t, u^{<t} = v^{<t} ⇒ (Γ u)^{≤t} = (Γ v)^{≤t}`, for `Γ: (X → ℝ_∞) → ℝ_∞`.", "notes": [], "title": "causality on `ℝ_∞` in terms of cutoffs", "source": "Prop. prop:causal_formulation (Complexity.tex), eq. (causal_old), scalar form on `ℝ_∞`", "state": "PROVED", "provider": "GuaranteedSubsol.ExtCausalCutoffProof.causal_iff_cutoff", "chapter": "Complexity", "statement": "theorem causal_iff_cutoff {X : Type*} (Γ : (X → WithTop ℝ) → WithTop ℝ) :\n    Causal Γ ↔ ∀ (u v : X → WithTop ℝ) (t : ℝ),\n      (∀ y, cutoffLt t (u y) = cutoffLt t (v y)) → cutoffLe t (Γ u) = cutoffLe t (Γ v)", "doc": "Source: Prop. prop:causal_formulation (Complexity.tex), eq. (causal_old), scalar form on\n`ℝ_∞ = WithTop ℝ`: `Ext.Causal Γ` is equivalent to\n`∀ u v t, u^{<t} = v^{<t} ⇒ (Γ u)^{≤t} = (Γ v)^{≤t}`, for `Γ : (X → ℝ_∞) → ℝ_∞`.", "deps": ["GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq", "GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq"], "labels": ["prop:causal_formulation", "eq:causal_old"], "direct": ["GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq", "GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq"]}, {"id": "GuaranteedSubsol.Causal.apply_eq_apply_min", "short": "Causal.apply_eq_apply_min", "file": "Anchors/CausalApplyMin.lean", "pub_source": "Corol. corol:G_min_u_t, scalar form", "pub_doc": "Source: Corol. corol:G_min_u_t, scalar form: if `Γ` is causal, then `Γ u = Γ min {u,t}` for all `t ≥ Γ u`. The scalar operator `Γ: (X → ℝ) → ℝ` stands for `(Γ · x)`.", "notes": [], "title": "a causal operator ignores values above its output", "source": "Corol. corol:G_min_u_t (Complexity.tex), scalar form", "state": "PROVED", "provider": "GuaranteedSubsol.CausalApplyMinProof.apply_eq_apply_min", "chapter": "Complexity", "statement": "theorem Causal.apply_eq_apply_min {X : Type*} {Γ : (X → ℝ) → ℝ} (hΓ : Causal Γ) (u : X → ℝ)\n    {t : ℝ} (ht : Γ u ≤ t) :\n    Γ u = Γ (fun y => min (u y) t)", "doc": "Source: Corol. corol:G_min_u_t (Complexity.tex), scalar form: if `Γ` is causal, then\n`Γ u = Γ min {u,t}` for all `t ≥ Γ u`. The scalar operator `Γ : (X → ℝ) → ℝ` stands for `(Γ · x)`.", "deps": [], "labels": ["corol:G_min_u_t"], "direct": []}, {"id": "GuaranteedSubsol.Ext.Causal.apply_eq_apply_min", "short": "Ext.Causal.apply_eq_apply_min", "file": "Anchors/ExtCausalApplyMin.lean", "pub_source": "Corol. corol:G_min_u_t, scalar form on `ℝ_∞`", "pub_doc": "Source: Corol. corol:G_min_u_t, scalar form on `ℝ_∞ = WithTop ℝ`: if `Γ` is causal (`Ext.Causal`), then `Γ u = Γ min {u,t}` for all real `t ≥ Γ u`. The scalar operator `Γ: (X → ℝ_∞) → ℝ_∞` stands for `(Γ · x)`.", "notes": [], "title": "a causal operator on `ℝ_∞` ignores values above its output", "source": "Corol. corol:G_min_u_t (Complexity.tex), scalar form on `ℝ_∞`", "state": "PROVED", "provider": "GuaranteedSubsol.CausalApplyMinProof.ext_apply_eq_apply_min", "chapter": "Complexity", "statement": "theorem Causal.apply_eq_apply_min {X : Type*} {Γ : (X → WithTop ℝ) → WithTop ℝ}\n    (hΓ : Causal Γ) (u : X → WithTop ℝ) {t : ℝ} (ht : Γ u ≤ t) :\n    Γ u = Γ (fun y => min (u y) t)", "doc": "Source: Corol. corol:G_min_u_t (Complexity.tex), scalar form on `ℝ_∞ = WithTop ℝ`: if `Γ` is\ncausal (`Ext.Causal`), then `Γ u = Γ min {u,t}` for all real `t ≥ Γ u`. The scalar operator\n`Γ : (X → ℝ_∞) → ℝ_∞` stands for `(Γ · x)`.", "deps": [], "labels": ["corol:G_min_u_t"], "direct": []}, {"id": "GuaranteedSubsol.HasMemory.apply_eq_apply_max", "short": "HasMemory.apply_eq_apply_max", "file": "Anchors/HasMemoryApplyMax.lean", "pub_source": "Prop. prop:Cpast_formulation, direct implication, scalar form", "pub_doc": "Source: Prop. prop:Cpast_formulation, direct implication, scalar form: if `Λ` is monotone, additively invariant and has `C_past`-memory, then `Λ u = Λ max {u,t}` for all `t ≤ Λ u - C_past`. The scalar operator `Λ: (X → ℝ) → ℝ` stands for `(Λ · x)`.", "notes": [], "title": "`C_past`-memory implies eq. (Lambda_max_u_t)", "source": "Prop. prop:Cpast_formulation (Complexity.tex), direct implication, scalar form", "state": "PROVED", "provider": "GuaranteedSubsol.CpastFormulationProof.apply_eq_apply_max", "chapter": "Complexity", "statement": "theorem HasMemory.apply_eq_apply_max {X : Type*} {Λ : (X → ℝ) → ℝ} {C : ℝ}\n    (hmono : Monotone Λ) (hadd : AdditivelyInvariant Λ) (h : HasMemory C Λ)\n    (u : X → ℝ) {t : ℝ} (ht : t ≤ Λ u - C) :\n    Λ u = Λ (fun y => max (u y) t)", "doc": "Source: Prop. prop:Cpast_formulation (Complexity.tex), direct implication, scalar form: if `Λ` is\nmonotone, additively invariant and has `C_past`-memory, then `Λ u = Λ max {u,t}` for all\n`t ≤ Λ u - C_past`. The scalar operator `Λ : (X → ℝ) → ℝ` stands for `(Λ · x)`.", "deps": [], "labels": ["prop:Cpast_formulation"], "direct": []}, {"id": "GuaranteedSubsol.hasMemory_of_apply_eq_apply_max", "short": "hasMemory_of_apply_eq_apply_max", "file": "Anchors/HasMemoryOfApplyMax.lean", "pub_source": "Prop. prop:Cpast_formulation, converse (finite `X`), scalar form", "pub_doc": "Source: Prop. prop:Cpast_formulation, converse implication, scalar form: if `Λ` is monotone, additively invariant, and `Λ u = Λ max {u,t}` for all `u` and `t ≤ Λ u - C_past`, then `Λ` has `C_past`-memory. `X` is finite (the proof needs `u - n ε 1_{u ≤ t} ≤ v` for some `n`). The scalar operator `Λ: (X → ℝ) → ℝ` stands for `(Λ · x)`.", "notes": [], "title": "eq. (Lambda_max_u_t) implies `C_past`-memory", "source": "Prop. prop:Cpast_formulation (Complexity.tex), converse (finite `X`), scalar form", "state": "PROVED", "provider": "GuaranteedSubsol.CpastFormulationProof.hasMemory_of_apply_eq_apply_max", "chapter": "Complexity", "statement": "theorem hasMemory_of_apply_eq_apply_max {X : Type*} [Finite X] {Λ : (X → ℝ) → ℝ} {C : ℝ}\n    (hmono : Monotone Λ) (hadd : AdditivelyInvariant Λ)\n    (h : ∀ (u : X → ℝ) (t : ℝ), t ≤ Λ u - C → Λ u = Λ (fun y => max (u y) t)) :\n    HasMemory C Λ", "doc": "Source: Prop. prop:Cpast_formulation (Complexity.tex), converse implication, scalar form: if `Λ` is\nmonotone, additively invariant, and `Λ u = Λ max {u,t}` for all `u` and `t ≤ Λ u - C_past`, then\n`Λ` has `C_past`-memory. `X` is finite (the proof needs `u - n ε 1_{u ≤ t} ≤ v` for some `n`).\nThe scalar operator `Λ : (X → ℝ) → ℝ` stands for `(Λ · x)`.", "deps": [], "labels": ["prop:Cpast_formulation"], "direct": []}, {"id": "GuaranteedSubsol.apply_le_apply_of_causal_memory", "short": "apply_le_apply_of_causal_memory", "file": "Anchors/ApplyLeApplyOfCausalMemory.lean", "pub_source": "Corol. corol:mon_min_max, scalar form", "pub_doc": "Source: Corol. corol:mon_min_max, scalar form: let `Λ` be monotone, causal, additively invariant, with `C_past`-memory; let `t₀ ≤ Λ u - C_past` and `t₁ ≥ Λ u`. If `v ≥ u` on `{t₀ ≤ u < t₁}` and `v ≥ t₁` on `{u ≥ t₁}`, then `Λ u ≤ Λ v`. `X` is finite, as in the paper's proof (choice of `t₀' < t₀` with no value of `u` in `[t₀', t₀[`). The scalar operator `Λ: (X → ℝ) → ℝ` stands for `(Λ · x)`.", "notes": [], "title": "monotonicity restricted to a window of values", "source": "Corol. corol:mon_min_max (Complexity.tex), scalar form", "state": "PROVED", "provider": "GuaranteedSubsol.MonMinMaxProof.apply_le_apply_of_causal_memory", "chapter": "Complexity", "statement": "theorem apply_le_apply_of_causal_memory {X : Type*} [Finite X] {Λ : (X → ℝ) → ℝ} {C : ℝ}\n    (hmono : Monotone Λ) (hcaus : Causal Λ) (hadd : AdditivelyInvariant Λ)\n    (hmem : HasMemory C Λ) {u v : X → ℝ} {t₀ t₁ : ℝ} (ht₀ : t₀ ≤ Λ u - C) (ht₁ : Λ u ≤ t₁)\n    (hmid : ∀ y, t₀ ≤ u y → u y < t₁ → u y ≤ v y) (htop : ∀ y, t₁ ≤ u y → t₁ ≤ v y) :\n    Λ u ≤ Λ v", "doc": "Source: Corol. corol:mon_min_max (Complexity.tex), scalar form: let `Λ` be monotone, causal,\nadditively invariant, with `C_past`-memory; let `t₀ ≤ Λ u - C_past` and `t₁ ≥ Λ u`. If `v ≥ u` on\n`{t₀ ≤ u < t₁}` and `v ≥ t₁` on `{u ≥ t₁}`, then `Λ u ≤ Λ v`. `X` is finite, as in the paper's\nproof (choice of `t₀' < t₀` with no value of `u` in `[t₀', t₀[`). The scalar operator\n`Λ : (X → ℝ) → ℝ` stands for `(Λ · x)`.", "deps": ["GuaranteedSubsol.Causal.apply_eq_apply_min", "GuaranteedSubsol.HasMemory.apply_eq_apply_max", "GuaranteedSubsol.apply_le_apply_of_causal_memory_of_lt"], "labels": ["corol:mon_min_max"], "direct": ["GuaranteedSubsol.apply_le_apply_of_causal_memory_of_lt"]}, {"id": "GuaranteedSubsol.apply_le_apply_of_causal_memory_of_lt", "short": "apply_le_apply_of_causal_memory_of_lt", "file": "Anchors/ApplyLeApplyOfCausalMemoryOfLt.lean", "pub_source": "Corol. corol:mon_min_max, variant with `t₀ < Λ u - C`, no finiteness, scalar form", "pub_doc": "Variant of Corol. corol:mon_min_max, scalar form, with the strict assumption `t₀ < Λ u - C_past` and no finiteness assumption on `X`: let `Λ` be monotone, causal, additively invariant, with `C_past`-memory; let `t₀ < Λ u - C_past` and `t₁ ≥ Λ u`. If `v ≥ u` on `{t₀ ≤ u < t₁}` and `v ≥ t₁` on `{u ≥ t₁}`, then `Λ u ≤ Λ v`. The scalar operator `Λ: (X → ℝ) → ℝ` stands for `(Λ · x)`.", "notes": [], "title": "monotonicity restricted to a window of values, strict lower level", "source": "Corol. corol:mon_min_max (Complexity.tex), variant with `t₀ < Λ u - C`, no finiteness, scalar form", "state": "PROVED", "provider": "GuaranteedSubsol.MonMinMaxProof.apply_le_apply_of_causal_memory_of_lt", "chapter": "Complexity", "statement": "theorem apply_le_apply_of_causal_memory_of_lt {X : Type*} {Λ : (X → ℝ) → ℝ} {C : ℝ}\n    (hmono : Monotone Λ) (hcaus : Causal Λ) (hadd : AdditivelyInvariant Λ)\n    (hmem : HasMemory C Λ) {u v : X → ℝ} {t₀ t₁ : ℝ} (ht₀ : t₀ < Λ u - C) (ht₁ : Λ u ≤ t₁)\n    (hmid : ∀ y, t₀ ≤ u y → u y < t₁ → u y ≤ v y) (htop : ∀ y, t₁ ≤ u y → t₁ ≤ v y) :\n    Λ u ≤ Λ v", "doc": "Variant of Corol. corol:mon_min_max (Complexity.tex), scalar form, with the strict assumption\n`t₀ < Λ u - C_past` and no finiteness assumption on `X`: let `Λ` be monotone, causal, additively\ninvariant, with `C_past`-memory; let `t₀ < Λ u - C_past` and `t₁ ≥ Λ u`. If `v ≥ u` on\n`{t₀ ≤ u < t₁}` and `v ≥ t₁` on `{u ≥ t₁}`, then `Λ u ≤ Λ v`. The scalar operator\n`Λ : (X → ℝ) → ℝ` stands for `(Λ · x)`.", "deps": ["GuaranteedSubsol.Causal.apply_eq_apply_min", "GuaranteedSubsol.HasMemory.apply_eq_apply_max"], "labels": ["corol:mon_min_max"], "direct": ["GuaranteedSubsol.Causal.apply_eq_apply_min", "GuaranteedSubsol.HasMemory.apply_eq_apply_max"]}, {"id": "GuaranteedSubsol.subsol_extension", "short": "subsol_extension", "file": "Anchors/GraphSubsol.lean", "pub_source": "Lemma lem:graph_subsol", "pub_doc": "Source: Lemma lem:graph_subsol: let `Λ, Γ: ℝ^X → ℝ^X` with `Λ` monotone and `Γ ≤ Λ`. If `ū ≤ Λ ū` and `û = max {ū, Γ û}`, then `û ≤ Λ û`. Global operators `(X → ℝ) → X → ℝ`, with the pointwise order on `X → ℝ` and on operators.", "notes": ["author ruling", "bound variables renamed to lowerCamelCase"], "title": "extension of a sub-solution by a graph operator", "source": "Lemma lem:graph_subsol (Complexity.tex); bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.GraphSubsolProof.subsol_extension", "chapter": "Complexity", "statement": "theorem subsol_extension {X : Type*} {Λ Γ : (X → ℝ) → X → ℝ} (hmono : Monotone Λ)\n    (hΓ : Γ ≤ Λ) {uSub uHat : X → ℝ} (hsub : uSub ≤ Λ uSub)\n    (hhat : uHat = fun x => max (uSub x) (Γ uHat x)) :\n    uHat ≤ Λ uHat", "doc": "Source: Lemma lem:graph_subsol (Complexity.tex): let `Λ, Γ : ℝ^X → ℝ^X` with `Λ` monotone and\n`Γ ≤ Λ`. If `ū ≤ Λ ū` and `û = max {ū, Γ û}`, then `û ≤ Λ û`. Global operators\n`(X → ℝ) → X → ℝ`, with the pointwise order on `X → ℝ` and on operators.", "deps": [], "labels": ["lem:graph_subsol"], "direct": []}, {"id": "GuaranteedSubsol.max_min_fixedPoint", "short": "max_min_fixedPoint", "file": "Anchors/MaxMinFixedPoint.lean", "pub_source": "Lemma lem:max_min, first two conclusions, under causality only", "pub_doc": "Source: Lemma lem:max_min: let `Γ` be causal, `Γ':= max {ū, min {T, Γ}}`. If `u = max {ū, Γ u}`, then `û:= max {ū, min {T, u}}` satisfies `Γ' û = û`, and `min {u,T} = min {û,T}`. Global operator `Γ: (X → ℝ) → X → ℝ`, causal at every point; `Γ'` and `û` are written out explicitly. the anchor proves the fixed-point identity under causality only. Uniqueness is not part of the anchor; it follows from `le_of_causal_real`.", "notes": ["V1 also assumes `Γ` monotone and states uniqueness, which follows from `le_of_causal_real`; author's ruling 2026-10-20, annotation", "author ruling", "bound variables renamed to lowerCamelCase", "The paper's last consequence, `{u < t} = {û < t}` for `t ≤ T`, is omitted as trivial; author ruling.", "author's ruling 2026-10-20", "Annotation : V1 lem:max_min assumes `Γ` monotone and causal and states that `û` is the unique fixed point"], "title": "fixed point of the truncated operator `max {ū, min {T, Γ}}`", "source": "Lemma lem:max_min (Complexity.tex), first two conclusions, under causality only (V1 also assumes `Γ` monotone and states uniqueness, which follows from `le_of_causal_real`; author's ruling 2026-10-20, annotation); bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.MaxMinProof.max_min_fixedPoint", "chapter": "Complexity", "statement": "theorem max_min_fixedPoint {X : Type*} {Γ : (X → ℝ) → X → ℝ} (hcaus : ∀ x, Causal (Γ · x))\n    (uSub : X → ℝ) (T : ℝ) {u uHat : X → ℝ} (hu : u = fun x => max (uSub x) (Γ u x))\n    (huHat : uHat = fun x => max (uSub x) (min T (u x))) :\n    ((fun x => max (uSub x) (min T (Γ uHat x))) = uHat) ∧ ∀ x, min (u x) T = min (uHat x) T", "doc": "Source: Lemma lem:max_min (Complexity.tex): let `Γ` be causal, `Γ' := max {ū, min {T, Γ}}`. If\n`u = max {ū, Γ u}`, then `û := max {ū, min {T, u}}` satisfies `Γ' û = û`, and\n`min {u,T} = min {û,T}`. (The paper's last consequence, `{u < t} = {û < t}` for `t ≤ T`, is\nomitted as trivial; author ruling.) Global operator `Γ : (X → ℝ) → X → ℝ`, causal at every point;\n`Γ'` and `û` are written out explicitly.\nAnnotation (author's ruling 2026-10-20): V1 lem:max_min assumes `Γ` monotone and causal and states\nthat `û` is the unique fixed point; the anchor proves the fixed-point identity under causality\nonly. Uniqueness is not part of the anchor; it follows from `le_of_causal_real`.", "deps": [], "labels": ["lem:max_min"], "direct": []}, {"id": "GuaranteedSubsol.max_min_unique", "short": "max_min_unique", "file": "Anchors/MaxMinUnique.lean", "pub_source": "Lemma lem:max_min, uniqueness: every fixed point of `max {ū, min {T, Γ}}` equals `û`, `Γ` monotone and causal", "pub_doc": "Source: Lemma lem:max_min, uniqueness part: let `Γ: ℝ^X → ℝ^X` be monotone and causal (at every point), `ū ∈ ℝ^X`, `T ∈ ℝ`. If `u = max {ū, Γ u}` and `û:= max {ū, min {T, u}}`, then every fixed point `v` of `Γ':= max {ū, min {T, Γ}}` equals `û`. (That `û` is a fixed point is `max_min_fixedPoint`.) `X` is finite.", "notes": ["author's request 2026-10-20, completes `max_min_fixedPoint`", "author's request 2026-10-20, completing the anchor `max_min_fixedPoint`"], "title": "uniqueness of the fixed point in lem:max_min", "source": "Lemma lem:max_min (Complexity.tex, V1), uniqueness: every fixed point of `max {ū, min {T, Γ}}` equals `û`, `Γ` monotone and causal (author's request 2026-10-20, completes `max_min_fixedPoint`)", "state": "PROVED", "provider": "GuaranteedSubsol.ExistsUniqueProof.max_min_unique", "chapter": "Complexity", "statement": "theorem max_min_unique {X : Type*} [Finite X] {Γ : (X → ℝ) → X → ℝ}\n    (hmono : ∀ x, Monotone (Γ · x)) (hcaus : ∀ x, Causal (Γ · x)) (uSub : X → ℝ) (T : ℝ)\n    {u uHat v : X → ℝ} (hu : u = fun x => max (uSub x) (Γ u x))\n    (huHat : uHat = fun x => max (uSub x) (min T (u x)))\n    (hv : v = fun x => max (uSub x) (min T (Γ v x))) : v = uHat", "doc": "Source: Lemma lem:max_min (Complexity.tex, V1), uniqueness part (author's request 2026-10-20,\ncompleting the anchor `max_min_fixedPoint`): let `Γ : ℝ^X → ℝ^X` be monotone and causal (at every\npoint), `ū ∈ ℝ^X`, `T ∈ ℝ`. If `u = max {ū, Γ u}` and `û := max {ū, min {T, u}}`, then every fixed\npoint `v` of `Γ' := max {ū, min {T, Γ}}` equals `û`. (That `û` is a fixed point is\n`max_min_fixedPoint`.) `X` is finite.", "deps": ["GuaranteedSubsol.le_of_causal_real", "GuaranteedSubsol.Causal.max", "GuaranteedSubsol.Causal.min", "GuaranteedSubsol.max_min_fixedPoint", "GuaranteedSubsol.monotone_max_min", "GuaranteedSubsol.Causal.max_min"], "labels": ["lem:max_min"], "direct": ["GuaranteedSubsol.Causal.max_min", "GuaranteedSubsol.le_of_causal_real", "GuaranteedSubsol.max_min_fixedPoint", "GuaranteedSubsol.monotone_max_min"]}, {"id": "GuaranteedSubsol.monotone_max_min", "short": "monotone_max_min", "file": "Anchors/MonotoneMaxMin.lean", "pub_source": "Lemma lem:max_min_mon_causal, monotone part, scalar form", "pub_doc": "Source: Lemma lem:max_min_mon_causal, monotone part, scalar form: if `Γ` is monotone, so is `u ↦ max {c, min {T, Γ u}}`, where `c` stands for `ū (x)`. The scalar operator `Γ: (X → ℝ) → ℝ` stands for `(Γ · x)`.", "notes": [], "title": "monotonicity of `max {ū, min {T, Γ}}`", "source": "Lemma lem:max_min_mon_causal (Complexity.tex), monotone part, scalar form", "state": "PROVED", "provider": "GuaranteedSubsol.MaxMinMonCausalProof.monotone_max_min", "chapter": "Complexity", "statement": "theorem monotone_max_min {X : Type*} {Γ : (X → ℝ) → ℝ} (hmono : Monotone Γ) (c T : ℝ) :\n    Monotone (fun u => max c (min T (Γ u)))", "doc": "Source: Lemma lem:max_min_mon_causal (Complexity.tex), monotone part, scalar form: if `Γ` is\nmonotone, so is `u ↦ max {c, min {T, Γ u}}`, where `c` stands for `ū (x)`. The scalar operator\n`Γ : (X → ℝ) → ℝ` stands for `(Γ · x)`.", "deps": [], "labels": ["lem:max_min_mon_causal"], "direct": []}, {"id": "GuaranteedSubsol.Causal.max_min", "short": "Causal.max_min", "file": "Anchors/CausalMaxMin.lean", "pub_source": "Lemma lem:max_min_mon_causal, causal part, scalar form", "pub_doc": "Source: Lemma lem:max_min_mon_causal, causal part, scalar form: if `Γ` is causal, so is `u ↦ max {c, min {T, Γ u}}`, where `c` stands for `ū (x)`. The scalar operator `Γ: (X → ℝ) → ℝ` stands for `(Γ · x)`.", "notes": [], "title": "causality of `max {ū, min {T, Γ}}`", "source": "Lemma lem:max_min_mon_causal (Complexity.tex), causal part, scalar form", "state": "PROVED", "provider": "GuaranteedSubsol.MaxMinMonCausalProof.causal_max_min", "chapter": "Complexity", "statement": "theorem Causal.max_min {X : Type*} {Γ : (X → ℝ) → ℝ} (hcaus : Causal Γ) (c T : ℝ) :\n    Causal (fun u => max c (min T (Γ u)))", "doc": "Source: Lemma lem:max_min_mon_causal (Complexity.tex), causal part, scalar form: if `Γ` is causal,\nso is `u ↦ max {c, min {T, Γ u}}`, where `c` stands for `ū (x)`. The scalar operator\n`Γ : (X → ℝ) → ℝ` stands for `(Γ · x)`.", "deps": ["GuaranteedSubsol.Causal.max", "GuaranteedSubsol.Causal.min"], "labels": ["lem:max_min_mon_causal"], "direct": ["GuaranteedSubsol.Causal.max", "GuaranteedSubsol.Causal.min"]}, {"id": "GuaranteedSubsol.subsol_growth", "short": "subsol_growth", "file": "Anchors/SubsolGrowth.lean", "pub_source": "Prop. prop:olu_ge_ustar, comparison principle in the sub- vs super-solution form of the paper eq:comparison_Lambda", "pub_doc": "Source: Prop. prop:olu_ge_ustar. Global operators `Λ, Γ: (X → ℝ) → X → ℝ` with the same Dirichlet data `ubd` outside `I = Int X` (the \"implicit additional assumption\" of the paper's proof). `Λ` is monotone, additively invariant, has `C_past`-memory and is `C_Γ, C'_Γ`-comparable with `Γ` on `Int X`. The comparison principle is assumed in the form of the paper eq:comparison_Lambda (`hcomp`: sub-solution vs. super-solution, on any partition `J ⊔ Jᶜ`). The paper's `u_*` is only a sub-solution, named `uSub`. The assumption `Γ ≤ Λ` is not used, hence omitted. Conclusion: `u ≥ t + (u_* - (1+ε) t - C_past - C'_Γ) / C_Γ` on `{u ≥ t}`.", "notes": ["author ruling", "bound variables renamed to lowerCamelCase"], "title": "growth of a sub-solution above a level", "source": "Prop. prop:olu_ge_ustar (Complexity.tex), comparison principle in the sub- vs super-solution form of V1 eq:comparison_Lambda; bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.SubsolGrowthProof.subsol_growth", "chapter": "Complexity", "statement": "theorem subsol_growth {X : Type*} {Λ Γ : (X → ℝ) → X → ℝ} {I : Set X} {ubd : X → ℝ}\n    (hΛbd : ∀ u, ∀ x ∉ I, Λ u x = ubd x) (hΓbd : ∀ u, ∀ x ∉ I, Γ u x = ubd x)\n    {Cpast CΓ CΓ' : ℝ} (hCpast : 0 ≤ Cpast) (hCΓ : 1 ≤ CΓ) (hCΓ' : 0 ≤ CΓ')\n    (hmono : ∀ x ∈ I, Monotone (Λ · x)) (hadd : ∀ x ∈ I, AdditivelyInvariant (Λ · x))\n    (hmem : ∀ x ∈ I, HasMemory Cpast (Λ · x))\n    (hcmp : ∀ x ∈ I, Comparable CΓ CΓ' (Λ · x) (Γ · x))\n    (hcomp : ∀ J : Set X, HasComparisonPrinciple J Λ)\n    {uSub : X → ℝ} (huSub : uSub ≤ Λ uSub) {u : X → ℝ} {t ε : ℝ} (ht : 0 ≤ t) (hε : 0 < ε)\n    (hlow : ∀ x, u x < t → uSub x ≤ (1 + ε) * u x) (hΓu : ∀ x, Γ u x ≤ u x)\n    (huΛ : ∀ x, u x ≤ Λ u x) :\n    ∀ x, t ≤ u x → t + (uSub x - (1 + ε) * t - Cpast - CΓ') / CΓ ≤ u x", "doc": "Source: Prop. prop:olu_ge_ustar (Complexity.tex). Global operators `Λ, Γ : (X → ℝ) → X → ℝ` with\nthe same Dirichlet data `ubd` outside `I = Int X` (the \"implicit additional assumption\" of the\npaper's proof). `Λ` is monotone, additively invariant, has `C_past`-memory and is\n`C_Γ, C'_Γ`-comparable with `Γ` on `Int X`. The comparison principle is assumed in the form of\nV1 eq:comparison_Lambda (`hcomp`: sub-solution vs. super-solution, on any partition `J ⊔ Jᶜ`). The\npaper's `u_*` is only a sub-solution, named `uSub`. The assumption `Γ ≤ Λ` is not used, hence\nomitted. Conclusion: `u ≥ t + (u_* - (1+ε) t - C_past - C'_Γ) / C_Γ` on `{u ≥ t}`.", "deps": ["GuaranteedSubsol.HasMemory.apply_eq_apply_max"], "labels": ["prop:olu_ge_ustar", "eq:comparison_Lambda"], "direct": ["GuaranteedSubsol.HasMemory.apply_eq_apply_max"]}, {"id": "GuaranteedSubsol.le_mul_iff_kruzkov", "short": "le_mul_iff_kruzkov", "file": "Anchors/TolIffKruzkov.lean", "pub_source": "the paper eq. (tol_as_Kruzkov), scalar form, `u̲` in `ℝ_∞`", "pub_doc": "Source: the paper, eq. (tol_as_Kruzkov), scalar form: `(1+ε) ū ≥ u̲ ⇔ v̄ exp(-ε ū/α) ≥ v̲`, where `v̄:= E_α ū` and `v̲:= E_α u̲`. Here `E_α = kruzkov αinv`, with `αinv = 1/α > 0`. The value `u̲ ∈ ℝ_∞ = WithTop ℝ` may be infinite (as for the super-solution of the ANB method), while `ū ∈ ℝ`.", "notes": ["author ruling", "bound variables renamed to lowerCamelCase"], "title": "the tolerance criterion in Kruzkov coordinates", "source": "Complexity.tex eq. (tol_as_Kruzkov), scalar form, `u̲` in `ℝ_∞`; bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.TolKruzkovProof.le_mul_iff_kruzkov", "chapter": "Complexity", "statement": "theorem le_mul_iff_kruzkov {αinv ε : ℝ} (hα : 0 < αinv) (uSub : ℝ) (uSup : WithTop ℝ) :\n    uSup ≤ (((1 + ε) * uSub : ℝ) : WithTop ℝ) ↔\n      kruzkov αinv uSup ≤ kruzkov αinv uSub * Real.exp (-ε * αinv * uSub)", "doc": "Source: Complexity.tex, eq. (tol_as_Kruzkov), scalar form:\n`(1+ε) ū ≥ u̲ ⇔ v̄ exp(-ε ū/α) ≥ v̲`, where `v̄ := E_α ū` and `v̲ := E_α u̲`.\nHere `E_α = kruzkov αinv`, with `αinv = 1/α > 0`. The value `u̲ ∈ ℝ_∞ = WithTop ℝ` may be\ninfinite (as for the super-solution of the ANB method), while `ū ∈ ℝ`.", "deps": [], "labels": ["eq:tol_as_Kruzkov"], "direct": []}, {"id": "GuaranteedSubsol.t_advances", "short": "t_advances", "file": "Anchors/TAdvances.lean", "pub_source": "Prop. prop:t_advances; unused hypotheses dropped", "pub_doc": "Source: Prop. prop:t_advances. Global operator `Λ: (X → ℝ) → X → ℝ` with Dirichlet data `ubd` outside `I = Int X`; `Φ` at `x` is `kruzkovOp α (Λ · x)`. The Kruzkov transform of `ū` is `v̄ = kruzkov αinv ū`, with `α * αinv = 1`. The assumption `T⁻ < T⁺` is dropped as well: it follows from the constraint on `Δ`. `t = (T⁺ + T⁻)/2` and `Δ = (T⁺ - T⁻)/2` are given by their definitions.", "notes": ["author ruling", "author ruling", "bound variables renamed to lowerCamelCase", "Author rulings: the monotonicity of `Λ` is not needed (the generalized `monotoneExtension` makes `Φ` monotone), and the assumptions `v̄ - Φ v̄ ≤ 0` and `0 ≤ v̲ - Φ v̲` of (a) are dropped, being unused"], "title": "the tolerance criterion advances in the narrow band", "source": "Prop. prop:t_advances (Complexity.tex); unused hypotheses dropped (author ruling); bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.TAdvancesProof.t_advances", "chapter": "Complexity", "statement": "theorem t_advances {X : Type*} [Finite X] {Λ : (X → ℝ) → X → ℝ} {I : Set X} {ubd : X → ℝ}\n    (hΛbd : ∀ u, ∀ x ∉ I, Λ u x = ubd x) {α αinv ρ : ℝ} (hα : 0 < α) (hααinv : α * αinv = 1)\n    (hρ₀ : 0 ≤ ρ) (hρ₁ : ρ < 1) (hadd : ∀ x ∈ I, AdditivelyInvariant (Λ · x))\n    (hsub : ∀ x ∈ I, SubAdditive ρ (kruzkovOp α (Λ · x)))\n    {uSub vsub vsup : X → ℝ} (hvsub : ∀ x, vsub x = kruzkov αinv (uSub x))\n    (hvsup : ∀ x, vsup x ≤ 0) {Tm Tp ξ ε C t Δ : ℝ} (hTm : 0 ≤ Tm) (hξ : 0 ≤ ξ)\n    (hε : 0 < ε) (hC : 1 ≤ C) (ht : t = (Tp + Tm) / 2) (hΔ : Δ = (Tp - Tm) / 2)\n    (ha₁ : ∀ x, Tm ≤ uSub x → uSub x < Tp → -((1 - ρ) * ξ) ≤ vsub x - kruzkovOp α (Λ · x) vsub)\n    (ha₂ : ∀ x, Tm ≤ uSub x → uSub x < Tp → vsup x - kruzkovOp α (Λ · x) vsup ≤ (1 - ρ) * ξ)\n    (hb : ∀ x, Tp ≤ uSub x → -ξ ≤ vsub x)\n    (hc : ∀ x, uSub x < Tm → vsup x ≤ vsub x * Real.exp (-ε * αinv * uSub x))\n    (hξC : ξ ≤ C * Real.exp (-αinv * Tp)) (hεT : ε * Tp ≤ α)\n    (hΔlarge : 2 * α * max 1 (Real.log (2 * Real.exp 1 * C / ε)) ≤ Δ) :\n    ∀ x, t - Δ / 2 ≤ uSub x → uSub x ≤ t + Δ / 2 →\n      vsup x ≤ vsub x * Real.exp (-ε * αinv * uSub x)", "doc": "Source: Prop. prop:t_advances (Complexity.tex). Global operator `Λ : (X → ℝ) → X → ℝ` with\nDirichlet data `ubd` outside `I = Int X`; `Φ` at `x` is `kruzkovOp α (Λ · x)`. The Kruzkov\ntransform of `ū` is `v̄ = kruzkov αinv ū`, with `α * αinv = 1`. Author rulings: the monotonicity\nof `Λ` is not needed (the generalized `monotoneExtension` makes `Φ` monotone), and the\nassumptions `v̄ - Φ v̄ ≤ 0` and `0 ≤ v̲ - Φ v̲` of (a) are dropped, being unused. The assumption\n`T⁻ < T⁺` is dropped as well: it follows from the constraint on `Δ`.\n`t = (T⁺ + T⁻)/2` and `Δ = (T⁺ - T⁻)/2` are given by their definitions.", "deps": ["GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.kruzkovOp_mul", "GuaranteedSubsol.le_of_comparison"], "labels": ["prop:t_advances"], "direct": ["GuaranteedSubsol.kruzkovOp_mul", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.monotone_kruzkovOp"]}, {"id": "GuaranteedSubsol.abs_rpow_sub_rpow_le", "short": "abs_rpow_sub_rpow_le", "file": "Anchors/PowrDiff.lean", "pub_source": "Lemma lem:powr_diff, `0 ≤ r`", "pub_doc": "Source: Lemma lem:powr_diff: for all `a, b ≥ 0` and `r ∈ [0,1]`, `|a^r - b^r| ≤ |a - b|^r` (real powers `Real.rpow`). The paper assumes `r ∈ ]0,1]`; the case `r = 0` also holds.", "notes": ["author ruling", "author ruling: `0 ≤ r`"], "title": "difference of powers", "source": "Lemma lem:powr_diff (Complexity.tex), `0 ≤ r` (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.PowrDiffProof.abs_rpow_sub_rpow_le", "chapter": "Complexity", "statement": "theorem abs_rpow_sub_rpow_le {a b r : ℝ} (ha : 0 ≤ a) (hb : 0 ≤ b) (hr₀ : 0 ≤ r) (hr₁ : r ≤ 1) :\n    |a ^ r - b ^ r| ≤ |a - b| ^ r", "doc": "Source: Lemma lem:powr_diff (Complexity.tex): for all `a, b ≥ 0` and `r ∈ [0,1]`,\n`|a^r - b^r| ≤ |a - b|^r` (real powers `Real.rpow`). The paper assumes `r ∈ ]0,1]`; the case\n`r = 0` also holds (author ruling: `0 ≤ r`).", "deps": [], "labels": ["lem:powr_diff"], "direct": []}, {"id": "GuaranteedSubsol.kruzkov_mul_eq_neg_rpow", "short": "kruzkov_mul_eq_neg_rpow", "file": "Anchors/KruzkovMulEqNegRpow.lean", "pub_source": "the paper, equation before lem:powr_diff (`E_β u = -(-E_α u)^r`), scalar form", "pub_doc": "Source: the paper, subsection \"Complexity with unknown property constants\" (equation before Lemma lem:powr_diff), scalar form: if `v:= E_α u` and `w:= E_β u`, then `w = -(-v)^r` with `r:= α/β`. With inverse timescales, `E_α = kruzkov αinv` and `E_β = kruzkov (r * αinv)`. Real `u`, as in the paper.", "notes": [], "title": "change of Kruzkov timescale", "source": "Complexity.tex, equation before lem:powr_diff (`E_β u = -(-E_α u)^r`), scalar form", "state": "PROVED", "provider": "GuaranteedSubsol.KruzkovRpowProof.kruzkov_mul_eq_neg_rpow", "chapter": "Complexity", "statement": "theorem kruzkov_mul_eq_neg_rpow (αinv r u : ℝ) :\n    kruzkov (r * αinv) u = -(-kruzkov αinv u) ^ r", "doc": "Source: Complexity.tex, subsection \"Complexity with unknown property constants\" (equation before\nLemma lem:powr_diff), scalar form: if `v := E_α u` and `w := E_β u`, then `w = -(-v)^r` with\n`r := α/β`. With inverse timescales, `E_α = kruzkov αinv` and `E_β = kruzkov (r * αinv)`.\nReal `u`, as in the paper.", "deps": [], "labels": ["lem:powr_diff"], "direct": []}, {"id": "GuaranteedSubsol.t_advances_withUnknown", "short": "t_advances_withUnknown", "file": "Anchors/TAdvancesWithUnknown.lean", "pub_source": "Prop. prop:t_advances_withUnknown; unused hypotheses and the unused `βinv` dropped", "pub_doc": "Source: Prop. prop:t_advances_withUnknown. Same convention     (ha₂ : ∀ x, Tm ≤ uSub x → uSub x < Tp → vsup x - kruzkovOp α (Λ · x) vsup ≤ (1 - ρ) * ξ)\n    (hb : ∀ x, Tp ≤ uSub x → -ξ ≤ vsub x)\n    (hc : ∀ x, uSub x < Tm → vsup x ≤ vsub x * Real.exp (-ε * αinv * uSub x))\n    (hξT : ξ ≤ Real.exp (-αinv * Tp)) (hεT : ε * Tp ≤ α)\n    (hΔlarge : 2 * β * max 1 (Real.log (2 * Real.exp 1 * C / ε)) ≤ Δ) :\n    ∀ x, t - Δ / 2 ≤ uSub x → uSub x ≤ t + Δ / 2 →\n      vsup x ≤ vsub x * Real.exp (-ε * αinv * uSub x)", "doc": "Source: Prop. prop:t_advances_withUnknown (Complexity.tex). Same conventions as `t_advances`:\nglobal operator `Λ` with Dirichlet data `ubd` outside `I = Int X`; `Φ_α` (resp. `Φ_β`) at `x` is\n`kruzkovOp α (Λ · x)` (resp. `kruzkovOp β (Λ · x)`); `v̄ = kruzkov αinv ū`; `α * αinv = 1`;\n`r = α / β`, `C = (1-ρ)^r / (1-σ)`, `t` and `Δ` given by their definitions.\nAuthor rulings: the monotonicity of `Λ`, the assumptions `v̄ - Φ_α v̄ ≤ 0` and `0 ≤ v̲ - Φ_α v̲`\nof (a), `T⁻ < T⁺` and `0 < ρ` are dropped, being unused (V1 assumes `ρ, σ ∈ ]0,1[`; here\n`0 ≤ σ < 1`). Renamed from `t_advances_small_alpha`\n(author ruling, 2026-10-14: `WithUnknown` in place of `small_alpha`; statement unchanged).", "deps": ["GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.kruzkovOp_mul", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.t_advances", "GuaranteedSubsol.abs_rpow_sub_rpow_le", "GuaranteedSubsol.kruzkov_mul_eq_neg_rpow"], "labels": ["prop:t_advances_withUnknown"], "direct": ["GuaranteedSubsol.abs_rpow_sub_rpow_le", "GuaranteedSubsol.kruzkov_mul_eq_neg_rpow", "GuaranteedSubsol.t_advances"]}, {"id": "GuaranteedSubsol.Ext.max_min_fixedPoint", "short": "Ext.max_min_fixedPoint", "file": "Anchors/ExtMaxMinFixedPoint.lean", "pub_source": "Lemma lem:max_min, on `ℝ_∞`, under causality only", "pub_doc": "Source: Lemma lem:max_min, on `ℝ_∞ = WithTop ℝ` (as used in the proof of Lemma lem:u_less_t): let `Γ: (X → ℝ_∞) → X → ℝ_∞` be causal (`Ext.Causal` at every point). If `u = max {ū, Γ u}`, then `û:= max {ū, min {T, u}}` satisfies `max {ū, min {T, Γ û}} = û`, and `min {u,T} = min {û,T}`. Here `ū` and `T` are real. the anchor proves the fixed-point identity under causality only. Uniqueness is not part of the anchor; it follows from `le_of_causal_ext`.", "notes": ["V1 also assumes `Γ` monotone and states uniqueness, which follows from `le_of_causal_ext`; author's ruling 2026-10-20, annotation", "author ruling", "bound variables renamed to lowerCamelCase", "author's ruling 2026-10-20", "Annotation : V1 lem:max_min assumes `Γ` monotone and causal and states that `û` is the unique fixed point"], "title": "fixed point of `max {ū, min {T, Γ}}` on `ℝ_∞`", "source": "Lemma lem:max_min (Complexity.tex), on `ℝ_∞`, under causality only (V1 also assumes `Γ` monotone and states uniqueness, which follows from `le_of_causal_ext`; author's ruling 2026-10-20, annotation); bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.ULessTProof.ext_max_min_fixedPoint", "chapter": "Complexity", "statement": "theorem max_min_fixedPoint {X : Type*} {Γ : (X → WithTop ℝ) → X → WithTop ℝ}\n    (hcaus : ∀ x, Causal (Γ · x)) (uSub : X → ℝ) (T : ℝ) {u uHat : X → WithTop ℝ}\n    (hu : u = fun x => max (uSub x : WithTop ℝ) (Γ u x))\n    (huHat : uHat = fun x => max (uSub x : WithTop ℝ) (min (T : WithTop ℝ) (u x))) :\n    ((fun x => max (uSub x : WithTop ℝ) (min (T : WithTop ℝ) (Γ uHat x))) = uHat) ∧\n      ∀ x, min (u x) T = min (uHat x) T", "doc": "Source: Lemma lem:max_min (Complexity.tex), on `ℝ_∞ = WithTop ℝ` (as used in the proof of\nLemma lem:u_less_t): let `Γ : (X → ℝ_∞) → X → ℝ_∞` be causal (`Ext.Causal` at every point). If\n`u = max {ū, Γ u}`, then `û := max {ū, min {T, u}}` satisfies `max {ū, min {T, Γ û}} = û`, and\n`min {u,T} = min {û,T}`. Here `ū` and `T` are real.\nAnnotation (author's ruling 2026-10-20): V1 lem:max_min assumes `Γ` monotone and causal and states\nthat `û` is the unique fixed point; the anchor proves the fixed-point identity under causality\nonly. Uniqueness is not part of the anchor; it follows from `le_of_causal_ext`.", "deps": [], "labels": ["lem:max_min"], "direct": []}, {"id": "GuaranteedSubsol.u_less_t", "short": "u_less_t", "file": "Anchors/ULessT.lean", "pub_source": "Lemma lem:u_less_t; monotonicity of `Γ` dropped; the identities for a given fixed point `u` of `max {ū, Γ}`, existence and uniqueness of the three fixed points (stated in the paper) not part of the anchor", "pub_doc": "Source: Lemma lem:u_less_t: let `Γ: ℝ_∞^X → ℝ_∞^X` be causal (`Ext.Causal` at every point), `ū ∈ ℝ^X`, `T ∈ ℝ`, and `u = max {ū, Γ u}`. Then `ǔ:= u^{<T}` satisfies `ǔ = max {ū, Γ ǔ}^{<T}`; `û:= max {ū, min {T, ǔ}}` satisfies `û = max {ū, min {T, Γ û}}`; and `ǔ = û^{<T}`. Cutoffs are `cutoffLt` pointwise. the anchor proves the identities `ǔ = u^{<T}`, `û = max {ū, min {T, ǔ}}`, `ǔ = û^{<T}` for a given fixed point `u` of `Γ' = max {ū, Γ}`, under causality only. Existence and uniqueness are not part of the anchor; they follow from the comparison principle for causal operators and Dijkstra's method.", "notes": ["author ruling", "author's ruling 2026-10-20, annotation", "author ruling", "bound variables renamed to lowerCamelCase", "author's ruling 2026-10-20", "Author ruling: the monotonicity of `Γ` is dropped, being unused", "Annotation : V1 lem:u_less_t states that the three operators are monotone and causal and have unique fixed points `u`, `ǔ`, `û`"], "title": "cutting a fixed point of `max {ū, Γ}` at a level `T`", "source": "Lemma lem:u_less_t (Complexity.tex); monotonicity of `Γ` dropped (author ruling); the identities for a given fixed point `u` of `max {ū, Γ}`, existence and uniqueness of the three fixed points (stated in V1) not part of the anchor (author's ruling 2026-10-20, annotation); bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.ULessTProof.u_less_t", "chapter": "Complexity", "statement": "theorem u_less_t {X : Type*} {Γ : (X → WithTop ℝ) → X → WithTop ℝ}\n    (hcaus : ∀ x, Ext.Causal (Γ · x)) (uSub : X → ℝ) (T : ℝ) {u ucheck uHat : X → WithTop ℝ}\n    (hu : u = fun x => max (uSub x : WithTop ℝ) (Γ u x))\n    (hucheck : ucheck = fun x => cutoffLt T (u x))\n    (huHat : uHat = fun x => max (uSub x : WithTop ℝ) (min (T : WithTop ℝ) (ucheck x))) :\n    (ucheck = fun x => cutoffLt T (max (uSub x : WithTop ℝ) (Γ ucheck x))) ∧\n      (uHat = fun x => max (uSub x : WithTop ℝ) (min (T : WithTop ℝ) (Γ uHat x))) ∧\n      ucheck = fun x => cutoffLt T (uHat x)", "doc": "Source: Lemma lem:u_less_t (Complexity.tex): let `Γ : ℝ_∞^X → ℝ_∞^X` be causal (`Ext.Causal` at\nevery point), `ū ∈ ℝ^X`, `T ∈ ℝ`, and `u = max {ū, Γ u}`. Then `ǔ := u^{<T}` satisfies\n`ǔ = max {ū, Γ ǔ}^{<T}`; `û := max {ū, min {T, ǔ}}` satisfies `û = max {ū, min {T, Γ û}}`; and\n`ǔ = û^{<T}`. Cutoffs are `cutoffLt` pointwise. Author ruling: the monotonicity of `Γ` is\ndropped, being unused.\nAnnotation (author's ruling 2026-10-20): V1 lem:u_less_t states that the three operators are\nmonotone and causal and have unique fixed points `u`, `ǔ`, `û`; the anchor proves the identities\n`ǔ = u^{<T}`, `û = max {ū, min {T, ǔ}}`, `ǔ = û^{<T}` for a given fixed point `u` of\n`Γ' = max {ū, Γ}`, under causality only. Existence and uniqueness are not part of the anchor; they\nfollow from the comparison principle for causal operators and Dijkstra's method.", "deps": ["GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq", "GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.Ext.max_min_fixedPoint"], "labels": ["lem:u_less_t"], "direct": ["GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.Ext.max_min_fixedPoint"]}, {"id": "GuaranteedSubsol.u_less_t_existsUnique", "short": "u_less_t_existsUnique", "file": "Anchors/ULessTExistsUnique.lean", "pub_source": "Lemma lem:u_less_t, first sentence: `max {ū, Γ}`, `max {ū, Γ}^{<T}`, `max {ū, min {T, Γ}}` are monotone and causal and each has a unique fixed point in `ℝ_∞^X`", "pub_doc": "Source: Lemma lem:u_less_t, first sentence: let `Γ: ℝ_∞^X → ℝ_∞^X` be monotone and causal (at every point), `ū ∈ ℝ^X`, `T ∈ ℝ`. Then the operators `Γ':= max {ū, Γ}`, `Γ̌:= max {ū, Γ}^{<T}` and `Γ̂:= max {ū, min {T, Γ}}` are monotone and causal, and each has a unique fixed point in `ℝ_∞^X` (the fixed points `u`, `ǔ`, `û` of the lemma). The operators are written out pointwise; the fixed points are stated in the form `u = fun x => …` of the hypotheses of `u_less_t`. Cutoffs are `cutoffLt` (eq. eqdef:u_less_t). `X` is finite.", "notes": ["author's request 2026-10-20, completes `u_less_t`", "author's request 2026-10-20, completing the anchor `u_less_t`"], "title": "the three fixed points of lem:u_less_t exist and are unique", "source": "Lemma lem:u_less_t (Complexity.tex, V1), first sentence: `max {ū, Γ}`, `max {ū, Γ}^{<T}`, `max {ū, min {T, Γ}}` are monotone and causal and each has a unique fixed point in `ℝ_∞^X` (author's request 2026-10-20, completes `u_less_t`)", "state": "PROVED", "provider": "GuaranteedSubsol.ExistsUniqueProof.u_less_t_existsUnique", "chapter": "Complexity", "statement": "theorem u_less_t_existsUnique {X : Type*} [Finite X] {Γ : (X → WithTop ℝ) → X → WithTop ℝ}\n    (hmono : ∀ x, Monotone (Γ · x)) (hcaus : ∀ x, Ext.Causal (Γ · x)) (uSub : X → ℝ) (T : ℝ) :\n    (∀ x, Monotone (fun u => max (uSub x : WithTop ℝ) (Γ u x)) ∧\n      Ext.Causal (fun u => max (uSub x : WithTop ℝ) (Γ u x))) ∧\n    (∀ x, Monotone (fun u => cutoffLt T (max (uSub x : WithTop ℝ) (Γ u x))) ∧\n      Ext.Causal (fun u => cutoffLt T (max (uSub x : WithTop ℝ) (Γ u x)))) ∧\n    (∀ x, Monotone (fun u => max (uSub x : WithTop ℝ) (min (T : WithTop ℝ) (Γ u x))) ∧\n      Ext.Causal (fun u => max (uSub x : WithTop ℝ) (min (T : WithTop ℝ) (Γ u x)))) ∧\n    (∃! u : X → WithTop ℝ, u = fun x => max (uSub x : WithTop ℝ) (Γ u x)) ∧\n    (∃! u : X → WithTop ℝ, u = fun x => cutoffLt T (max (uSub x : WithTop ℝ) (Γ u x))) ∧\n    (∃! u : X → WithTop ℝ,\n      u = fun x => max (uSub x : WithTop ℝ) (min (T : WithTop ℝ) (Γ u x)))", "doc": "Source: Lemma lem:u_less_t (Complexity.tex, V1), first sentence (author's request 2026-10-20,\ncompleting the anchor `u_less_t`): let `Γ : ℝ_∞^X → ℝ_∞^X` be monotone and causal (at every\npoint), `ū ∈ ℝ^X`, `T ∈ ℝ`. Then the operators `Γ' := max {ū, Γ}`, `Γ̌ := max {ū, Γ}^{<T}` and\n`Γ̂ := max {ū, min {T, Γ}}` are monotone and causal, and each has a unique fixed point in `ℝ_∞^X`\n(the fixed points `u`, `ǔ`, `û` of the lemma). The operators are written out pointwise; the fixed\npoints are stated in the form `u = fun x => …` of the hypotheses of `u_less_t`. Cutoffs are\n`cutoffLt` (eq. eqdef:u_less_t). `X` is finite.", "deps": ["GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq", "GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq", "GuaranteedSubsol.le_of_causal_ext", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.Ext.causal_iff_cutoff"], "labels": ["lem:u_less_t"], "direct": ["GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.le_of_causal_ext"]}, {"id": "GuaranteedSubsol.kruzkov_local_of_subAdditive", "short": "kruzkov_local_of_subAdditive", "file": "Anchors/KruzkovLocalOfSubAdditive.lean", "pub_source": "Prop. prop:subadd_local, (⇒) with `O(t²)`, scalar form; continuity  and finiteness dropped", "pub_doc": "Source: Prop. prop:subadd_local, direct implication, scalar form, with the strongest conclusion (the `O(t²)` variant): if `Λ` is monotone and `Φ_α = kruzkovOp α Λ` is `ρ`-sub-additive, then for every `u`, `Λ [u + t exp(u/α)] ≤ Λ u + ρ t exp(Λ u / α) + O(t²)` as `t → 0⁺`. Here `α * αinv = 1`. `0 ≤ ρ` in place of the paper's `ρ > 0`.", "notes": ["V1; V0: local Lipschitz", "author ruling", "V0: local Lipschitz", "Author ruling: the continuity assumption of V1  and the finiteness of `X` are dropped, being unused in this direction"], "title": "sub-additivity of `Φ_α` implies the local expansion, with `O(t²)`", "source": "Prop. prop:subadd_local (Subadd.tex), (⇒) with `O(t²)`, scalar form; continuity (V1; V0: local Lipschitz) and finiteness dropped (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.SubaddLocalFwdProof.kruzkov_local_of_subAdditive", "chapter": "Subadd", "statement": "theorem kruzkov_local_of_subAdditive {X : Type*} {Λ : (X → ℝ) → ℝ} (hmono : Monotone Λ)\n    {α αinv ρ : ℝ} (hα : 0 < α) (hααinv : α * αinv = 1) (hρ : 0 ≤ ρ)\n    (h : SubAdditive ρ (kruzkovOp α Λ)) (u : X → ℝ) :\n    ∃ K : ℝ, ∀ᶠ t in 𝓝[>] (0 : ℝ),\n      Λ (fun y => u y + t * Real.exp (αinv * u y)) ≤\n        Λ u + ρ * t * Real.exp (αinv * Λ u) + K * t ^ 2", "doc": "Source: Prop. prop:subadd_local (Subadd.tex), direct implication, scalar form, with the strongest\nconclusion (the `O(t²)` variant): if `Λ` is monotone and\n`Φ_α = kruzkovOp α Λ` is `ρ`-sub-additive, then for every `u`,\n`Λ [u + t exp(u/α)] ≤ Λ u + ρ t exp(Λ u / α) + O(t²)` as `t → 0⁺`. Here `α * αinv = 1`.\nAuthor ruling: the continuity assumption of V1 (V0: local Lipschitz) and the finiteness of `X` are\ndropped, being unused in this direction; `0 ≤ ρ` in place of V1's `ρ > 0`.", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp"], "labels": ["prop:subadd_local"], "direct": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_kruzkovOp"]}, {"id": "GuaranteedSubsol.subAdditive_of_kruzkov_local", "short": "subAdditive_of_kruzkov_local", "file": "Anchors/SubAdditiveOfKruzkovLocal.lean", "pub_source": "Prop. prop:subadd_local, (⇐) from `o(t)`, scalar form; continuity, as in the paper", "pub_doc": "Source: Prop. prop:subadd_local, converse implication, scalar form, with the weakest hypothesis (the `o(t)` variant): if `Λ` is monotone and continuous and, for every `u`, `Λ [u + t exp(u/α)] ≤ Λ u + ρ t exp(Λ u / α) + o(t)` as `t → 0⁺`, then `Φ_α = kruzkovOp α Λ` is `ρ`-sub-additive. The `o(t)` is written `∀ η > 0, ∀ᶠ t in 𝓝[>] 0, … + η t`; `α * αinv = 1`. As in the paper, `Λ` is continuous; `X` is `Finite` (only continuity and finiteness are used); `0 ≤ ρ` in place of the paper's `ρ > 0`.", "notes": ["author ruling; V0: local Lipschitz", "author ruling; V0 assumed it locally Lipschitz"], "title": "the local expansion implies sub-additivity of `Φ_α`", "source": "Prop. prop:subadd_local (Subadd.tex), (⇐) from `o(t)`, scalar form; continuity, as in V1 (author ruling; V0: local Lipschitz)", "state": "PROVED", "provider": "GuaranteedSubsol.SubaddLocalBwdProof.subAdditive_of_kruzkov_local", "chapter": "Subadd", "statement": "theorem subAdditive_of_kruzkov_local {X : Type*} [Finite X] {Λ : (X → ℝ) → ℝ}\n    (hmono : Monotone Λ) (hcont : Continuous Λ) {α αinv ρ : ℝ} (hα : 0 < α)\n    (hααinv : α * αinv = 1) (hρ : 0 ≤ ρ)\n    (h : ∀ (u : X → ℝ), ∀ η > (0 : ℝ), ∀ᶠ t in 𝓝[>] (0 : ℝ),\n      Λ (fun y => u y + t * Real.exp (αinv * u y)) ≤\n        Λ u + ρ * t * Real.exp (αinv * Λ u) + η * t) :\n    SubAdditive ρ (kruzkovOp α Λ)", "doc": "Source: Prop. prop:subadd_local (Subadd.tex), converse implication, scalar form, with the weakest\nhypothesis (the `o(t)` variant): if `Λ` is monotone and continuous and, for every `u`,\n`Λ [u + t exp(u/α)] ≤ Λ u + ρ t exp(Λ u / α) + o(t)` as `t → 0⁺`, then `Φ_α = kruzkovOp α Λ`\nis `ρ`-sub-additive. The `o(t)` is written `∀ η > 0, ∀ᶠ t in 𝓝[>] 0, … + η t`;\n`α * αinv = 1`.\nAs in V1, `Λ` is continuous (author ruling; V0 assumed it locally Lipschitz); `X` is `Finite`\n(only continuity and finiteness are used); `0 ≤ ρ` in place of V1's `ρ > 0`.", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp"], "labels": ["prop:subadd_local"], "direct": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_kruzkovOp"]}, {"id": "GuaranteedSubsol.local_iff_local_x", "short": "local_iff_local_x", "file": "Anchors/LocalIffLocalX.lean", "pub_source": "Prop. prop:subadd_local, (subadd_local) ⇔ (subadd_local_x), `o(t)`", "pub_doc": "Source: Prop. prop:subadd_local, equivalence of (subadd_local) and (subadd_local_x), scalar form, with `o(t)` remainders written `∀ η > 0, ∀ᶠ t in 𝓝[>] 0, … + η t`. It is the change of variable `t' = t exp(-Λ u / α)`, valid for any operator `Λ`; `αinv = 1/α`.", "notes": [], "title": "the two local formulations of sub-additivity in Kruzkov coordinates", "source": "Prop. prop:subadd_local (Subadd.tex), (subadd_local) ⇔ (subadd_local_x), `o(t)`", "state": "PROVED", "provider": "GuaranteedSubsol.LocalXProof.local_iff_local_x", "chapter": "Subadd", "statement": "theorem local_iff_local_x {X : Type*} (Λ : (X → ℝ) → ℝ) {αinv ρ : ℝ} :\n    (∀ (u : X → ℝ), ∀ η > (0 : ℝ), ∀ᶠ t in 𝓝[>] (0 : ℝ),\n        Λ (fun y => u y + t * Real.exp (αinv * u y)) ≤\n          Λ u + ρ * t * Real.exp (αinv * Λ u) + η * t) ↔\n      ∀ (u : X → ℝ), ∀ η > (0 : ℝ), ∀ᶠ t in 𝓝[>] (0 : ℝ),\n        Λ (fun y => u y + t * Real.exp (αinv * (u y - Λ u))) ≤ Λ u + ρ * t + η * t", "doc": "Source: Prop. prop:subadd_local (Subadd.tex), equivalence of (subadd_local) and (subadd_local_x),\nscalar form, with `o(t)` remainders written `∀ η > 0, ∀ᶠ t in 𝓝[>] 0, … + η t`. It is the change\nof variable `t' = t exp(-Λ u / α)`, valid for any operator `Λ`; `αinv = 1/α`.", "deps": [], "labels": ["prop:subadd_local"], "direct": []}, {"id": "GuaranteedSubsol.local_iff_local_x_sq", "short": "local_iff_local_x_sq", "file": "Anchors/LocalIffLocalXSq.lean", "pub_source": "Prop. prop:subadd_local, (subadd_local) ⇔ (subadd_local_x), `O(t²)`", "pub_doc": "Source: Prop. prop:subadd_local, equivalence of (subadd_local) and (subadd_local_x) in the variant where `o(t)` is replaced with `O(t²)` (\"The equivalence also holds if th )] ≤ Λ u + ρ t exp(Λ u / α)` for all `u` and all `t ≥ 0`. Here `α * αinv = 1` and `X` is finite (standing assumption).", "notes": [], "title": "sub-additivity of `Φ_α` for a concave operator", "source": "Corol. corol:subadd_concave (Subadd.tex), scalar form", "state": "PROVED", "provider": "GuaranteedSubsol.SubaddConcaveProof.subAdditive_kruzkovOp_iff_of_concave", "chapter": "Subadd", "statement": "theorem subAdditive_kruzkovOp_iff_of_concave {X : Type*} [Finite X] {Λ : (X → ℝ) → ℝ}\n    (hmono : Monotone Λ) (hconc : ConcaveOn ℝ Set.univ Λ) {α αinv ρ : ℝ} (hα : 0 < α)\n    (hααinv : α * αinv = 1) (hρ : 0 ≤ ρ) :\n    SubAdditive ρ (kruzkovOp α Λ) ↔\n      ∀ (u : X → ℝ) (t : ℝ), 0 ≤ t →\n        Λ (fun y => u y + t * Real.exp (αinv * u y)) ≤ Λ u + ρ * t * Real.exp (αinv * Λ u)", "doc": "Source: Corol. corol:subadd_concave (Subadd.tex), scalar form: if `Λ` is monotone and concave,\nthen `Φ_α = kruzkovOp α Λ` is `ρ`-sub-additive iff\n`Λ [u + t exp(u/α)] ≤ Λ u + ρ t exp(Λ u / α)` for all `u` and all `t ≥ 0`. Here `α * αinv = 1`\nand `X` is finite (standing assumption).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.kruzkov_local_of_subAdditive", "GuaranteedSubsol.subAdditive_of_kruzkov_local"], "labels": ["corol:subadd_concave"], "direct": ["GuaranteedSubsol.kruzkov_local_of_subAdditive", "GuaranteedSubsol.subAdditive_of_kruzkov_local"]}, {"id": "GuaranteedSubsol.subAdditive_kruzkovOp_of_le", "short": "subAdditive_kruzkovOp_of_le", "file": "Anchors/SubAdditiveKruzkovOpOfLe.lean", "pub_source": "Prop. prop:subadd_alpha_beta, scalar form; no restriction `ρ < 1`, `σ < 1`, as in the paper", "pub_doc": "Source: Prop. prop:subadd_alpha_beta, scalar form: if `Λ` is monotone and `1`-sub-additive and `Φ_α` is `ρ`-sub-additive, with `α > 0` and `ρ ≥ 0`, then `Φ_β` is `σ`-sub-additive for every `β ≥ α` and `σ ≥ (1 - α/β) + ρ α/β`, without restrictions `ρ < 1`, `σ < 1`, as i

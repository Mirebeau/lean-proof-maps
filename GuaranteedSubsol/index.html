al_ext", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbStep_eq_of_notMem_band", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.dijkstraHeapRun_eq", "GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff", "GuaranteedSubsol.OrderedPartialMap.entriesIco_fst", "GuaranteedSubsol.dijkstraHeapLoop_correct"], "labels": ["prop:correct_anb_lazy", "algo:anb_lazy", "anb_lazy:olu_gets_hatu"], "direct": ["GuaranteedSubsol.OrderedPartialMap.entriesIco_fst", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.dijkstraHeapLoop_correct", "GuaranteedSubsol.le_of_causal_ext"]}, {"id": "GuaranteedSubsol.anbHeapRun_cost", "short": "anbHeapRun_cost", "file": "Anchors/AnbHeapRunCost.lean", "title": "cost accounting of the ANB with sorted lists", "source": "Prop. prop:complexity_lazy (Complexity.tex, V1), generic cost accounting of algo:anb_lazy with sorted lists (author's request): evaluations of `Γ` and operations on `L`, `M`, `S`, `Sc` after `K` iterations, per point, in terms of `countB'` (selections by Dijkstra's method, `anbHeapCountB'`) and `countB` (iterations in the band, `anbHeapCountB`); names chosen by the author (2026-10-16); `ũ` takes values in `Option ℝ` (placeholder `none`; author's ruling 2026-10-17)", "state": "PROVED", "provider": "GuaranteedSubsol.AnbHeapCostProof.cost", "chapter": "Complexity", "statement": "theorem anbHeapRun_cost {X : Type*} [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    {p : AnbParams X} {𝒱 : X → Set X}\n    (hst : Global.Ext.HasStencil 𝒱 (Global.monotoneExtension p.Γ))\n    (hΓmono : ∀ x, Monotone (p.Γ · x)) (hΓcaus : ∀ x, Causal (p.Γ · x)) (hα : 0 < p.α)\n    (hτ : 0 < p.τ) (K : ℕ) :\n    (anbHeapRunWith S p 𝒱 K).dij.evalCount ≤ Fintype.card X +\n      ∑ x, anbHeapCountB' S p 𝒱 K x * (Global.Ext.revStencil 𝒱 x).card +\n      ∑ x, anbHeapCountB S p 𝒱 K x * (1 + (Global.Ext.revStencil 𝒱 x).card) ∧\n    (anbHeapRunWith S p 𝒱 K).dij.L.count + (anbHeapRunWith S p 𝒱 K).M.count +\n      (anbHeapRunWith S p 𝒱 K).S.count + (anbHeapRunWith S p 𝒱 K).Sc.count ≤\n      2 * Fintype.card X + 4 * K +\n      ∑ x, anbHeapCountB' S p 𝒱 K x * (5 + (Global.Ext.revStencil 𝒱 x).card) +\n      ∑ x, anbHeapCountB S p 𝒱 K x * (12 + (Global.Ext.revStencil 𝒱 x).card)", "doc": "Source: Prop. prop:complexity_lazy (Complexity.tex, V1), generic part (author's request), for\nalgo:anb_lazy with sorted lists (`anbHeapRunWith`, `AnbHeap.lean`) and any inner solver `S`. After\n`K` iterations, with `N := #X`, `𝒱̃` the reversed stencils, `countB'(x)` the number of selections of\n`x` in line anb_lazy:Dijkstra (line Dijkstra:accept; updates by Dijkstra's method, which only occur\nin the bands `B'_n`; `anbHeapCountB'`) and `countB(x)` the number of iterations `k < K` with\n`x ∈ B_k` (`anbHeapCountB`; names chosen by the author):\n* the number of evaluations of `Γ` is at most `N + ∑ₓ countB'(x) #𝒱̃(x) + ∑ₓ countB(x) (1 + #𝒱̃(x))`\n  (`N` evaluations to build `L`);\n* the number of operations on the lists `L`, `M`, `S`, `Sc` is at most\n  `2N + 4K + ∑ₓ countB'(x) (5 + #𝒱̃(x)) + ∑ₓ countB(x) (12 + #𝒱̃(x))` (`2N` to build `L` and\n  `Sc`).\nHypotheses: those of `anbHeapRun_equiv` (`Γ` monotone, causal, with stencils `𝒱`, `α > 0`,\n`τ > 0`). `X` is finite and linearly ordered (tie-breaking).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_count_le_one", "GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq", "GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq", "GuaranteedSubsol.le_of_causal_ext", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbStep_eq_of_notMem_band", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.dijkstraHeapRun_eq", "GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff", "GuaranteedSubsol.OrderedPartialMap.entriesIco_fst", "GuaranteedSubsol.dijkstraHeapLoop_correct"], "labels": ["prop:complexity_lazy", "algo:anb_lazy"], "direct": ["GuaranteedSubsol.OrderedPartialMap.entriesIco_fst", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.dijkstraHeapLoop_correct", "GuaranteedSubsol.le_of_causal_ext"]}, {"id": "GuaranteedSubsol.anbHeapRun_cost_le", "short": "anbHeapRun_cost_le", "file": "Anchors/AnbHeapRunCostLe.lean", "title": "complexity of the ANB with sorted lists under uniform bounds", "source": "Prop. prop:complexity_lazy (Complexity.tex, V1), eq. eq:anb_cost from uniform bounds `NΓ` (on `countB'`), `NΛ'` (on `countB`), `NΛ` (updates by the inner loops), `Kmax` (iterations); names chosen by the author (2026-10-16) (author's request; the instances for th:complexity, th:complexity_withUnknown, th:complexity_with_agsi are ordinary theorems in `AnbHeapComplexity.lean`, author's decision); `ũ` takes values in `Option ℝ` (placeholder `none`; author's ruling 2026-10-17)", "state": "PROVED", "provider": "GuaranteedSubsol.AnbHeapCostProof.cost_le", "chapter": "Complexity", "statement": "theorem anbHeapRun_cost_le {X : Type*} [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    {p : AnbParams X} {𝒱 : X → Set X}\n    (hst : Global.Ext.HasStencil 𝒱 (Global.monotoneExtension p.Γ))\n    (hΓmono : ∀ x, Monotone (p.Γ · x)) (hΓcaus : ∀ x, Causal (p.Γ · x)) (hα : 0 < p.α)\n    (hτ : 0 < p.τ) (NΓ NΛ' NΛ Kmax : ℕ) (hcountB' : ∀ K x, anbHeapCountB' S p 𝒱 K x ≤ NΓ)\n    (hcountB : ∀ K x, anbHeapCountB S p 𝒱 K x ≤ NΛ')\n    (hcountΛ : ∀ K x, (anbHeapRunWith S p 𝒱 K).countSub x ≤ NΛ ∧\n      (anbHeapRunWith S p 𝒱 K).countSup x ≤ NΛ)\n    (hstop : anbHeapStopIndexWith S p 𝒱 ≤ Kmax) :\n    ∑ x, ((anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).countSub x +\n        (anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).countSup x) ≤\n      ((2 * Fintype.card X * NΛ : ℕ) : ℕ∞) ∧\n    (anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).dij.evalCount ≤\n      Fintype.card X + (∑ x, (Global.Ext.revStencil 𝒱 x).card) * NΓ +\n        (Fintype.card X + ∑ x, (Global.Ext.revStencil 𝒱 x).card) * NΛ' ∧\n    (anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).dij.L.count +\n      (anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).M.count +\n      (anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).S.count +\n      (anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).Sc.count ≤\n      2 * Fintype.card X + 4 * Kmax +\n        NΓ * (5 * Fintype.card X + ∑ x, (Global.Ext.revStencil 𝒱 x).card) +\n        NΛ' * (12 * Fintype.card X + ∑ x, (Global.Ext.revStencil 𝒱 x).card)", "doc": "Source: Prop. prop:complexity_lazy (Complexity.tex, V1), eq. eq:anb_cost, from uniform bounds\n(author's request; the instances for Theorems th:complexity, th:complexity_withUnknown and\nth:complexity_with_agsi are in `AnbHeapComplexity.lean`). For algo:anb_lazy with sorted lists and\nany inner solver `S`: if `countB' ≤ N_Γ` (selections by Dijkstra's method, `anbHeapCountB'`),\n`countB ≤ N'_Λ` (iterations in the band, `anbHeapCountB`), each point is updated at most `N_Λ`\ntimes by each of the two inner loops (in total, `N_Λ = N'_Λ N''_Λ` in the instances), and the method\nstops within `Kmax` iterations (`⌈n_max⌉ + 1`), then at termination, with `N := #X` and\n`Ñ := ∑ₓ #𝒱̃(x)` (eq. eqdef:stencil_card): at most `2 N N_Λ` updates by the inner loops (evaluations\nof `Λ`), at most `N + Ñ N_Γ + (N + Ñ) N'_Λ` evaluations of `Γ`, and at most\n`2N + 4 Kmax + N_Γ (5N + Ñ) + N'_Λ (12N + Ñ)` operations on the lists `L`, `M`, `S`, `Sc`, each of\ncost `O(ln N)`. The cost `O(Ñ ln Ñ)` of the reversed stencils is not modelled. Names chosen by the\nauthor.\nHypotheses: those of `anbHeapRun_equiv`. `X` is finite and linearly ordered (tie-breaking).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_count_le_one", "GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq", "GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq", "GuaranteedSubsol.le_of_causal_ext", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbStep_eq_of_notMem_band", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.anbHeapRun_cost", "GuaranteedSubsol.dijkstraHeapRun_eq", "GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff", "GuaranteedSubsol.OrderedPartialMap.entriesIco_fst", "GuaranteedSubsol.dijkstraHeapLoop_correct"], "labels": ["prop:complexity_lazy", "eq:anb_cost", "th:complexity", "th:complexity_withUnknown", "th:complexity_with_agsi"], "direct": ["GuaranteedSubsol.anbHeapRun_cost"]}, {"id": "GuaranteedSubsol.dijkstraHeapRun_eq", "short": "dijkstraHeapRun_eq", "file": "Anchors/DijkstraHeapRunEq.lean", "title": "Dijkstra's method with a sorted list and a threshold", "source": "algo:Dijkstra with the sorted list `L` (invariant eq. eq:Dijkstra_prop) stored in an ordered partial map (Papers/OrderedPartialMap), stencils (eq. eqdef:stencil) and the stopping time `T` of algo:Dijkstra (V1; author's request): from any state with `L.v = dijkstraKey Γ u`, it follows `dijkstraRun` for `Γ^{<T}` (same `u`, counts), keeps the keys, and costs `∑ count · #𝒱̃` evaluations of `Γ` and `n + ∑ count · (1 + #𝒱̃)` operations on `L` (two counters, author's ruling); hypothesis: stencil property of `Γ`", "state": "PROVED", "provider": "GuaranteedSubsol.DijkstraHeapProof.run_spec", "chapter": "Notes", "statement": "theorem dijkstraHeapRun_eq {X : Type*} [Fintype X] [LinearOrder X]\n    {Γ : (X → WithTop ℝ) → X → WithTop ℝ} {𝒱 : X → Set X} (hst : Global.Ext.HasStencil 𝒱 Γ)\n    (T : WithTop ℝ) (s₀ : DijkstraHeapState X) (hL : s₀.L.v = dijkstraKey Γ s₀.u) (n : ℕ) :\n    (dijkstraHeapRun Γ 𝒱 T s₀ n).u = (dijkstraRun (dijkstraCutOp T Γ) s₀.u n).u ∧\n    (dijkstraHeapRun Γ 𝒱 T s₀ n).count =\n      s₀.count + (dijkstraRun (dijkstraCutOp T Γ) s₀.u n).count ∧\n    (dijkstraHeapRun Γ 𝒱 T s₀ n).L.v = dijkstraKey Γ (dijkstraHeapRun Γ 𝒱 T s₀ n).u ∧\n    (dijkstraHeapRun Γ 𝒱 T s₀ n).evalCount = s₀.evalCount +\n      ∑ x, (dijkstraRun (dijkstraCutOp T Γ) s₀.u n).count x * (Global.Ext.revStencil 𝒱 x).card ∧\n    (dijkstraHeapRun Γ 𝒱 T s₀ n).L.count = s₀.L.count + n +\n      ∑ x, (dijkstraRun (dijkstraCutOp T Γ) s₀.u n).count x *\n        (1 + (Global.Ext.revStencil 𝒱 x).card)", "doc": "Source: algo:Dijkstra (Complexity.tex) with the sorted list `L` (its invariant is eq.\neq:Dijkstra_prop, right) stored in an ordered partial map (Papers/OrderedPartialMap, author's\nrequest; `dijkstraHeapRun`), with the stencils `𝒱` of eq. eqdef:stencil and the stopping time `T`\nof algo:Dijkstra (V1: the method stops when the smallest key is `≥ T`, as needed in the ANB).\nStarting from any state whose list holds the keys of the active points (`L.v = dijkstraKey Γ u`, as\nin the ANB where `L` is given), after `n` iterations: the map `u` and the acceptance counts coincide\nwith those of algo:Dijkstra without stopping time (`dijkstraRun`) applied to `Γ^{<T}`\n(`dijkstraCutOp`; `Γ^{<⊤} = Γ`), as in the proof of Prop. prop:Dijkstra_correct; the list still\nholds the keys of the active points; the number of evaluations of `Γ` has increased by\n`∑ₓ count(x) · #𝒱̃(x)`, and the number of operations on `L` by `n + ∑ₓ count(x) · (1 + #𝒱̃(x))`,\nwhere `count` is the number of acceptances in algo:Dijkstra and `𝒱̃` the reversed stencil (author's\nruling: two separate counters). The only hypothesis is the stencil property of `Γ`. `X` is finite\nand linearly ordered (tie-breaking).", "deps": ["GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff"], "labels": ["algo:Dijkstra", "eq:Dijkstra_prop", "eqdef:stencil"], "direct": ["GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff"]}, {"id": "GuaranteedSubsol.dijkstraHeapInit_run_eq", "short": "dijkstraHeapInit_run_eq", "file": "Anchors/DijkstraHeapInitRunEq.lean", "title": "Dijkstra's method with a sorted list, from scratch", "source": "Same, started from scratch (`dijkstraHeapInit`) with stopping time `T = ∞`: follows `dijkstraRun`, with `#X + ∑ count · #𝒱̃` evaluations of `Γ` and `#X + n + ∑ count · (1 + #𝒱̃)` operations on `L`", "state": "PROVED", "provider": "GuaranteedSubsol.DijkstraHeapProof.init_run_spec", "chapter": "Notes", "statement": "theorem dijkstraHeapInit_run_eq {X : Type*} [Fintype X] [LinearOrder X]\n    {Γ : (X → WithTop ℝ) → X → WithTop ℝ} {𝒱 : X → Set X} (hst : Global.Ext.HasStencil 𝒱 Γ)\n    (u₀ : X → WithTop ℝ) (n : ℕ) :\n    (dijkstraHeapRun Γ 𝒱 ⊤ (dijkstraHeapInit Γ u₀) n).u = (dijkstraRun Γ u₀ n).u ∧\n    (dijkstraHeapRun Γ 𝒱 ⊤ (dijkstraHeapInit Γ u₀) n).count = (dijkstraRun Γ u₀ n).count ∧\n    (dijkstraHeapRun Γ 𝒱 ⊤ (dijkstraHeapInit Γ u₀) n).L.v =\n      dijkstraKey Γ (dijkstraHeapRun Γ 𝒱 ⊤ (dijkstraHeapInit Γ u₀) n).u ∧\n    (dijkstraHeapRun Γ 𝒱 ⊤ (dijkstraHeapInit Γ u₀) n).evalCount = Fintype.card X +\n      ∑ x, (dijkstraRun Γ u₀ n).count x * (Global.Ext.revStencil 𝒱 x).card ∧\n    (dijkstraHeapRun Γ 𝒱 ⊤ (dijkstraHeapInit Γ u₀) n).L.count = Fintype.card X + n +\n      ∑ x, (dijkstraRun Γ u₀ n).count x * (1 + (Global.Ext.revStencil 𝒱 x).card)", "doc": "Source: algo:Dijkstra (Complexity.tex) with the sorted list `L` (its invariant is eq.\neq:Dijkstra_prop, right) stored in an ordered partial map (Papers/OrderedPartialMap, author's\nrequest), started from scratch (`dijkstraHeapInit`: `L` filled with the keys of all the points)\nand with the stopping time `T = ∞` (`⊤`) of algo:Dijkstra:\nafter `n` iterations, the map `u` and the acceptance counts coincide with those of algo:Dijkstra\n(`dijkstraRun`), the list holds the keys of the active points, the number of evaluations of `Γ` is\n`#X + ∑ₓ count(x) · #𝒱̃(x)` and the number of operations on `L` is\n`#X + n + ∑ₓ count(x) · (1 + #𝒱̃(x))`, where `𝒱̃` is the reversed stencil. The only hypothesis is\nthe stencil property of `Γ`. `X` is finite and linearly ordered (tie-breaking).", "deps": ["GuaranteedSubsol.dijkstraHeapRun_eq", "GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff"], "labels": ["algo:Dijkstra", "eq:Dijkstra_prop", "eqdef:stencil"], "direct": ["GuaranteedSubsol.dijkstraHeapRun_eq"]}, {"id": "GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff", "short": "OrderedPartialMap.botVal_eq_none_iff", "file": "Anchors/OrderedPartialMapBotValEqNoneIff.lean", "title": "`bot` of an ordered partial map returns nothing iff the map is empty", "source": "Papers/OrderedPartialMap, operation bot (author's request): `bot` returns nothing iff the map is empty", "state": "PROVED", "provider": "GuaranteedSubsol.OrderedPartialMapProof.botVal_eq_none_iff", "chapter": "Notes", "statement": "theorem botVal_eq_none_iff {X V : Type*} [Fintype X] [LinearOrder X] [LinearOrder V]\n    {v : X → Option V} :\n    botVal v = none ↔ ∀ x, v x = none", "doc": "Source: Papers/OrderedPartialMap (`OrderedPartialMap.tex`), operation bot (author's request):\n`botVal v` (the first component of `bot`) is `none` iff `v x = ⋄` (`none`) for all `x`. `X` is\nfinite and linearly ordered, `V` linearly ordered.", "deps": [], "labels": [], "direct": []}, {"id": "GuaranteedSubsol.OrderedPartialMap.botVal_eq_some_iff", "short": "OrderedPartialMap.botVal_eq_some_iff", "file": "Anchors/OrderedPartialMapBotValEqSomeIff.lean", "title": "`bot` of an ordered partial map returns the smallest entry", "source": "Papers/OrderedPartialMap, operation bot (author's request): `bot` returns `(t, x)` iff `v x = t` and `(t, x)` is lexicographically minimal among the entries (value first)", "state": "PROVED", "provider": "GuaranteedSubsol.OrderedPartialMapProof.botVal_eq_some_iff", "chapter": "Notes", "statement": "theorem botVal_eq_some_iff {X V : Type*} [Fintype X] [LinearOrder X] [LinearOrder V]\n    {v : X → Option V} {t : V} {x : X} :\n    botVal v = some (t, x) ↔\n      v x = some t ∧ ∀ y t', v y = some t' → toLex (t, x) ≤ toLex (t', y)", "doc": "Source: Papers/OrderedPartialMap (`OrderedPartialMap.tex`), operation bot (author's request):\n`botVal v` (the first component of `bot`) is `(t, x)` iff `v x = t` and `(t, x)` is minimal among\nthe entries `(t', y)` (`v y = t'`) for the lexicographic order of `V ×ₗ X` (value first, ties\nbroken by the order of `X`). `X` is finite and linearly ordered, `V` linearly ordered.", "deps": ["GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff"], "labels": [], "direct": ["GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff"]}, {"id": "GuaranteedSubsol.OrderedPartialMap.entriesIco_fst", "short": "OrderedPartialMap.entriesIco_fst", "file": "Anchors/OrderedPartialMapEntriesIcoFst.lean", "title": "`entriesIco` of an ordered partial map returns the entries in `[Tm, Tp)`", "source": "Papers/OrderedPartialMap, operation range named `entriesIco` (author's request): the output is the set of points with an entry in `[Tm, Tp)`", "state": "PROVED", "provider": "GuaranteedSubsol.OrderedPartialMapProof.entriesIco_fst", "chapter": "Notes", "statement": "theorem entriesIco_fst {X V : Type*} [Fintype X] [LinearOrder V] (m : OrderedPartialMap X V)\n    (Tm Tp : V) (x : X) :\n    x ∈ (m.entriesIco Tm Tp).1 ↔ ∃ t, m.v x = some t ∧ Tm ≤ t ∧ t < Tp", "doc": "Source: Papers/OrderedPartialMap (`OrderedPartialMap.tex`), operation range, named `entriesIco`\nfollowing Mathlib's naming of intervals (author's request): its output is the set of points `x`\nwith an entry `v x = t` such that `Tm ≤ t < Tp`. `X` is finite, `V` linearly ordered.", "deps": [], "labels": [], "direct": []}, {"id": "GuaranteedSubsol.agsikStep_superSolution", "short": "agsikStep_superSolution", "file": "Anchors/AgsikStepSuperSolution.lean", "title": "the AGSIK preserves super-solutions", "source": "Algo. algo:agsik (AGSI2.tex), invariant `Λ u ≤ u`", "state": "PROVED", "provider": "GuaranteedSubsol.AgsikProof.superSolution", "chapter": "AGSI2", "statement": "theorem agsikStep_superSolution {X : Type*} {Λ : (X → WithTop ℝ) → X → WithTop ℝ}\n    (hmono : Monotone Λ) (αinv ε : ℝ) {s : AgsikState X} (hs : Λ s.u ≤ s.u) (k : ℕ) :\n    Λ ((agsikStep Λ αinv ε)^[k] s).u ≤ ((agsikStep Λ αinv ε)^[k] s).u", "doc": "Source: Algorithm algo:agsik (AGSI2.tex), \"Ensures at termination: `Λ u ≤ u`\": for a monotone\n`Λ` on `ℝ_∞`, if `Λ u ≤ u` (e.g. `u = +∞` at initialization), this remains true at all times.", "deps": [], "labels": ["algo:agsik"], "direct": []}, {"id": "GuaranteedSubsol.agsikRun_terminates", "short": "agsikRun_terminates", "file": "Anchors/AgsikRunTerminates.lean", "title": "termination of the AGSIK", "source": "Algo. algo:agsik (AGSI2.tex), termination (V0 formalizationInstruction, removed in V1; author's request); renamed to the naming scheme (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.AgsikProof.terminates", "chapter": "AGSI2", "statement": "theorem agsikRun_terminates {X : Type*} [Finite X] {Λ : (X → WithTop ℝ) → X → WithTop ℝ}\n    (hmono : Monotone Λ) (hcomp : Ext.HasComparisonPrinciple Set.univ Λ) {w : X → ℝ}\n    (hw : ∀ x, (w x : WithTop ℝ) ≤ Λ (fun y => (w y : WithTop ℝ)) x) {αinv ε : ℝ}\n    (hαinv : 0 < αinv) (hε : 0 < ε) :\n    ∃ k, agsikDone Λ ε (agsikRun Λ αinv ε k).u", "doc": "Source: Algorithm algo:agsik (AGSI2.tex); the termination claim is from a V0\n`\\formalizationInstruction`, removed in V1 (author's request): if `Λ` is monotone on `ℝ_∞`,\nsatisfies the comparison principle and admits a finite sub-solution `w`, then the AGSIK started from\n`u = +∞`, with `ε > 0` and `α > 0` (`αinv = 1/α`), reaches the stopping criterion `u ≤ Λ u + ε`\nafter finitely many steps (no a-priori bound). `X` is finite.", "deps": ["GuaranteedSubsol.agsikStep_superSolution"], "labels": ["algo:agsik"], "direct": ["GuaranteedSubsol.agsikStep_superSolution"]}, {"id": "GuaranteedSubsol.agsikRun_terminates_of_kruzkov", "short": "agsikRun_terminates_of_kruzkov", "file": "Anchors/AgsikRunTerminatesOfKruzkov.lean", "title": "termination of the AGSIK for the extension of a real scheme", "source": "Algo. algo:agsik (AGSI2.tex), termination (V0 formalizationInstruction, removed in V1) for `Λ_∞` with `Φ_β` `ρ`-sub-additive (author's request); restated with `Global.monotoneExtension` in place of the inline extension, equal by definition (author ruling); renamed to the naming scheme (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.AgsikKruzkovProof.agsikRun_terminates_of_kruzkov", "chapter": "AGSI2", "statement": "theorem agsikRun_terminates_of_kruzkov {X : Type*} [Finite X] {Λ : (X → ℝ) → X → ℝ}\n    (hmono : ∀ x, Monotone (Λ · x)) {β ρ : ℝ} (hβ : 0 < β) (hρ : ρ < 1)\n    (hsub : ∀ x, SubAdditive ρ (kruzkovOp β (Λ · x))) {w : X → ℝ} (hw : w ≤ Λ w)\n    {αinv ε : ℝ} (hαinv : 0 < αinv) (hε : 0 < ε) :\n    ∃ k, agsikDone (Global.monotoneExtension Λ) ε\n      (agsikRun (Global.monotoneExtension Λ) αinv ε k).u", "doc": "Source: Algorithm algo:agsik (AGSI2.tex); the termination claim is from a V0\n`\\formalizationInstruction`, removed in V1. Stated for the extension `Λ_∞` of a real operator `Λ`\n(author's request): if `Λ` is monotone, its Kruzkov transform `Φ_β` is `ρ`-sub-additive with `β > 0`\nand `ρ < 1`, and `Λ` admits a finite sub-solution `w`, then the AGSIK applied to `Λ_∞` (timescale\n`α = 1/αinv > 0`, unrelated to `β`, tolerance `ε > 0`) reaches its stopping criterion after finitely\nmany steps. No causality is assumed. `X` is finite.", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.agsikStep_superSolution", "GuaranteedSubsol.agsikRun_terminates"], "labels": ["algo:agsik"], "direct": ["GuaranteedSubsol.agsikRun_terminates", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_kruzkovOp"]}, {"id": "GuaranteedSubsol.agsik_until_iff", "short": "agsik_until_iff", "file": "Anchors/AgsikUntilIff.lean", "title": "reformulation of the intermediate stopping criterion of the AGSIK", "source": "Algo. algo:agsik (AGSI2.tex), line agsik:until ⇔ its reformulation with `<` (author's request), strict as in V1", "state": "PROVED", "provider": "GuaranteedSubsol.AgsikCriterionProof.agsik_until_iff", "chapter": "AGSI2", "statement": "theorem agsik_until_iff {α : ℝ} (hα : 0 < α) (a b ε : ℝ) (n : ℕ) :\n    Real.exp (-a / α) < Real.exp ((ε - b) / α) + (2 : ℝ)⁻¹ ^ n ↔\n      (n * α * Real.log 2 ≤ a ∨\n        b < a + ε - α * Real.log (1 - Real.exp ((a - n * α * Real.log 2) / α)))", "doc": "Source: Algorithm algo:agsik (AGSI2.tex), line agsik:until, and the displayed reformulation in the\nparagraph before the algorithm (with the convention `ln t = -∞` for `t ≤ 0`), at a point with\n`u = b` and `Λ u = a` real, level `n`, timescale `α > 0`: the criterion\n`exp(-a/α) < exp((ε-b)/α) + 2^{-n}` holds iff `a ≥ n α ln 2` or\n`b < a + ε - α ln(1 - exp((a - n α ln 2)/α))`, with a strict second inequality as in V1 (V0 had\n`≤` there).", "deps": [], "labels": ["algo:agsik", "agsik:until"], "direct": []}, {"id": "GuaranteedSubsol.apply_zero_pos_of_causal", "short": "apply_zero_pos_of_causal", "file": "Anchors/ApplyZeroPosOfCausal.lean", "title": "a causal operator is positive on `0`", "source": "Prop. prop:cst_subsol (Intro.tex, V1), item enum:Lambda0_delta, causal case: `Γ[0] > 0` (scalar form; author's request 2026-10-20)", "state": "PROVED", "provider": "GuaranteedSubsol.ApplyZeroNonnegProof.apply_zero_pos_of_causal", "chapter": "Intro", "statement": "theorem apply_zero_pos_of_causal {X : Type*} {Γ : (X → ℝ) → ℝ} (hcaus : Causal Γ)\n    (hadd : AdditivelyInvariant Γ) : 0 < Γ 0", "doc": "Source: Prop. prop:cst_subsol (Intro.tex, V1), item enum:Lambda0_delta, causal case: if `Γ` _le {X : Type*} {Λ Γ : (X → ℝ) → X → ℝ} {I : Set X} {ubd : X → ℝ}\n    (hΓbd : ∀ u, ∀ x ∉ I, Γ u x = ubd x) (hΓadd : ∀ x ∈ I, AdditivelyInvariant (Γ · x))\n    (hΓΛ : ∀ u, Γ u ≤ Λ u) (hΓ0 : ∀ x ∈ I, 0 ≤ Γ 0 x) {t : ℝ} (ht : ∀ x ∉ I, t ≤ ubd x)\n    (x : X) : t ≤ Λ (fun _ => t) x ∧ t ≤ Γ (fun _ => t) x", "doc": "Source: Prop. prop:cst_subsol (Intro.tex, V1), eq. eq:cst_subsol, second case: if `Γ[0] ≥ 0` and\n`Γ ≤ Λ`, then `t ≤ Λ[t]` and `t ≤ Γ[t]` for all `t ≤ min u_bd`. `Γ` is additively invariant on\n`Int X = I` and equal to `u_bd` on `∂X` (the additive invariance of `Λ` is not used).", "deps": [], "labels": ["prop:cst_subsol", "eq:cst_subsol"], "direct": []}, {"id": "GuaranteedSubsol.monotone_bandOp", "short": "monotone_bandOp", "file": "Anchors/MonotoneBandOp.lean", "title": "the operator on a band, with frozen exterior values, is monotone", "source": "Lemma lem:monDom (Complexity.tex, V1), first claim for `Λ_B^v` (`bandOp`): monotone (author's request 2026-10-20)", "state": "PROVED", "provider": "GuaranteedSubsol.BandProof.monotone_bandOp", "chapter": "Complexity", "statement": "theorem monotone_bandOp {X : Type*} {Λ : (X → ℝ) → X → ℝ} (hΛ : Monotone Λ) (B : Set X)\n    (v : X → ℝ) : Monotone (bandOp Λ B v)", "doc": "Source: Lemma lem:monDom (Complexity.tex, V1), first claim, for `Λ_B^v` (eq. eqdef:Lambda_B,\nright): if `Λ` is monotone, so is `Λ_B^v` (`bandOp Λ B v`, acting on `ℝ^B`, the values outside `B`\nbeing frozen to `v`).", "deps": [], "labels": ["lem:monDom"], "direct": []}, {"id": "GuaranteedSubsol.subAdditive_bandOp", "short": "subAdditive_bandOp", "file": "Anchors/SubAdditiveBandOp.lean", "title": "the operator on a band, with frozen exterior values, is sub-additive", "source": "Lemma lem:monDom (Complexity.tex, V1), second claim: `Λ` monotone and `ρ`-sub-additive ⇒ `Λ_B^v` `ρ`-sub-additive (author's request 2026-10-20)", "state": "PROVED", "provider": "GuaranteedSubsol.BandProof.subAdditive_bandOp", "chapter": "Complexity", "statement": "theorem subAdditive_bandOp {X : Type*} {Λ : (X → ℝ) → X → ℝ} {ρ : ℝ} (hΛ : Monotone Λ)\n    (hsub : ∀ x, SubAdditive ρ (Λ · x)) (B : Set X) (v : X → ℝ) (x : B) :\n    SubAdditive ρ (bandOp Λ B v · x)", "doc": "Source: Lemma lem:monDom (Complexity.tex, V1), second claim: if `Λ` is monotone and\n`ρ`-sub-additive, so is `Λ_B^v` (`bandOp Λ B v`; scalar form at each point of `B`).", "deps": [], "labels": ["lem:monDom"], "direct": []}, {"id": "GuaranteedSubsol.parallelAgsiPasses_lt_top_of_subAdditive", "short": "parallelAgsiPasses_lt_top_of_subAdditive", "file": "Anchors/ParallelAgsiPassesLtTopOfSubAdditive.lean", "title": "the parallel AGSI terminates (super-solution version)", "source": "Prop. prop:cplx_agsi_parallel (AGSI2.tex, V1), termination claim, super-solution version, `0 < ρ < 1` (author's request 2026-10-20)", "state": "PROVED", "provider": "GuaranteedSubsol.ParallelAgsiTermProof.passes_lt_top", "chapter": "AGSI2", "statement": "theorem parallelAgsiPasses_lt_top_of_subAdditive {X : Type*} [Finite X]\n    {Φ : (X → ℝ) → X → ℝ} (hmono : Monotone Φ) {ρ : ℝ} (hρ0 : 0 < ρ) (hρ1 : ρ < 1)\n    (hsub : ∀ x, SubAdditive ρ (Φ · x)) {η C : ℝ} (hη : 0 < η) {v : X → ℝ}\n    (hv : Φ v ≤ v) (hvC : ∀ x, v x - Φ v x ≤ C) : parallelAgsiPasses Φ η v < ⊤", "doc": "Source: Prop. prop:cplx_agsi_parallel (AGSI2.tex, V1), termination claim: if `Φ` is monotone and\n`ρ`-sub-additive with `0 < ρ < 1`, Algorithm algo:agsi_parallel, started from `v` with\n`0 ≤ v - Φ v ≤ C`, terminates (the number of passes is finite). The bound on the number of updates\nat each point is `parallelAgsiRun_count_le_of_subAdditive`.", "deps": ["GuaranteedSubsol.restrictOp_superSolution", "GuaranteedSubsol.norm_sub_le_of_subAdditive", "GuaranteedSubsol.existsUnique_fixedPoint_of_subAdditive", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.parallelAgsiStep_superSolution", "GuaranteedSubsol.parallelAgsiRun_count_le_of_subAdditive"], "labels": ["prop:cplx_agsi_parallel"], "direct": ["GuaranteedSubsol.parallelAgsiRun_count_le_of_subAdditive"]}, {"id": "GuaranteedSubsol.parallelAgsiSubPasses_lt_top_of_subAdditive", "short": "parallelAgsiSubPasses_lt_top_of_subAdditive", "file": "Anchors/ParallelAgsiSubPassesLtTopOfSubAdditive.lean", "title": "the parallel AGSI terminates (sub-solution version)", "source": "Prop. prop:cplx_agsi_parallel (AGSI2.tex, V1), termination claim, sub-solution variant (author's request 2026-10-20)", "state": "PROVED", "provider": "GuaranteedSubsol.ParallelAgsiTermProof.subPasses_lt_top", "chapter": "AGSI2", "statement": "theorem parallelAgsiSubPasses_lt_top_of_subAdditive {X : Type*} [Finite X]\n    {Φ : (X → ℝ) → X → ℝ} (hmono : Monotone Φ) {ρ : ℝ} (hρ0 : 0 < ρ) (hρ1 : ρ < 1)\n    (hsub : ∀ x, SubAdditive ρ (Φ · x)) {η C : ℝ} (hη : 0 < η) {v : X → ℝ}\n    (hv : v ≤ Φ v) (hvC : ∀ x, Φ v x - v x ≤ C) : parallelAgsiSubPasses Φ η v < ⊤", "doc": "Source: Prop. prop:cplx_agsi_parallel (AGSI2.tex, V1), termination claim for the sub-solution\nvariant of Algorithm algo:agsi_parallel: if `Φ` is monotone and `ρ`-sub-additive with\n`0 < ρ < 1`, started from `v` with `0 ≤ Φ v - v ≤ C`, the loop terminates. The bound on the number\nof updates at each point is `parallelAgsiSubRun_count_le_of_subAdditive`.", "deps": ["GuaranteedSubsol.restrictOp_superSolution", "GuaranteedSubsol.norm_sub_le_of_subAdditive", "GuaranteedSubsol.existsUnique_fixedPoint_of_subAdditive", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.parallelAgsiStep_superSolution", "GuaranteedSubsol.parallelAgsiRun_count_le_of_subAdditive", "GuaranteedSubsol.parallelAgsiSubStep_iterate", "GuaranteedSubsol.parallelAgsiSubRun_count_le_of_subAdditive"], "labels": ["prop:cplx_agsi_parallel"], "direct": ["GuaranteedSubsol.parallelAgsiSubRun_count_le_of_subAdditive"]}, {"id": "GuaranteedSubsol.monotone_constrGamma", "short": "monotone_constrGamma", "file": "Anchors/MonotoneConstrGamma.lean", "title": "the constructed underestimating operator is monotone", "source": "Prop. prop:constr_Gamma (Intro.tex, V1), monotonicity of `Γ u := Λ[0] + min_V u` (author's request 2026-10-20)", "state": "PROVED", "provider": "GuaranteedSubsol.ConstrGamma.monotone", "chapter": "Intro", "statement": "theorem monotone_constrGamma {X : Type*} {Λ : (X → ℝ) → ℝ} {V : Finset X} (hV : V.Nonempty) :\n    Monotone (constrGamma Λ V hV)", "doc": "Source: Prop. prop:constr_Gamma (Intro.tex, V1), monotonicity of `Γ u := Λ[0] + min_V u`\n(eq. eqdef:constr_Gamma, at an interior point; the other properties are `constrGammaLoc`).", "deps": [], "labels": ["prop:constr_Gamma"], "direct": []}, {"id": "GuaranteedSubsol.dijkstraHeapLoop_correct", "short": "dijkstraHeapLoop_correct", "file": "Anchors/DijkstraHeapLoopCorrect.lean", "title": "Dijkstra's method with a sorted list and a stopping time", "source": "Prop. prop:Dijkstra_correct and algo:Dijkstra (Complexity.tex, V1), with the sorted list `L` and the stopping time `T` (`dijkstraHeapLoop`): termination (stop index in `ℕ∞`, finite) within `#X` acceptances, one per updated point (re-frozen 2026-10-20, author's approval), fixed point of `Γ^{<T}`, `L` holds the keys of the active points, all `≥ T`, each point accepted at most once exactly where `u` decreased, costs; used by `anbHeapRun_equiv` (author's request 2026-10-20)", "state": "PROVED", "provider": "GuaranteedSubsol.DijkstraHeapCorrectProof.loop_correct", "chapter": "Complexity", "statement": "theorem dijkstraHeapLoop_correct {X : Type*} [Fintype X] [LinearOrder X]\n    {Γ : (X → WithTop ℝ) → X → WithTop ℝ} {𝒱 : X → Set X} (hst : Global.Ext.HasStencil 𝒱 Γ)\n    (hmono : Monotone Γ) (hcaus : ∀ x, Ext.Causal (Γ · x)) (T : WithTop ℝ)\n    (s₀ : DijkstraHeapState X) (hL : s₀.L.v = dijkstraKey Γ s₀.u)\n    (hsup : dijkstraCutOp T Γ s₀.u ≤ s₀.u) :\n    dijkstraHeapStopIndex Γ 𝒱 T s₀ ≤ Fintype.card X ∧\n    dijkstraHeapStopIndex Γ 𝒱 T s₀ =\n      ((∑ x, ((dijkstraHeapLoop Γ 𝒱 T s₀).count x - s₀.count x) : ℕ) : ℕ∞) ∧\n    dijkstraCutOp T Γ (dijkstraHeapLoop Γ 𝒱 T s₀).u = (dijkstraHeapLoop Γ 𝒱 T s₀).u ∧\n    (dijkstraHeapLoop Γ 𝒱 T s₀).L.v = dijkstraKey Γ (dijkstraHeapLoop Γ 𝒱 T s₀).u ∧\n    (∀ y t, (dijkstraHeapLoop Γ 𝒱 T s₀).L.v y = some t → T ≤ t) ∧\n    (∀ x, (dijkstraHeapLoop Γ 𝒱 T s₀).count x ≤ s₀.count x + 1 ∧\n      ((dijkstraHeapLoop Γ 𝒱 T s₀).count x = s₀.count x + 1 ↔\n        (dijkstraHeapLoop Γ 𝒱 T s₀).u x < s₀.u x)) ∧\n    (dijkstraHeapLoop Γ 𝒱 T s₀).evalCount = s₀.evalCount +\n      ∑ x, ((dijkstraHeapLoop Γ 𝒱 T s₀).count x - s₀.count x) * (Global.Ext.revStencil 𝒱 x).card ∧\n    (dijkstraHeapLoop Γ 𝒱 T s₀).L.count = s₀.L.count + 1 +\n      ∑ x, ((dijkstraHeapLoop Γ 𝒱 T s₀).count x - s₀.count x) *\n        (2 + (Global.Ext.revStencil 𝒱 x).card)", "doc": "Source: Prop. prop:Dijkstra_correct and algo:Dijkstra (Complexity.tex, V1), for the while loop\nwith the sorted list `L` and the stopping time `T ∈ ℝ_∞` (`dijkstraHeapLoop`; author's request\n2026-10-20). Hypotheses: `Γ : ℝ_∞^X → ℝ_∞^X` monotone and causal, with stencils `𝒱`; the initial\n`u` satisfies `(Γ u)^{<T} ≤ u`; `L` holds the keys of the active points,\n`L = {(Γ u(x), x) | Γ u(x) < u(x)}` (eq. eq:Dijkstra_prop). Conclusions: the loop stops (the stop\nindex, in `ℕ∞`, is finite) after at most `#X` acceptances, one per point where `u` decreased\n(re-frozen 2026-10-20, author's approval: stop index in `ℕ∞`); `u` is then a fixed point of\n`Γ^{<T}` (`dijkstraCutOp`); `L` still holds the keys of the active points, and all of them are\n`≥ T`; each point is accepted at most once, exactly where `u` decreased; the evaluations of `Γ`\nand the operations on `L`. This is the form used in the ANB with sorted lists\n(`anbHeapRun_equiv`). `X` is finite and linearly ordered (tie-breaking).", "deps": ["GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_count_le_one", "GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq", "GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq", "GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.dijkstraHeapRun_eq", "GuaranteedSubsol.OrderedPartialMap.botVal_eq_none_iff"], "labels": ["prop:Dijkstra_correct", "algo:Dijkstra"], "direct": ["GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.dijkstraHeapRun_eq", "GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "GuaranteedSubsol.dijkstraRun_count_le_one", "GuaranteedSubsol.dijkstraRun_fixedPoint"]}]</script>
<script id="algos" type="application/json">{"algos": {"algo:Dijkstra": {"title": "Generalized Dijkstra algorithm, with stopping time T", "termination": ["GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.dijkstraHeapLoop_correct"], "variants": [{"name": "Set of active points (the list L is implicit)", "state": [{"name": "DijkstraState", "file": "Dijkstra.lean", "doc": "State of the generalized Dijkstra algorithm (algo:Dijkstra): the map `u` and the number `count x` of Dijkstra updates performed at each point. The list `L` is not stored: by Prop. prop:Dijkstra_correct it equals `{(Γ u x, x) | Γ u x < u x}`.", "code": "structure DijkstraState (X : Type*) where\n  u : X → WithTop ℝ\n  count : X → ℕ"}, {"name": "dijkstraInit", "file": "Dijkstra.lean", "doc": "Initialization with the initial guess `u₀` and no updates.", "code": "def dijkstraInit (u₀ : X → WithTop ℝ) : DijkstraState X := ⟨u₀, 0⟩"}], "step": [{"name": "dijkstraSelect", "file": "Dijkstra.lean", "doc": "Line Dijkstra:accept: `x` is the active point whose pair `(t, x) = (Γ u x, x)` is minimal for the lexicographic order.", "code": "def dijkstraSelect [LinearOrder X] (Γ : (X → WithTop ℝ) → X → WithTop ℝ) (u : X → WithTop ℝ)\n    (x : X) : Prop :=\n  Γ u x < u x ∧ ∀ y, Γ u y < u y → Γ u x < Γ u y ∨ (Γ u x = Γ u y ∧ x ≤ y)"}, {"name": "dijkstraStep", "file": "Dijkstra.lean", "doc": "One iteration of the while loop of algo:Dijkstra: the Dijkstra update `u(x) ← Γ u(x)` at the selected point (and `count x ← count x + 1`); if `L` is empty, stay put.", "code": "open Classical in\nnoncomputable def dijkstraStep [LinearOrder X] (Γ : (X → WithTop ℝ) → X → WithTop ℝ)\n    (s : DijkstraState X) : DijkstraState X :=\n  if h : ∃ x, dijkstraSelect Γ s.u x then\n    { u := Function.update s.u (Classical.choose h) (Γ s.u (Classical.choose h))\n      count := Function.update s.count (Classical.choose h) (s.count (Classical.choose h) + 1) }\n  else s"}], "loop": [{"name": "dijkstraRun", "file": "Dijkstra.lean", "doc": "The state of algo:Dijkstra after `n` iterations, started from the initial guess `u₀`.", "code": "noncomputable def dijkstraRun [LinearOrder X] (Γ : (X → WithTop ℝ) → X → WithTop ℝ)\n    (u₀ : X → WithTop ℝ) (n : ℕ) : DijkstraState X :=\n  (dijkstraStep Γ)^[n] (dijkstraInit u₀)"}]}, {"name": "Sorted list L and stopping time T", "state": [{"name": "DijkstraHeapState", "file": "DijkstraHeap.lean", "doc": "State of Dijkstra's method with a sorted list: the map `u`, the number of acceptances at each point, the list `L` (with its operation counter), and the number of evaluations of `Γ`.", "code": "structure DijkstraHeapState (X : Type*) where\n  u : X → WithTop ℝ\n  count : X → ℕ\n  L : OrderedPartialMap X (WithTop ℝ)\n  evalCount : ℕ"}, {"name": "dijkstraHeapInit", "file": "DijkstraHeap.lean", "doc": "Initial state built from scratch: `u₀`, no acceptance, `L` filled with the keys of all the points (`#X` evaluations of `Γ` and `#X` operations on `L`).", "code": "noncomputable def dijkstraHeapInit (Γ : (X → WithTop ℝ) → X → WithTop ℝ) (u₀ : X → WithTop ℝ) :\n    DijkstraHeapState X :=\n  ⟨u₀, 0, (⟨fun _ => none, 0⟩ : OrderedPartialMap X (WithTop ℝ)).set Finset.univ\n    (dijkstraKey Γ u₀), Fintype.card X⟩"}], "step": [{"name": "dijkstraKey", "file": "DijkstraHeap.lean", "doc": "The key of `y` in the list `L`: `Γ u y` if `y` is active (`Γ u y < u y`), absent otherwise.", "code": "noncomputable def dijkstraKey (Γ : (X → WithTop ℝ) → X → WithTop ℝ) (u : X → WithTop ℝ) :\n    X → Option (WithTop ℝ) :=\n  fun y => if Γ u y < u y then some (Γ u y) else none"}, {"name": "dijkstraCutOp", "file": "DijkstraHeap.lean", "doc": "The operator `Γ^{<T}`: `Γ u x` if `Γ u x < T`, and `∞` otherwise (for `T = ⊤`, this is `Γ`).", "code": "noncomputable def dijkstraCutOp (T : WithTop ℝ) (Γ : (X → WithTop ℝ) → X → WithTop ℝ) :\n    (X → WithTop ℝ) → X → WithTop ℝ :=\n  fun u x => if Γ u x < T then Γ u x else ⊤"}, {"name": "dijkstraHeapStep", "file": "DijkstraHeap.lean", "doc": "One iteration of Dijkstra's method with a sorted list, stencil `𝒱` and threshold `T`.", "code": "noncomputable def dijkstraHeapStep (Γ : (X → WithTop ℝ) → X → WithTop ℝ) (𝒱 : X → Set X)\n    (T : WithTop ℝ) (s : DijkstraHeapState X) : DijkstraHeapState X :=\n  match s.L.bot with\n  | (none, L₁) => { s with L := L₁ }\n  | (some (t, x), L₁) =>\n    if T ≤ t then { s with L := L₁ }\n    else\n      let u' := Function.update s.u x t\n      { u := u'\n        count := Function.update s.count x (s.count x + 1)\n        L := (L₁.erase1 x).set (Global.Ext.revStencil 𝒱 x) (dijkstraKey Γ u')\n        evalCount := s.evalCount + (Global.Ext.revStencil 𝒱 x).card }"}], "loop": [{"name": "dijkstraHeapRun", "file": "DijkstraHeap.lean", "doc": "The state after `n` iterations, from the state `s₀`.", "code": "noncomputable def dijkstraHeapRun (Γ : (X → WithTop ℝ) → X → WithTop ℝ) (𝒱 : X → Set X)\n    (T : WithTop ℝ) (s₀ : DijkstraHeapState X) (n : ℕ) : DijkstraHeapState X :=\n  (dijkstraHeapStep Γ 𝒱 T)^[n] s₀"}, {"name": "DijkstraHeapState.Stopped", "file": "DijkstraHeap.lean", "doc": "Whether Dijkstra's method with a sorted list and threshold `T` stops at the state `s`: the list `L` is empty, or its smallest key is `≥ T`.", "code": "def DijkstraHeapState.Stopped (T : WithTop ℝ) (s : DijkstraHeapState X) : Prop :=\n  ∀ t x, OrderedPartialMap.botVal s.L.v = some (t, x) → T ≤ t"}, {"name": "dijkstraHeapStopIndex", "file": "DijkstraHeap.lean", "doc": "The number of acceptances before Dijkstra's method with a sorted list stops, from the state `s₀` (`⊤` if it never stops).", "code": "open Classical in\nnoncomputable def dijkstraHeapStopIndex (Γ : (X → WithTop ℝ) → X → WithTop ℝ) (𝒱 : X → Set X)\n    (T : WithTop ℝ) (s₀ : DijkstraHeapState X) : ℕ∞ :=\n  if h : ∃ n, (dijkstraHeapRun Γ 𝒱 T s₀ n).Stopped T then Nat.find h else ⊤"}, {"name": "dijkstraHeapLoop", "file": "DijkstraHeap.lean", "doc": "The while loop of algo:Dijkstra with a sorted list and threshold `T`, from the state `s₀`: the acceptances, then the final test (one more call to `bot`, which finds the list empty or its smallest key `≥ T`). Meaningful when the stop index is finite.", "code": "noncomputable def dijkstraHeapLoop (Γ : (X → WithTop ℝ) → X → WithTop ℝ) (𝒱 : X → Set X)\n    (T : WithTop ℝ) (s₀ : DijkstraHeapState X) : DijkstraHeapState X :=\n  dijkstraHeapRun Γ 𝒱 T s₀ ((dijkstraHeapStopIndex Γ 𝒱 T s₀).toNat + 1)"}]}]}, "algo:global_iteration": {"title": "Global iteration, for computing a super-solution (and its sub-solution variant)", "termination": ["GuaranteedSubsol.globalIterRun_terminates", "GuaranteedSubsol.globalIterSubRun_terminates", "GuaranteedSubsol.globalIterRun_passes_le_withUnknown"], "variants": [{"name": "The state is the map v : X → ℝ", "state": [], "step": [{"name": "globalIterStep", "file": "GlobalIteration.lean", "doc": "One iteration of algo:global_iteration, super-solution version: `v ← Φ v`, unless the stopping criterion `v - Φ v ≤ η` holds, in which case `v` is unchanged.", "code": "open Classical in\nnoncomputable def globalIterStep (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : X → ℝ :=\n  if ∀ x, v x - Φ v x ≤ η then v else Φ v"}, {"name": "globalIterSubStep", "file": "GlobalIteration.lean", "doc": "One iteration of algo:global_iteration, sub-solution variant: `v ← Φ v`, unless the stopping criterion `Φ v - v ≤ η` holds, in which case `v` is unchanged.", "code": "open Classical in\nnoncomputable def globalIterSubStep (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : X → ℝ :=\n  if ∀ x, Φ v x - v x ≤ η then v else Φ v"}], "loop": [{"name": "globalIterRun", "file": "GlobalIteration.lean", "doc": "The map of algo:global_iteration (super-solution version) after `n` iterations from `v`.", "code": "noncomputable def globalIterRun (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) (n : ℕ) : X → ℝ :=\n  (globalIterStep Φ η)^[n] v"}, {"name": "globalIterPasses", "file": "GlobalIteration.lean", "doc": "Number of iterations of algo:global_iteration (super-solution version) until its stopping criterion holds, i.e. when the while loop exits (`⊤` if it never holds).", "code": "open Classical in\nnoncomputable def globalIterPasses (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : ℕ∞ :=\n  if h : ∃ n, ∀ x, globalIterRun Φ η v n x - Φ (globalIterRun Φ η v n) x ≤ η then\n    (Nat.find h : ℕ∞)\n  else ⊤"}, {"name": "globalIterResult", "file": "GlobalIteration.lean", "doc": "The output of algo:global_iteration (super-solution version), started from `v` (meaningful when the loop exits, i.e. when `globalIterPasses Φ η v < ⊤`).", "code": "noncomputable def globalIterResult (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : X → ℝ :=\n  globalIterRun Φ η v (globalIterPasses Φ η v).toNat"}, {"name": "globalIterSubRun", "file": "GlobalIteration.lean", "doc": "The map of algo:global_iteration (sub-solution variant) after `n` iterations from `v`.", "code": "noncomputable def globalIterSubRun (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) (n : ℕ) : X → ℝ :=\n  (globalIterSubStep Φ η)^[n] v"}, {"name": "globalIterSubPasses", "file": "GlobalIteration.lean", "doc": "Number of iterations of algo:global_iteration (sub-solution variant) until its stopping criterion holds (`⊤` if it never holds).", "code": "open Classical in\nnoncomputable def globalIterSubPasses (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : ℕ∞ :=\n  if h : ∃ n, ∀ x, Φ (globalIterSubRun Φ η v n) x - globalIterSubRun Φ η v n x ≤ η then\n    (Nat.find h : ℕ∞)\n  else ⊤"}, {"name": "globalIterSubResult", "file": "GlobalIteration.lean", "doc": "The output of algo:global_iteration (sub-solution variant), started from `v` (meaningful when the loop exits, i.e. when `globalIterSubPasses Φ η v < ⊤`).", "code": "noncomputable def globalIterSubResult (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : X → ℝ :=\n  globalIterSubRun Φ η v (globalIterSubPasses Φ η v).toNat"}]}]}, "algo:agsi_parallel": {"title": "Parallel AGSI, for computing a super-solution (and its sub-solution variant)", "termination": ["GuaranteedSubsol.parallelAgsiRun_terminates", "GuaranteedSubsol.parallelAgsiSubRun_terminates", "GuaranteedSubsol.parallelAgsiPasses_lt_top_of_subAdditive", "GuaranteedSubsol.parallelAgsiSubPasses_lt_top_of_subAdditive"], "variants": [{"name": "", "state": [{"name": "ParallelAgsiState", "file": "ParallelAGSI.lean", "doc": "State of the parallel AGSI (algo:agsi_parallel): the current map `v` and, for each point, the number `count x` of updates `v(x) ← Φ v(x)` performed so far.", "code": "structure ParallelAgsiState (X : Type*) where\n  v : X → ℝ\n  count : X → ℕ"}], "step": [{"name": "parallelAgsiStep", "file": "ParallelAGSI.lean", "doc": "One pass of the parallel AGSI (algo:agsi_parallel, line algoline:agsi_parallel_for), super-solution version: on `B := {x | v x - Φ v x > η}`, `v(x) ← Φ v(x)` and `count x ← count x + 1`; elsewhere both are unchanged.", "code": "open Classical in\nnoncomputable def parallelAgsiStep (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (s : ParallelAgsiState X) :\n    ParallelAgsiState X where\n  v := restrictOp Φ {x | η < s.v x - Φ s.v x} s.v\n  count x := if η < s.v x - Φ s.v x then s.count x + 1 else s.count x"}, {"name": "parallelAgsiSubStep", "file": "ParallelAGSI.lean", "doc": "One pass of the parallel AGSI, sub-solution variant (algo:agsi_parallel, with `v - Φ v` replaced by `Φ v - v`): on `B := {x | Φ v x - v x > η}`, `v(x) ← Φ v(x)` and `count x ← count x + 1`; elsewhere both are unchanged.", "code": "open Classical in\nnoncomputable def parallelAgsiSubStep (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (s : ParallelAgsiState X) :\n    ParallelAgsiState X where\n  v := restrictOp Φ {x | η < Φ s.v x - s.v x} s.v\n  count x := if η < Φ s.v x - s.v x then s.count x + 1 else s.count x"}], "loop": [{"name": "parallelAgsiRun", "file": "ParallelAGSI.lean", "doc": "The state of algo:agsi_parallel (super-solution version) after `n` passes, started from `v` with no updates.", "code": "noncomputable def parallelAgsiRun (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) (n : ℕ) :\n    ParallelAgsiState X :=\n  (parallelAgsiStep Φ η)^[n] ⟨v, 0⟩"}, {"name": "parallelAgsiPasses", "file": "ParallelAGSI.lean", "doc": "Number of passes of algo:agsi_parallel (super-solution version) until its stopping criterion `v - Φ v ≤ η` holds (`⊤` if it never holds).", "code": "open Classical in\nnoncomputable def parallelAgsiPasses (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : ℕ∞ :=\n  if h : ∃ n, ∀ x, (parallelAgsiRun Φ η v n).v x - Φ (parallelAgsiRun Φ η v n).v x ≤ η then\n    (Nat.find h : ℕ∞)\n  else ⊤"}, {"name": "parallelAgsiResult", "file": "ParallelAGSI.lean", "doc": "The output of algo:agsi_parallel (super-solution version), started from `v` (meaningful when the loop exits, i.e. when `parallelAgsiPasses Φ η v < ⊤`).", "code": "noncomputable def parallelAgsiResult (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : X → ℝ :=\n  (parallelAgsiRun Φ η v (parallelAgsiPasses Φ η v).toNat).v"}, {"name": "parallelAgsiCount", "file": "ParallelAGSI.lean", "doc": "The number of updates `v(x) ← Φ v(x)` performed at each point by algo:agsi_parallel (super-solution version) until the loop stops (`⊤` if it never stops).", "code": "open Classical in\nnoncomputable def parallelAgsiCount (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : X → ℕ∞ :=\n  fun x => if parallelAgsiPasses Φ η v = ⊤ then ⊤\n    else ((parallelAgsiRun Φ η v (parallelAgsiPasses Φ η v).toNat).count x : ℕ∞)"}, {"name": "parallelAgsiSubRun", "file": "ParallelAGSI.lean", "doc": "The state of the sub-solution variant of algo:agsi_parallel after `n` passes, started from `v` with no updates.", "code": "noncomputable def parallelAgsiSubRun (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) (n : ℕ) :\n    ParallelAgsiState X :=\n  (parallelAgsiSubStep Φ η)^[n] ⟨v, 0⟩"}, {"name": "parallelAgsiSubPasses", "file": "ParallelAGSI.lean", "doc": "Number of passes of the sub-solution variant of algo:agsi_parallel until its stopping criterion `Φ v - v ≤ η` holds (`⊤` if it never holds).", "code": "open Classical in\nnoncomputable def parallelAgsiSubPasses (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : ℕ∞ :=\n  if h : ∃ n, ∀ x, Φ (parallelAgsiSubRun Φ η v n).v x - (parallelAgsiSubRun Φ η v n).v x ≤ η then\n    (Nat.find h : ℕ∞)\n  else ⊤"}, {"name": "parallelAgsiSubResult", "file": "ParallelAGSI.lean", "doc": "The output of the sub-solution variant of algo:agsi_parallel, started from `v` (meaningful when the loop exits, i.e. when `parallelAgsiSubPasses Φ η v < ⊤`).", "code": "noncomputable def parallelAgsiSubResult (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : X → ℝ :=\n  (parallelAgsiSubRun Φ η v (parallelAgsiSubPasses Φ η v).toNat).v"}, {"name": "parallelAgsiSubCount", "file": "ParallelAGSI.lean", "doc": "The number of updates `v(x) ← Φ v(x)` performed at each point by the sub-solution variant of algo:agsi_parallel until the loop stops (`⊤` if it never stops).", "code": "open Classical in\nnoncomputable def parallelAgsiSubCount (Φ : (X → ℝ) → X → ℝ) (η : ℝ) (v : X → ℝ) : X → ℕ∞ :=\n  fun x => if parallelAgsiSubPasses Φ η v = ⊤ then ⊤\n    else ((parallelAgsiSubRun Φ η v (parallelAgsiSubPasses Φ η v).toNat).count x : ℕ∞)"}]}]}, "algo:agsik": {"title": "AGSI with Kruzkov based intermediate stopping criteria (AGSIK)", "termination": ["GuaranteedSubsol.agsikRun_terminates", "GuaranteedSubsol.agsikRun_terminates_of_kruzkov"], "variants": [{"name": "", "state": [{"name": "AgsikState", "file": "AGSIK.lean", "doc": "State of the AGSIK (algo:agsik): the main iteration index `n`, the map `u`, and the number `count x` of updates `u(x) ← Λ u(x)` performed so far at each point.", "code": "structure AgsikState (X : Type*) where\n  n : ℕ\n  u : X → WithTop ℝ\n  count : X → ℕ"}, {"name": "agsikInit", "file": "AGSIK.lean", "doc": "Initialization of algo:agsik: `n = 0`, `u = +∞`, no updates.", "code": "def agsikInit : AgsikState X := ⟨0, fun _ => ⊤, 0⟩"}], "step": [{"name": "agsikSelect", "file": "AGSIK.lean", "doc": "Selection criterion of line agsik:parallel_for at level `n`: `exp(-Λu(x)/α) ≥ exp((ε-u(x))/α) + 2^{-n}`, with `αinv = 1/α`.", "code": "def agsikSelect (Λ : (X → WithTop ℝ) → X → WithTop ℝ) (αinv ε : ℝ) (n : ℕ)\n    (u : X → WithTop ℝ) (x : X) : Prop :=\n  (2 : ℝ)⁻¹ ^ n + Real.exp (αinv * ε) * -kruzkov αinv (u x) ≤ -kruzkov αinv (Λ u x)"}, {"name": "agsikStep", "file": "AGSIK.lean", "doc": "One step of the AGSIK (algo:agsik): a parallel pass `u(x) ← Λ u(x)` on the selected points at level `n` if there are any; otherwise stay put if `u ≤ Λ u + ε`; otherwise `n ← n + 1`.", "code": "open Classical in\nnoncomputable def agsikStep (Λ : (X → WithTop ℝ) → X → WithTop ℝ) (αinv ε : ℝ)\n    (s : AgsikState X) : AgsikState X :=\n  if ∃ x, agsikSelect Λ αinv ε s.n s.u x then\n    { n := s.n\n      u := fun x => if agsikSelect Λ αinv ε s.n s.u x then Λ s.u x else s.u x\n      count := fun x => if agsikSelect Λ αinv ε s.n s.u x then s.count x + 1 else s.count x }\n  else if agsikDone Λ ε s.u then s\n  else { s with n := s.n + 1 }"}], "loop": [{"name": "agsikDone", "file": "AGSIK.lean", "doc": "Stopping criterion of the main loop of algo:agsik: `u ≤ Λ u + ε` on `X`.", "code": "def agsikDone (Λ : (X → WithTop ℝ) → X → WithTop ℝ) (ε : ℝ) (u : X → WithTop ℝ) : Prop :=\n  ∀ x, u x ≤ Λ u x + (ε : WithTop ℝ)"}, {"name": "agsikRun", "file": "AGSIK.lean", "doc": "The state of algo:agsik after `k` steps, started from `u = +∞` (`agsikInit`).", "code": "noncomputable def agsikRun (Λ : (X → WithTop ℝ) → X → WithTop ℝ) (αinv ε : ℝ) (k : ℕ) :\n    AgsikState X :=\n  (agsikStep Λ αinv ε)^[k] agsikInit"}]}]}, "algo:anb": {"title": "Adaptive Narrow Band (ANB)", "termination": ["GuaranteedSubsol.anbStopIndex_le", "GuaranteedSubsol.anbStopIndex_le_withUnknown", "GuaranteedSubsol.anbRun_done_of_maxWidth", "GuaranteedSubsol.anbRunData_passes_le", "GuaranteedSubsol.anbRunData_passes_le_withUnknown"], "variants": [{"name": "", "state": [{"name": "AnbParams", "file": "Anb.lean", "doc": "Parameters of algo:anb: the scheme `Λ`, its causal underestimate `Γ` (line anb:hatu), the tolerance `ε`, and the constants `τ`, `α`, `ρ` of line anb:input.", "code": "structure AnbParams (X : Type*) where\n  Λ : (X → ℝ) → X → ℝ\n  Γ : (X → ℝ) → X → ℝ\n  ε : ℝ\n  τ : ℝ\n  α : ℝ\n  ρ : ℝ"}, {"name": "AnbState", "file": "Anb.lean", "doc": "State of algo:anb: iteration index `n`, sub-solution `ū`, super-solution `u̲`, the initial guess `uHatInit` for Dijkstra's method at line anb:hatu (built at the end of the previous iteration, see Prop. prop:Dijkstra_band and `anbDijkstraGuess`), and the number of updates of `ū`, `u̲` and `û` performed so far at each point. The counters of `ū` and `u̲` take values in `ℕ∞`: they become `⊤` when an inner loop (lines anb:while_sub, anb:while_sup) involving the point never exits, so that a bound on them also expresses termination; Dijkstra's method always performs `card X` steps, and the counter of `û` is in `ℕ`.", "code": "structure AnbState (X : Type*) where\n  n : ℕ\n  uSub : X → ℝ\n  uSup : X → WithTop ℝ\n  uHatInit : X → WithTop ℝ\n  countSub : X → ℕ∞\n  countSup : X → ℕ∞\n  countHat : X → ℕ"}, {"name": "anbInit", "file": "Anb.lean", "doc": "Line anb:init, starting at `n = 0` (Remark rem:anb_npos: the iteration `n = 0` is vacuous): `ū = 0`, `u̲ = ∞`, initial guess `0` for `û` (the natural super-solution at the start; the iteration `n = 0` then computes `û_0 = 0` and `t⁻_0 = 0`, the conventions of Prop. prop:Dijkstra_band), no updates.", "code": "def anbInit : AnbState X := ⟨0, 0, fun _ => ⊤, 0, 0, 0, 0⟩"}], "step": [{"name": "anbHatOp", "file": "Anb.lean", "doc": "Line anb:hatu: the operator `Γ' u := max (ū, min (T, Γ_∞ u))`, with `T = nτ`, whose fixed point is `û_n` (Prop. prop:Dijkstra_band).", "code": "noncomputable def anbHatOp (Γ : (X → ℝ) → X → ℝ) (uSub : X → ℝ) (T : ℝ) :\n    (X → WithTop ℝ) → X → WithTop ℝ :=\n  fun u x => max (uSub x : WithTop ℝ) (min (T : WithTop ℝ) (Global.monotoneExtension Γ u x))"}, {"name": "anbLevel", "file": "Anb.lean", "doc": "Line anb:tn: `t_n := min (T, min {û(x) | (1 + ε) û(x) < u̲(x)})`, with `T = nτ`; it is `T` if this set is empty.", "code": "open Classical in\nnoncomputable def anbLevel [Fintype X] (ε T : ℝ) (uHat : X → ℝ) (uSup : X → WithTop ℝ) : ℝ :=\n  let S := Finset.univ.filter fun x => (((1 + ε) * uHat x : ℝ) : WithTop ℝ) < uSup x\n  if h : S.Nonempty then min T (S.inf' h uHat) else T"}, {"name": "anbBand", "file": "Anb.lean", "doc": "Line anb:Bn: `B_n := {x | T - 2Δ ≤ û(x) < T}`, with `T = nτ` and `Δ = Δ_n`.", "code": "def anbBand (T Δ : ℝ) (uHat : X → ℝ) : Set X :=\n  {x | T - 2 * Δ ≤ uHat x ∧ uHat x < T}"}, {"name": "AnbStepData", "file": "Anb.lean", "doc": "The quantities of one iteration of algo:anb, computed from the state at its start: Dijkstra's run for `û_n`, `û_n`, `t_n`, `Δ_n`, `B_n`, `η_n`, the inputs `E_α û_n`, `E_α u̲` of the two global iterations, and the operators `Φ_α` acting on the band `B_n`, the values outside `B_n` being frozen to `E_α û_n` (sub-solution variant) and to `E_α u̲` (super-solution version).", "code": "structure AnbStepData (X : Type*) where\n  hatRun : DijkstraState X\n  uHat : X → ℝ\n  t : ℝ\n  Δ : ℝ\n  band : Set X\n  η : ℝ\n  vSub : X → ℝ\n  vSup : X → ℝ\n  ΦSub : (band → ℝ) → band → ℝ\n  ΦSup : (band → ℝ) → band → ℝ"}, {"name": "anbStepData", "file": "Anb.lean", "doc": "The quantities of the iteration of algo:anb started from the state `s` (lines anb:hatu to algoline:etan, with line anb:hatu2 skipped). `û_n` is finite in the analysis; the conversion from `ℝ_∞` uses the junk value `0` otherwise.", "code": "noncomputable def anbStepData [Fintype X] [LinearOrder X] (p : AnbParams X) (s : AnbState X) :\n    AnbStepData X :=\n  let T : ℝ := s.n * p.τ\n  let D := dijkstraRun (anbHatOp p.Γ s.uSub T) s.uHatInit (Nat.card X)\n  let uHat : X → ℝ := fun x => (D.u x).untopD 0\n  let t := anbLevel p.ε T uHat s.uSup\n  let B := anbBand T (T - t) uHat\n  { hatRun := D, uHat := uHat, t := t, Δ := T - t, band := B\n    η := (1 - p.ρ) * Real.exp (-T / p.α)\n    vSub := fun x => kruzkov (1 / p.α) (uHat x)\n    vSup := fun x => kruzkov (1 / p.α) (s.uSup x)\n    ΦSub := bandOp (Global.kruzkovOp p.α p.Λ) B fun x => kruzkov (1 / p.α) (uHat x)\n    ΦSup := bandOp (Global.kruzkovOp p.α p.Λ) B fun x => kruzkov (1 / p.α) (s.uSup x) }"}, {"name": "AnbInnerSolver", "file": "Anb.lean", "doc": "The inner solver of lines anb:while_sub and anb:while_sup, acting on the maps on a band `B` with operator `Φ`, tolerance `η` and initial map `v`: the result, and the number of updates at each point of `B` (`⊤` if the loop never stops; the values at the points outside `B` are not used), for the sub-solution variant and the super-solution version.", "code": "structure AnbInnerSolver (X : Type*) where\n  subResult : (B : Set X) → ((B → ℝ) → B → ℝ) → ℝ → (B → ℝ) → B → ℝ\n  subCount : (B : Set X) → ((B → ℝ) → B → ℝ) → ℝ → (B → ℝ) → X → ℕ∞\n  supResult : (B : Set X) → ((B → ℝ) → B → ℝ) → ℝ → (B → ℝ) → B → ℝ\n  supCount : (B : Set X) → ((B → ℝ) → B → ℝ) → ℝ → (B → ℝ) → X → ℕ∞"}, {"name": "anbStepWith", "file": "Anb.lean", "doc": "One iteration of the main loop of algo:anb (its body, lines anb:hatu to anb:while_sup; the stopping test of line anb:for is not applied here, see `anbDone`), with the inner solver `S`: compute the quantities of the iteration (`anbStepData`), run the two inner loops on the band `B_n` (on the subtype), extend their results by the frozen values outside `B_n`, convert back from Kruzkov coordinates, update the counters, set the initial guess for `û` of the next iteration (`anbDijkstraGuess`, eq. eqdef:Dijkstra_supsol), and increment `n`.", "code": "open Classical in\nnoncomputable def anbStepWith [Fintype X] [LinearOrder X] (S : AnbInnerSolver X) (p : AnbParams X)\n    (s : AnbState X) : AnbState X :=\n  let d := anbStepData p s\n  let wSub : X → ℝ :=\n    bandExtend d.band d.vSub (S.subResult d.band d.ΦSub d.η fun x => d.vSub x)\n  let wSup : X → ℝ := bandExtend d.band d.vSup (S.supResult d.band d.ΦSup d.η fun x => d.vSup x)\n  let uSub : X → ℝ := fun x => -p.α * Real.log (-wSub x)\n  { n := s.n + 1\n    uSub := uSub\n    uSup := fun x => kruzkovInv p.α (wSup x)\n    uHatInit := anbDijkstraGuess (((s.n + 1 : ℕ) : ℝ) * p.τ) d.tMinus d.uHat uSub\n    countSub := fun x =>\n      s.countSub x + if x ∈ d.band then S.subCount d.band d.ΦSub d.η (fun y => d.vSub y) x else 0\n    countSup := fun x =>\n      s.countSup x + if x ∈ d.band then S.supCount d.band d.ΦSup d.η (fun y => d.vSup y) x else 0\n    countHat := fun x => s.countHat x + d.hatRun.count x }"}, {"name": "anbStep", "file": "Anb.lean", "doc": "One iteration of the main loop of algo:anb (its body, lines anb:hatu to anb:while_sup; the stopping test of line anb:for is not applied here, see `anbDone`): the inner loops are global iterations on the band `B_n` (`anbGlobalIter`).", "code": "noncomputable def anbStep [Fintype X] [LinearOrder X] (p : AnbParams X) (s : AnbState X) :\n    AnbState X :=\n  anbStepWith anbGlobalIter p s"}], "loop": [{"name": "anbDone", "file": "Anb.lean", "doc": "Stopping criterion of line anb:for: `(1 + ε) ū ≥ u̲` on `X`.", "code": "def anbDone (p : AnbParams X) (s : AnbState X) : Prop :=\n  ∀ x, s.uSup x ≤ (((1 + p.ε) * s.uSub x : ℝ) : WithTop ℝ)"}, {"name": "anbRunWith", "file": "Anb.lean", "doc": "The state of the ANB with the inner solver `S` after `k` iterations of its main loop (at the start of iteration `n = k`).", "code": "noncomputable def anbRunWith [Fintype X] [LinearOrder X] (S : AnbInnerSolver X) (p : AnbParams X)\n    (k : ℕ) : AnbState X :=\n  (anbStepWith S p)^[k] anbInit"}, {"name": "anbStopIndexWith", "file": "Anb.lean", "doc": "The iteration at which the ANB with the inner solver `S` terminates: the first `k` such that the stopping test `(1 + ε) ū ≥ u̲` holds at the start of iteration `k` (`⊤` if it never holds).", "code": "open Classical in\nnoncomputable def anbStopIndexWith [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    (p : AnbParams X) : ℕ∞ :=\n  if h : ∃ k, anbDone p (anbRunWith S p k) then (Nat.find h : ℕ∞) else ⊤"}, {"name": "anbRun", "file": "Anb.lean", "doc": "The state of algo:anb after `k` iterations of its main loop (at the start of iteration `n = k`). The iterations are not stopped by the test `anbDone`; the algorithm terminates at the first `k` such that `anbDone p (anbRun p k)` (`anbStopIndex`).", "code": "noncomputable def anbRun [Fintype X] [LinearOrder X] (p : AnbParams X) (k : ℕ) : AnbState X :=\n  anbRunWith anbGlobalIter p k"}, {"name": "anbStopIndex", "file": "Anb.lean", "doc": "The iteration at which algo:anb terminates: the first `k` such that the stopping test `(1 + ε) ū ≥ u̲` holds at the start of iteration `k` (`⊤` if it never holds).", "code": "noncomputable def anbStopIndex [Fintype X] [LinearOrder X] (p : AnbParams X) : ℕ∞ :=\n  anbStopIndexWith anbGlobalIter p"}]}]}, "algo:anb_lazy": {"title": "Adaptive Narrow Band (ANB), complete implementation", "termination": ["GuaranteedSubsol.anbHeapRun_equiv", "GuaranteedSubsol.anbLazyRun_equiv", "GuaranteedSubsol.anbStopIndex_le"], "variants": [{"name": "With the sorted lists L, M, S, Sc", "state": [{"name": "AnbHeapState", "file": "AnbHeap.lean", "doc": "State of the ANB with sorted lists: the iteration index `n`, the map `ũ` (`uTilde`; `none` is the placeholder `⋄`, standing for `(n-1)τ`), the super-solution `u̲~` (`uSup`), the state of Dijkstra's method (`ǔ`, the list `L`, the acceptance counts, the number of evaluations of `Γ`), the lists `M`, `S`, `Sc`, the previous band `B_{n-1}` (`bandPrev`), and the numbers of updates of `ū` and `u̲~` at each point.", "code": "structure AnbHeapState (X : Type*) where\n  n : ℕ\n  uTilde : X → Option ℝ\n  uSup : X → WithTop ℝ\n  dij : DijkstraHeapState X\n  M : OrderedPartialMap X ℝ\n  S : OrderedPartialMap X ℝ\n  Sc : OrderedPartialMap X (WithTop ℝ)ᵒᵈ\n  bandPrev : Finset X\n  countSub : X → ℕ∞\n  countSup : X → ℕ∞"}, {"name": "anbHeapInit", "file": "AnbHeap.lean", "doc": "Initial state: `ũ = ⋄`, `ǔ = u̲~ = ∞`, `M = S = ∅`, `Sc` holds all the points (`#X` operations), `B_{-1} = ∅`, and `L` holds the keys of `max {0, Γ_∞}` at `ǔ = ∞` (`#X` evaluations of `Γ` and operations; `0 = ⋄→0` is the value of the placeholder in the first effective iteration `n = 1`).", "code": "noncomputable def anbHeapInit (Γ : (X → ℝ) → X → ℝ) : AnbHeapState X :=\n  { n := 0, uTilde := fun _ => none, uSup := fun _ => ⊤\n    dij := dijkstraHeapInit (anbHeapOp Γ 0) fun _ => ⊤\n    M := ⟨fun _ => none, 0⟩, S := ⟨fun _ => none, 0⟩\n    Sc := (⟨fun _ => none, 0⟩ : OrderedPartialMap X (WithTop ℝ)ᵒᵈ).set Finset.univ\n      (anbKeySc (fun _ => none) fun _ => ⊤)\n    bandPrev := ∅, countSub := 0, countSup := 0 }"}], "step": [{"name": "anbKeyS", "file": "AnbHeap.lean", "doc": "The key of `x` in the list `S` (eq. eqdef:S_heap): `ũ(x)` if it is not the placeholder (the map `ũ` itself).", "code": "def anbKeyS (u : X → Option ℝ) : X → Option ℝ := u"}, {"name": "anbKeyM", "file": "AnbHeap.lean", "doc": "The key of `x` in the list `M` (eq. eqdef:M_heap): `ũ(x)` if it is not the placeholder and `(1 + ε) ũ(x) < u̲~(x)`.", "code": "noncomputable def anbKeyM (ε : ℝ) (u : X → Option ℝ) (uSup : X → WithTop ℝ) : X → Option ℝ :=\n  fun x => match u x with\n    | none => none\n    | some r => if (((1 + ε) * r : ℝ) : WithTop ℝ) < uSup x then some r else none"}, {"name": "anbKeySc", "file": "AnbHeap.lean", "doc": "The key of `x` in the list `Sc`: `u̲~(x)`, in the reverse order, if `ũ(x)` is the placeholder.", "code": "def anbKeySc (u : X → Option ℝ) (uSup : X → WithTop ℝ) : X → Option (WithTop ℝ)ᵒᵈ :=\n  fun x => match u x with\n    | none => some (OrderDual.toDual (uSup x))\n    | some _ => none"}, {"name": "anbHeapOp", "file": "AnbHeap.lean", "doc": "The operator `max {ū, Γ_∞}` of the Dijkstra step, without the cutoff (the threshold `nτ` is the stopping test of the loop).", "code": "noncomputable def anbHeapOp (Γ : (X → ℝ) → X → ℝ) (uSub : X → ℝ) :\n    (X → WithTop ℝ) → X → WithTop ℝ :=\n  fun u x => max (uSub x : WithTop ℝ) (Global.monotoneExtension Γ u x)"}, {"name": "AnbHeapStepData", "file": "AnbHeap.lean", "doc": "The quantities of one iteration of the ANB with sorted lists, in the order of the program.", "code": "structure AnbHeapStepData (X : Type*) where\n  /-- The state of Dijkstra's method after line anb_lazy:Dijkstra. -/\n  dij : DijkstraHeapState X\n  /-- The points selected in line anb_lazy:Dijkstra (line Dijkstra:accept of algo:Dijkstra). -/\n  selected : Finset X\n  /-- The points updated in line anb_lazy:olu_gets_hatu. -/\n  updated : Finset X\n  /-- `ũ` after line anb_lazy:olu_gets_hatu. -/\n  uTildeInit : X → Option ℝ\n  /-- The lists `M`, `S`, `Sc` before line anb_lazy:update_MS. -/\n  M : OrderedPartialMap X ℝ\n  S : OrderedPartialMap X ℝ\n  Sc : OrderedPartialMap X (WithTop ℝ)ᵒᵈ\n  t : ℝ\n  Δ : ℝ\n  band : Finset X\n  η : ℝ\n  vSub : X → ℝ\n  vSup : X → ℝ\n  ΦSub : (↥(band : Set X) → ℝ) → ↥(band : Set X) → ℝ\n  ΦSup : (↥(band : Set X) → ℝ) → ↥(band : Set X) → ℝ"}, {"name": "anbHeapStepData", "file": "AnbHeap.lean", "doc": "The quantities of the iteration started from the state `s`, with stencils `𝒱` (see the module docstring).", "code": "open Classical in\nnoncomputable def anbHeapStepData (p : AnbParams X) (𝒱 : X → Set X) (s : AnbHeapState X) :\n    AnbHeapStepData X :=\n  let T : ℝ := s.n * p.τ\n  let D := dijkstraHeapLoop (anbHeapOp p.Γ (s.uSub p.τ)) 𝒱 T s.dij\n  let sel := Finset.univ.filter fun x => D.count x ≠ s.dij.count x\n  let W := s.S.entriesIco ((s.n - 1) * p.τ) T\n  let P := s.bandPrev ∪ sel ∪ W.1\n  let uTildeInit : X → Option ℝ := fun x =>\n    if x ∈ P then\n      (if D.u x = ⊤ ∧ s.uSub p.τ x < T then none\n        else some (max (s.uSub p.τ x) (min T ((D.u x).untopD T))))\n    else s.uTilde x\n  let M₁ := s.M.set P (anbKeyM p.ε uTildeInit s.uSup)\n  let S₁ := W.2.set P (anbKeyS uTildeInit)\n  let Sc₁ := s.Sc.set P (anbKeySc uTildeInit s.uSup)\n  let bM := M₁.bot\n  let t : ℝ := match bM.1 with\n    | none => T\n    | some (t, _) => min T t\n  let B := S₁.entriesIco (T - 2 * (T - t)) T\n  let uHat : X → ℝ := fun x => (uTildeInit x).getD T\n  { dij := D, selected := sel, updated := P, uTildeInit := uTildeInit, M := bM.2, S := B.2\n    Sc := Sc₁, t := t, Δ := T - t, band := B.1\n    η := (1 - p.ρ) * Real.exp (-T / p.α)\n    vSub := fun x => kruzkov (1 / p.α) (uHat x)\n    vSup := fun x => kruzkov (1 / p.α) (s.uSup x)\n    ΦSub := bandOp (Global.kruzkovOp p.α p.Λ) B.1 fun x => kruzkov (1 / p.α) (uHat x)\n    ΦSup := bandOp (Global.kruzkovOp p.α p.Λ) B.1 fun x => kruzkov (1 / p.α) (s.uSup x) }"}, {"name": "anbHeapStepWith", "file": "AnbHeap.lean", "doc": "One iteration of the ANB with sorted lists, inner solver `S` and stencils `𝒱`: the inner loops on the band (as in `AnbLazy`), the update of `M`, `S`, `Sc`, the reset of `ǔ` on the band, and the update of the keys of `L`.", "code": "open Classical in\nnoncomputable def anbHeapStepWith (S : AnbInnerSolver X) (p : AnbParams X) (𝒱 : X → Set X)\n    (s : AnbHeapState X) : AnbHeapState X :=\n  let d := anbHeapStepData p 𝒱 s\n  let T : ℝ := s.n * p.τ\n  let B : Set X := d.band\n  let wSub : X → ℝ := bandExtend B d.vSub (S.subResult B d.ΦSub d.η fun x => d.vSub x)\n  let wSup : X → ℝ := bandExtend B d.vSup (S.supResult B d.ΦSup d.η fun x => d.vSup x)\n  let uTilde : X → Option ℝ := fun x =>\n    if x ∈ d.band then some (-p.α * Real.log (-wSub x)) else d.uTildeInit x\n  let uSup : X → WithTop ℝ := fun x => kruzkovInv p.α (wSup x)\n  let uCheck : X → WithTop ℝ := fun x => if x ∈ d.band then ⊤ else d.dij.u x\n  let uSubNext : X → ℝ := fun x => (uTilde x).getD T\n  let R := d.band ∪ d.band.biUnion (Global.Ext.revStencil 𝒱)\n  { n := s.n + 1\n    uTilde := uTilde\n    uSup := uSup\n    dij := { u := uCheck, count := d.dij.count\n             L := d.dij.L.set R (dijkstraKey (anbHeapOp p.Γ uSubNext) uCheck)\n             evalCount := d.dij.evalCount + R.card }\n    M := d.M.set d.band (anbKeyM p.ε uTilde uSup)\n    S := d.S.set d.band (anbKeyS uTilde)\n    Sc := d.Sc.set d.band (anbKeySc uTilde uSup)\n    bandPrev := d.band\n    countSub := fun x =>\n      s.countSub x + if x ∈ d.band then S.subCount B d.ΦSub d.η (fun y => d.vSub y) x else 0\n    countSup := fun x =>\n      s.countSup x + if x ∈ d.band then S.supCount B d.ΦSup d.η (fun y => d.vSup y) x else 0 }"}], "loop": [{"name": "anbHeapDone", "file": "AnbHeap.lean", "doc": "Stopping test: `M = ∅`, and the largest key `u̲~(x)` of `Sc` (if any) is `≤ (1 + ε)(n-1)τ`.", "code": "def anbHeapDone (p : AnbParams X) (s : AnbHeapState X) : Prop :=\n  (∀ x, s.M.v x = none) ∧ ∀ t x, OrderedPartialMap.botVal s.Sc.v = some (t, x) →\n    OrderDual.ofDual t ≤ (((1 + p.ε) * (((s.n : ℝ) - 1) * p.τ) : ℝ) : WithTop ℝ)"}, {"name": "anbHeapRunWith", "file": "AnbHeap.lean", "doc": "The state of the ANB with sorted lists after `k` iterations.", "code": "noncomputable def anbHeapRunWith (S : AnbInnerSolver X) (p : AnbParams X) (𝒱 : X → Set X)\n    (k : ℕ) : AnbHeapState X :=\n  (anbHeapStepWith S p 𝒱)^[k] (anbHeapInit p.Γ)"}, {"name": "anbHeapStopIndexWith", "file": "AnbHeap.lean", "doc": "The iteration at which the ANB with sorted lists terminates: the first `k` such that the stopping test holds at the start of iteration `k` (`⊤` if it never holds).", "code": "open Classical in\nnoncomputable def anbHeapStopIndexWith (S : AnbInnerSolver X) (p : AnbParams X)\n    (𝒱 : X → Set X) : ℕ∞ :=\n  if h : ∃ k, anbHeapDone p (anbHeapRunWith S p 𝒱 k) then (Nat.find h : ℕ∞) else ⊤"}]}, {"name": "With the placeholder ⋄, without the lists (intermediate version)", "state": [{"name": "AnbLazyState", "file": "AnbLazy.lean", "doc": "State of the ANB with a placeholder: the iteration index `n`, the map `ũ` (`uTilde`), whose value `none` (`⋄`) is a placeholder for `(n-1)τ`, the super-solution `u̲~` (`uSup`), the initial guess `ǔ^init` (`uCheckInit`) for Dijkstra's method, and the numbers of updates of `ū`, `u̲~` and `ǔ` at each point.", "code": "structure AnbLazyState (X : Type*) where\n  n : ℕ\n  uTilde : X → Option ℝ\n  uSup : X → WithTop ℝ\n  uCheckInit : X → WithTop ℝ\n  countSub : X → ℕ∞\n  countSup : X → ℕ∞\n  countHat : X → ℕ"}, {"name": "anbLazyInit", "file": "AnbLazy.lean", "doc": "Initial state: `ũ_0 = 0` (no placeholder), `u̲~_0 = ∞`, `ǔ_0^init = ∞`, no updates.", "code": "def anbLazyInit : AnbLazyState X := ⟨0, fun _ => some 0, fun _ => ⊤, fun _ => ⊤, 0, 0, 0⟩"}], "step": [{"name": "anbCheckOp", "file": "AnbLazy.lean", "doc": "The operator `u ↦ max {ū, Γ_∞ u}^{<T}` of the Dijkstra step.", "code": "noncomputable def anbCheckOp (Γ : (X → ℝ) → X → ℝ) (uSub : X → ℝ) (T : ℝ) :\n    (X → WithTop ℝ) → X → WithTop ℝ :=\n  fun u x => cutoffLt T (max (uSub x : WithTop ℝ) (Global.monotoneExtension Γ u x))"}, {"name": "anbLazyLevel", "file": "AnbLazy.lean", "doc": "`t_n := min {T, min {ũ^init(x) | (1 + ε) ũ^init(x) < u̲~(x)}}`, the placeholder `none` never satisfying the condition; it is `T` if the set is empty.", "code": "open Classical in\nnoncomputable def anbLazyLevel [Fintype X] (ε T : ℝ) (uTildeInit : X → Option ℝ)\n    (uSup : X → WithTop ℝ) : ℝ :=\n  let S := Finset.univ.filter fun x =>\n    uTildeInit x ≠ none ∧ (((1 + ε) * (uTildeInit x).getD T : ℝ) : WithTop ℝ) < uSup x\n  if h : S.Nonempty then min T (S.inf' h fun x => (uTildeInit x).getD T) else T"}, {"name": "AnbLazyStepData", "file": "AnbLazy.lean", "doc": "The quantities of one iteration of the ANB with a placeholder, computed from the state at its start: Dijkstra's run, `ǔ`, `ũ^init`, its value `û := (ũ^init)^{⋄→T}` (`uHat`), `t_n`, `Δ_n`, `B_n`, `η_n`, the inputs of the inner loops in Kruzkov coordinates, and the operators acting on the band.", "code": "structure AnbLazyStepData (X : Type*) where\n  checkRun : DijkstraState X\n  uCheck : X → WithTop ℝ\n  uTildeInit : X → Option ℝ\n  uHat : X → ℝ\n  t : ℝ\n  Δ : ℝ\n  band : Set X\n  η : ℝ\n  vSub : X → ℝ\n  vSup : X → ℝ\n  ΦSub : (band → ℝ) → band → ℝ\n  ΦSup : (band → ℝ) → band → ℝ"}, {"name": "anbLazyStepData", "file": "AnbLazy.lean", "doc": "The quantities of the iteration started from the state `s` (see the module docstring).", "code": "open Classical in\nnoncomputable def anbLazyStepData [Fintype X] [LinearOrder X] (p : AnbParams X)\n    (s : AnbLazyState X) : AnbLazyStepData X :=\n  let T : ℝ := s.n * p.τ\n  let D := dijkstraRun (anbCheckOp p.Γ (s.uSub p.τ) T) s.uCheckInit (Nat.card X)\n  let uTildeInit : X → Option ℝ := fun x =>\n    if D.u x = ⊤ ∧ s.uSub p.τ x < T then none\n    else some (max (s.uSub p.τ x) (min ((D.u x).untopD T) T))\n  let uHat : X → ℝ := fun x => (uTildeInit x).getD T\n  let t := anbLazyLevel p.ε T uTildeInit s.uSup\n  let B : Set X := {x | ∃ r, uTildeInit x = some r ∧ T - 2 * (T - t) ≤ r ∧ r < T}\n  { checkRun := D, uCheck := D.u, uTildeInit := uTildeInit, uHat := uHat, t := t, Δ := T - t,\n    band := B\n    η := (1 - p.ρ) * Real.exp (-T / p.α)\n    vSub := fun x => kruzkov (1 / p.α) (uHat x)\n    vSup := fun x => kruzkov (1 / p.α) (s.uSup x)\n    ΦSub := bandOp (Global.kruzkovOp p.α p.Λ) B fun x => kruzkov (1 / p.α) (uHat x)\n    ΦSup := bandOp (Global.kruzkovOp p.α p.Λ) B fun x => kruzkov (1 / p.α) (s.uSup x) }"}, {"name": "anbLazyStepWith", "file": "AnbLazy.lean", "doc": "One iteration of the ANB with a placeholder, with the inner solver `S`: on the band, the results of the inner loops (extended by the frozen values outside the band), converted back from Kruzkov coordinates; outside the band, `ũ := ũ^init` (placeholders included); the next guess `ǔ^{<t⁻_n}`; the counters.", "code": "open Classical in\nnoncomputable def anbLazyStepWith [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    (p : AnbParams X) (s : AnbLazyState X) : AnbLazyState X :=\n  let d := anbLazyStepData p s\n  let T : ℝ := s.n * p.τ\n  let wSub : X → ℝ :=\n    bandExtend d.band d.vSub (S.subResult d.band d.ΦSub d.η fun x => d.vSub x)\n  let wSup : X → ℝ := bandExtend d.band d.vSup (S.supResult d.band d.ΦSup d.η fun x => d.vSup x)\n  { n := s.n + 1\n    uTilde := fun x => if x ∈ d.band then some (-p.α * Real.log (-wSub x))\n      else d.uTildeInit x\n    uSup := fun x => kruzkovInv p.α (wSup x)\n    uCheckInit := fun x => cutoffLt (T - 2 * d.Δ) (d.uCheck x)\n    countSub := fun x =>\n      s.countSub x + if x ∈ d.band then S.subCount d.band d.ΦSub d.η (fun y => d.vSub y) x else 0\n    countSup := fun x =>\n      s.countSup x + if x ∈ d.band then S.supCount d.band d.ΦSup d.η (fun y => d.vSup y) x else 0\n    countHat := fun x => s.countHat x + d.checkRun.count x }"}], "loop": [{"name": "anbLazyDone", "file": "AnbLazy.lean", "doc": "Stopping test `(1 + ε) ũ^{⋄→(n-1)τ} ≥ u̲~`.", "code": "def anbLazyDone (p : AnbParams X) (s : AnbLazyState X) : Prop :=\n  ∀ x, s.uSup x ≤ (((1 + p.ε) * s.uSub p.τ x : ℝ) : WithTop ℝ)"}, {"name": "anbLazyRunWith", "file": "AnbLazy.lean", "doc": "The state of the ANB with a placeholder and inner solver `S`, after `k` iterations.", "code": "noncomputable def anbLazyRunWith [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    (p : AnbParams X) (k : ℕ) : AnbLazyState X :=\n  (anbLazyStepWith S p)^[k] anbLazyInit"}, {"name": "anbLazyStopIndexWith", "file": "AnbLazy.lean", "doc": "The iteration at which the ANB with a placeholder terminates: the first `k` such that the stopping test holds at the start of iteration `k` (`⊤` if it never holds).", "code": "open Classical in\nnoncomputable def anbLazyStopIndexWith [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    (p : AnbParams X) : ℕ∞ :=\n  if h : ∃ k, anbLazyDone p (anbLazyRunWith S p k) then (Nat.find h : ℕ∞) else ⊤"}]}]}}, "structs": {"OrderedPartialMap": {"title": "Ordered partial map: a sorted list of pairs (v x, x) with an operation counter", "link_decls": false, "statements": true, "sections": [{"title": "Structure", "open": true, "decls": [{"name": "OrderedPartialMap", "file": "OrderedPartialMap.lean", "doc": "An ordered partial map: the partial map `v` (`none` is absent) and an operation counter.", "code": "structure OrderedPartialMap (X V : Type*) where\n  v : X → Option V\n  count : ℕ"}]}, {"title": "Operations, with their costs", "open": true, "decls": [{"name": "empty", "file": "OrderedPartialMap.lean", "doc": "Whether there is no entry; cost `1`.", "code": "def empty (m : OrderedPartialMap X V) : Bool × OrderedPartialMap X V :=\n  (decide (∀ x, m.v x = none), ⟨m.v, m.count + 1⟩)"}, {"name": "bot", "file": "OrderedPartialMap.lean", "doc": "The smallest entry (`none` if there is none); cost `1`.", "code": "def bot (m : OrderedPartialMap X V) : Option (V × X) × OrderedPartialMap X V :=\n  (botVal m.v, ⟨m.v, m.count + 1⟩)"}, {"name": "set1", "file": "OrderedPartialMap.lean", "doc": "`v x := t` (`t = none` erases `x`); cost `1`.", "code": "def set1 (m : OrderedPartialMap X V) (x : X) (t : Option V) : OrderedPartialMap X V :=\n  ⟨Function.update m.v x t, m.count + 1⟩"}, {"name": "set", "file": "OrderedPartialMap.lean", "doc": "`v x := v' x` for `x ∈ Y`; cost `#Y`.", "code": "def set (m : OrderedPartialMap X V) (Y : Finset X) (v' : X → Option V) :\n    OrderedPartialMap X V :=\n  ⟨fun x => if x ∈ Y then v' x else m.v x, m.count + Y.card⟩"}, {"name": "erase1", "file": "OrderedPartialMap.lean", "doc": "Erase the entry of `x`; cost `1`.", "code": "def erase1 (m : OrderedPartialMap X V) (x : X) : OrderedPartialMap X V := m.set1 x none"}, {"name": "erase", "file": "OrderedPartialMap.lean", "doc": "Erase the entries of the points of `Y`; cost `#Y`.", "code": "def erase (m : OrderedPartialMap X V) (Y : Finset X) : OrderedPartialMap X V :=\n  m.set Y fun _ => none"}, {"name": "pop", "file": "OrderedPartialMap.lean", "doc": "The smallest entry (`none` if there is none), which is erased; cost `2` (`1` if there is no entry).", "code": "def pop (m : OrderedPartialMap X V) : Option (V × X) × OrderedPartialMap X V :=\n  match botVal m.v with\n  | none => (none, ⟨m.v, m.count + 1⟩)\n  | some (t, x) => (some (t, x), ⟨Function.update m.v x none, m.count + 2⟩)"}, {"name": "entriesIco", "file": "OrderedPartialMap.lean", "doc": "The points `x` whose value satisfies `Tm ≤ v x < Tp` (closed-open interval); cost `1 + #W`, where `W` is the output.", "code": "open Classical in\nnoncomputable def entriesIco (m : OrderedPartialMap X V) (Tm Tp : V) :\n    Finset X

\end{aligned}\\]\n\\[\\begin{aligned}\n\n\tu_{n+1} &amp;\\leq u_n, &amp;\n\t\\min\\{t_n, u_{n+1}\\} &amp;= \\min \\{t_n, u_n\\}, &amp;\n\tt_{n+1} &amp;\\geq t_n.\n\\end{aligned}\\]\nThe points $(x_n)_{n \\geq 0}$ are pairwise distinct, thus <a class=\"pref\" href=\"#label=algo:Dijkstra\">Algorithm 2<\/a> terminates, at some iteration $N$.<br><br>The map $u_* := u_N$ is a fixed point of $\\Gamma^{&lt;T}$, and $\\{x_0,\\cdots,x_{N-1}\\} = \\{x\\in X \\mid u_*(x) &lt; u_0(x)\\}$."}, "eq:Dijkstra_prop": {"kind": "equation", "num": "25", "page": 18, "plain": "25", "ref": "(25)", "env": "prop:Dijkstra_correct", "title": "Correctness of generalized Dijkstra", "html": ""}, "eq:Dijkstra_prop2": {"kind": "equation", "num": "26", "page": 18, "plain": "26", "ref": "(26)", "env": "prop:Dijkstra_correct", "title": "Correctness of generalized Dijkstra", "html": ""}, "prop:comp_of_causal": {"kind": "proposition", "num": "2.10", "page": 19, "plain": "2.10", "ref": "Proposition 2.10", "env": "prop:comp_of_causal", "title": "Comparison principle, via causality", "html": "Let $\\Gamma : \\bR^X \\to \\bR^X$ be monotone and causal. Then for any partition $X = \\Int Y \\sqcup \\partial Y$ and any $u, v \\in \\bR_\\infty^X$\n\\[\n\t(u \\leq \\Gamma u \\text{ and } \\Gamma v \\leq v \\text{ on } \\Int Y, \\text{ and } u \\leq v \\text{ on } \\partial Y)\\ \\Rightarrow \\ u \\leq v,\n\\]\nabusively denoting by $\\Gamma$ the monotone extension $\\Gamma_\\infty$ for readability, since they coincide on finite maps by <a class=\"pref\" href=\"#label=prop:monotonic_Phi\">Proposition 2.1<\/a>.\nGiven a super-solution $\\ul u \\in \\bR_\\infty^X$ as initial guess (for instance $\\ul u = \\infty$), Dijkstra&#x27;s algorithm thus computes the <em>unique<\/em> fixed point $u_*$ of $\\Gamma$, using exactly $\\#\\{u_* &lt; \\ul u\\} \\leq \\# X$ iterations. In addition, $u_* \\leq \\ul u$, hence $u_*$ takes finite values if $\\ul u$ does."}, "lem:causal_mix": {"kind": "lemma", "num": "2.11", "page": 19, "plain": "2.11", "ref": "Lemma 2.11", "env": "lem:causal_mix", "title": "", "html": "If two operators $\\Gamma, \\Lambda : \\bR^X \\to \\bR^X$ are monotone (resp. causal, resp. $\\rho$-sub-additive, resp. $\\nu$-sub-multiplicative), then so are $\\max \\{\\Gamma, \\Lambda\\}$ and $\\min\\{\\Gamma, \\Lambda\\}$."}, "prop:causal_formulation": {"kind": "proposition", "num": "2.12", "page": 19, "plain": "2.12", "ref": "Proposition 2.12", "env": "prop:causal_formulation", "title": "Reformulation of causality", "html": "For any  $u,v \\in \\bR^X$ and any $t \\in \\bR$, one has\n\\[\\begin{aligned}\n\t\\min\\{u,t\\} &amp;= \\min\\{v,t\\} \\Leftrightarrow u^{&lt;t} = v^{&lt;t}, &amp;\n\t(\\exists \\delta&gt;0,\\, \\min\\{u,t+\\delta\\} = \\min\\{v,t+\\delta\\}) \\Leftrightarrow u^{\\leq t} = v^{\\leq t}\n\\end{aligned}\\]\nTherefore, the causality property <a class=\"pref\" href=\"#label=eqdef:causality\">(11)<\/a> is equivalent to: \n$\\forall u,v \\in \\bR^X$, $\\forall t\\in \\bR$,\n\\[\n\n\tu^{&lt;t} = v^{&lt;t} \\Rightarrow (\\Gamma u)^{\\leq t} = (\\Gamma v)^{\\leq t}.\n\\]\nIf $\\Gamma$ is monotone (resp. causal), then so is $\\Gamma^{&lt;T} : u \\mapsto (\\Gamma u)^{&lt;T}$, for any $T \\in \\bR$."}, "eq:causal_old": {"kind": "equation", "num": "27", "page": 20, "plain": "27", "ref": "(27)", "env": "prop:causal_formulation", "title": "Reformulation of causality", "html": ""}, "corol:G_min_u_t": {"kind": "corollary", "num": "2.13", "page": 20, "plain": "2.13", "ref": "Corollary 2.13", "env": "corol:G_min_u_t", "title": "", "html": "Let $\\Gamma : \\bR^X \\to \\bR^X$ be causal. Then for all $u\\in \\bR^X$ and all $x \\in X$,\n\t\\[\\begin{aligned}\n\t\t\\Gamma u(x) &amp;= \\Gamma \\min \\{u,t\\}(x), &amp;\n\t\t\\text{for all } t &amp;\\geq \\Gamma u(x).\n\t\\end{aligned}\\]"}, "prop:Cpast_formulation": {"kind": "proposition", "num": "2.14", "page": 20, "plain": "2.14", "ref": "Proposition 2.14", "env": "prop:Cpast_formulation", "title": "", "html": "Let $\\Lambda : \\bR^X \\to \\bR^X$ be monotone and additively invariant.\nThe $C_\\past$-memory property is equivalent to: for all $u \\in \\bR^X$ and all $x \\in X$\n\\[\\begin{aligned}\n\n\t\\Lambda u(x) &amp;= \\Lambda \\max \\{u, t\\}(x), &amp;\n\t\\text{for all } t &amp;\\leq \\Lambda u(x) - C_\\past.\n\\end{aligned}\\]"}, "eq:Lambda_max_u_t": {"kind": "equation", "num": "28", "page": 20, "plain": "28", "ref": "(28)", "env": "prop:Cpast_formulation", "title": "", "html": ""}, "eq:Lambda_eps_Y_geq": {"kind": "equation", "num": "29", "page": 20, "plain": "29", "ref": "(29)", "env": "", "title": "", "html": "\\[\n\n\t\\Lambda [u+\\ve\\bbone_Y] (x)= \\Lambda \\max \\{u+\\ve \\bbone_Y,t+\\ve\\}(x) \\geq \\Lambda [u+\\ve](x) = \\Lambda u(x) + \\ve,\n\\]"}, "corol:mon_min_max": {"kind": "corollary", "num": "2.15", "page": 21, "plain": "2.15", "ref": "Corollary 2.15", "env": "corol:mon_min_max", "title": "", "html": "Let $\\Lambda: \\bR^X \\to \\bR^X$ be monotone, causal, additively invariant, with $C_\\past$-memory.\nLet $u \\in \\bR^X$, $x \\in X$, $t_0 \\leq \\Lambda u(x)-C_\\past$ and $t_1 \\geq \\Lambda u(x)$.\nLet $v\\in \\bR^X$ be such that $v \\geq u$ on $\\{t_0 \\leq u &lt; t_1\\}$, and $v \\geq t_1$ on $\\{u\\geq t_1\\}$. Then $\\Lambda u(x) \\leq \\Lambda v(x)$."}, "lem:graph_subsol": {"kind": "lemma", "num": "2.16", "page": 21, "plain": "2.16", "ref": "Lemma 2.16", "env": "lem:graph_subsol", "title": "", "html": "Consider operators $\\Lambda, \\Gamma: \\bR^X \\to \\bR^X$. Assume that $\\Lambda$ is monotone, and that $\\Gamma \\leq \\Lambda$.\nIf $\\ol u,\\hat u \\in \\bR^X$ satisfy $\\ol u \\leq \\Lambda \\ol u$ and $\\hat u = \\max \\{\\ol u, \\Gamma\\hat u\\}$, then $\\hat u \\leq \\Lambda \\hat u$."}, "rem:anb_npos": {"kind": "remark", "num": "2.17", "page": 21, "plain": "2.17", "ref": "Remark 2.17", "env": "rem:anb_npos", "title": "", "html": "The iteration numbers in <a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a> are positive: $n = 1,2,...$ However, it would make no difference to start at $n=0$, since the $0$-th iteration would be vacuous: one would have $\\ol u_0 = \\hat u_0 = 0$, $\\ul u_0 = \\infty$, hence $t_0 = \\Delta_0 = 0$, and therefore an empty  narrow band $B_0 = \\emptyset$. (The Lean implementation of <a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a> contains this additional $0$-th iteration.)"}, "prop:always_subsol": {"kind": "proposition", "num": "2.18", "page": 21, "plain": "2.18", "ref": "Proposition 2.18", "env": "prop:always_subsol", "title": "", "html": "Let $\\Lambda, \\Gamma : \\bR^X \\to \\bR^X$. Assume that $\\Lambda$ is monotone, $\\Lambda[0] \\geq 0$, and $\\Gamma \\leq \\Lambda$.\nDenote by $\\ol u_n, \\ul u_n, \\hat u_n$ the state of the variables $\\ol u, \\ul u, \\hat u$ in line <a class=\"pref\" href=\"#label=anb:hatu\">5<\/a> of the $n$-th iteration of <a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a>. Then\n\\[\\begin{aligned}\n\n\t\\ol u_n &amp;\\leq \\Lambda \\ol u_n, &amp;\n\t\\Lambda \\ul u_n &amp;\\leq \\ul u_n, &amp;\n\t\\hat u_n &amp;\\leq \\Lambda \\hat u_n, &amp;\n\t\\ol u_n &amp;\\leq \\hat u_n \\leq \\ol u_{n+1}, &amp;\n\t\\ul u_{n+1} &amp;\\leq \\ul u_n.\n\\end{aligned}\\]"}, "eq:always_subsol": {"kind": "equation", "num": "30", "page": 21, "plain": "30", "ref": "(30)", "env": "prop:always_subsol", "title": "", "html": ""}, "lem:max_min_mon_causal": {"kind": "lemma", "num": "2.19", "page": 22, "plain": "2.19", "ref": "Lemma 2.19", "env": "lem:max_min_mon_causal", "title": "", "html": "If $\\Gamma : \\bR^X \\to \\bR^X$ is monotone and causal, and $\\ol u \\in \\bR^X$, $T \\in \\bR$, then $\\Gamma&#x27; := \\max \\{\\ol u, \\min \\{T, \\Gamma\\}\\}$ is monotone and causal."}, "prop:Dijkstra_band": {"kind": "proposition", "num": "2.20", "page": 22, "plain": "2.20", "ref": "Proposition 2.20", "env": "prop:Dijkstra_band", "title": "", "html": "Assume that $\\Gamma:\\bR^X \\to \\bR^X$ is monotone and causal, and use the notations $\\ol u_n, \\hat u_n$ and the assumptions of <a class=\"pref\" href=\"#label=prop:always_subsol\">Proposition 2.18<\/a>.\nGiven $n\\geq 1$, define the mapping $\\hat u^\\init_n \\in \\bR^X$ by\n\\[\\begin{aligned}\n\n\t\\hat u_n^\\init(x) &amp;:= \\begin{cases}\n\t\t\\hat u_{n-1}(x) &amp; \\text{if } \\hat u_{n-1}(x) &lt; t_{n-1}^-, \\\\ \n\t\t\\max\\{ \\ol u_{n} (x), n\\tau\\} &amp; \\text{otherwise},\n\t\\end{cases} &amp;\n\t\\text{where } t_n^- &amp;:= t_n - \\Delta_n = n\\tau-2 \\Delta_n,\n\\end{aligned}\\]\nand by convention $\\hat u_0 := 0$ and $t_0^- := 0$.\nThen $\\Gamma&#x27; \\hat u_n^\\init \\leq \\hat u_n^\\init$, where $\\Gamma&#x27; := \\max \\{\\ol u_n, \\min \\{n\\tau,\\Gamma\\}\\}$.\nApplying Dijkstra&#x27;s <a class=\"pref\" href=\"#label=algo:Dijkstra\">Algorithm 2<\/a> to $\\Gamma&#x27;$ and to the initial guess $\\hat u_n^\\init$, we obtain $\\hat u_n$.\nAll the points updated in the course of <a class=\"pref\" href=\"#label=algo:Dijkstra\">Algorithm 2<\/a> belong to\n\\[\n\n\tB&#x27;_n := \\{x \\in X \\mid t^-_{n-1} \\leq \\hat u_{n-1}(x) \\text{ and } \\hat u_n(x) &lt; n\\tau\\}.\n\\]"}, "eqdef:Dijkstra_supsol": {"kind": "equation", "num": "31", "page": 22, "plain": "31", "ref": "(31)", "env": "prop:Dijkstra_band", "title": "", "html": ""}, "eqdef:Bpn": {"kind": "equation", "num": "32", "page": 22, "plain": "32", "ref": "(32)", "env": "prop:Dijkstra_band", "title": "", "html": ""}, "eq:u_nm1_eq_max": {"kind": "equation", "num": "33", "page": 22, "plain": "33", "ref": "(33)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\\hat u_{n-1} &amp;= \\max \\{\\ol u_{n-1}, \\min \\{(n-1) \\tau, \\Gamma \\hat u_{n-1}\\}\\}, \\\\\n\n\\min \\{t_{n-1}^-, \\hat u_{n-1}\\} &amp;= \\min \\{t_{n-1}^-, \\ol u_n\\} = \\min \\{t_{n-1}^-, u\\}, \\\\\n\n\\min \\{t_{n-1}^-, \\Gamma \\hat u_{n-1}\\} &amp;= \\min\\{t_{n-1}^-, \\Gamma u\\}\n\\end{aligned}\\]"}, "eq:min_tnm1_hat_sub_u": {"kind": "equation", "num": "34", "page": 22, "plain": "34", "ref": "(34)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\\hat u_{n-1} &amp;= \\max \\{\\ol u_{n-1}, \\min \\{(n-1) \\tau, \\Gamma \\hat u_{n-1}\\}\\}, \\\\\n\n\\min \\{t_{n-1}^-, \\hat u_{n-1}\\} &amp;= \\min \\{t_{n-1}^-, \\ol u_n\\} = \\min \\{t_{n-1}^-, u\\}, \\\\\n\n\\min \\{t_{n-1}^-, \\Gamma \\hat u_{n-1}\\} &amp;= \\min\\{t_{n-1}^-, \\Gamma u\\}\n\\end{aligned}\\]"}, "eq:min_t_nm1_Gamma": {"kind": "equation", "num": "35", "page": 22, "plain": "35", "ref": "(35)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\\hat u_{n-1} &amp;= \\max \\{\\ol u_{n-1}, \\min \\{(n-1) \\tau, \\Gamma \\hat u_{n-1}\\}\\}, \\\\\n\n\\min \\{t_{n-1}^-, \\hat u_{n-1}\\} &amp;= \\min \\{t_{n-1}^-, \\ol u_n\\} = \\min \\{t_{n-1}^-, u\\}, \\\\\n\n\\min \\{t_{n-1}^-, \\Gamma \\hat u_{n-1}\\} &amp;= \\min\\{t_{n-1}^-, \\Gamma u\\}\n\\end{aligned}\\]"}, "lem:max_min": {"kind": "lemma", "num": "2.21", "page": 23, "plain": "2.21", "ref": "Lemma 2.21", "env": "lem:max_min", "title": "", "html": "Let $\\Gamma : \\bR^X \\to \\bR^X$ be monotone and causal, and $\\ol u \\in \\bR^X$, $T \\in \\bR$.\nIf $u \\in \\bR^X$ satisfies $u = \\max \\{\\ol u, \\Gamma u\\}$, then $\\hat u := \\max \\{\\ol u, \\min \\{T, u\\}\\}$ is the unique fixed point of $\\Gamma&#x27; := \\max \\{\\ol u, \\min \\{T, \\Gamma\\}\\}$.<br><br>In addition, $\\min \\{u,T\\} = \\min \\{\\hat u, T\\}$, hence $\\{u &lt; t\\} = \\{\\hat u &lt; t\\}$, $\\forall t\\leq T$."}, "eq:min_T_Gammap_hatu_eq_min_T_u": {"kind": "equation", "num": "36", "page": 23, "plain": "36", "ref": "(36)", "env": "", "title": "", "html": "\\[\n\t\n\t\\min\\{T, \\Gamma&#x27; \\hat u\\} = \\min \\{T, \\max \\{\\ol u, \\Gamma \\hat u\\}\\} = \\min \\{T, \\max \\{\\ol u,  \\Gamma u\\}\\} = \\min \\{T,u\\}\n\\]"}, "prop:olu_ge_ustar": {"kind": "proposition", "num": "2.22", "page": 23, "plain": "2.22", "ref": "Proposition 2.22", "env": "prop:olu_ge_ustar", "title": "", "html": "Let $\\Lambda : \\bR^X \\to \\bR^X$ be monotone and additively invariant, and let $\\Gamma : \\bR^X \\to \\bR^X$ obey the $(C_\\Gamma, C&#x27;_\\Gamma)$-comparison property for some $C_\\Gamma \\geq 1$, $C&#x27;_\\Gamma \\geq 0$.\nAssume furthermore that $\\Lambda$ has $C_\\past$-memory, with $C_\\past \\geq 0$, satisfies the comparison principle <a class=\"pref\" href=\"#label=eq:comparison_Lambda\">(22)<\/a>,\nand that $u_* \\in \\bR^X$ satisfies $u_* \\leq \\Lambda u_*$.\nLet $u\\in \\bR^X$, $t\\geq 0$ and $\\ve&gt;0$ obey\n<ul><li> $(1+\\ve) u \\geq u_*$ on $\\partial Y := \\{u &lt; t\\}$.<\/li><li> $\\Gamma u \\leq u \\leq \\Lambda u$.<\/li><\/ul>\nThen $u \\geq t + (u_*-(1+\\ve) t-C_\\past -C&#x27;_\\Gamma)/C_\\Gamma$ on $\\Int Y := X \\sm \\partial Y = \\{u \\geq t\\}$."}, "eqdef:vw_Cpast": {"kind": "equation", "num": "37", "page": 23, "plain": "37", "ref": "(37)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\t\n\t\tv &amp;:= C_\\past + C&#x27;_\\Gamma + (1+\\ve)t+ C_\\Gamma (u-t) = T + C_\\Gamma u, &amp;\n\t\tw &amp;:= \\max \\{v,(1+\\ve) t\\},\n\t\\end{aligned}\\]"}, "eq:get_Cpast": {"kind": "equation", "num": "38", "page": 24, "plain": "38", "ref": "(38)", "env": "", "title": "", "html": "\\[\n\t\n\t\\Lambda v\n\t= T + \\Lambda [C_\\Gamma u]\n\t\\geq T + C_\\Gamma \\Lambda u - C&#x27;_\\Gamma\n\t\\geq T + C_\\Gamma u- C&#x27;_\\Gamma = v - C&#x27;_\\Gamma \\geq (1+\\ve) t+C_\\past,\n\t\\]"}, "eq:supsol_Cpast": {"kind": "equation", "num": "39", "page": 24, "plain": "39", "ref": "(39)", "env": "", "title": "", "html": "\\[\n\t\n\t\t\\Lambda \\max \\{v,(1+\\ve) t\\} =\n\t\t\\Lambda v\n\t\t = \\Lambda [T + C_\\Gamma u]\n\t\t = T + \\Lambda [C_\\Gamma u]\n\t\t \\leq T+ C_\\Gamma \\Gamma u\n\t\t \\leq T + C_\\Gamma u = v\n\t\t = w, \n\t\\]"}, "corol:Bn_comp": {"kind": "corollary", "num": "2.23", "page": 24, "plain": "2.23", "ref": "Corollary 2.23", "env": "corol:Bn_comp", "title": "", "html": "Let <a class=\"pref\" href=\"#label=assum:all\">Assumption 1.10<\/a> hold, and further assume that $\\Lambda$ admits a fixed point $u_* \\in \\bR^X$, and satisfies the comparison principle, and let $\\ve,\\tau&gt;0$. Then\n\t\\[\\begin{aligned}\n\t\tB_n &amp;\\subset \\{t_n^- \\leq u_* &lt; t_n^+\\},&amp; \n\t\tB&#x27;_n &amp;\\subset \\{t_{n-1}^- \\leq u_* &lt; t_n^+\\}, &amp;\n\t\t\\text{with } t_n^+ := (1+\\ve) t_n + C_\\past + C&#x27;_\\Gamma + C_\\Gamma \\Delta_n,\n\t\\end{aligned}\\]\n\tin the $n$-th iteration of <a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a>. The time $t_n^-$ and band $B&#x27;_n$ are from <a class=\"pref\" href=\"#label=prop:Dijkstra_band\">Proposition 2.20<\/a>."}, "eq:tol_as_Kruzkov": {"kind": "equation", "num": "40", "page": 25, "plain": "40", "ref": "(40)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\t(1+\\ve) \\ol u &amp;\\geq \\ul u \\ \\Leftrightarrow \\ \\ol v \\exp(-\\ve \\ol u/\\alpha) \\geq \\ul v, &amp;\n\t\\text{where } \\ol v &amp;:= \\rE_\\alpha \\ol u,\\ \\ul v := \\rE_\\alpha \\ul u,\n\\end{aligned}\\]"}, "prop:t_advances": {"kind": "proposition", "num": "2.24", "page": 25, "plain": "2.24", "ref": "Proposition 2.24", "env": "prop:t_advances", "title": "", "html": "Let $\\Lambda : \\bR^X\\to \\bR^X$ be a monotone and additively invariant operator,   and assume that $\\Phi := \\rE_\\alpha \\Lambda_\\infty \\rE_\\alpha^{-1}$ is $\\rho$-sub-additive with $0 \\leq \\rho &lt; 1$.\nLet $\\ol u \\in \\bR^X$, $\\ol v := \\rE_\\alpha \\ol u$, and $\\ul v \\in ]-\\infty,0]^X$. Let $0 \\leq T^- &lt; T^+$, $\\xi \\geq 0$, $\\ve&gt;0$.\nAssume that\n<ol><li> $-(1-\\rho) \\xi \\leq \\ol v-\\Phi \\ol v\\leq 0$ and $0 \\leq \\ul v-\\Phi \\ul v \\leq (1-\\rho)\\xi$ on $\\Int Y := \\{T^- \\leq \\ol u &lt; T^+\\}$.<\/li><li> $\\ol v \\geq -\\xi$ on $\\partial Y_1 := \\{T^+ \\leq \\ol u\\}$.<\/li><li> $\\ol v \\exp(-\\ve \\ol u/\\alpha) \\geq \\ul v$ on $\\partial Y_2 := \\{ \\ol u &lt; T^-\\}$.<\/li><\/ol>\nDenote $t := (T^++T^-) / 2$ and $\\Delta := (T^+-T^-) / 2$, and assume furthermore that for some $C \\geq 1$\n\\[\\begin{aligned}\n\n\t\\xi &amp;\\leq C \\exp(-T^+/\\alpha), &amp;\n\t\\ve T^+ &amp;\\leq \\alpha, &amp;\n\t\\Delta \\geq 2 \\alpha \\max \\{1, \\ln (2 e C/\\ve)\\}.\n\\end{aligned}\\]\nThen $\\ol v \\exp(-\\ve \\ol u/\\alpha) \\geq \\ul v$ on\n$\\{t-\\Delta/2 \\leq \\ol u \\leq t+\\Delta/2\\}$."}, "eq:constr_tadvances": {"kind": "equation", "num": "41", "page": 25, "plain": "41", "ref": "(41)", "env": "prop:t_advances", "title": "", "html": ""}, "ineq:t_advances": {"kind": "equation", "num": "42", "page": 25, "plain": "42", "ref": "(42)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\t\t\\frac{2\\xi} {-\\ol v} \n\t\t\\leq 2C\\exp(\\frac{\\ol u-T^+} \\alpha)\n\t\t\\leq 2 C \\exp( -\\frac{\\Delta}{2 \\alpha})\n\t\t\\leq  \\frac \\ve e\n\t\t\\leq  \\frac {\\ve\\Delta}{2 \\alpha e}\n\t\t\\leq \\exp(&amp;-\\frac{\\ve T^-} \\alpha) - \\exp(-\\frac{\\ve (T^- +  \\Delta/ 2)}\\alpha) \\\\\n\t\t&amp;\\leq \\exp(-\\frac{\\ve T^-} \\alpha) - \\exp(-\\frac {\\ve \\ol u} \\alpha).\n\t\t\n\t\\end{aligned}\\]"}, "lem:first_iter": {"kind": "lemma", "num": "2.25", "page": 26, "plain": "2.25", "ref": "Lemma 2.25", "env": "lem:first_iter", "title": "First iterations", "html": "Under <a class=\"pref\" href=\"#label=assum:all\">Assumption 1.10<\/a>:\n\tin any iteration $1 \\leq n \\leq \\min(u_\\bd)/\\tau$ of <a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a>, one has \n\t$\\ol u_n = (n-1) \\tau$, $\\ul u_n = \\infty$, $\\hat u_n = n\\tau$, $t_n = n\\tau$, $\\Delta_n = 0$, \n\t$B_n = \\emptyset$."}, "corol:max_width": {"kind": "corollary", "num": "2.26", "page": 26, "plain": "2.26", "ref": "Corollary 2.26", "env": "corol:max_width", "title": "Maximum narrow band width", "html": "Let <a class=\"pref\" href=\"#label=assum:all\">Assumption 1.10<\/a> hold, and further assume that $\\Phi_\\alpha := \\rE_\\alpha \\Lambda_\\infty \\rE_\\alpha^{-1}$ is $\\rho$-sub-additive with $\\alpha&gt;0$ and $0 \\leq \\rho &lt; 1$, and that\n\\[\\begin{aligned}\n\t0 &amp;&lt; \\ve \\leq \\ve_{\\max}, &amp; 2\\Delta_{\\max} \\leq \\min(u_\\bd).\n\\end{aligned}\\]<br><br>The number of iterations of <a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a> is bounded by $n_{\\max}$, and in each iteration one has $\\Delta_n &lt; \\Delta_{\\max}$.\nWe denoted:\n\\[\\begin{aligned}\n\t\\Delta_{\\max} &amp;:= 2 \\alpha  \\ln (2 e/\\ve) + 2\\tau, &amp;\n\tn_{\\max} &amp;:= \\Big\\lceil \\frac{\\|u_*\\|_\\infty + \\Delta_{\\max}} \\tau \\Big\\rceil, &amp;\n\t\\ve_{\\max} &amp;:= \\min \\big\\{\\frac \\alpha{\\|u_*\\|_\\infty+\\Delta_{\\max}}, 2\\big\\}.\n\\end{aligned}\\]"}, "eq:Enp1_subset_En": {"kind": "equation", "num": "43", "page": 26, "plain": "43", "ref": "(43)", "env": "", "title": "", "html": "\\[\n\t\n\tE_{n+1} := \\{(1+\\ve) \\hat u_{n+1} &lt; \\ul u_{n+1}\\} \\subset \\{(1+\\ve) \\ol u_{n+1} &lt; \\ul u_{n+1}\\} \\subset E_n := \\{(1+\\ve) \\hat u_n &lt; \\ul u_n\\} \\subset \\{\\hat u_n \\geq t_n\\},\n\t\\]"}, "eq:olv_exp_olu_iff": {"kind": "equation", "num": "44", "page": 27, "plain": "44", "ref": "(44)", "env": "", "title": "", "html": "\\[\n\t\n\t\t\\ol v \\exp(-\\ve \\ol u/\\alpha) \\geq \\ul v \\ \\Leftrightarrow \\ (1+\\ve) \\ol u_{n+1} \\geq \\ul u_{n+1},\n\t\\]"}, "eq:n_le_nmax": {"kind": "equation", "num": "45", "page": 27, "plain": "45", "ref": "(45)", "env": "", "title": "", "html": "\\[\n\t\n\t\tT^+ = n\\tau = t_n + \\Delta_n &lt; \\|\\hat u_n\\|_\\infty + \\Delta_{\\max} \\leq \\|u_*\\|_\\infty + \\Delta_{\\max},\n\t\\]"}, "eq:tnp1_ge_tnpD2": {"kind": "equation", "num": "46", "page": 27, "plain": "46", "ref": "(46)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\t\t\n\t\t(1 &amp;+ \\ve)  \\hat u_{n+1}(x) &lt; \\ul u_{n+1}(x)\n\t\t\\ \\Rightarrow \\\n\t\t(1+\\ve) \\ol u_{n+1}(x) &lt; \\ul u_{n+1}(x)\n\t\t\\ \\Leftrightarrow \\\n\t\t\\ol v (x) \\exp(-\\ve \\ol u(x)/\\alpha) &lt; \\ul v(x) \\\\\n\t\t\n\t\t&amp; \\Rightarrow \\\n\t\t(\\ol u_{n+1}(x) &lt; t_n -\\Delta_n/2 \\text{ or } \\ol u_{n+1}(x) &gt; t_n + \\Delta_n/2)\n\t\\end{aligned}\\]"}, "eq:u_nm1_le_tn_or": {"kind": "equation", "num": "47", "page": 27, "plain": "47", "ref": "(47)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\t\t\n\t\t(1 &amp;+ \\ve)  \\hat u_{n+1}(x) &lt; \\ul u_{n+1}(x)\n\t\t\\ \\Rightarrow \\\n\t\t(1+\\ve) \\ol u_{n+1}(x) &lt; \\ul u_{n+1}(x)\n\t\t\\ \\Leftrightarrow \\\n\t\t\\ol v (x) \\exp(-\\ve \\ol u(x)/\\alpha) &lt; \\ul v(x) \\\\\n\t\t\n\t\t&amp; \\Rightarrow \\\n\t\t(\\ol u_{n+1}(x) &lt; t_n -\\Delta_n/2 \\text{ or } \\ol u_{n+1}(x) &gt; t_n + \\Delta_n/2)\n\t\\end{aligned}\\]"}, "corol:NGamma": {"kind": "corollary", "num": "2.27", "page": 27, "plain": "2.27", "ref": "Corollary 2.27", "env": "corol:NGamma", "title": "", "html": "Under the assumptions of <a class=\"pref\" href=\"#label=corol:max_width\">Corollary 2.26<\/a>.\n\tIn any iteration $n\\geq 1$\n\\[\\begin{aligned}\n\n\tB_n &amp;\\subset \\{ n\\tau -2 \\Delta_{\\max} \\leq u_* &lt; n \\tau + \\Delta^+_{\\max} \\}, &amp;\n\tB&#x27;_n &amp;\\subset \\{ (n-1) \\tau - 2 \\Delta_{\\max} \\leq u_* &lt; n\\tau + \\Delta^+_{\\max}\\},\n\\end{aligned}\\]\nwith $\\Delta^+_{\\max} := (C_\\Gamma-1) \\Delta_{\\max} + \\ve \\|u_*\\|_\\infty + C_\\past + C&#x27;_\\Gamma$.\nTherefore, for any $x \\in X$,\n\\[\\begin{aligned}\n\n\t\\# \\{n\\geq 1 \\mid x \\in B_n\\} &amp;\\leq N&#x27;_\\Lambda := \\Big\\lceil \\frac{2\\Delta_{\\max} + \\Delta^+_{\\max}} \\tau \\Big\\rceil, &amp;\n\t\\# \\{n\\geq 1 \\mid x \\in B&#x27;_n\\} &amp;\\leq N_\\Gamma := N&#x27;_\\Lambda+1.\n\\end{aligned}\\]"}, "eq:Bn_subset_Bpn_subset": {"kind": "equation", "num": "48", "page": 27, "plain": "48", "ref": "(48)", "env": "corol:NGamma", "title": "", "html": ""}, "eq:count_x_in_Bn": {"kind": "equation", "num": "49", "page": 27, "plain": "49", "ref": "(49)", "env": "corol:NGamma", "title": "", "html": ""}, "algo:global_iteration": {"kind": "algorithm", "num": "3", "page": 28, "plain": "3", "ref": "Algorithm 3", "env": "algo:global_iteration", "title": "Global iteration, for computing a super-solution", "html": ""}, "lem:cplx_global_iteration": {"kind": "lemma", "num": "2.28", "page": 28, "plain": "2.28", "ref": "Lemma 2.28", "env": "lem:cplx_global_iteration", "title": "", "html": "Let $\\Phi : \\bR^X \\to \\bR^X$ be monotone and $\\rho$-sub-additive, with $0&lt; \\rho &lt; 1$, and let $v \\in \\bR^X$ satisfy $0 \\leq v-\\Phi v \\leq C$ (resp. $0 \\leq \\Phi v-v \\leq C$). Then <a class=\"pref\" href=\"#label=algo:global_iteration\">Algorithm 3<\/a> (resp. the sub-solution variant) terminates using at most $\\lceil \\frac{\\ln (C/\\eta)} {-\\ln \\rho} \\rceil_+$ iterations."}, "prop:niter_while": {"kind": "proposition", "num": "2.29", "page": 28, "plain": "2.29", "ref": "Proposition 2.29", "env": "prop:niter_while", "title": "", "html": "Under the assumptions of <a class=\"pref\" href=\"#label=corol:max_width\">Corollary 2.26<\/a>, and $\\rho&gt;0$.\nThe number of iterations in the inner while loops lines <a class=\"pref\" href=\"#label=anb:while_sub\">11<\/a> and <a class=\"pref\" href=\"#label=anb:while_sup\">12<\/a> of <a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a>, is at most\n\\[\n\n\tN&#x27;&#x27;_\\Lambda := \\Big \\lceil \\frac{2 \\Delta_{\\max}/\\alpha - \\ln (1-\\rho)}{-\\ln \\rho} \\Big \\rceil\n\\]"}, "eq:NLambdapp": {"kind": "equation", "num": "50", "page": 28, "plain": "50", "ref": "(50)", "env": "prop:niter_while", "title": "", "html": ""}, "lem:powr_diff": {"kind": "lemma", "num": "2.30", "page": 29, "plain": "2.30", "ref": "Lemma 2.30", "env": "lem:powr_diff", "title": "", "html": "For all $a,b\\geq 0$, $r\\in ]0,1]$, one has $|a^r-b^r| \\leq |a-b|^r$."}, "prop:t_advances_withUnknown": {"kind": "proposition", "num": "2.31", "page": 29, "plain": "2.31", "ref": "Proposition 2.31", "env": "prop:t_advances_withUnknown", "title": "", "html": "Let $\\Lambda : \\bR^X \\to \\bR^X$ be a monotone and additively invariant operator. Assume that $\\Phi_\\beta := \\rE_\\beta \\Lambda_\\infty \\rE_\\beta^{-1}$ is $\\sigma$-sub-additive, where the parameters $\\alpha,\\beta,\\rho,\\sigma$ satisfy \n\\[\\begin{aligned}\n\n\t\\alpha, \\beta &amp; &gt;0 , &amp;\n\t\\rho,\\sigma &amp;\\in ]0,1[, &amp;\n\t1 \\geq r &amp;:= \\alpha/\\beta, &amp;\n\t1 \\leq C &amp;:= (1-\\rho)^r /(1-\\sigma).\n\\end{aligned}\\]\nLet $\\ol u \\in \\bR^X$, $\\ol v := \\rE_\\alpha \\ol u$, and let $\\ul v \\in ]-\\infty,0]^X$. Let $0 \\leq T^- &lt; T^+$, $\\xi \\geq 0$, $\\ve&gt;0$.\nAssume that\n<ol><li> $-(1-\\rho) \\xi \\leq \\ol v-\\Phi_\\alpha \\ol v \\leq 0$ and $0 \\leq \\ul v-\\Phi_\\alpha \\ul v \\leq (1-\\rho)\\xi$ on\n\t$\\Int Y := \\{T^- \\leq \\ol u &lt; T^+\\}$.<\/li><li> $\\ol v \\geq -\\xi$ on $\\partial Y_1 := \\{T^+ \\leq \\ol u\\}$.<\/li><li> $\\ol v \\exp(-\\ve \\ol u/\\alpha) \\geq \\ul v$ on $\\partial Y_2 := \\{ \\ol u &lt; T^-\\}$.<\/li><\/ol>\nDenote $t := \\frac {T^++T^-} 2$ and $\\Delta := \\frac{T^+-T^-} 2$, and assume furthermore that\n\\[\\begin{aligned}\n\n\t\\xi &amp;\\leq \\exp(-T^+/\\alpha), &amp;\n\t\\ve T^+ &amp;\\leq \\alpha, &amp; \n\t\n\t\\Delta \\geq 2 \\beta \\max \\{1, \\ln (2 e C/\\ve)\\}.\n\\end{aligned}\\]\nThen $\\ol v \\exp(-\\ve \\ol u/\\alpha) \\geq \\ul v$ on\n$\\{t-\\Delta/2 \\leq \\ol u \\leq t+\\Delta/2\\}$."}, "eq:t_advances_withUnknown_params": {"kind": "equation", "num": "51", "page": 29, "plain": "51", "ref": "(51)", "env": "prop:t_advances_withUnknown", "title": "", "html": ""}, "eq:constr_tadvances_withUnknown": {"kind": "equation", "num": "52", "page": 29, "plain": "52", "ref": "(52)", "env": "prop:t_advances_withUnknown", "title": "", "html": ""}, "eq:olv_olw": {"kind": "equation", "num": "53", "page": 29, "plain": "53", "ref": "(53)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\t\\ol v \\exp(-\\ve \\ol u/\\alpha) &amp;\\geq \\ul v \\Leftrightarrow \\ol w \\exp(-\\ve \\ol u/\\beta) \\geq \\ul w, &amp;\n\t\\Phi_\\beta \\ol w &amp;= -(-\\Phi_\\alpha \\ol v)^r, &amp;\n\t\\Phi_\\beta \\ul w &amp;= -(-\\Phi_\\alpha \\ul v)^r.\n\\end{aligned}\\]"}, "corol:max_width_withUnknown": {"kind": "corollary", "num": "2.32", "page": 29, "plain": "2.32", "ref": "Corollary 2.32", "env": "corol:max_width_withUnknown", "title": "", "html": "Let <a class=\"pref\" href=\"#label=assum:all\">Assumption 1.10<\/a> hold, and further assume that $\\Phi_\\beta$ is $\\sigma$-sub-additive where $0 &lt; \\alpha \\leq \\beta$, and $\\rho,\\sigma \\in ]0,1[$ satisfy $0 &lt; (1-\\sigma)^\\beta \\leq (1-\\rho)^\\alpha$. Assume furthermore that $0 &lt; \\ve \\leq \\ve_{\\max}$ and $2 \\Delta_{\\max} \\leq \\min(u_\\bd)$. The number of iterations of <a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a> is bounded by $n_{\\max}$, and in each iteration $\\Delta_n &lt; \\Delta_{\\max}$. We denoted\n\\[\\begin{aligned}\n\t\\Delta_{\\max} &amp;:= 2 \\beta  \\ln (2 e C/\\ve) + 2\\tau,&amp;\n\tn_{\\max} &amp;:= \\Big\\lceil \\frac{\\|u_*\\|_\\infty + \\Delta_{\\max}} \\tau \\Big\\rceil,&amp;\n\t\\ve_{\\max} &amp;:= \\min \\big\\{\\frac \\alpha {\\|u_*\\|_\\infty + \\Delta_{\\max}}, 2\\big\\},\n\\end{aligned}\\]\nwhere $C$ is from <a class=\"pref\" href=\"#label=prop:t_advances_withUnknown\">Proposition 2.31<\/a>.\nLikewise, the statement of <a class=\"pref\" href=\"#label=corol:NGamma\">Corollary 2.27<\/a> holds with this modified value of $\\Delta_{\\max}$."}, "lem:pow_cvx": {"kind": "lemma", "num": "2.33", "page": 30, "plain": "2.33", "ref": "Lemma 2.33", "env": "lem:pow_cvx", "title": "", "html": "For any $0 \\leq a \\leq b$, $s \\geq 1$, one has $b^s \\leq a^s + s b^{s-1} (b-a)$."}, "lem:cplx_global_iteration_withUnknown": {"kind": "lemma", "num": "2.34", "page": 30, "plain": "2.34", "ref": "Lemma 2.34", "env": "lem:cplx_global_iteration_withUnknown", "title": "", "html": "Let $\\Lambda : \\bR^X \\to \\bR^X$ be monotone and such that $\\Phi_\\beta := \\rE_\\beta \\Lambda_\\infty \\rE_\\beta^{-1}$ is $\\sigma$-sub-additive, where $0 &lt; \\alpha \\leq \\beta$ and $0&lt;\\sigma&lt;1$.\nLet also $\\ol u, \\ul u \\in \\bR_\\infty^X$ be such that $\\ol u \\leq \\Lambda \\ol u$, $\\Lambda \\ul u \\leq \\ul u$ and $\\rE_\\alpha \\ol u \\geq -C$ where $C \\geq 0$. Then <a class=\"pref\" href=\"#label=algo:global_iteration\">Algorithm 3<\/a> (global iteration) applied to $\\Phi_\\alpha$ and $\\rE_\\alpha \\ol u$ (sub-solution version) or $\\rE_\\alpha \\ul u$ (super-solution version), with tolerance $\\eta&gt;0$, uses at most \n$\\lceil \\frac{\\ln (C/\\eta) + \\ln (\\beta/\\alpha)} {-\\ln \\sigma} \\rceil_+$\niterations."}, "eq:cplx_global_iteration_withUnknown": {"kind": "equation", "num": "54", "page": 30, "plain": "54", "ref": "(54)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\t\n\t\t\\ol w &amp;= - (-\\ol v)^r \\geq -C^r,&amp;\n\t\t0 &amp;\\leq \\Phi_\\beta \\ol w - \\ol w \\leq -\\ol w \\leq C^r,&amp;\n\t\t0 &amp;\\leq \\ul w - \\Phi_\\beta \\ul w\\leq -\\Phi_\\beta \\ul w \\leq -\\ol w \\leq C^r.\n\t\\end{aligned}\\]"}, "prop:niter_while_withUnknown": {"kind": "proposition", "num": "2.35", "page": 30, "plain": "2.35", "ref": "Proposition 2.35", "env": "prop:niter_while_withUnknown", "title": "", "html": "Under the assumptions of <a class=\"pref\" href=\"#label=corol:max_width_withUnknown\">Corollary 2.32<\/a>.\nThe number of iterations in the inner while loops lines <a class=\"pref\" href=\"#label=anb:while_sub\">11<\/a> and <a class=\"pref\" href=\"#label=anb:while_sup\">12<\/a> of <a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a> is at most\n\\[\n\tN_\\Lambda&#x27;&#x27; :=\n\t\\Big\\lceil\n\t\\frac{2 \\Delta_{\\max}/\\alpha + \\ln (\\beta/\\alpha)  - \\ln (1-\\rho)}{-\\ln \\sigma}\n\t\\Big\\rceil\n\\]"}, "eqdef:u_diamond_to": {"kind": "equation", "num": "55", "page": 31, "plain": "55", "ref": "(55)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\tu^{\\diamond \\to T}(x) &amp;:=\n\t\\begin{cases}\n\t\tu(x) \\!\\!&amp;\\text{if } u(x) \\neq \\diamond\\\\\n\t\tT &amp; \\text{else}\n\t\\end{cases} \n\\end{aligned}\\]"}, "lem:u_less_t": {"kind": "lemma", "num": "2.36", "page": 31, "plain": "2.36", "ref": "Lemma 2.36", "env": "lem:u_less_t", "title": "", "html": "Let $\\Gamma : \\bR^X_\\infty \\to \\bR^X_\\infty$ be monotone and causal, let $\\ol u \\in \\bR^X$, and let $T \\in \\bR$.\n\tThen so are the operators $\\Gamma&#x27; := \\max \\{\\ol u, \\Gamma\\}$, $\\check \\Gamma := \\max\\{\\ol u,\\Gamma\\}^{&lt;T}$ and $\\hat \\Gamma := \\max \\{\\ol u, \\min \\{T,\\Gamma\\}\\}$, and as a result each has a unique fixed point in $\\bR_\\infty^X$, respectively denoted $u, \\check u, \\hat u$. They are related as follows: \n\t\\[\\begin{aligned}\n\t\t\\check u &amp;= u^{&lt;T} = \\hat u^{&lt;T}, &amp;\n\t\t\\hat u &amp;= \\max \\{\\ol u, \\min \\{T, u\\}\\} = \\max \\{\\ol u, \\min \\{T, \\check u\\}\\}.\n\t\\end{aligned}\\]"}, "eqdef:L_heap": {"kind": "equation", "num": "56", "page": 32, "plain": "56", "ref": "(56)", "env": "", "title": "", "html": "\\[\\begin{aligned} \n\n\tL &amp;= \\{ (t,x)\\in \\bR \\times X \\mid x \\in X,\\, t := \\max \\{\\tilde u^{\\diamond \\to (n-1)\\tau}(x),\\, \\Gamma \\check u(x)\\} &lt; \\check u(x) \\,\\}, \\\\\n\n\tM &amp;= \\{ (\\tilde u(x), x) \\in \\bR \\times X \\mid x \\in X,\\, \\tilde u(x) \\neq \\diamond,\\ (1+\\ve) \\tilde u(x) &lt; \\undertilde u(x) \\},\\\\\n\n\tS &amp;= \\{ (\\tilde u(x), x) \\in \\bR \\times X \\mid x \\in X,\\, \\tilde u(x) \\neq \\diamond\\}, \\\\\n\n\tS^c &amp; = \\{(\\undertilde u(x),x) \\in \\bR_\\infty \\times X \\mid x \\in X,\\ \\tilde u(x) = \\diamond\\}.\n\\end{aligned}\\]"}, "eqdef:M_heap": {"kind": "equation", "num": "57", "page": 32, "plain": "57", "ref": "(57)", "env": "", "title": "", "html": "\\[\\begin{aligned} \n\n\tL &amp;= \\{ (t,x)\\in \\bR \\times X \\mid x \\in X,\\, t := \\max \\{\\tilde u^{\\diamond \\to (n-1)\\tau}(x),\\, \\Gamma \\check u(x)\\} &lt; \\check u(x) \\,\\}, \\\\\n\n\tM &amp;= \\{ (\\tilde u(x), x) \\in \\bR \\times X \\mid x \\in X,\\, \\tilde u(x) \\neq \\diamond,\\ (1+\\ve) \\tilde u(x) &lt; \\undertilde u(x) \\},\\\\\n\n\tS &amp;= \\{ (\\tilde u(x), x) \\in \\bR \\times X \\mid x \\in X,\\, \\tilde u(x) \\neq \\diamond\\}, \\\\\n\n\tS^c &amp; = \\{(\\undertilde u(x),x) \\in \\bR_\\infty \\times X \\mid x \\in X,\\ \\tilde u(x) = \\diamond\\}.\n\\end{aligned}\\]"}, "eqdef:S_heap": {"kind": "equation", "num": "58", "page": 32, "plain": "58", "ref": "(58)", "env": "", "title": "", "html": "\\[\\begin{aligned} \n\n\tL &amp;= \\{ (t,x)\\in \\bR \\times X \\mid x \\in X,\\, t := \\max \\{\\tilde u^{\\diamond \\to (n-1)\\tau}(x),\\, \\Gamma \\check u(x)\\} &lt; \\check u(x) \\,\\}, \\\\\n\n\tM &amp;= \\{ (\\tilde u(x), x) \\in \\bR \\times X \\mid x \\in X,\\, \\tilde u(x) \\neq \\diamond,\\ (1+\\ve) \\tilde u(x) &lt; \\undertilde u(x) \\},\\\\\n\n\tS &amp;= \\{ (\\tilde u(x), x) \\in \\bR \\times X \\mid x \\in X,\\, \\tilde u(x) \\neq \\diamond\\}, \\\\\n\n\tS^c &amp; = \\{(\\undertilde u(x),x) \\in \\bR_\\infty \\times X \\mid x \\in X,\\ \\tilde u(x) = \\diamond\\}.\n\\end{aligned}\\]"}, "eqdef:Sc_heap": {"kind": "equation", "num": "59", "page": 32, "plain": "59", "ref": "(59)", "env": "", "title": "", "html": "\\[\\begin{aligned} \n\n\tL &amp;= \\{ (t,x)\\in \\bR \\times X \\mid x \\in X,\\, t := \\max \\{\\tilde u^{\\diamond \\to (n-1)\\tau}(x),\\, \\Gamma \\check u(x)\\} &lt; \\check u(x) \\,\\}, \\\\\n\n\tM &amp;= \\{ (\\tilde u(x), x) \\in \\bR \\times X \\mid x \\in X,\\, \\tilde u(x) \\neq \\diamond,\\ (1+\\ve) \\tilde u(x) &lt; \\undertilde u(x) \\},\\\\\n\n\tS &amp;= \\{ (\\tilde u(x), x) \\in \\bR \\times X \\mid x \\in X,\\, \\tilde u(x) \\neq \\diamond\\}, \\\\\n\n\tS^c &amp; = \\{(\\undertilde u(x),x) \\in \\bR_\\infty \\times X \\mid x \\in X,\\ \\tilde u(x) = \\diamond\\}.\n\\end{aligned}\\]"}, "prop:correct_anb_lazy": {"kind": "proposition", "num": "2.37", "page": 32, "plain": "2.37", "ref": "Proposition 2.37", "env": "prop:correct_anb_lazy", "title": "Equivalence of <a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a> and <a class=\"pref\" href=\"#label=algo:anb_lazy\">Algorithm 4<\/a>", "html": "Under <a class=\"pref\" href=\"#label=assum:all\">Assumption 1.10<\/a>,\ndenote by $\\tilde u_n$, $\\undertilde u_n$, $\\check u_n^\\init$ (resp. and $\\check u_n$) the state of the variable $\\tilde u$, $\\undertilde u$, $\\check u$ (resp. also $\\check u$) in line <a class=\"pref\" href=\"#label=anb_lazy:main_for\">4<\/a> (resp. line <a class=\"pref\" href=\"#label=anb_lazy:tn\">11<\/a>) of the $n$-th iteration of <a class=\"pref\" href=\"#label=algo:anb_lazy\">Algorithm 4<\/a>. Then \n\\[\\begin{aligned}\n\n\t\\ol u_n &amp;= \\tilde u_n^{\\diamond \\to (n-1)\\tau}, &amp;\n\t\\undertilde u_n &amp;= \\ul u_n, &amp;\n\t\\check u_n^\\init &amp;= (\\hat u_n^\\init)^{&lt; n\\tau}, &amp; \n\t\\hat u_n^\\init &amp;= \\min\\{\\check u_n^\\init, \\max \\{\\overline u_n, n\\tau\\}\\}, \n\\end{aligned}\\]\n\\[\\begin{aligned}\n\n\t\\check u_n &amp;= \\hat u_n^{&lt;n\\tau}, &amp;\n\t\\hat u_n = \\max \\{\\ol u_n, \\min \\{n\\tau,\\check u_n\\}\\},\n\\end{aligned}\\]\n\\[\n\n\t\\tilde u_n = \n\t\\begin{cases}\n\t\\diamond \\text{ where } \\ol u_{n-1} &lt;(n-1) \\tau \\text{ and } \\hat u_{n-1} = (n-1) \\tau, \\\\\n\t\\ol u_n \\text{ otherwise}.  \t\n\t\\end{cases}\n\\]\nwhere $\\ol u_n$, $\\ul u_n$, $\\hat u_n^\\init$ and $\\hat u_n$ are from <a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a>, as described in <a class=\"pref\" href=\"#label=prop:always_subsol\">Proposition 2.18<\/a> and <a class=\"pref\" href=\"#label=prop:Dijkstra_band\">Proposition 2.20<\/a>.\nIn addition, <a class=\"pref\" href=\"#label=eqdef:L_heap\">(56)<\/a>, <a class=\"pref\" href=\"#label=eqdef:M_heap\">(57)<\/a>, <a class=\"pref\" href=\"#label=eqdef:S_heap\">(58)<\/a> and <a class=\"pref\" href=\"#label=eqdef:Sc_heap\">(59)<\/a> hold on line <a class=\"pref\" href=\"#label=anb_lazy:main_for\">4<\/a> and after each update of $M,S,S^c$ in <a class=\"pref\" href=\"#label=algo:anb_lazy\">Algorithm 4<\/a>.\n<a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a> and <a class=\"pref\" href=\"#label=algo:anb_lazy\">Algorithm 4<\/a> have equivalent stopping criteria, and thus stop at exactly the same iteration."}, "eq:lazy_bij": {"kind": "equation", "num": "60", "page": 32, "plain": "60", "ref": "(60)", "env": "prop:correct_anb_lazy", "title": "Equivalence of <a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a> and <a class=\"pref\" href=\"#label=algo:anb_lazy\">Algorithm 4<\/a>", "html": ""}, "eq:lazy_bij_hat": {"kind": "equation", "num": "61", "page": 32, "plain": "61", "ref": "(61)", "env": "prop:correct_anb_lazy", "title": "Equivalence of <a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a> and <a class=\"pref\" href=\"#label=algo:anb_lazy\">Algorithm 4<\/a>", "html": ""}, "eq:lazy_bij_placeholder": {"kind": "equation", "num": "62", "page": 32, "plain": "62", "ref": "(62)", "env": "prop:correct_anb_lazy", "title": "Equivalence of <a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a> and <a class=\"pref\" href=\"#label=algo:anb_lazy\">Algorithm 4<\/a>", "html": ""}, "eq:Lmid_anb_lazy": {"kind": "equation", "num": "63", "page": 33, "plain": "63", "ref": "(63)", "env": "", "title": "", "html": "\\[\n\n\tL = \\{ (t,x) \\mid x \\in X,\\, t := \\max \\{\\ol u_n(x),\\, \\Gamma \\check u_n(x)\\} &lt;  \\check u_n(x) \\,\\}, \n\n\\]"}, "eq:tilde_u_assign": {"kind": "equation", "num": "64", "page": 33, "plain": "64", "ref": "(64)", "env": "", "title": "", "html": "\\[\n\n\t\\tilde u_{n+1}^\\init(x) :=\n\t\\begin{cases}\n\t\t\\diamond \\quad \\text{if } \\tilde u_n^{\\diamond \\to (n-1)\\tau}(x) &lt; n\\tau \\text{ and } \\check u_n(x) = \\infty \\\\\n\t\t\\max \\{\\tilde u_n^{\\diamond \\to (n-1)\\tau}(x), \\min \\{n\\tau, \\check u_n(x)\\}\\} \\quad \\text{else}\n\t\\end{cases} \\!\\!\\!\n\t=\n\t\\begin{cases}\n\t\t\\diamond \\quad \\text{if } \\ol u_n(x) &lt; n\\tau \\text{ and } \\hat u_n(x) = n\\tau \\\\\n\t\t\\hat u_n(x) \\quad \\text{else}\n\t\\end{cases}\n\\]"}, "prop:complexity_lazy": {"kind": "proposition", "num": "2.38", "page": 33, "plain": "2.38", "ref": "Proposition 2.38", "env": "prop:complexity_lazy", "title": "", "html": "Under the assumptions of <a class=\"pref\" href=\"#label=th:complexity\">Theorem 1.11<\/a> or <a class=\"pref\" href=\"#label=th:complexity_withUnknown\">1.12<\/a>,\n<a class=\"pref\" href=\"#label=algo:anb_lazy\">Algorithm 4<\/a> has complexity\n\\[\n\n\\cO(\\widetilde N \\ln \\widetilde N) \n+ 2 N N_\\Lambda U_\\Lambda \n+ (\\widetilde N N_\\Gamma + (N+\\widetilde N) N&#x27;_\\Lambda) U_\\Gamma \n+ (N+\\widetilde N)(N&#x27;_\\Lambda + N_\\Gamma) \\cO( \\ln N) +  \\cO(n_{\\max} \\ln N),\n\\]\nwhere $N := \\#(X)$ and $\\widetilde N := \\sum_{x \\in X} \\#(\\cV(x)) = \\sum_{x \\in X} \\#(\\widetilde \\cV(x))$, is the total cardinality of the stencils of $\\Gamma$, see <a class=\"pref\" href=\"#label=eqdef:stencil_card\">(19)<\/a> and <a class=\"pref\" href=\"#label=eqdef:stencil\">(23)<\/a>.\nWe denoted by $U_\\Lambda$, $U_\\Gamma$ and $\\cO(\\ln N)$ the unit cost of, respectively, the evaluation of $\\Lambda u(x)$, $\\Gamma u(x)$, and the insertion or deletion into a balanced binary search tree with at most $N$ elements.\n$N_\\Lambda$, $N&#x27;_\\Lambda$ and $N_\\Gamma$ are from <a class=\"pref\" href=\"#label=th:complexity\">Theorem 1.11<\/a> or <a class=\"pref\" href=\"#label=th:complexity_withUnknown\">1.12<\/a>."}, "eq:anb_cost": {"kind": "equation", "num": "65", "page": 33, "plain": "65", "ref": "(65)", "env": "prop:complexity_lazy", "title": "", "html": ""}, "algo:anb_lazy": {"kind": "algorithm", "num": "4", "page": 34, "plain": "4", "ref": "Algorithm 4", "env": "algo:anb_lazy", "title": "Adaptive Narrow Band (ANB), complete implementation", "html": ""}, "anb_lazy:main_for": {"kind": "algorithm", "num": "4", "page": 34, "plain": "4", "ref": "Algorithm 4", "env": "algo:anb_lazy", "title": "", "html": ""}, "anb_lazy:Dijkstra": {"kind": "algorithm", "num": "4", "page": 34, "plain": "6", "ref": "line 6 of Algorithm 4", "env": "algo:anb_lazy", "title": "", "html": ""}, "anb_lazy:olu_gets_hatu": {"kind": "algorithm", "num": "4", "page": 34, "plain": "8", "ref": "line 8 of Algorithm 4", "env": "algo:anb_lazy", "title": "", "html": ""}, "anb_lazy:tn": {"kind": "algorithm", "num": "4", "page": 34, "plain": "11", "ref": "line 11 of Algorithm 4", "env": "algo:anb_lazy", "title": "", "html": ""}, "anb_lazy:Bn": {"kind": "algorithm", "num": "4", "page": 34, "plain": "13", "ref": "line 13 of Algorithm 4", "env": "algo:anb_lazy", "title": "", "html": ""}, "anb_lazy:etan": {"kind": "algorithm", "num": "4", "page": 34, "plain": "14", "ref": "line 14 of Algorithm 4", "env": "algo:anb_lazy", "title": "", "html": ""}, "anb_lazy:while_sub": {"kind": "algorithm", "num": "4", "page": 34, "plain": "15", "ref": "line 15 of Algorithm 4", "env": "algo:anb_lazy", "title": "", "html": ""}, "anb_lazy:while_sub_updt": {"kind": "algorithm", "num": "4", "page": 34, "plain": "16", "ref": "line 16 of Algorithm 4", "env": "algo:anb_lazy", "title": "", "html": ""}, "anb_lazy:while_sup": {"kind": "algorithm", "num": "4", "page": 34, "plain": "17", "ref": "line 17 of Algorithm 4", "env": "algo:anb_lazy", "title": "", "html": ""}, "anb_lazy:while_sup_updt": {"kind": "algorithm", "num": "4", "page": 34, "plain": "18", "ref": "line 18 of Algorithm 4", "env": "algo:anb_lazy", "title": "", "html": ""}, "anb_lazy:update_MS": {"kind": "algorithm", "num": "4", "page": 34, "plain": "19", "ref": "line 19 of Algorithm 4", "env": "algo:anb_lazy", "title": "", "html": ""}, "anb_lazy:parallel_for2": {"kind": "algorithm", "num": "4", "page": 34, "plain": "20", "ref": "line 20 of Algorithm 4", "env": "algo:anb_lazy", "title": "", "html": ""}, "anb_lazy:L": {"kind": "algorithm", "num": "4", "page": 34, "plain": "21", "ref": "line 21 of Algorithm 4", "env": "algo:anb_lazy", "title": "", "html": ""}, "eqdef:SLupdate": {"kind": "equation", "num": "74", "page": 50, "plain": "74", "ref": "(74)", "env": "", "title": "", "html": "\\[\n\n  \\Lambda u(x) := \\min_{(v_1,\\cdots,v_d) \\in \\bV(x)}\n  \\ \\min_{(\\xi_1,\\cdots,\\xi_d) \\in \\Xi_d} \\ \n  \\ol \\cF_x\\Big(\\sum_{1 \\leq i \\leq d} \\xi_i v_i\\Big) + \\sum_{1 \\leq i \\leq d} \\xi_i u(x+v_i), \n\\]"}, "assum:stencil": {"kind": "assumption", "num": "B.1", "page": 51, "plain": "B.1", "ref": "Assumption B.1", "env": "assum:stencil", "title": "", "html": "$X = \\Int X \\sqcup \\partial X \\subset \\bR^d$ is a finite set. $\\cF_x$ is a (possibly asymmetric) given norm on $\\bR^d$ and $\\ol \\cF_x(v) := \\cF_x(-v)$, for each $x \\in \\Int X$, $v \\in \\bR^d$. \n$\\bV(x) \\subset \\bR^{d \\times d}$ is a given finite collection of square matrices, and the corresponding stencil $\\cV(x) := \\{x+v_i \\mid (v_1,\\cdots,v_d)\\in \\bV(x),\\ 1\\leq i\\leq d\\}$ satisfies $\\cV(x) \\subset X$ for all $x \\in \\Int X$.\nWe further assume:\n<ul><li> (Connectedness to the boundary) \nFor all $x_0 \\in \\Int X$, \nthere exists $n\\geq 1$, \n$x_1,\\cdots,x_{n-1} \\in \\Int X$, $x_n \\in \\partial X$, such that $x_{i+1} \\in \\cV(x_i)$ for all $0 \\leq i &lt;n$.<\/li><li>  (Non-degeneracy of simplices) For all $x \\in \\Int X$, all $(v_1,\\cdots,v_d) \\in \\bV(x)$, \n\t$\\det(v_1,\\cdots,v_d) \\neq 0$.<\/li><\/ul>"}, "eqdef:LFupdate": {"kind": "equation", "num": "75", "page": 51, "plain": "75", "ref": "(75)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\t\n\t\\nabla_h u(x) &amp;:= \\sum_{1 \\leq i \\leq d} \\frac{u(x+h b_i)-u(x-h b_i)}{2h} b_i,&amp;\n\t\\Lambda u(x) &amp;:= \\min \\{\\Lambda_0 u(x), \\Lambda_1 u(x)\\},\n\\end{aligned}\\]"}, "assum:LF": {"kind": "assumption", "num": "B.2", "page": 51, "plain": "B.2", "ref": "Assumption B.2", "env": "assum:LF", "title": "", "html": "The domain \n\t$\\Omega \\subset \\bR^d$ is open and bounded, and the Hamiltonian $\\cF^* \\in C^0(\\overline \\Omega\\times \\bR^d,[0,\\infty[)$ obeys \n\\[\\begin{aligned}\n\n\t\\cF^*_x(\\lambda \\xi) &amp;= \\lambda \\cF_x^*(\\xi), &amp;\n\tC_0^{-1} \\|\\xi\\|_\\infty &amp;\\leq \\cF_x^*(\\xi), &amp;\n\t|\\cF_x^*(\\xi)-\\cF_x^*(\\zeta)| \\leq C_1 \\|\\xi-\\zeta\\|_1,\n\\end{aligned}\\]\nfor all $\\lambda\\geq 0$ and $\\xi,\\zeta\\in \\bR^d$, where $C_0,C_1$ are positive constants.\n\tThe grid scale $h&gt;0$ is fixed, and the discrete domain $X := \\Int X \\sqcup \\partial X$ is defined by \n\\[\\begin{aligned}\n\n\t\\Int X &amp;:= \\Omega \\cap h \\bZ^d, &amp;\n\t\\partial X := \\{x+\\chi h b_i\\mid x\\in \\Int X,\\ 1 \\leq i \\leq d,\\ \\chi = \\pm 1\\}\\sm \\Int X.\n\\end{aligned}\\]\nWe also fix $0 &lt; c_1 &lt; C_1^{-1}$ and denote $\\delta_\\LF := (1-C_1c_1)/(2d)$."}, "eq:c0C1": {"kind": "equation", "num": "76", "page": 52, "plain": "76", "ref": "(76)", "env": "assum:LF", "title": "", "html": ""}, "eqdef:XhLF": {"kind": "equation", "num": "77", "page": 52, "plain": "77", "ref": "(77)", "env": "assum:LF", "title": "", "html": ""}, "eq:LF_alpha_rho_nu": {"kind": "equation", "num": "78", "page": 52, "plain": "78", "ref": "(78)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\t\\alpha &amp;:= 2h \\frac {d C_0^2}{c_1 \\delta_\\LF^2}, &amp; \n\t\\rho &amp;:= 1- \\frac 1 2 \\Big(\\frac {c_1 \\delta_\\LF}{C_0 d}\\Big)^2, &amp; \n\t\\nu &amp;:= h \\frac {c_1} d.\n\\end{aligned}\\]"}, "eqdef:UDupdate": {"kind": "equation", "num": "79", "page": 52, "plain": "79", "ref": "(79)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\t\\sum_{e \\in E} \\mu(x,e) \\max \\big\\{0,\\, \\lambda-u(x-h e)+h\\&lt;\\omega(x),e\\&gt;,\\, \\lambda - u(x+ h e)-h\\&lt;\\omega(x),e\\&gt;\\big\\}^2 = h^2, \n\\end{aligned}\\]"}, "assum:Euler": {"kind": "assumption", "num": "B.3", "page": 52, "plain": "B.3", "ref": "Assumption B.3", "env": "assum:Euler", "title": "", "html": "The domain $\\Omega\\subset \\bR^d$ is open and bounded. The Randers eikonal equation parameters $\\cD \\in C^0(\\overline \\Omega,\\cS_d^{++})$ and $\\omega \\in C^0(\\overline\\Omega, \\bR^d)$ obey the compatibility condition $\\|\\omega(x)\\|_{\\cD(x)} \\leq \\omega_{\\max} &lt; 1$. The <br><br>stencil $E \\subset \\bZ^d \\sm \\{0\\}$ is finite and the coefficients $\\mu \\in C^0(\\overline \\Omega \\times E,]0,\\infty[)$ obey \n\\[\\begin{aligned}\n\n\t\\cD(x) &amp;:= \\sum_{e \\in E} \\mu(x,e) e e^\\top, &amp;\n\t0 &lt; \\mu_{\\min} \\leq \\mu(x,e) \\leq \\mu_{\\max}.\n\\end{aligned}\\]\nThe discrete domain $X = \\Int X \\sqcup \\partial X$ is defined in terms of the grid scale $h&gt;0$ by:\n\\[\\begin{aligned}\n\t\\Int X &amp;:= \\Omega \\cap h \\bZ^d, &amp;\n\t\\partial X &amp;:= \\{x+\\chi h e\\mid x \\in \\Int X,\\ e \\in E,\\ \\chi = \\pm 1\\} \\sm \\Int X.\n\\end{aligned}\\]"}, "eqdef:selling": {"kind": "equation", "num": "80", "page": 52, "plain": "80", "ref": "(80)", "env": "assum:Euler", "title": "", "html": ""}, "eq:rho_loc_LF": {"kind": "equation", "num": "82", "page": 53, "plain": "82", "ref": "(82)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\\rho^\\loc_\\LF(\\alpha; \\&lt;\\eta,\\cdot\\&gt;, x) &amp;= \n\\frac 1 {2d} \\sum_{\\substack{1 \\leq i \\leq d \\\\ \\chi=\\pm}} \\big(1-c_1 \\chi \\&lt; \\nabla \\cF_x^*(\\eta), b_i\\&gt; \\big) \\exp\\big(\\frac{\\chi \\&lt;\\eta, b_i\\&gt;}{\\alpha/h}\\big). \\\\\n\n\\rho^\\loc_\\SL(\\alpha; \\&lt;\\eta,\\cdot\\&gt;, x) &amp;= \\!\n\\sum_{1 \\leq i \\leq d} \\frac{\\&lt;V^{-1} \\nabla \\cF_x^*(\\eta), b_i\\&gt;}{\\&lt;V^{-1} \\nabla \\cF_x^*(\\eta), \\bbone\\&gt;} \n\\exp\\big(\\frac{\\&lt;V b_i, \\eta\\&gt;} {\\alpha}\\big), \n\\qquad\nV \\in \\bV(x),\\, V^{-1} \\nabla \\cF_x^*(\\eta) &lt; 0.\n\\\\\n\n\\rho^\\loc_\\UD (\\alpha; \\&lt;\\eta,\\cdot\\&gt;, x)\\! &amp;=  \\!\\!\n\\sum_{e \\in E} \n\\frac{\\mu(x,e) \\zeta(e)}{\\&lt;\\mu(x),\\zeta\\&gt;} \n\\exp\\!\\big(\\frac{- \\&lt;\\eta,e\\&gt;\\, \\sign(\\&lt;\\eta+\\omega,e\\&gt;)}{\\alpha/h}\\big),\n\\ \\zeta(e) := |\\&lt;\\eta+\\omega,e\\&gt;|,\\, e \\in E.\n\\end{aligned}\\]"}, "eq:rho_loc_SL": {"kind": "equation", "num": "83", "page": 53, "plain": "83", "ref": "(83)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\\rho^\\loc_\\LF(\\alpha; \\&lt;\\eta,\\cdot\\&gt;, x) &amp;= \n\\frac 1 {2d} \\sum_{\\substack{1 \\leq i \\leq d \\\\ \\chi=\\pm}} \\big(1-c_1 \\chi \\&lt; \\nabla \\cF_x^*(\\eta), b_i\\&gt; \\big) \\exp\\big(\\frac{\\chi \\&lt;\\eta, b_i\\&gt;}{\\alpha/h}\\big). \\\\\n\n\\rho^\\loc_\\SL(\\alpha; \\&lt;\\eta,\\cdot\\&gt;, x) &amp;= \\!\n\\sum_{1 \\leq i \\leq d} \\frac{\\&lt;V^{-1} \\nabla \\cF_x^*(\\eta), b_i\\&gt;}{\\&lt;V^{-1} \\nabla \\cF_x^*(\\eta), \\bbone\\&gt;} \n\\exp\\big(\\frac{\\&lt;V b_i, \\eta\\&gt;} {\\alpha}\\big), \n\\qquad\nV \\in \\bV(x),\\, V^{-1} \\nabla \\cF_x^*(\\eta) &lt; 0.\n\\\\\n\n\\rho^\\loc_\\UD (\\alpha; \\&lt;\\eta,\\cdot\\&gt;, x)\\! &amp;=  \\!\\!\n\\sum_{e \\in E} \n\\frac{\\mu(x,e) \\zeta(e)}{\\&lt;\\mu(x),\\zeta\\&gt;} \n\\exp\\!\\big(\\frac{- \\&lt;\\eta,e\\&gt;\\, \\sign(\\&lt;\\eta+\\omega,e\\&gt;)}{\\alpha/h}\\big),\n\\ \\zeta(e) := |\\&lt;\\eta+\\omega,e\\&gt;|,\\, e \\in E.\n\\end{aligned}\\]"}, "eq:rho_loc_UD": {"kind": "equation", "num": "84", "page": 53, "plain": "84", "ref": "(84)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\\rho^\\loc_\\LF(\\alpha; \\&lt;\\eta,\\cdot\\&gt;, x) &amp;= \n\\frac 1 {2d} \\sum_{\\substack{1 \\leq i \\leq d \\\\ \\chi=\\pm}} \\big(1-c_1 \\chi \\&lt; \\nabla \\cF_x^*(\\eta), b_i\\&gt; \\big) \\exp\\big(\\frac{\\chi \\&lt;\\eta, b_i\\&gt;}{\\alpha/h}\\big). \\\\\n\n\\rho^\\loc_\\SL(\\alpha; \\&lt;\\eta,\\cdot\\&gt;, x) &amp;= \\!\n\\sum_{1 \\leq i \\leq d} \\frac{\\&lt;V^{-1} \\nabla \\cF_x^*(\\eta), b_i\\&gt;}{\\&lt;V^{-1} \\nabla \\cF_x^*(\\eta), \\bbone\\&gt;} \n\\exp\\big(\\frac{\\&lt;V b_i, \\eta\\&gt;} {\\alpha}\\big), \n\\qquad\nV \\in \\bV(x),\\, V^{-1} \\nabla \\cF_x^*(\\eta) &lt; 0.\n\\\\\n\n\\rho^\\loc_\\UD (\\alpha; \\&lt;\\eta,\\cdot\\&gt;, x)\\! &amp;=  \\!\\!\n\\sum_{e \\in E} \n\\frac{\\mu(x,e) \\zeta(e)}{\\&lt;\\mu(x),\\zeta\\&gt;} \n\\exp\\!\\big(\\frac{- \\&lt;\\eta,e\\&gt;\\, \\sign(\\&lt;\\eta+\\omega,e\\&gt;)}{\\alpha/h}\\big),\n\\ \\zeta(e) := |\\&lt;\\eta+\\omega,e\\&gt;|,\\, e \\in E.\n\\end{aligned}\\]"}, "eq:fixedPoint": {"kind": "equation", "num": "1", "page": 2, "plain": "1", "ref": "(1)", "env": "", "title": "", "html": "\\[\n\n\t\\Lambda u_* = u_*\n\\]"}, "eq:cvtol_intro": {"kind": "equation", "num": "2", "page": 2, "plain": "2", "ref": "(2)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\t\\ol u &amp;\\leq \\Lambda \\ol u, &amp;\n\t\\Lambda \\ul u &amp;\\leq \\ul u, &amp;\n\t(1+\\ve) \\ol u \\geq \\ul u.\n\t\n\\end{aligned}\\]"}, "eq:tol_fixed_point": {"kind": "equation", "num": "3", "page": 2, "plain": "3", "ref": "(3)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\t\\ol u &amp;\\leq u_* \\leq \\ul u, &amp;\n\t\\text{hence }\n\t(1+\\ve)^{-1} \\ul u \\leq u_* \\leq (1+\\ve) \\ol u,\n\\end{aligned}\\]"}, "rem:FE": {"kind": "remark", "num": "1.1", "page": 3, "plain": "1.1", "ref": "Remark 1.1", "env": "rem:FE", "title": "Finite element discretization of eikonal and HJB PDEs", "html": "Consider an open bounded domain $\\Omega \\subset \\bR^d$, and a slowness profile $\\cF^*\\in C^0(\\overline \\Omega \\times \\bR^d , [0,\\infty[)$, $(x,\\zeta) \\mapsto \\cF^*_x(\\zeta)$, often referred to as the Hamiltonian, subject to assumptions specified later. \nOur objective is to compute the viscosity solution $U : \\overline \\Omega \\to \\bR$ [BCD97] to\n\\[\\begin{aligned}\n\n\t\\forall x \\in \\Omega,\\, \\cF_x^*(\\nabla U(x)) &amp;= 1,  &amp;\n\t\\forall x \\in \\partial \\Omega,\\, U(x) &amp;= U_\\bd(x).\n\\end{aligned}\\]\nAn upper bound on the Lipschitz constant of the boundary data $U_\\bd : \\partial \\Omega \\to \\bR$ is required to ensure the continuity of the solution, see [BCD97, BR06] for a discussion, which is out of the scope of this paper.<br><br>An important special case <span class=\"fn\">(This condition implies the convexity of $\\zeta \\mapsto \\cF^*_x(\\zeta)$, thus excludes two-player differential games, \nsee <a class=\"pref\" href=\"#label=subsec:pursuit\">Section 3.2<\/a>.)<\/span> is when $\\cF_x^*(\\zeta) = \\max \\{\\&lt;\\zeta,\\xi\\&gt; \\mid \\cF_x(\\xi) \\leq 1\\}$ is dual to a <em>Finsler metric<\/em>\n <span class=\"fn\">(I.e. $\\cF_x$ is a norm on $\\bR^d$, possibly asymmetric, for all $x \\in \\overline\\Omega$.)<\/span>\n$\\cF \\in C^0(\\overline \\Omega \\times \\bR^d, [0,\\infty[)$, $(x,\\xi)\\mapsto \\cF_x(\\xi)$,<br><br>on the domain. Bellman&#x27;s optimality principle then states that, for any point $x$ and neighborhood $V$ such that $x\\in V \\subset \\overline \\Omega$, one has\n\\[\\begin{aligned}\n\n\tU(x) &amp;= \\min_{y \\in \\partial V} \\Big(d_\\cF(y, x) + U(y)\\Big),\\\\ \n\t\n\t\\text{where} \\quad\n\td_\\cF(x,y) &amp;:= \\min \\Big\\{\\int_0^1 \\cF_{\\gamma(t)}(\\gamma&#x27;(t)) \\diff t \\mid\n\t\\gamma \\in \\Lip([0,1], \\overline \\Omega),\\ \\gamma(0) = x,\\ \\gamma(1) = y\\Big\\}.\n\\end{aligned}\\]\nTaking $V = \\overline \\Omega$ in <a class=\"pref\" href=\"#label=eq:BellmanOpt\">(5)<\/a>, one sees in particular that the viscosity solution to <a class=\"pref\" href=\"#label=eq:eikonal\">(4)<\/a> is the path-length distance from $\\partial \\Omega$, w.r.t. the metric $\\cF$, and with initial penalty $U_\\bd$.<br><br>We now turn to the so-called finite element discretization [BR06] of <a class=\"pref\" href=\"#label=eq:eikonal\">(4)<\/a>, and for that purpose we consider a triangulation $\\cT$ of $\\overline \\Omega$,<br><br>whose interior (resp. boundary) vertices are denoted $\\Int X$ (resp. $\\partial X$). Let $X = \\Int X \\sqcup \\partial X$, and denote by $V(x)$ the union of the simplices of $\\cT$ containing a given point $x\\in \\Int X$. Define for all $u \\in \\bR^X$ and all $x \\in \\Int X$ \n\\[\\begin{aligned}\n\n\t\\Lambda u(x) &amp;:= \\min_{y \\in \\partial V(x)} \\Big(\\cF_x(x-y) + \\interp_\\cT u(y)\\Big), &amp;\n\t\\Gamma u(x) &amp;:= c(x) + \\min_{y \\in X \\cap \\partial V(x)} u(y),\n\\end{aligned}\\]\nwhere $\\interp_\\cT u(y)$ denotes the piecewise linear interpolation on the triangulation $\\cT$ of the mapping $u : X \\to \\bR$, evaluated at the point $y\\in \\overline \\Omega$, and where $c(x) := \\min\\{\\cF_x(x-y) \\mid y \\in \\partial V(x)\\}$.\nWe also let $\\Lambda u (x) := \\Gamma u(x) := u_\\bd(x)$ for all $x \\in \\partial X$, where $u_\\bd : \\partial X \\to \\bR$ approximates the boundary data $U_\\bd$. The fixed point equation <a class=\"pref\" href=\"#label=eq:fixedPoint\">(1)<\/a>, characterizing the discrete scheme solution $u_*$, thus mimics Bellman&#x27;s optimality principle <a class=\"pref\" href=\"#label=eq:BellmanOpt\">(5)<\/a>, using the polygonal neighborhood $V(x)$ and the approximations $d_\\cF(y,x) \\approx \\cF_x(x-y)$ and $U(y) \\approx \\interp_\\cT u(y)$.\nThe operator (<a class=\"pref\" href=\"#label=eqdef:FE\">6<\/a>, right) is intended as a cheap approximation of $\\Lambda$, solvable via Dijkstra&#x27;s algorithm, which is used in a subroutine of the proposed ANB method."}, "eq:eikonal": {"kind": "equation", "num": "4", "page": 3, "plain": "4", "ref": "(4)", "env": "rem:FE", "title": "Finite element discretization of eikonal and HJB PDEs", "html": ""}, "eq:BellmanOpt": {"kind": "equation", "num": "5", "page": 3, "plain": "5", "ref": "(5)", "env": "rem:FE", "title": "Finite element discretization of eikonal and HJB PDEs", "html": ""}, "eqdef:FE": {"kind": "equation", "num": "6", "page": 3, "plain": "6", "ref": "(6)", "env": "rem:FE", "title": "Finite element discretization of eikonal and HJB PDEs", "html": ""}, "eqdef:Cpast_memory": {"kind": "equation", "num": "7", "page": 4, "plain": "7", "ref": "(7)", "env": "", "title": "", "html": "\\[\n\t\n\t\\max \\{u,t\\} = \\max\\{v,t\\}\n\t\\ \\Rightarrow \\\n\t\\max \\{\\Lambda u, t+C_\\past\\} = \\max \\{\\Lambda v, t+C_\\past\\}.\n\t\\]"}, "eqdef:monotone_extension": {"kind": "equation", "num": "8", "page": 4, "plain": "8", "ref": "(8)", "env": "", "title": "", "html": "\\[\n\n\t\\Lambda_\\infty u := \\lim_{t \\to \\infty} \\Lambda \\min\\{u,t\\}.\n\\]"}, "eqdef:Kruzkov": {"kind": "equation", "num": "9", "page": 4, "plain": "9", "ref": "(9)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\t\\rE_\\alpha u &amp;:= \\begin{cases}\n\t\t-\\exp(-u/\\alpha) &amp;\\text{if } u&lt;\\infty\\\\\n\t\t0 &amp;\\text{else}\n\t\\end{cases} &amp;\n\t\\rE_\\alpha^{-1} v &amp;:= \\begin{cases}\n\t\t-\\alpha\\ln(-v) &amp;\\text{if } v&lt;0\\\\\n\t\t\\infty &amp;\\text{else},\n\t\\end{cases}\n\\end{aligned}\\]"}, "eqdef:Phi": {"kind": "equation", "num": "10", "page": 4, "plain": "10", "ref": "(10)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\t\\Phi_\\alpha &amp;: \\bR^X \\to \\bR^X, &amp;\n\t\\Phi_\\alpha := \\rE_\\alpha \\Lambda_\\infty \\rE_\\alpha^{-1}.\n\\end{aligned}\\]"}, "eqdef:causality": {"kind": "equation", "num": "11", "page": 5, "plain": "11", "ref": "(11)", "env": "", "title": "", "html": "\\[\n\t\n\t\t\\min \\{u,t\\} = \\min\\{v,t\\} \\ \\Rightarrow \\ \\exists \\delta&gt;0,\\, \\min\\{\\Gamma u,t+\\delta\\} = \\min \\{\\Gamma v,t+\\delta\\}.\n\t\\]"}, "rem:submult_strictcaus": {"kind": "remark", "num": "1.2", "page": 5, "plain": "1.2", "ref": "Remark 1.2", "env": "rem:submult_strictcaus", "title": "Other properties of interest", "html": "The following properties, of an operator $\\Lambda : \\bR^X \\to \\bR^X$, are not used in our main results, but are often discussed: with $\\delta,\\nu&gt;0$\n<ul><li> ($\\nu$-sub-multiplicativity  <span class=\"fn\">(\n\tThe sub-multiplicativity parameter is denoted $\\sigma$ in [MM24], but here we reserve this symbol for another use.\n\t)<\/span>)\n\t$\\Lambda[(1+t) u] \\leq (1+t) \\Lambda u - \\nu t$ on $\\Int X$, for all $t \\geq 0$, $u \\in \\bR^X$.<\/li><li> ($\\delta$-strict-causality ) Like causality, but $\\delta&gt;0$ is independent of $u,v\\in \\bR^X$ and $t\\in \\bR$.<\/li><\/ul>"}, "prop:cst_subsol": {"kind": "proposition", "num": "1.3", "page": 5, "plain": "1.3", "ref": "Proposition 1.3", "env": "prop:cst_subsol", "title": "Constant sub-solutions", "html": "Consider two additively invariant operators $\\Lambda, \\Gamma : \\bR^X \\to \\bR^X$, and parameters $\\nu,\\alpha,\\rho,C_\\Gamma&gt;0$, with $\\rho&lt;1$. \n<ol><li> If $\\Lambda$ is $\\nu$-sub-multiplicative, then $\\Lambda[0] \\geq \\nu$ on $\\Int X$.<\/li><li> If $\\Phi_\\alpha := \\rE_\\alpha \\Lambda_\\infty \\rE_\\alpha^{-1}$ is $\\rho$-sub-additive, then $\\Lambda[0] \\geq -\\alpha \\ln \\rho$ on $\\Int X$.<\/li><li> If $\\Gamma$ is causal, then $\\Gamma[0] &gt; 0$ on $\\Int X$. (If $\\Gamma$ is $\\delta$-strictly causal, then $\\Gamma[0] \\geq \\delta$ on $\\Int X$.)<\/li><\/ol>\nIf $\\Lambda[0] \\geq 0$ and the upper estimate $\\Lambda[C_\\Gamma u] \\leq C_\\Gamma \\Gamma u$ of $C_\\Gamma,C&#x27;_\\Gamma$-comparison holds (resp. $\\Gamma[0] \\geq 0$ and $\\Gamma\\leq \\Lambda$), then\n\\[\\begin{aligned}\n\n\tt &amp;\\leq \\Lambda[t],&amp;\n\tt &amp;\\leq \\Gamma[t], \n\t&amp;\\text{for all } t \\leq \\min(u_\\bd).\n\\end{aligned}\\]"}, "enum:Lambda0_nu": {"kind": "enumi", "num": "1", "page": 6, "plain": "1", "ref": "item 1", "env": "prop:cst_subsol", "title": "Constant sub-solutions", "html": ""}, "enum:Lambda0_alpha": {"kind": "enumi", "num": "2", "page": 6, "plain": "2", "ref": "item 2", "env": "prop:cst_subsol", "title": "Constant sub-solutions", "html": ""}, "enum:Lambda0_delta": {"kind": "enumi", "num": "3", "page": 6, "plain": "3", "ref": "item 3", "env": "prop:cst_subsol", "title": "Constant sub-solutions", "html": ""}, "eq:cst_subsol": {"kind": "equation", "num": "12", "page": 6, "plain": "12", "ref": "(12)", "env": "prop:cst_subsol", "title": "Constant sub-solutions", "html": ""}, "prop:constr_Gamma": {"kind": "proposition", "num": "1.4", "page": 6, "plain": "1.4", "ref": "Proposition 1.4", "env": "prop:constr_Gamma", "title": "Constructing $\\Gamma$ from $\\Lambda$", "html": "Let $\\Lambda : \\bR^X \\to \\bR^X$ be monotone, additively invariant, and such that $\\Lambda[0] \\geq \\delta &gt; 0$ on $\\Int X$.\n\tAssume that $\\Lambda u(x)$ only depends on the values of $u$ on a stencil $\\emptyset\\neq\\cV(x) \\subset X$, for all $x \\in \\Int X$, and is bounded in terms of the smallest of these values:\n\t\\[\\begin{aligned}\n\t\n\t\tu_{|\\cV(x)} &amp;= v_{|\\cV(x)} \\ \\Rightarrow \\ \\Lambda u(x) = \\Lambda v(x),&amp;\n\t\t\\Lambda u(x) &amp;\\leq C_\\past + \\min_{\\cV(x)} u,\n\t\\end{aligned}\\]\n\tfor all $u,v\\in \\bR^X$ and all $x\\in \\Int X$, where $C_\\past\\geq 0$ is a constant.\n\tThen $\\Lambda$ has $C_\\past$-memory, and admits a super-solution if the stencils are connected to the boundary <span class=\"fn\">(In the sense that: $\\forall x_0 \\in \\Int X$, $\\exists n \\geq 0$, $\\exists x_1,\\cdots,x_n \\in \\Int X$, $\\exists x_{n+1} \\in \\partial X$, $\\forall 0 \\leq i \\leq n$, $x_{i+1}\\in \\cV(x_i)$)<\/span>. In addition, the following operator $\\Gamma$ is monotone, additively invariant, $\\delta$-strictly-causal, underestimates $\\Lambda$, and is $C_\\Gamma, C&#x27;_\\Gamma$-comparable. Given $u \\in \\bR^X$, set $\\Gamma u = u_\\bd$ on $\\partial X$, and for all $x \\in \\Int X$\n\t\\[\\begin{aligned}\n\t\n\t\t\\Gamma u(x) &amp;:= c(x) + \\min_{\\cV(x)} u, &amp;\n\t\tc(x) &amp;:= \\Lambda[0](x), &amp;\n\t\tC_\\Gamma &amp;:= \\frac {C_\\past} \\delta, &amp;\n\t\tC&#x27;_\\Gamma &amp;:= C_\\past C_\\Gamma-\\delta.\n\t\\end{aligned}\\]"}, "eqdef:Cpast_dependency": {"kind": "equation", "num": "13", "page": 6, "plain": "13", "ref": "(13)", "env": "prop:constr_Gamma", "title": "Constructing $\\Gamma$ from $\\Lambda$", "html": ""}, "eqdef:constr_Gamma": {"kind": "equation", "num": "14", "page": 6, "plain": "14", "ref": "(14)", "env": "prop:constr_Gamma", "title": "Constructing $\\Gamma$ from $\\Lambda$", "html": ""}, "rem:homog_csts": {"kind": "remark", "num": "1.5", "page": 7, "plain": "1.5", "ref": "Remark 1.5", "env": "rem:homog_csts", "title": "Homogeneity properties of the constants", "html": "The following intrinsic grid scale $h&gt;0$ can be associated to the finite element scheme <a class=\"pref\" href=\"#label=eqdef:FE\">(6)<\/a>:\n\\[\n\nh = \\max \\{ \\cF_x(x-y)\t\\mid x \\in \\Int X,\\ y \\in X \\cap \\partial V(x)\\}.\n\\]\nA grid scale $h&gt;0$ is also associated to the Semi-Lagrangian, Upwind-Differences, and Lax-Friedrichs schemes, see <a class=\"pref\" href=\"#label=sec:effective\">Appendix B<\/a>.\nFor these schemes, and under mild geometric non-degeneracy assumptions, $\\alpha/h$ is positively bounded above and below, $1-\\rho$ is positively bounded below, and $(C_\\past/h, C_\\Gamma, C_\\Gamma&#x27;/h)$ are bounded above, <em>independently<\/em> of $h&gt;0$, see <a class=\"pref\" href=\"#label=sec:effective\">Appendix B<\/a>. The final complexity estimate $\\cO(N \\ln^2 (N/\\ve))$ assumes these homogeneity properties, see <a class=\"pref\" href=\"#label=eq:homog_scheme_csts\">(17)<\/a> and <a class=\"pref\" href=\"#label=eq:ln_N_eps\">(20)<\/a> below."}, "eqdef:hFE": {"kind": "equation", "num": "15", "page": 7, "plain": "15", "ref": "(15)", "env": "rem:homog_csts", "title": "Homogeneity properties of the constants", "html": ""}, "rem:validityFE": {"kind": "remark", "num": "1.6", "page": 7, "plain": "1.6", "ref": "Remark 1.6", "env": "rem:validityFE", "title": "Validity of the scheme axioms", "html": "Consider the finite element scheme <a class=\"pref\" href=\"#label=eqdef:FE\">(6)<\/a>, from [BR06].\nMonotonicity and additive invariance hold by construction. \nProperty <a class=\"pref\" href=\"#label=eqdef:Cpast_dependency\">(13)<\/a> is satisfied with $C_\\past := h$ from <a class=\"pref\" href=\"#label=eqdef:hFE\">(15)<\/a>, hence <a class=\"pref\" href=\"#label=prop:constr_Gamma\">Proposition 1.4<\/a> yields the remaining desired properties of $\\Lambda$ and $\\Gamma$, except the positivity of boundary conditions, which must be assumed, and the $\\rho$-sub-additivity of $\\Phi_\\alpha$, which is further discussed in <a class=\"pref\" href=\"#label=rem:causality\">Remark 1.7<\/a> and established in <a class=\"pref\" href=\"#label=sec:effective\">Appendix B<\/a>."}, "rem:causality": {"kind": "remark", "num": "1.7", "page": 7, "plain": "1.7", "ref": "Remark 1.7", "env": "rem:causality", "title": "Causality, and Kruzkov-contractivity", "html": "A monotone and causal <a class=\"pref\" href=\"#label=eqdef:causality\">(11)<\/a> operator admits a unique fixed point, which can be computed with complexity $\\cO(N\\ln N)$ using the so-called dynamic programming principle, also referred to as Dijkstra&#x27;s algorithm or the fast marching method depending on the context, see <a class=\"pref\" href=\"#label=prop:Dijkstra_correct\">Proposition 2.9<\/a> and <a class=\"pref\" href=\"#label=prop:comp_of_causal\">Proposition 2.10<\/a>.\nCausality holds for the operator associated to a graph distance with positive edge lengths, such as $\\Gamma$ as defined in (<a class=\"pref\" href=\"#label=eqdef:FE\">6<\/a>, right) with $\\delta:=\\min\\{c(x)\\mid x \\in \\Int X\\}$. It also holds for the operator $\\Lambda$ defined in (<a class=\"pref\" href=\"#label=eqdef:FE\">6<\/a>, left), provided a  geometrical <em>acuteness condition<\/em> is satisfied [KS98, SV03, Vla08], and this observation is at the foundation of numerous variants [AM12, Mir14a, Mir14b, DC18] of the <em>semi-Lagrangian<\/em> fast marching algorithm [Tsi95]. Finally, causality holds for numerical schemes defined using suitable <em>upwind-differences<\/em>, see \nthe foundational work<br><br>[Set96] and its anisotropic variants [Mir18, Mir19] also discussed in <a class=\"pref\" href=\"#label=sec:effective\">Appendix B<\/a>.<br><br>On the other hand, causality does <em>not<\/em> hold for the scheme <a class=\"pref\" href=\"#label=eqdef:FE\">(6)<\/a> if the mesh has obtuse angles (measured w.r.t. the metric), or for the upwind-differences scheme augmented with a drift term, or the Lax-Friedrichs scheme. As a substitute, we use the $\\rho$-sub-additivity of the operator $\\Phi_\\alpha$ expressed in Kruzkov coordinates <a class=\"pref\" href=\"#label=eqdef:Phi\">(10)<\/a>, which is established in [MM24] for the schemes of interest in this paper, see <a class=\"pref\" href=\"#label=sec:effective\">Appendix B<\/a>. (And where, crucially, $\\alpha$ is proportional to the grid scale, see <a class=\"pref\" href=\"#label=rem:KruzkovFixed\">Remark 1.8<\/a>.)\nThis property can be reformulated in terms of the following <em>local contraction ratio<\/em> if the scheme $\\Lambda$ is everywhere differentiable: for all $x \\in \\Int X$ and all $u \\in \\bR^X$, \n\\[\\begin{aligned}\n\n\\rho^\\loc(\\alpha; u,x) &amp;\\leq \\rho &lt; 1&amp; \\text{where } \n\\rho^\\loc(\\alpha; u,x) &amp;:= \n\t\\sum_{y \\in X} \\frac{\\partial \\Lambda u(x)} {\\partial u(y)} \\exp\\big(\\frac {u(y) - \\Lambda u(x)} \\alpha \\big).\n\\end{aligned}\\]\nSee <a class=\"pref\" href=\"#label=prop:subadd_local\">Proposition C.1<\/a> for a similar statement without the differentiability assumption. Noting that $0 \\leq \\frac{\\partial \\Lambda u(x)} {\\partial u(y)}$ by monotony we obtain $\\frac{\\partial \\Lambda u(x)} {\\partial u(y)} \\leq \\rho \\exp(-\\frac {u(y) - \\Lambda u(x)} \\alpha)$. In other words, $\\Lambda u(x)$ may depend on later, non-causal values $u(y) &gt; \\Lambda u(x)$, but this dependency decays exponentially fast with the difference $u(y) - \\Lambda u(x)$, with the timescale $\\alpha&gt;0$.\nWe regard this property as a weakened form of the causality property, which itself implies $\\frac{\\partial \\Lambda u(x)} {\\partial u(y)} = 0$ whenever $u(y) &gt; \\Lambda u(x)$.<br><br>Say that an operator $\\Lambda$ is $\\alpha$-Kruzkov-contractant if there exists $\\rho&lt;1$ such that $\\Phi_\\alpha := \\rE_\\alpha \\Lambda_\\infty \\rE_\\alpha^{-1}$ is $\\rho$-sub-additive, see <a class=\"pref\" href=\"#label=prop:contractivity\">Proposition 2.4<\/a>. Then for any $\\delta \\geq \\mu &gt; 0$ and $0 &lt; \\alpha \\leq \\beta$:\n\\[\\begin{aligned}\n\t\\!\n\t\\delta\\text{-strictly-causal}\n\t\\Rightarrow \\mu\\text{-strictly-causal}\n\t\\Rightarrow\\text{causal}\n\t\\Rightarrow \\alpha\\text{-\\Kruzkov-contractant}\n\t\\Rightarrow \\beta\\text{-\\Kruzkov-contractant}\n\\end{aligned}\\]\nThe first two implications are trivial, and the last two are established in <a class=\"pref\" href=\"#label=prop:causal_implies_subadd\">Proposition C.5<\/a> and <a class=\"pref\" href=\"#label=prop:subadd_alpha_beta\">Proposition C.3<\/a> respectively, under mild assumptions.\nThe classical fast marching method relies on causality, and Dial&#x27;s algorithm uses the  even stronger strict-causality property [Tsi95]. In contrast, the ANB method introduced in this paper uses the weaker $\\alpha$-Kruzkov-contractivity, or the even weaker $\\beta$-Kruzkov-contractivity for some <em>unknown<\/em> parameter $\\beta$ see <a class=\"pref\" href=\"#label=th:complexity_withUnknown\">Theorem 1.12<\/a>."}, "eq:subadd_diff": {"kind": "equation", "num": "16", "page": 7, "plain": "16", "ref": "(16)", "env": "rem:causality", "title": "Causality, and Kruzkov-contractivity", "html": ""}, "rem:KruzkovFixed": {"kind": "remark", "num": "1.8", "page": 8, "plain": "1.8", "ref": "Remark 1.8", "env": "rem:KruzkovFixed", "title": "Kruzkov transformation with $\\alpha$ independent of $h$", "html": "Consider a viscosity solution $u$ to some HJB or HJI degenerate elliptic PDE $\\cF^*_x(\\nabla u(x)) = 1$, where the Hamiltonian $\\cF^*$ is positively $1$-homogeneous. Then $v := -\\exp(-u/\\alpha)$, where $\\alpha&gt;0$ is a fixed timescale, is a viscosity solution to the elliptic PDE: $v(x)/\\alpha + \\cF^*_x(\\nabla v(x)) = 0$. The presence of a zeroth order term with a positive coefficient makes it much easier to study [BCD97]. <br><br>In the discrete setting, a Kruzkov transformation with a fixed timescale $\\alpha&gt;0$ independent of the grid scale $h$ is considered in [AGH18, Kus90]. This yields a contracting scheme in the $\\ell^\\infty$ norm, with contraction factor $\\rho \\approx 1-c h/\\alpha$ as $h\\to 0^+$, where $c&gt;0$ is a constant.\nWhile this property is sufficient to prove the existence and uniqueness of the scheme solution, the contraction ratio is too close to $1$ to be helpful in the complexity analysis.\nIn contrast, we apply in this paper the Kruzkov change of coordinates with a timescale $\\alpha = \\Theta( h )$ proportional to the grid scale, so as to obtain a contraction ratio $\\rho&lt;1$ independent of $h$."}, "algo:anb": {"kind": "algorithm", "num": "1", "page": 8, "plain": "1", "ref": "Algorithm 1", "env": "algo:anb", "title": "Adaptive Narrow Band (ANB)", "html": ""}, "anb:input": {"kind": "algorithm", "num": "1", "page": 8, "plain": "1", "ref": "Algorithm 1", "env": "algo:anb", "title": "", "html": ""}, "anb:ensures": {"kind": "algorithm", "num": "1", "page": 8, "plain": "2", "ref": "line 2 of Algorithm 1", "env": "algo:anb", "title": "", "html": ""}, "anb:init": {"kind": "algorithm", "num": "1", "page": 8, "plain": "3", "ref": "line 3 of Algorithm 1", "env": "algo:anb", "title": "", "html": ""}, "anb:for": {"kind": "algorithm", "num": "1", "page": 8, "plain": "4", "ref": "line 4 of Algorithm 1", "env": "algo:anb", "title": "", "html": ""}, "anb:hatu": {"kind": "algorithm", "num": "1", "page": 8, "plain": "5", "ref": "line 5 of Algorithm 1", "env": "algo:anb", "title": "", "html": ""}, "anb:hatu2": {"kind": "algorithm", "num": "1", "page": 8, "plain": "6", "ref": "line 6 of Algorithm 1", "env": "algo:anb", "title": "", "html": ""}, "anb:tn": {"kind": "algorithm", "num": "1", "page": 8, "plain": "7", "ref": "line 7 of Algorithm 1", "env": "algo:anb", "title": "", "html": ""}, "anb:Deltan": {"kind": "algorithm", "num": "1", "page": 8, "plain": "8", "ref": "line 8 of Algorithm 1", "env": "algo:anb", "title": "", "html": ""}, "anb:Bn": {"kind": "algorithm", "num": "1", "page": 8, "plain": "9", "ref": "line 9 of Algorithm 1", "env": "algo:anb", "title": "", "html": ""}, "algoline:etan": {"kind": "algorithm", "num": "1", "page": 8, "plain": "10", "ref": "line 10 of Algorithm 1", "env": "algo:anb", "title": "", "html": ""}, "anb:while_sub": {"kind": "algorithm", "num": "1", "page": 8, "plain": "11", "ref": "line 11 of Algorithm 1", "env": "algo:anb", "title": "", "html": ""}, "anb:while_sup": {"kind": "algorithm", "num": "1", "page": 8, "plain": "12", "ref": "line 12 of Algorithm 1", "env": "algo:anb", "title": "", "html": ""}, "rem:subsol_construction": {"kind": "remark", "num": "1.9", "page": 8, "plain": "1.9", "ref": "Remark 1.9", "env": "rem:subsol_construction", "title": "Challenges of the sub-solution construction", "html": "Narrow band methods turn the global problem <a class=\"pref\" href=\"#label=eq:fixedPoint\">(1)<\/a> on the finite set $X = \\Int X \\sqcup \\partial X$, into a sequence of sub-problems posed on successive and possibly overlapping subdomains $B_n \\subset X$, $n \\geq 0$. \nOn the $n$-th iteration one typically has $X = A_n \\sqcup B_n \\sqcup C_n$, where the numerical solution is essentially frozen in $A_n$, and is completely unknown in $C_n$. \nThis raises the issue of choosing the boundary condition on $C_n$ for the sub-problem posed on $B_n$: when building a super-solution, the outflow boundary condition $+\\infty$ on $C_n$ yields a small and acceptable boundary layer; when building a sub-solution, the simplest counterpart is to choose the boundary value $0$ on $C_n$, but this creates a huge, domain-wide boundary layer, which is not acceptable, see the discussion in [Cri09]. \nFor this reason, our sub-solution construction involves an additional ingredient: an extension by solving an obstacle-type problem via Dijkstra&#x27;s method, see line <a class=\"pref\" href=\"#label=anb:hatu\">5<\/a> of <a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a> and <a class=\"pref\" href=\"#label=fig:sub_sup_dij_1D\">Figure 1<\/a>, which (i) does <em>not<\/em> require boundary conditions on $C_n$, (ii) preserves the sub-solution property, and (iii) provides boundary conditions for the next sub-problem.\nIterative methods, such as the FS, AGSI and FIM [Zha05, BR06, JW08] face a similar issue: the super-solution $+\\infty$ is a much better initialization than the sub-solution $0$, which is why they work with super-solutions in practice."}, "assum:all": {"kind": "assumption", "num": "1.10", "page": 11, "plain": "1.10", "ref": "Assumption 1.10", "env": "assum:all", "title": "", "html": "The operator $\\Lambda$ is monotone, additively invariant, has positive boundary conditions, admits a finite super-solution, and has $C_\\past$-memory. \n\tThe operator $\\Gamma$ is monotone, additively invariant, causal, underestimates $\\Lambda$, and is $C_\\Gamma,C&#x27;_\\Gamma$-comparable to $\\Lambda$. We denoted by $C_\\past\\geq 0$, $C_\\Gamma\\geq 1$, $C&#x27;_\\Gamma\\geq 0$ some arbitrary constants."}, "th:complexity": {"kind": "theorem", "num": "1.11", "page": 11, "plain": "1.11", "ref": "Theorem 1.11", "env": "th:complexity", "title": "", "html": "Let <a class=\"pref\" href=\"#label=assum:all\">Assumption 1.10<\/a> hold, and further assume that $\\Phi_\\alpha := \\rE_\\alpha \\Lambda_\\infty \\rE_\\alpha^{-1}$ is $\\rho$-sub-additive for some $\\alpha&gt;0$, $0 &lt; \\rho &lt; 1$, and that $0 &lt; \\ve \\leq \\ve_{\\max}$ and $2\\Delta_{\\max} \\leq \\min (u_\\bd)$.<br><br>The operator $\\Lambda$ admits a unique fixed point $u_* \\in \\bR^X$, and satisfies the comparison principle.\n<a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a>, with parameters $0 &lt; \\ve \\leq \\ve_{\\max}$ and $\\tau&gt;0$, terminates using at most $n_{\\max}$ iterations.\nIn the $n$-th such iteration, one has $\\Delta_n &lt; \\Delta_{\\max}$, and the number of inner loops in lines <a class=\"pref\" href=\"#label=anb:while_sub\">11<\/a> and <a class=\"pref\" href=\"#label=anb:while_sup\">12<\/a> is at most $N_\\Lambda&#x27;&#x27;$.\nIn addition, any given $x\\in X$ appears at most $N&#x27;_\\Lambda$ times in the narrow band: $\\# \\{n = 1,2,\\cdots \\mid x \\in B_n\\} \\leq N&#x27;_\\Lambda$.\nA sub- and a super-solution $\\ol u,\\ul u \\in \\bR^X$ are produced, satisfying $(1+\\ve) \\ol u \\geq \\ul u$ at termination.<br><br>Finally, <a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a> uses, at any given point $x \\in X$, at most $N_\\Lambda$  updates $\\ol u(x) \\gets \\Lambda \\ol u(x)$, at most $N_\\Lambda$ updates $\\ul u(x) \\gets \\Lambda \\ul u(x)$, and at most $N_\\Gamma$ updates $\\hat u(x) \\gets \\Gamma \\hat u(x)$ assuming that line <a class=\"pref\" href=\"#label=anb:hatu\">5<\/a> of <a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a> is implemented as in <a class=\"pref\" href=\"#label=prop:Dijkstra_band\">Proposition 2.20<\/a>. \nWe denoted\n\\[\\begin{aligned}\n\n\t\\Delta_{\\max} &amp;:= 2 \\alpha  \\ln \\big(\\frac{2 e} \\ve\\big) + 2\\tau, &amp;\n\tn_{\\max} &amp;:= \\Big\\lceil \\frac{\\|u_*\\|_\\infty + \\Delta_{\\max}} \\tau \\Big\\rceil, &amp;\n\t\\ve_{\\max} &amp;:= \\min \\big\\{\\frac \\alpha{\\|u_*\\|_\\infty+\\Delta_{\\max}}, 2\\big\\},\n\\end{aligned}\\]<br><br>\\[\\begin{aligned}\n\t\\Delta^+_{\\max} &amp;:= (C_\\Gamma-1) \\Delta_{\\max} + \\ve \\|u_*\\|_\\infty + C_\\past + C&#x27;_\\Gamma,&amp;\n\tN&#x27;_\\Lambda &amp;:= \\Big\\lceil \\frac{2\\Delta_{\\max} + \\Delta^+_{\\max}} \\tau \\Big\\rceil,&amp;\n\\end{aligned}\\]<br><br>\\[\\begin{aligned}\nN_\\Gamma &amp;:= N&#x27;_\\Lambda+1, &amp;\nN&#x27;&#x27;_\\Lambda &amp;:= \\Big\\lceil \\frac{2 \\Delta_{\\max}/\\alpha - \\ln (1-\\rho)}{-\\ln \\rho}\t\\Big\\rceil, &amp;\nN_\\Lambda &amp;:= N_\\Lambda&#x27; N_\\Lambda&#x27;&#x27;.\n\\end{aligned}\\]"}, "th:complexity_withUnknown": {"kind": "theorem", "num": "1.12", "page": 12, "plain": "1.12", "ref": "Theorem 1.12", "env": "th:complexity_withUnknown", "title": "", "html": "Let <a class=\"pref\" href=\"#label=assum:all\">Assumption 1.10<\/a> hold, and further assume that $\\Phi_\\beta$ is $\\sigma$-sub-additive with $0&lt;\\alpha \\leq \\beta$, $\\rho,\\sigma \\in ]0,1[$ and $(1-\\rho)^\\alpha \\geq (1-\\sigma)^\\beta$, and that $0 &lt; \\ve \\leq \\ve_{\\max}$ and $2\\Delta_{\\max} \\leq \\min (u_\\bd)$. The conclusions of <a class=\"pref\" href=\"#label=th:complexity\">Theorem 1.11<\/a> hold, using the modified constants:\n\\[\\begin{aligned}\n\t\\Delta_{\\max} &amp;:= 2 \\beta \\ln \\big(\\frac{2 e C} \\ve\\big) + 2\\tau  \\quad \n\t\\text{where } C := \\frac{(1-\\rho)^{\\frac \\alpha \\beta}}{1-\\sigma}, &amp;\n\tN_\\Lambda&#x27;&#x27; &amp;:= \\Big\\lceil \\frac{2 \\Delta_{\\max}/\\alpha + \\ln (\\beta/\\alpha) - \\ln (1-\\rho)}{-\\ln \\sigma} \\Big\\rceil.\n\\end{aligned}\\]"}, "eq:homog_scheme_csts": {"kind": "equation", "num": "17", "page": 12, "plain": "17", "ref": "(17)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\t\\rho\\leq \\sigma &amp;\\leq  \\sigma_{\\max} &lt; 1, &amp;\n\t\\tau,\\alpha,\\beta &amp;= \\Theta(h), &amp;\n\tC&#x27;_\\Gamma,C_\\past &amp;= \\cO(h), &amp;\n\tC_\\Gamma &amp;= \\cO(1), &amp;\n\t\\|u_*\\|_\\infty &amp;= \\Theta(1),\n\n\\end{aligned}\\]"}, "eq:bigO_h_ln_eps": {"kind": "equation", "num": "18", "page": 12, "plain": "18", "ref": "(18)", "env": "", "title": "", "html": "\\[\\begin{aligned} \n\t\\Delta_{\\max},\\Delta^+_{\\max} &amp;= \\cO(-h \\ln \\ve), &amp;\n\tn_{\\max} &amp;= \\cO(h^{-1} - \\ln \\ve), &amp;\n\t\\ve_{\\max} = \\Theta(h), \\\\ \n\tN&#x27;_\\Lambda, N_\\Gamma, N&#x27;&#x27;_\\Lambda &amp;= \\cO(-\\ln \\ve), &amp;\n\tN_\\Lambda &amp;= \\cO(\\ln^2 \\ve).\n\\end{aligned}\\]"}, "rem:tol_range": {"kind": "remark", "num": "1.13", "page": 12, "plain": "1.13", "ref": "Remark 1.13", "env": "rem:tol_range", "title": "Valid range of the tolerance parameter $\\ve&gt;0$", "html": "The assumptions of <a class=\"pref\" href=\"#label=th:complexity\">Theorem 1.11<\/a> and <a class=\"pref\" href=\"#label=th:complexity_withUnknown\">Theorem 1.12<\/a> impose\n$\\ve \\leq \\ve_{\\max} = \\Theta(h)$ and $\\min(u_\\bd) \\geq 2\\Delta_{\\max} = \\cO(-h\\ln \\ve)$.\nFor sufficiently small $h&gt;0$, there is therefore a non-empty range of acceptable tolerances $\\ve \\in [\\exp(-c/h),

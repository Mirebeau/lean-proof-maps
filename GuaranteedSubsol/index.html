× OrderedPartialMap X V :=\n  let W := Finset.univ.filter fun x => ∃ t, m.v x = some t ∧ Tm ≤ t ∧ t < Tp\n  (W, ⟨m.v, m.count + 1 + W.card⟩)"}]}, {"title": "Auxiliary definitions", "open": false, "decls": [{"name": "entries", "file": "OrderedPartialMap.lean", "doc": "The entries `(v x, x)`, in the lexicographic order of `V ×ₗ X`.", "code": "def entries (v : X → Option V) : Finset (V ×ₗ X) :=\n  Finset.univ.filterMap (fun x => (v x).map fun t => toLex (t, x)) (by …)"}, {"name": "botVal", "file": "OrderedPartialMap.lean", "doc": "The smallest entry `(t, x)` for the lexicographic order (`none` if there is no entry).", "code": "def botVal (v : X → Option V) : Option (V × X) := WithTop.map ofLex (entries v).min"}]}]}, "AnbParams": {"title": "Parameters of the ANB: the scheme Λ, its causal underestimate Γ, the tolerance ε, and τ, α, ρ", "link_decls": false, "statements": true, "sections": [{"title": "Structure", "open": true, "decls": [{"name": "AnbParams", "file": "Anb.lean", "doc": "Parameters of algo:anb: the scheme `Λ`, its causal underestimate `Γ` (line anb:hatu), the tolerance `ε`, and the constants `τ`, `α`, `ρ` of line anb:input.", "code": "structure AnbParams (X : Type*) where\n  Λ : (X → ℝ) → X → ℝ\n  Γ : (X → ℝ) → X → ℝ\n  ε : ℝ\n  τ : ℝ\n  α : ℝ\n  ρ : ℝ"}]}, {"title": "Derived constants", "open": false, "decls": [{"name": "AnbParams.Δmax", "file": "Anb.lean", "doc": "`Δ_max := 2α ln(2e/ε) + 2τ`, the bound on the half-width of the narrow band (Corollary corol:max_width, as in V1; V0 had `2α ln(2e/ε) + τ`).", "code": "noncomputable def AnbParams.Δmax (p : AnbParams X) : ℝ :=\n  2 * p.α * Real.log (2 * Real.exp 1 / p.ε) + 2 * p.τ"}, {"name": "AnbParams.nMax", "file": "Anb.lean", "doc": "`(‖u_*‖_∞ + Δ_max) / τ`, for the fixed point `u_*`: V1's `n_max` (Corollary corol:max_width) is its ceiling `⌈nMax⌉₊`.", "code": "noncomputable def AnbParams.nMax [Fintype X] (p : AnbParams X) (uFix : X → ℝ) : ℝ :=\n  (‖uFix‖ + p.Δmax) / p.τ"}, {"name": "AnbParams.εmax", "file": "Anb.lean", "doc": "`ε_max := min (α / (‖u_*‖_∞ + Δ_max), 2)` (Corollary corol:max_width), for the fixed point `u_*`. Note that `Δ_max` depends on `ε`.", "code": "noncomputable def AnbParams.εmax [Fintype X] (p : AnbParams X) (uFix : X → ℝ) : ℝ :=\n  min (p.α / (‖uFix‖ + p.Δmax)) 2"}, {"name": "AnbParams.ΔplusMax", "file": "Anb.lean", "doc": "`Δ⁺_max := (C_Γ - 1) Δ_max + ε ‖u_*‖_∞ + C_past + C'_Γ` (Corollary corol:NGamma).", "code": "noncomputable def AnbParams.ΔplusMax [Fintype X] (p : AnbParams X) (Cpast CΓ CΓ' : ℝ)\n    (uFix : X → ℝ) : ℝ :=\n  (CΓ - 1) * p.Δmax + p.ε * ‖uFix‖ + Cpast + CΓ'"}, {"name": "AnbParams.NΛ'", "file": "Anb.lean", "doc": "`N'_Λ := ⌈(2 Δ_max + Δ⁺_max) / τ⌉`, the bound on the number of iterations with `x ∈ B_n` (Corollary corol:NGamma).", "code": "noncomputable def AnbParams.NΛ' [Fintype X] (p : AnbParams X) (Cpast CΓ CΓ' : ℝ)\n    (uFix : X → ℝ) : ℕ :=\n  ⌈(2 * p.Δmax + p.ΔplusMax Cpast CΓ CΓ' uFix) / p.τ⌉₊"}, {"name": "AnbParams.NΓ", "file": "Anb.lean", "doc": "`N_Γ := N'_Λ + 1`, the bound on the number of iterations with `x ∈ B'_n` (Corollary corol:NGamma).", "code": "noncomputable def AnbParams.NΓ [Fintype X] (p : AnbParams X) (Cpast CΓ CΓ' : ℝ)\n    (uFix : X → ℝ) : ℕ :=\n  p.NΛ' Cpast CΓ CΓ' uFix + 1"}, {"name": "AnbParams.NΛ''", "file": "Anb.lean", "doc": "`N''_Λ := ⌈(2 Δ_max / α - ln (1 - ρ)) / (-ln ρ)⌉`, the bound on the number of passes of the inner loops (Prop. prop:niter_while).", "code": "noncomputable def AnbParams.NΛ'' (p : AnbParams X) : ℕ :=\n  ⌈(2 * p.Δmax / p.α - Real.log (1 - p.ρ)) / (-Real.log p.ρ)⌉₊"}, {"name": "AnbParams.NΛ''agsi", "file": "Anb.lean", "doc": "`N''_Λ := ⌈2 Δ_max / (-α ln ρ)⌉₊ + 2/(1-ρ)²` (Theorem th:complexity_with_agsi, V1), the bound on the number of updates at each point of the band in each iteration of the variant with the parallel AGSI; its second term is rounded down, since the update counts are integers.", "code": "noncomputable def AnbParams.NΛ''agsi (p : AnbParams X) : ℕ :=\n  ⌈2 * p.Δmax / (-(p.α * Real.log p.ρ))⌉₊ + ⌊2 / (1 - p.ρ) ^ 2⌋₊"}]}, {"title": "Unknown constants regime", "open": true, "decls": [{"name": "AnbParams.withUnknown", "file": "Anb.lean", "doc": "The parameters `p` of algo:anb, together with unknown constants `β`, `σ`.", "code": "def AnbParams.withUnknown (p : AnbParams X) (β σ : ℝ) : AnbParams.WithUnknown X := ⟨p, β, σ⟩"}]}]}, "AnbInnerSolver": {"title": "Inner solver of the ANB: the loops on the narrow band (lines anb:while_sub and anb:while_sup)", "link_decls": false, "statements": true, "sections": [{"title": "Structure", "open": true, "decls": [{"name": "AnbInnerSolver", "file": "Anb.lean", "doc": "The inner solver of lines anb:while_sub and anb:while_sup, acting on the maps on a band `B` with operator `Φ`, tolerance `η` and initial map `v`: the result, and the number of updates at each point of `B` (`⊤` if the loop never stops; the values at the points outside `B` are not used), for the sub-solution variant and the super-solution version.", "code": "structure AnbInnerSolver (X : Type*) where\n  subResult : (B : Set X) → ((B → ℝ) → B → ℝ) → ℝ → (B → ℝ) → B → ℝ\n  subCount : (B : Set X) → ((B → ℝ) → B → ℝ) → ℝ → (B → ℝ) → X → ℕ∞\n  supResult : (B : Set X) → ((B → ℝ) → B → ℝ) → ℝ → (B → ℝ) → B → ℝ\n  supCount : (B : Set X) → ((B → ℝ) → B → ℝ) → ℝ → (B → ℝ) → X → ℕ∞"}]}, {"title": "The two instances", "open": true, "decls": [{"name": "anbGlobalIter", "file": "Anb.lean", "doc": "The inner solver of algo:anb: the global iteration (algo:global_iteration), which updates each point of the band once per pass.", "code": "noncomputable def anbGlobalIter : AnbInnerSolver X :=\n  ⟨fun _ Φ η v => globalIterSubResult Φ η v, fun _ Φ η v _ => globalIterSubPasses Φ η v,\n    fun _ Φ η v => globalIterResult Φ η v, fun _ Φ η v _ => globalIterPasses Φ η v⟩"}, {"name": "anbAgsi", "file": "Anb.lean", "doc": "The inner solver of the variant of Theorem th:complexity_with_agsi: the parallel AGSI (algo:agsi_parallel).", "code": "open Classical in\nnoncomputable def anbAgsi : AnbInnerSolver X :=\n  ⟨fun _ => parallelAgsiSubResult,\n    fun B Φ η v x => if h : x ∈ B then parallelAgsiSubCount Φ η v ⟨x, h⟩ else 0,\n    fun _ => parallelAgsiResult,\n    fun B Φ η v x => if h : x ∈ B then parallelAgsiCount Φ η v ⟨x, h⟩ else 0⟩"}]}, {"title": "Properties used in the analysis", "open": false, "decls": [{"name": "AnbInnerSolver.Valid", "file": "Anb.lean", "doc": "The properties of an inner solver used in the analysis of algo:anb: its outputs lie in any set of maps which contains the input and is closed under partial updates `w(y) ← Φ w(y)`, and when the numbers of updates are finite at all the points of the band, the outputs satisfy the stopping criteria.", "code": "class AnbInnerSolver.Valid (S : AnbInnerSolver X) : Prop where\n  subResult_mem : ∀ (B : Set X) (Φ : (B → ℝ) → B → ℝ) (η : ℝ) (v : B → ℝ) (N : Set (B → ℝ)),\n    v ∈ N → (∀ w ∈ N, ∀ w' : B → ℝ, (∀ y, w' y = w y ∨ w' y = Φ w y) → w' ∈ N) →\n      S.subResult B Φ η v ∈ N\n  supResult_mem : ∀ (B : Set X) (Φ : (B → ℝ) → B → ℝ) (η : ℝ) (v : B → ℝ) (N : Set (B → ℝ)),\n    v ∈ N → (∀ w ∈ N, ∀ w' : B → ℝ, (∀ y, w' y = w y ∨ w' y = Φ w y) → w' ∈ N) →\n      S.supResult B Φ η v ∈ N\n  subResult_crit : ∀ (B : Set X) (Φ : (B → ℝ) → B → ℝ) (η : ℝ) (v : B → ℝ),\n    (∀ x ∈ B, S.subCount B Φ η v x < ⊤) →\n      ∀ y, Φ (S.subResult B Φ η v) y - S.subResult B Φ η v y ≤ η\n  supResult_crit : ∀ (B : Set X) (Φ : (B → ℝ) → B → ℝ) (η : ℝ) (v : B → ℝ),\n    (∀ x ∈ B, S.supCount B Φ η v x < ⊤) →\n      ∀ y, S.supResult B Φ η v y - Φ (S.supResult B Φ η v) y ≤ η"}]}]}, "AnbParams.WithUnknown": {"title": "ANB parameters with unknown constants β, σ (Theorem th:complexity_withUnknown)", "link_decls": false, "statements": true, "sections": [{"title": "Structure", "open": true, "decls": [{"name": "AnbParams.WithUnknown", "file": "Anb.lean", "doc": "The parameters `p` of algo:anb, together with constants `β`, `σ` such that `Φ_β` is `σ`-sub-additive (Theorem th:complexity_withUnknown). These constants are *unknown*: they are not parameters of the algorithm, which only uses `p`; they only enter the complexity analysis.", "code": "structure AnbParams.WithUnknown (X : Type*) where\n  p : AnbParams X\n  β : ℝ\n  σ : ℝ"}, {"name": "AnbParams.withUnknown", "file": "Anb.lean", "doc": "The parameters `p` of algo:anb, together with unknown constants `β`, `σ`.", "code": "def AnbParams.withUnknown (p : AnbParams X) (β σ : ℝ) : AnbParams.WithUnknown X := ⟨p, β, σ⟩"}]}, {"title": "Derived constants", "open": false, "decls": [{"name": "AnbParams.WithUnknown.C", "file": "Anb.lean", "doc": "`C := (1 - ρ)^(α/β) / (1 - σ)` (Prop. prop:t_advances_withUnknown).", "code": "noncomputable def C (q : AnbParams.WithUnknown X) : ℝ :=\n  (1 - q.p.ρ) ^ (q.p.α / q.β) / (1 - q.σ)"}, {"name": "AnbParams.WithUnknown.Δmax", "file": "Anb.lean", "doc": "`Δ_max := 2β ln(2eC/ε) + 2τ` (Corollary corol:max_width_withUnknown).", "code": "noncomputable def Δmax (q : AnbParams.WithUnknown X) : ℝ :=\n  2 * q.β * Real.log (2 * Real.exp 1 * q.C / q.p.ε) + 2 * q.p.τ"}, {"name": "AnbParams.WithUnknown.nMax", "file": "Anb.lean", "doc": "`(‖u_*‖_∞ + Δ_max) / τ`: V1's `n_max` (Corollary corol:max_width_withUnknown) is its ceiling `⌈nMax⌉₊`.", "code": "noncomputable def nMax [Fintype X] (q : AnbParams.WithUnknown X) (uFix : X → ℝ) : ℝ :=\n  (‖uFix‖ + q.Δmax) / q.p.τ"}, {"name": "AnbParams.WithUnknown.εmax", "file": "Anb.lean", "doc": "`ε_max := min (α / (‖u_*‖_∞ + Δ_max), 2)` (Corollary corol:max_width_withUnknown).", "code": "noncomputable def εmax [Fintype X] (q : AnbParams.WithUnknown X) (uFix : X → ℝ) : ℝ :=\n  min (q.p.α / (‖uFix‖ + q.Δmax)) 2"}, {"name": "AnbParams.WithUnknown.NΛ''", "file": "Anb.lean", "doc": "`N''_Λ := ⌈(2 Δ_max / α + ln (β / α) - ln (1 - ρ)) / (-ln σ)⌉`, the bound on the number of passes of the inner loops (Prop. prop:niter_while_withUnknown, V1; author's ruling 2026-10-16: the V0 constant `⌈((2 Δ_max + β ln 2) / α - ln (1 - ρ)) / (-ln σ)⌉` is discarded).", "code": "noncomputable def NΛ'' (q : AnbParams.WithUnknown X) : ℕ :=\n  ⌈(2 * q.Δmax / q.p.α + Real.log (q.β / q.p.α) - Real.log (1 - q.p.ρ)) / (-Real.log q.σ)⌉₊"}, {"name": "AnbParams.WithUnknown.ΔplusMax", "file": "Anb.lean", "doc": "`Δ⁺_max := (C_Γ - 1) Δ_max + ε ‖u_*‖_∞ + C_past + C'_Γ`, with the modified `Δ_max` (Corollary corol:max_width_withUnknown, last sentence; Theorem th:complexity_withUnknown).", "code": "noncomputable def ΔplusMax [Fintype X] (q : AnbParams.WithUnknown X) (Cpast CΓ CΓ' : ℝ)\n    (uFix : X → ℝ) : ℝ :=\n  (CΓ - 1) * q.Δmax + q.p.ε * ‖uFix‖ + Cpast + CΓ'"}, {"name": "AnbParams.WithUnknown.NΛ'", "file": "Anb.lean", "doc": "`N'_Λ := ⌈(2 Δ_max + Δ⁺_max) / τ⌉`, with the modified `Δ_max`.", "code": "noncomputable def NΛ' [Fintype X] (q : AnbParams.WithUnknown X) (Cpast CΓ CΓ' : ℝ)\n    (uFix : X → ℝ) : ℕ :=\n  ⌈(2 * q.Δmax + q.ΔplusMax Cpast CΓ CΓ' uFix) / q.p.τ⌉₊"}, {"name": "AnbParams.WithUnknown.NΓ", "file": "Anb.lean", "doc": "`N_Γ := N'_Λ + 1`, with the modified `Δ_max`.", "code": "noncomputable def NΓ [Fintype X] (q : AnbParams.WithUnknown X) (Cpast CΓ CΓ' : ℝ)\n    (uFix : X → ℝ) : ℕ :=\n  q.NΛ' Cpast CΓ CΓ' uFix + 1"}]}]}, "AnbAlwaysSubsolWith": {"title": "The properties of Prop. prop:always_subsol for one iteration of the ANB", "link_decls": false, "statements": true, "sections": [{"title": "Structure", "open": true, "decls": [{"name": "AnbAlwaysSubsolWith", "file": "Anb.lean", "doc": "The properties of Prop. prop:always_subsol for the iteration of the ANB with the inner solver `S` started from the state `s`: with `û := (anbStepData p s).uHat` and the next state `s' := anbStepWith S p s`, `ū ≤ Λ ū`, `Λ u̲ ≤ u̲`, `û ≤ Λ û`, `ū ≤ û ≤ ū'` and `u̲' ≤ u̲` (eq. (always_subsol)).", "code": "structure AnbAlwaysSubsolWith [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    (p : AnbParams X) (s : AnbState X) : Prop where\n  uSub_le : s.uSub ≤ p.Λ s.uSub\n  uSup_ge : Global.monotoneExtension p.Λ s.uSup ≤ s.uSup\n  uHat_le : (anbStepData p s).uHat ≤ p.Λ (anbStepData p s).uHat\n  uSub_le_uHat : s.uSub ≤ (anbStepData p s).uHat\n  uHat_le_uSub_step : (anbStepData p s).uHat ≤ (anbStepWith S p s).uSub\n  uSup_step_le : (anbStepWith S p s).uSup ≤ s.uSup"}, {"name": "AnbAlwaysSubsol", "file": "Anb.lean", "doc": "The properties of Prop. prop:always_subsol for the iteration of algo:anb started from the state `s`: with `û := (anbStepData p s).uHat` and the next state `s' := anbStep p s`, `ū ≤ Λ ū`, `Λ u̲ ≤ u̲`, `û ≤ Λ û`, `ū ≤ û ≤ ū'` and `u̲' ≤ u̲` (eq. (always_subsol)).", "code": "def AnbAlwaysSubsol [Fintype X] [LinearOrder X] (p : AnbParams X) (s : AnbState X) : Prop :=\n  AnbAlwaysSubsolWith anbGlobalIter p s"}]}]}, "Axioms": {"title": "The axioms of the schemes (Introduction): additive invariance, memory, causality, sub-additivity, ...", "link_decls": true, "statements": false, "sections": [{"title": "Scalar form: Λ : ℝ^X → ℝ (one point of a scheme)", "open": true, "decls": [{"name": "AdditivelyInvariant", "file": "Axioms.lean", "doc": "(Additive invariance, Intro.tex, axioms of `Λ` and `Γ`, scalar form) `Λ (u + t) = Λ u + t` for all `t : ℝ`, `u : X → ℝ`.", "code": "def AdditivelyInvariant (Λ : (X → ℝ) → ℝ) : Prop :=\n  ∀ (u : X → ℝ) (t : ℝ), Λ (fun y => u y + t) = Λ u + t"}, {"name": "HasMemory", "file": "Axioms.lean", "doc": "(`C_past`-memory, Intro.tex eq. eqdef:Cpast_memory, scalar form) `max {u,t} = max {v,t} ⇒ max {Λ u, t + C} = max {Λ v, t + C}`, for all `u v : X → ℝ` and `t : ℝ`.", "code": "def HasMemory (C : ℝ) (Λ : (X → ℝ) → ℝ) : Prop :=\n  ∀ (u v : X → ℝ) (t : ℝ), (∀ y, max (u y) t = max (v y) t) →\n    max (Λ u) (t + C) = max (Λ v) (t + C)"}, {"name": "Causal", "file": "Axioms.lean", "doc": "(Causality, Intro.tex eq. eqdef:causality, scalar form) `min {u,t} = min {v,t} ⇒ ∃ δ > 0, min {Λ u, t + δ} = min {Λ v, t + δ}`, for all `u v : X → ℝ` and `t : ℝ`.  REVIEW: here `δ` may depend on the point `x`; this is equivalent to the paper's global causality because `X` is finite (take the minimum of the `δ`'s).", "code": "def Causal (Λ : (X → ℝ) → ℝ) : Prop :=\n  ∀ (u v : X → ℝ) (t : ℝ), (∀ y, min (u y) t = min (v y) t) →\n    ∃ δ > 0, min (Λ u) (t + δ) = min (Λ v) (t + δ)"}, {"name": "StrictlyCausal", "file": "Axioms.lean", "doc": "(`δ`-strict causality, Intro.tex Remark rem:submult_strictcaus, scalar form) Like causality, but `δ` is independent of `u`, `v` and `t`.", "code": "def StrictlyCausal (δ : ℝ) (Λ : (X → ℝ) → ℝ) : Prop :=\n  ∀ (u v : X → ℝ) (t : ℝ), (∀ y, min (u y) t = min (v y) t) →\n    min (Λ u) (t + δ) = min (Λ v) (t + δ)"}, {"name": "SubMultiplicative", "file": "Axioms.lean", "doc": "(`ν`-sub-multiplicativity, Intro.tex Remark rem:submult_strictcaus, scalar form) `Λ [(1+t) u] ≤ (1+t) Λ u - ν t` for all `t ≥ 0`, `u : X → ℝ`.", "code": "def SubMultiplicative (ν : ℝ) (Λ : (X → ℝ) → ℝ) : Prop :=\n  ∀ (t : ℝ), 0 ≤ t → ∀ (u : X → ℝ), Λ (fun y => (1 + t) * u y) ≤ (1 + t) * Λ u - ν * t"}, {"name": "SubAdditive", "file": "Axioms.lean", "doc": "(`ρ`-sub-additivity, Intro.tex, axiom after eq. eqdef:Phi, scalar form) `Φ (v + t) ≤ Φ v + ρ t` for all `t ≥ 0`, `v : X → ℝ`.  Stated for an arbitrary operator `Φ`, as in Complexity.tex (Prop. prop:contractivity, Lemma lem:monDom). The paper's assumption \"`Φ_α` is `ρ`-sub-additive\" is this property applied to the Kruzkov-transformed operator `Φ_α = E_α Λ_∞ E_α⁻¹`.  REVIEW: on `∂X` the paper's global property reduces to `0 ≤ ρ t`, so the scalar form recovers the global one only when `ρ ≥ 0`.", "code": "def SubAdditive (ρ : ℝ) (Φ : (X → ℝ) → ℝ) : Prop :=\n  ∀ (v : X → ℝ) (t : ℝ), 0 ≤ t → Φ (fun y => v y + t) ≤ Φ v + ρ * t"}, {"name": "HasStencil", "file": "Axioms.lean", "doc": "(Stencil, Intro.tex eq. eqdef:Cpast_dependency, left, scalar form) `Λ u` only depends on the restriction of `u` to the stencil `V`: `u_{|V} = v_{|V} ⇒ Λ u = Λ v`.", "code": "def HasStencil (V : Set X) (Λ : (X → ℝ) → ℝ) : Prop :=\n  ∀ (u v : X → ℝ), (∀ y ∈ V, u y = v y) → Λ u = Λ v"}, {"name": "HasDependency", "file": "Axioms.lean", "doc": "(`C_past`-dependency, Intro.tex eq. eqdef:Cpast_dependency, scalar form) `Λ` has stencil `V`, and `Λ u ≤ C + min_V u` for all `u : X → ℝ`.  REVIEW: `Λ u ≤ C + min_V u` is written `∀ y ∈ V, Λ u ≤ C + u y`. This is the same inequality when `V` is finite and nonempty, and avoids an infimum over `V`, which in `ℝ` would take a junk value when `V` is empty or `u` is unbounded below on `V`.", "code": "def HasDependency (C : ℝ) (V : Set X) (Λ : (X → ℝ) → ℝ) : Prop :=\n  HasStencil V Λ ∧ ∀ (u : X → ℝ), ∀ y ∈ V, Λ u ≤ C + u y"}, {"name": "Comparable", "file": "Axioms.lean", "doc": "(`C_Γ,C'_Γ`-comparison, Intro.tex, axioms of `Γ`, scalar form) `C Λ u - C' ≤ Λ [C u] ≤ C Γ u` for all `u : X → ℝ`.", "code": "def Comparable (C C' : ℝ) (Λ Γ : (X → ℝ) → ℝ) : Prop :=\n  ∀ u : X → ℝ, C * Λ u - C' ≤ Λ (fun y => C * u y) ∧ Λ (fun y => C * u y) ≤ C * Γ u"}, {"name": "HasComparisonPrinciple", "file": "Axioms.lean", "doc": "(Comparison principle, Complexity.tex, eq. eq:comparison_Lambda of Prop. prop:comparison_Lambda, V1) For the partition `X = I ⊔ Iᶜ`, a sub-solution on `I` lies below a super-solution on `I` as soon as it does on the complement: `(u ≤ Λ u and Λ v ≤ v on I, u ≤ v outside I) ⇒ u ≤ v`. The paper's \"for any partition\" is `∀ I, HasComparisonPrinciple I Λ`. Unlike the other axioms, this is a property of the global operator `Λ : (X → ℝ) → X → ℝ`.", "code": "def HasComparisonPrinciple (I : Set X) (Λ : (X → ℝ) → X → ℝ) : Prop :=\n  ∀ (u v : X → ℝ), (∀ x ∈ I, u x ≤ Λ u x) → (∀ x ∈ I, Λ v x ≤ v x) →\n    (∀ x ∉ I, u x ≤ v x) → u ≤ v"}]}, {"title": "Values in ℝ_∞ = WithTop ℝ (namespace Ext)", "open": false, "decls": [{"name": "Ext.AdditivelyInvariant", "file": "AxiomsExt.lean", "doc": "(Additive invariance, Intro.tex, axioms of `Λ` and `Γ`, on `ℝ_∞`) `Λ (u + t) = Λ u + t` for all `t : ℝ`.", "code": "def AdditivelyInvariant (Λ : (X → WithTop ℝ) → WithTop ℝ) : Prop :=\n  ∀ (u : X → WithTop ℝ) (t : ℝ), Λ (fun y => u y + t) = Λ u + t"}, {"name": "Ext.HasMemory", "file": "AxiomsExt.lean", "doc": "(`C_past`-memory, Intro.tex eq. eqdef:Cpast_memory, on `ℝ_∞`) `max {u,t} = max {v,t} ⇒ max {Λ u, t + C} = max {Λ v, t + C}`, for all `t : ℝ`.", "code": "def HasMemory (C : ℝ) (Λ : (X → WithTop ℝ) → WithTop ℝ) : Prop :=\n  ∀ (u v : X → WithTop ℝ) (t : ℝ), (∀ y, max (u y) t = max (v y) t) →\n    max (Λ u) ((t + C : ℝ) : WithTop ℝ) = max (Λ v) ((t + C : ℝ) : WithTop ℝ)"}, {"name": "Ext.Causal", "file": "AxiomsExt.lean", "doc": "(Causality, Intro.tex eq. eqdef:causality, on `ℝ_∞`) `min {u,t} = min {v,t} ⇒ ∃ δ > 0, min {Λ u, t + δ} = min {Λ v, t + δ}`, for all `t : ℝ`.", "code": "def Causal (Λ : (X → WithTop ℝ) → WithTop ℝ) : Prop :=\n  ∀ (u v : X → WithTop ℝ) (t : ℝ), (∀ y, min (u y) t = min (v y) t) →\n    ∃ δ > (0 : ℝ),\n      min (Λ u) ((t + δ : ℝ) : WithTop ℝ) = min (Λ v) ((t + δ : ℝ) : WithTop ℝ)"}, {"name": "Ext.StrictlyCausal", "file": "AxiomsExt.lean", "doc": "(`δ`-strict causality, Intro.tex Remark rem:submult_strictcaus, on `ℝ_∞`) Like causality, but `δ` is independent of `u`, `v` and `t`.", "code": "def StrictlyCausal (δ : ℝ) (Λ : (X → WithTop ℝ) → WithTop ℝ) : Prop :=\n  ∀ (u v : X → WithTop ℝ) (t : ℝ), (∀ y, min (u y) t = min (v y) t) →\n    min (Λ u) ((t + δ : ℝ) : WithTop ℝ) = min (Λ v) ((t + δ : ℝ) : WithTop ℝ)"}, {"name": "Ext.SubMultiplicative", "file": "AxiomsExt.lean", "doc": "(`ν`-sub-multiplicativity, Intro.tex Remark rem:submult_strictcaus, on `ℝ_∞`) `Λ [(1+t) u] ≤ (1+t) Λ u - ν t` for all real `t ≥ 0`, written `Λ [(1+t) u] + ν t ≤ (1+t) Λ u`.", "code": "def SubMultiplicative (ν : ℝ) (Λ : (X → WithTop ℝ) → WithTop ℝ) : Prop :=\n  ∀ (t : ℝ), 0 ≤ t → ∀ (u : X → WithTop ℝ),\n    Λ (fun y => ((1 + t : ℝ) : WithTop ℝ) * u y) + ((ν * t : ℝ) : WithTop ℝ) ≤\n      ((1 + t : ℝ) : WithTop ℝ) * Λ u"}, {"name": "Ext.SubAdditive", "file": "AxiomsExt.lean", "doc": "(`ρ`-sub-additivity, Intro.tex, axiom after eq. eqdef:Phi, on `ℝ_∞`) `Φ (v + t) ≤ Φ v + ρ t` for all real `t ≥ 0`.", "code": "def SubAdditive (ρ : ℝ) (Φ : (X → WithTop ℝ) → WithTop ℝ) : Prop :=\n  ∀ (v : X → WithTop ℝ) (t : ℝ), 0 ≤ t → Φ (fun y => v y + t) ≤ Φ v + ((ρ * t : ℝ) : WithTop ℝ)"}, {"name": "Ext.HasStencil", "file": "AxiomsExt.lean", "doc": "(Stencil, Intro.tex eq. eqdef:Cpast_dependency, left, on `ℝ_∞`) `u_{|V} = v_{|V} ⇒ Λ u = Λ v`.", "code": "def HasStencil (V : Set X) (Λ : (X → WithTop ℝ) → WithTop ℝ) : Prop :=\n  ∀ (u v : X → WithTop ℝ), (∀ y ∈ V, u y = v y) → Λ u = Λ v"}, {"name": "Ext.HasDependency", "file": "AxiomsExt.lean", "doc": "(`C_past`-dependency, Intro.tex eq. eqdef:Cpast_dependency, on `ℝ_∞`) `Λ` has stencil `V`, and `Λ u ≤ C + u y` for all `y ∈ V`.", "code": "def HasDependency (C : ℝ) (V : Set X) (Λ : (X → WithTop ℝ) → WithTop ℝ) : Prop :=\n  HasStencil V Λ ∧ ∀ (u : X → WithTop ℝ), ∀ y ∈ V, Λ u ≤ (C : WithTop ℝ) + u y"}, {"name": "Ext.Comparable", "file": "AxiomsExt.lean", "doc": "(`C_Γ,C'_Γ`-comparison, Intro.tex, axioms of `Γ`, on `ℝ_∞`) `C Λ u - C' ≤ Λ [C u] ≤ C Γ u`, written `C Λ u ≤ Λ [C u] + C'` and `Λ [C u] ≤ C Γ u`.", "code": "def Comparable (C C' : ℝ) (Λ Γ : (X → WithTop ℝ) → WithTop ℝ) : Prop :=\n  ∀ u : X → WithTop ℝ,\n    (C : WithTop ℝ) * Λ u ≤ Λ (fun y => (C : WithTop ℝ) * u y) + (C' : WithTop ℝ) ∧\n      Λ (fun y => (C : WithTop ℝ) * u y) ≤ (C : WithTop ℝ) * Γ u"}, {"name": "Ext.HasComparisonPrinciple", "file": "AxiomsExt.lean", "doc": "(Comparison principle on `ℝ_∞`, Complexity.tex eq. eq:comparison_Lambda, V1) For the partition `X = I ⊔ Iᶜ`: `(u ≤ Λ u and Λ v ≤ v on I, u ≤ v outside I) ⇒ u ≤ v`, for the global operator `Λ : (X → ℝ_∞) → X → ℝ_∞`.", "code": "def HasComparisonPrinciple (I : Set X) (Λ : (X → WithTop ℝ) → X → WithTop ℝ) : Prop :=\n  ∀ (u v : X → WithTop ℝ), (∀ x ∈ I, u x ≤ Λ u x) → (∀ x ∈ I, Λ v x ≤ v x) →\n    (∀ x ∉ I, u x ≤ v x) → u ≤ v"}]}, {"title": "Global operators ℝ^X → ℝ^X (namespace Global)", "open": false, "decls": [{"name": "Global.HasMemory", "file": "Global.lean", "doc": "(`C_past`-memory, Intro.tex eq. (Cpast_memory), global form) `max {u,t} = max {v,t} ⇒ max {Λ u, t + C} = max {Λ v, t + C}` on `X`.", "code": "def HasMemory (C : ℝ) (Λ : (X → ℝ) → X → ℝ) : Prop :=\n  ∀ (u v : X → ℝ) (t : ℝ), (∀ y, max (u y) t = max (v y) t) →\n    ∀ x, max (Λ u x) (t + C) = max (Λ v x) (t + C)"}, {"name": "Global.Causal", "file": "Global.lean", "doc": "(Causality, Intro.tex eq. (causality), global form) `min {u,t} = min {v,t} ⇒ ∃ δ > 0, min {Λ u, t + δ} = min {Λ v, t + δ}` on `X`.", "code": "def Causal (Λ : (X → ℝ) → X → ℝ) : Prop :=\n  ∀ (u v : X → ℝ) (t : ℝ), (∀ y, min (u y) t = min (v y) t) →\n    ∃ δ > 0, ∀ x, min (Λ u x) (t + δ) = min (Λ v x) (t + δ)"}, {"name": "Global.StrictlyCausal", "file": "Global.lean", "doc": "(`δ`-strict causality, Intro.tex Remark rem:submult_strictcaus, global form) Like causality, but `δ` is independent of `u`, `v` and `t`.", "code": "def StrictlyCausal (δ : ℝ) (Λ : (X → ℝ) → X → ℝ) : Prop :=\n  ∀ (u v : X → ℝ) (t : ℝ), (∀ y, min (u y) t = min (v y) t) →\n    ∀ x, min (Λ u x) (t + δ) = min (Λ v x) (t + δ)"}, {"name": "Global.SubAdditive", "file": "Global.lean", "doc": "(`ρ`-sub-additivity, Intro.tex, axiom after eq. eqdef:Phi, global form) `Φ (v + t) ≤ Φ v + ρ t` on `X`, for all `t ≥ 0`.", "code": "def SubAdditive (ρ : ℝ) (Φ : (X → ℝ) → X → ℝ) : Prop :=\n  ∀ (v : X → ℝ) (t : ℝ), 0 ≤ t → ∀ x, Φ (fun y => v y + t) x ≤ Φ v x + ρ * t"}]}, {"title": "Global operators on ℝ_∞^X (namespace Global.Ext)", "open": false, "decls": [{"name": "Global.Ext.HasMemory", "file": "GlobalExt.lean", "doc": "(Global `C_past`-memory on `ℝ_∞`) `max {u,t} = max {v,t} ⇒ max {Λ u, t + C} = max {Λ v, t + C}` at every point `x`.", "code": "def HasMemory (C : ℝ) (Λ : (X → WithTop ℝ) → X → WithTop ℝ) : Prop :=\n  ∀ (u v : X → WithTop ℝ) (t : ℝ), (∀ y, max (u y) t = max (v y) t) →\n    ∀ x, max (Λ u x) ((t + C : ℝ) : WithTop ℝ) = max (Λ v x) ((t + C : ℝ) : WithTop ℝ)"}, {"name": "Global.Ext.Causal", "file": "GlobalExt.lean", "doc": "(Global causality on `ℝ_∞`) `min {u,t} = min {v,t} ⇒ ∃ δ > 0, min {Λ u, t + δ} = min {Λ v, t + δ}` at every point `x`, with `δ` independent of `x`.", "code": "def Causal (Λ : (X → WithTop ℝ) → X → WithTop ℝ) : Prop :=\n  ∀ (u v : X → WithTop ℝ) (t : ℝ), (∀ y, min (u y) t = min (v y) t) →\n    ∃ δ > (0 : ℝ), ∀ x,\n      min (Λ u x) ((t + δ : ℝ) : WithTop ℝ) = min (Λ v x) ((t + δ : ℝ) : WithTop ℝ)"}, {"name": "Global.Ext.StrictlyCausal", "file": "GlobalExt.lean", "doc": "(Global `δ`-strict causality on `ℝ_∞`) Like causality, with `δ` independent of `u`, `v`, `t`.", "code": "def StrictlyCausal (δ : ℝ) (Λ : (X → WithTop ℝ) → X → WithTop ℝ) : Prop :=\n  ∀ (u v : X → WithTop ℝ) (t : ℝ), (∀ y, min (u y) t = min (v y) t) →\n    ∀ x, min (Λ u x) ((t + δ : ℝ) : WithTop ℝ) = min (Λ v x) ((t + δ : ℝ) : WithTop ℝ)"}, {"name": "Global.Ext.SubAdditive", "file": "GlobalExt.lean", "doc": "(Global `ρ`-sub-additivity on `ℝ_∞`) `Φ (v + t) ≤ Φ v + ρ t` pointwise, for real `t ≥ 0`.", "code": "def SubAdditive (ρ : ℝ) (Φ : (X → WithTop ℝ) → X → WithTop ℝ) : Prop :=\n  ∀ (v : X → WithTop ℝ) (t : ℝ), 0 ≤ t →\n    ∀ x, Φ (fun y => v y + t) x ≤ Φ v x + ((ρ * t : ℝ) : WithTop ℝ)"}, {"name": "Global.Ext.HasStencil", "file": "GlobalExt.lean", "doc": "(Stencil, Intro.tex eq. (Cpast_dependency), left, global form on `ℝ_∞`) `Γ u x` only depends on the restriction of `u` to the stencil `𝒱 x`.", "code": "def HasStencil (𝒱 : X → Set X) (Γ : (X → WithTop ℝ) → X → WithTop ℝ) : Prop :=\n  ∀ x, GuaranteedSubsol.Ext.HasStencil (𝒱 x) (Γ · x)"}, {"name": "Global.Ext.revStencil", "file": "GlobalExt.lean", "doc": "The reversed stencil `𝒱̃ y := {x | y ∈ 𝒱 x}` (Complexity.tex, eq. eqdef:stencil, without the restriction to `Int X`): the points whose value `Γ u x` may change when `u y` changes. It is a `Finset`, since its cardinality is the cost of updating the corresponding values.", "code": "open Classical in\nnoncomputable def revStencil [Fintype X] (𝒱 : X → Set X) (y : X) : Finset X :=\n  Finset.univ.filter fun x => y ∈ 𝒱 x"}]}]}}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<script>
const NODES = JSON.parse(document.getElementById('data').textContent);
const BY = Object.fromEntries(NODES.map(n => [n.id, n]));
const { algos: ALGOS, structs: STRUCTS } = JSON.parse(document.getElementById('algos').textContent);
const CH = {
  Intro: { label: 'Introduction', v: '--c-intro' },
  Subadd: { label: 'Sub-additivity', v: '--c-subadd' },
  Complexity: { label: 'Complexity', v: '--c-complexity' },
  AGSI2: { label: 'AGSI', v: '--c-agsi' },
  Notes: { label: 'Author notes', v: '--c-notes' },
};
const chapterOf = n => CH[n.chapter] ? n.chapter : 'Notes';
const usedBy = {};
NODES.forEach(n => n.direct.forEach(d => (usedBy[d] = usedBy[d] || []).push(n.id)));
const usedByAll = {};
NODES.forEach(n => n.deps.forEach(d => (usedByAll[d] = usedByAll[d] || []).push(n.id)));
document.getElementById('nTotal').textContent = NODES.length;

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inlineCode = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
// Names that link to a page of the site: data structures, the axioms (with their namespaces), and the
// states of the algorithms (to their algorithm).
const TARGETS = {};
Object.entries(ALGOS).forEach(([l, a]) => a.variants.forEach(v => [...v.state, ...v.step].forEach(d => {
  if (/^(open .* in\n)?(noncomputable )?structure /.test(d.code)) TARGETS[d.name] = 'label=' + l; })));
Object.entries(STRUCTS).forEach(([n, t]) => {
  TARGETS[n] = 'def=' + n;
  if (t.link_decls) t.sections.forEach(sec => sec.decls.forEach(d => { TARGETS[d.name] = 'def=' + n + '/' + d.name; }));
});
// longest names first, so that `AnbParams.WithUnknown` is not cut at `AnbParams`
const STRUCT_RE = new RegExp('(?<![\\w.])(' + Object.keys(TARGETS).sort((a, b) => b.length - a.length).map(reEsc).join('|') + ')(?![\\w\'])(?![^<]*>)', 'g');
function leanHL(src, ns = '') {  // ns: namespace of the code (`Ext.`, ...), for bare names
  return esc(src)
    .replace(/\b(theorem|structure|def|noncomputable|abbrev|where|open|in|fun|let|if|then|else|match|with|Type|Prop)\b/g, '<span class="kw">$1</span>')
    .replace(/(<span class="kw">(?:theorem|def|structure|abbrev)<\/span>\s+)([\w.'₀-₉]+)/, '$1<span class="nm">$2</span>')
    .replace(/(∀|∃|→|↔|∧|∨)/g, '<span class="kw">$1</span>')
    .replace(STRUCT_RE, m => `<a class="lnk" href="#${TARGETS[ns + m] || TARGETS[m]}">${m}</a>`);
}

// legend / filters
const active = new Set(Object.keys(CH));
const legend = document.getElementById('legend');
Object.entries(CH).forEach(([k, c]) => {
  const n = NODES.filter(x => chapterOf(x) === k).length;
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.setAttribute('aria-pressed', 'true'); b.id = 'chip-' + k;
  b.innerHTML = `<span class="dot" style="background:var(${c.v})"></span>${c.label} <span class="count">${n}</span>`;
  b.onclick = () => { active.has(k) ? active.delete(k) : active.add(k); b.setAttribute('aria-pressed', active.has(k)); applyFilter(); };
  legend.appendChild(b);
});

const elements = [];
NODES.forEach(n => elements.push({ data: { id: n.id, label: n.short, ch: chapterOf(n) } }));
NODES.forEach(n => n.direct.forEach(d => elements.push({ data: { id: d + '>' + n.id, source: d, target: n.id } })));

function style() {
  const s = [
    { selector: 'node', style: {
      'shape': 'round-rectangle', 'label': 'data(label)', 'font-family': 'JetBrains Mono, monospace', 'font-size': 10,
      'color': css('--node-text'), 'text-valign': 'center', 'text-halign': 'center',
      'background-color': css('--panel'), 'border-width': 2, 'width': 'label', 'height': 22, 'padding': '6px' } },
    { selector: 'edge', style: { 'width': 1, 'line-color': css('--edge'), 'target-arrow-color': css('--edge'),
      'target-arrow-shape': 'triangle', 'arrow-scale': 0.7, 'curve-style': 'bezier' } },
    { selector: '.faded', style: { 'opacity': parseFloat(css('--fade')) } },
    { selector: 'edge.hi', style: { 'line-color': css('--edge-hi'), 'target-arrow-color': css('--edge-hi'), 'width': 1.6, 'opacity': 1 } },
    { selector: 'node.sel', style: { 'background-color': css('--accent-soft'), 'border-width': 3.5, 'font-weight': 'bold' } },
    { selector: 'node.match', style: { 'border-style': 'double', 'border-width': 4 } },
  ];
  Object.entries(CH).forEach(([k, c]) => s.push({ selector: `node[ch = "${k}"]`, style: { 'border-color': css(c.v) } }));
  return s;
}

cytoscape.use(cytoscapeDagre);
const cy = cytoscape({
  container: document.getElementById('cy'), elements, style: style(),
  layout: { name: 'dagre', rankDir: 'TB', nodeSep: 14, rankSep: 46, edgeSep: 6 },
  minZoom: 0.08, maxZoom: 2.5, wheelSensitivity: 0.25,
});

function applyFilter() {
  cy.batch(() => cy.nodes().forEach(n => n.style('display', active.has(n.data('ch')) ? 'element' : 'none')));
}

let current = null;
function select(id, center) {
  current = id;
  const n = BY[id];
  const anc = new Set(n.deps), desc = new Set(usedByAll[id] || []);
  cy.batch(() => {
    cy.elements().removeClass('faded hi sel');
    cy.nodes().forEach(x => { const i = x.id(); if (i !== id && !anc.has(i) && !desc.has(i)) x.addClass('faded'); });
    cy.edges().forEach(e => {
      const s = e.source().id(), t = e.target().id();
      const inA = (t === id || anc.has(t)) && (anc.has(s));
      const inD = (s === id || desc.has(s)) && desc.has(t);
      if (inA || inD) e.addClass('hi'); else e.addClass('faded');
    });
    cy.getElementById(id).addClass('sel');
  });
  if (center) cy.animate({ center: { eles: cy.getElementById(id) }, zoom: Math.max(cy.zoom(), 0.9) }, { duration: 250 });
  renderPanel(n);
  try { localStorage.setItem('psm-sel', id); } catch (e) {}
}

function refList(ids) {
  if (!ids || !ids.length) return '<p class="empty">None</p>';
  return '<ul>' + ids.slice().sort().map(i => `<li><button type="button" class="ref" data-id="${esc(i)}">${esc(BY[i].short)}</button></li>`).join('') + '</ul>';
}
function renderPanel(n) {
  const c = CH[chapterOf(n)];
  const p = document.getElementById('panel');
  p.innerHTML = `
    <div class="eyebrow"><span class="tag" style="background:var(${c.v})">${c.label}</span><span class="proved">Proved</span></div>
    <h2>${esc(n.short)}</h2>
    <p class="title">${inlineCode(n.title)}</p>
    <p class="source">${inlineCode(n.source)}</p>
    <pre>${leanHL(n.statement, n.id.replace('GuaranteedSubsol.', '').replace(/[^.]*$/, ''))}</pre>
    <details><summary>Docstring</summary><p class="doc">${inlineCode(n.doc)}</p></details>
    ${n.labels.map(l => { const o = NODES.filter(m => m.id !== n.id && m.labels.includes(l)).map(m => m.id);
      const a = ALGOS[l] ? `<button type="button" class="linkbtn" data-algo="${esc(l)}">Show the algorithm</button>` : '';
      return o.length || a ? `<div class="refs"><h3>Other anchors for <code>${esc(l)}</code>${a}</h3>${o.length ? refList(o) : ''}</div>` : ''; }).join('')}
    <div class="refs"><h3>Uses directly (${n.direct.length}; ${n.deps.length} in all)</h3>${refList(n.direct)}</div>
    <div class="refs"><h3>Used directly by (${(usedBy[n.id] || []).length}; ${(usedByAll[n.id] || []).length} in all)</h3>${refList(usedBy[n.id])}</div>
    <p class="meta">Anchor file <code>${esc(n.file)}</code> · proof <code>${esc(n.provider)}</code></p>`;
  p.querySelectorAll('.ref').forEach(b => b.onclick = () => select(b.dataset.id, true));
  p.querySelectorAll('.linkbtn').forEach(b => b.onclick = () => showLabel(b.dataset.algo));
}

// An algorithm of the paper: its Lean state, the step of its main loop, the loop itself, and the
// anchors citing it.
function declHTML(d, open) {
  return `<details class="decl"${open ? ' open' : ''}><summary>${esc(d.name)}</summary>
    <p class="ddoc">${inlineCode(d.doc)}</p><pre>${leanHL(d.code, d.name.replace(/[^.]*$/, ''))}</pre>
    <p class="meta">${esc(d.file)}</p></details>`;
}
function renderAlgo(l, ids) {
  current = null;
  const a = ALGOS[l], p = document.getElementById('panel');
  const sec = (t, ds, open) => ds.length ? `<div class="algo-sec"><h3>${t}</h3>${ds.map(d => declHTML(d, open)).join('')}</div>` : '';
  p.innerHTML = `
    <div class="eyebrow"><span class="tag" style="background:var(--c-complexity)">Algorithm</span><code>${esc(l)}</code></div>
    <p class="title">${esc(a.title)}</p>
    <p class="source">The Lean definitions of the algorithm: its state, one step of its main loop, and the loop with its stopping rule. Click a name to fold it.</p>
    ${a.variants.map(v => `${v.name ? `<p class="variant">${esc(v.name)}</p>` : ''}
      ${sec('State', v.state, true)}${sec('Step of the main loop', v.step, true)}${sec('Main loop and stopping', v.loop, false)}`).join('')}
    ${a.termination.length ? `<div class="algo-sec"><h3>Termination</h3>
      <p class="source">The theorems proving that the algorithm stops. Open one to see its hypotheses and the statements its proof rests on.</p>
      ${a.termination.map(i => `<details class="decl" open><summary>${esc(BY[i].short)}<button type="button" class="linkbtn ref-open" data-id="${esc(i)}">Open</button></summary>
        <p class="ddoc">${inlineCode(BY[i].title)}. ${inlineCode(BY[i].source)}</p><pre>${leanHL(BY[i].statement, BY[i].short.replace(/[^.]*$/, ''))}</pre></details>`).join('')}</div>` : ''}
    <div class="refs"><h3>Statements about this algorithm (${ids.length})</h3>${refList(ids)}</div>`;
  p.querySelectorAll('.ref-open').forEach(b => b.onclick = e => { e.preventDefault(); select(b.dataset.id, true); });
  p.querySelectorAll('.ref').forEach(b => b.onclick = () => select(b.dataset.id, true));
  p.scrollTop = 0;
}

cy.on('tap', 'node', e => select(e.target.id(), false));
cy.on('tap', e => { if (e.target === cy && current) { cy.elements().removeClass('faded hi'); } });
document.getElementById('fit').onclick = () => cy.fit(undefined, 20);

const q = document.getElementById('q');
q.addEventListener('input', () => {
  const s = q.value.trim().toLowerCase();
  cy.batch(() => {
    cy.nodes().removeClass('match');
    if (!s) return;
    const hits = cy.nodes().filter(x => { const n = BY[x.id()]; return (n.short + ' ' + n.source + ' ' + n.title).toLowerCase().includes(s); });
    hits.addClass('match');
    if (hits.length === 1) select(hits[0].id(), true);
  });
});

function restyle() { cy.style(style()); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', restyle);
new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// URL fragment: `#label=lem:max_min` (a paper label: its anchors are outlined, the first is shown)
// or `#GuaranteedSubsol.u_less_t` / `#u_less_t` (one anchor). Used by `\leancheck` in the paper.
// A data structure: its Lean definition, its operations, and the statements about it.
function renderStruct(name, focus) {
  current = null;
  const t = STRUCTS[name], p = document.getElementById('panel');
  const ids = t.statements ? NODES.filter(n => new RegExp('\\b' + reEsc(name) + '\\b').test(n.statement)).map(n => n.id) : [];
  cy.batch(() => {
    cy.elements().removeClass('faded hi sel match');
    const hits = cy.collection(ids.map(i => cy.getElementById(i)));
    hits.addClass('match');
    if (ids.length) cy.elements().not(hits).addClass('faded');
  });
  if (ids.length) { cy.zoom(0.9); cy.center(cy.getElementById(ids[0])); }
  q.value = name;
  p.innerHTML = `
    <div class="eyebrow"><span class="tag" style="background:var(--c-notes)">Data structure</span><code>${esc(name)}</code></div>
    <p class="title">${esc(t.title)}</p>
    ${t.sections.map(sec => `<div class="algo-sec"><h3>${esc(sec.title)}</h3>${sec.decls.map(d => declHTML(d, sec.open)).join('')}</div>`).join('')}
    ${t.statements ? `<div class="refs"><h3>Statements using it (${ids.length})</h3>${refList(ids)}</div>` : ''}`;
  p.querySelectorAll('.ref').forEach(b => b.onclick = () => select(b.dataset.id, true));
  p.scrollTop = 0;
  const f = focus && [...p.querySelectorAll('details.decl')].find(e => e.querySelector('summary').textContent.trim() === focus);
  if (f) { f.open = true; f.scrollIntoView({ block: 'start' }); f.querySelector('summary').focus(); }
  return true;
}
function showLabel(l) {
  const ids = NODES.filter(n => n.labels.includes(l)).map(n => n.id);
  if (!ids.length && !ALGOS[l]) return false;
  if (ALGOS[l]) {
    cy.batch(() => {
      cy.elements().removeClass('faded hi sel match');
      const hits = cy.collection(ids.map(i => cy.getElementById(i)));
      hits.addClass('match');
      cy.elements().not(hits).addClass('faded');
    });
    q.value = l;
    renderAlgo(l, ids);
    if (ids.length) { cy.zoom(0.9); cy.center(cy.getElementById(ids[0])); }
    return true;
  }
  return null;
}
function fromHash() {
  let h = location.hash.slice(1);
  try { h = decodeURIComponent(h); } catch (e) {}
  if (!h) return false;
  if (h.startsWith('def=')) {
    const [n, ...f] = h.slice(4).split('/');
    return STRUCTS[n] ? renderStruct(n, f.join('/')) : false;
  }
  if (h.startsWith('label=')) {
    const l = h.slice(6), ids = NODES.filter(n => n.labels.includes(l)).map(n => n.id);
    if (ALGOS[l]) return showLabel(l);
    if (!ids.length) return false;
    cy.nodes().removeClass('match');
    const hits = cy.collection(ids.map(i => cy.getElementById(i)));
    hits.addClass('match');
    q.value = l;
    select(ids[0], false);
    cy.zoom(0.9);
    cy.center(cy.getElementById(ids[0]));
    return true;
  }
  const id = BY[h] ? h : BY['GuaranteedSubsol.' + h] ? 'GuaranteedSubsol.' + h : null;
  if (!id) return false;
  select(id, true);
  return true;
}
window.addEventListener('hashchange', fromHash);

let start = 'GuaranteedSubsol.anbRun_complexity';
try { const s = localStorage.getItem('psm-sel'); if (s && BY[s]) start = s; } catch (e) {}
cy.fit(undefined, 20);
if (!fromHash()) select(start, false);
</script>

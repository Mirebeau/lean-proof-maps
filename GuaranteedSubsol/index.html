 c&#x27; h]$, where $c, c&#x27; &gt;0$ are positive constants."}, "eqdef:stencil_card": {"kind": "equation", "num": "19", "page": 12, "plain": "19", "ref": "(19)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\tN &amp;:= \\#(X), &amp; \n\t\\widetilde N &amp;:= \\#\\{(x,y) \\in \\Int X \\times X \\mid \\Gamma u(x) \\text{ depends on } u(y)\\}. &amp;\n\t\\text{Thus } N, \\widetilde N &amp;= \\Theta(h^{-d}),\n\\end{aligned}\\]"}, "eq:ln_N_eps": {"kind": "equation", "num": "20", "page": 12, "plain": "20", "ref": "(20)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\n&amp;\\cO(\\widetilde N \\ln \\widetilde N) \n+ 2 N N_\\Lambda U_\\Lambda \n+ (\\widetilde N N_\\Gamma + (N+\\widetilde N) N&#x27;_\\Lambda) U_\\Gamma \n+ (N+\\widetilde N)(N&#x27;_\\Lambda + N_\\Gamma) \\cO( \\ln N) +  \\cO(n_{\\max}\\ln N)\n\t\\\\\n\t&amp;= \\cO( N \\ln^2 \\ve - N \\ln \\ve \\ln N)\n\t= \\cO(N \\ln^2 (N/\\ve)).\n\t\n\\end{aligned}\\]"}, "eq:default_ratios": {"kind": "equation", "num": "93", "page": 57, "plain": "93", "ref": "(93)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\tr_\\alpha &amp; \\in \\{1,2,3,5\\}, &amp;\n\t\\rho &amp;= 0.95, &amp;\n\tr_\\tau &amp;= 0.5, \n\n\\end{aligned}\\]"}, "eq:default_tol": {"kind": "equation", "num": "66", "page": 37, "plain": "66", "ref": "(66)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\t\\ve &amp;= 10^{-3}, &amp;\n\t\\tilde \\ve &amp;= 10^{-4} h,\n\\end{aligned}\\]"}, "eq:rho_lin": {"kind": "equation", "num": "67", "page": 39, "plain": "67", "ref": "(67)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\t\\rho^\\lin(\\alpha; x) &amp;:= \n\t\\sup_{\\cF_x^*(\\eta) = 1} \\rho^\\loc\\big(\\alpha; \\&lt;\\eta,\\cdot\\&gt;, x\\big), &amp;\n\t\\rho^\\lin(\\alpha) &amp;:= \n\t\\max_{x \\in \\Int X} \\rho^\\lin(\\alpha; x).\n\\end{aligned}\\]"}, "eq:default_rho_tau": {"kind": "equation", "num": "68", "page": 39, "plain": "68", "ref": "(68)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\t\n\t\\rho &amp;= 0.95, &amp;\n\t\\tau &amp;= \\alpha /2. \n\\end{aligned}\\]"}, "eq:HookeMetric": {"kind": "equation", "num": "69", "page": 42, "plain": "69", "ref": "(69)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\t\\cF_x^*(\\eta) &amp;:= \\sqrt{\\lambda_{\\max}(c(x; \\eta))}, &amp;\n\t\\text{ where } c(x; \\eta)_{jk} &amp;:= \\sum_{i,l} c_{ijkl}(x) \\eta_i \\eta_l.\n\\end{aligned}\\]"}, "eqdef:swirl_hamiltonian": {"kind": "equation", "num": "70", "page": 45, "plain": "70", "ref": "(70)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\t\\cF^*_x(\\eta) &amp;:= \\| \\eta - \\omega(x)\\|, &amp;\n\t\n\t\\omega(x) &amp;:= \\omega_{\\max} \\frac{ \\|x\\|^2}{1+\\|x\\|^2} \\frac{x^\\perp}{\\|x\\|},\n\\end{aligned}\\]"}, "prop:subadd_local": {"kind": "proposition", "num": "C.1", "page": 54, "plain": "C.1", "ref": "Proposition C.1", "env": "prop:subadd_local", "title": "", "html": "Let $\\Lambda : \\bR^X \\to \\bR^X$ be monotone and continuous. Denote by $\\Phi_\\alpha := \\rE_\\alpha \\Lambda_\\infty \\rE_\\alpha^{-1}$ this operator in Kruzkov coordinates, where $\\alpha&gt;0$. \nGiven $\\rho &gt; 0$, the following properties are equivalent: $\\Phi_\\alpha$ is $\\rho$-sub-additive\n\\[\\begin{aligned}\n\n\t\n\t &amp;\\Leftrightarrow \n\t\\forall u \\in \\bR^X,\\ \\Lambda\\big[u + t \\exp\\big(\\frac u \\alpha\\big)\\big] \\leq \\Lambda u + \\rho t \\exp\\big(\\frac{\\Lambda u} \\alpha\\big) + o(t) \\text{ as } t \\to 0^+ \\\\\n\t\n\t&amp; \\Leftrightarrow \\forall u \\in \\bR^X,\\ \\forall x \\in X,\\ \n\t\\Lambda\\big[u + t \\exp\\big(\\frac{u-\\Lambda u(x)} \\alpha\\big)\\big](x) \\leq \\Lambda u(x) + \\rho t + o(t) \\text{ as } t \\to 0^+\n\\end{aligned}\\]\nThe equivalence also holds if the remainder $o(t)$ is replaced with $\\cO(t^2)$. Note that <a class=\"pref\" href=\"#label=eq:subadd_local_x\">(86)<\/a> involves the mapping $u - \\Lambda u(x) := [u(y) - \\Lambda u(x)]_{y \\in X} \\in \\bR^X$, where $x \\in X$ is fixed."}, "eq:subadd_local": {"kind": "equation", "num": "85", "page": 54, "plain": "85", "ref": "(85)", "env": "prop:subadd_local", "title": "", "html": ""}, "eq:subadd_local_x": {"kind": "equation", "num": "86", "page": 54, "plain": "86", "ref": "(86)", "env": "prop:subadd_local", "title": "", "html": ""}, "ineq:E1": {"kind": "equation", "num": "87", "page": 54, "plain": "87", "ref": "(87)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\t\\rE_1 u + e^{-\\ve} t \\leq \\rE_1(u+t e^u) &amp;\\leq \\rE_1 u +t, &amp;\n\t \\rE_1^{-1} v - t/v &amp;\\leq \n\t\\rE_1^{-1} (v+t) \\leq \\rE_1^{-1} v - e^\\ve t/v\n\\end{aligned}\\]"}, "ineq:E1_Lambda": {"kind": "equation", "num": "88", "page": 54, "plain": "88", "ref": "(88)", "env": "", "title": "", "html": "\\[\n\n\t\\rE_1 \\Lambda (u+t e^u) \n\t= \\Phi_1(\\rE_1(u+t e^u)) \n\t\\leq \\Phi_1(\\rE_1 u+t) \n\t\\leq \\Phi_1 \\rE_1 u + \\rho t\n\t= \\rE_1 \\Lambda u + \\rho t,\n\\]"}, "corol:subadd_concave": {"kind": "corollary", "num": "C.2", "page": 54, "plain": "C.2", "ref": "Corollary C.2", "env": "corol:subadd_concave", "title": "", "html": "Let $\\Lambda : \\bR^X \\to \\bR^X$ be monotone and such that $u \\in \\bR^X \\mapsto \\Lambda u(x) \\in \\bR$ is concave, for all $x \\in X$. Then one has the equivalence, where $\\alpha,\\rho&gt; 0$ and $\\Phi_\\alpha := \\rE_\\alpha \\Lambda_\\infty \\rE_\\alpha^{-1}$\n\\[\n\t\\Phi_\\alpha  \\text{ is $\\rho$-sub-additive}\n\t\\ \\Leftrightarrow \\\n\t\\forall u \\in \\bR^X,\\ \\forall t \\geq 0,\\ \\Lambda\\big[u + t \\exp(\\frac u \\alpha)\\big] \\leq \\Lambda u + \\rho t \\exp(\\frac{\\Lambda u} \\alpha).\n\\]"}, "prop:subadd_alpha_beta": {"kind": "proposition", "num": "C.3", "page": 55, "plain": "C.3", "ref": "Proposition C.3", "env": "prop:subadd_alpha_beta", "title": "", "html": "Let $\\Lambda : \\bR^X \\to \\bR^X$ be monotone and $1$-sub-additive. If $\\Phi_\\alpha$ is $\\rho$-sub-additive for some $\\alpha,\\rho&gt;0$, then $\\Phi_\\beta$ is $\\sigma$-sub-additive for any $\\beta \\geq \\alpha$ and $\\sigma \\geq (1-\\frac \\alpha \\beta) + \\rho \\frac \\alpha \\beta$. \n(Note in addition that $(1-\\frac \\alpha \\beta) + \\rho \\frac \\alpha \\beta&lt;1$ if $\\rho&lt;1$.)"}, "prop:strict_causal_implies_subadd": {"kind": "proposition", "num": "C.4", "page": 55, "plain": "C.4", "ref": "Proposition C.4", "env": "prop:strict_causal_implies_subadd", "title": "", "html": "Let $\\Lambda : \\bR^X \\to \\bR^X$ be $\\delta$-strictly-causal, monotone, and $1$-sub-additive. \n\tThen $\\Phi_\\alpha$ is $\\rho := \\exp(-\\delta/\\alpha)$-sub-additive, for any $\\alpha&gt;0$."}, "prop:causal_implies_subadd": {"kind": "proposition", "num": "C.5", "page": 55, "plain": "C.5", "ref": "Proposition C.5", "env": "prop:causal_implies_subadd", "title": "", "html": "Let $\\Lambda : \\bR^X \\to \\bR^X$ be monotone, causal, additively invariant, \n$\\nu$-sub-multiplicative, and have $C_\\past$-memory, for some $C_\\past,\\nu&gt;0$.\nThen $\\Phi_\\alpha := \\rE_\\alpha \\Lambda_\\infty \\rE_\\alpha^{-1}$ is $\\rho$-sub-additive for any $\\alpha&gt;0$, where $\\rho \\in ]0,1[$ is defined as \n\\[\n\n\\rho := 1- \\frac {\\nu}{C_\\past} \\Big(1-\\exp(-\\frac{C_\\past} \\alpha)\\Big).\n\\]"}, "eqdef:rho_causal": {"kind": "equation", "num": "89", "page": 55, "plain": "89", "ref": "(89)", "env": "prop:causal_implies_subadd", "title": "", "html": ""}, "ineq:vt_ut": {"kind": "equation", "num": "90", "page": 56, "plain": "90", "ref": "(90)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\t\n\t\tv_t &amp;\\geq u_t \\text{ on } \\{-C_\\past \\leq u_t \\leq \\Lambda u_t(x)\\}, &amp;\n\t\tv_t \\geq \\Lambda u_t(x) \\text{ on } \\{ u_t \\geq \\Lambda u_t(x)\\}.\n\t\\end{aligned}\\]"}, "ineq:uv_st": {"kind": "equation", "num": "91", "page": 56, "plain": "91", "ref": "(91)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\t\n\t\tu_t(y) &amp;\\leq v_t(y) \\Leftrightarrow e^{-s} + \\tfrac {c}{C_\\past} s \\leq 1+C t,&amp;\n\t\t-C_\\past &amp;\\leq u_t(y) \\Leftrightarrow s - C_\\past \\leq t e^{-s}.\n\t\\end{aligned}\\]"}, "ineq:Lambda_ut_vt": {"kind": "equation", "num": "92", "page": 56, "plain": "92", "ref": "(92)", "env": "", "title": "", "html": "\\[\n\t\n\t\t\\Lambda u_t(x) \n\t\t\\leq \\Lambda v_t(x) \\leq (1+\\frac{c t}{C_\\past}) \\Lambda u(x) - \\frac {\\nu c t}{C_\\past} + t + C t^2  \n\t\t= \\rho t + C t^2,\n\t\\]"}}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>

<script>
const NODES = JSON.parse(document.getElementById('data').textContent);
const BY = Object.fromEntries(NODES.map(n => [n.id, n]));
const { algos: ALGOS, structs: STRUCTS } = JSON.parse(document.getElementById('algos').textContent);
const PAPER = JSON.parse(document.getElementById('paper').textContent);
const PL = PAPER.labels;
const STATEMENT_KINDS = ['theorem', 'lemma', 'proposition', 'corollary', 'remark', 'definition', 'assumption'];
const CH = {
  Intro: { label: 'Introduction', v: '--c-intro' },
  Subadd: { label: 'Sub-additivity', v: '--c-subadd' },
  Complexity: { label: 'Complexity', v: '--c-complexity' },
  AGSI2: { label: 'AGSI', v: '--c-agsi' },
  Notes: { label: 'Author notes', v: '--c-notes' },
};
const chapterOf = n => CH[n.chapter] ? n.chapter : 'Notes';
const usedBy = {};
NODES.forEach(n => n.direct.forEach(d => (usedBy[d] = usedBy[d] || []).push(n.id)));
const usedByAll = {};
NODES.forEach(n => n.deps.forEach(d => (usedByAll[d] = usedByAll[d] || []).push(n.id)));
document.getElementById('nTotal').textContent = NODES.length;

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inlineCode = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
// Names that link to a page of the site: data structures, the axioms (with their namespaces), and the
// states of the algorithms (to their algorithm).
const TARGETS = {};
Object.entries(ALGOS).forEach(([l, a]) => a.variants.forEach(v => [...v.state, ...v.step, ...v.loop].forEach(d => {
  TARGETS[d.name] = TARGETS[d.name] || 'label=' + l + '/' + d.name; })));
Object.entries(STRUCTS).forEach(([n, t]) => {
  TARGETS[n] = 'def=' + n;
  if (t.link_decls) t.sections.forEach(sec => sec.decls.forEach(d => { TARGETS[d.name] = 'def=' + n + '/' + d.name; }));
});
// Paper labels in the Lean texts, shown as printed references ("Prop. prop:x" -> "Proposition 2.5").
const LABEL_RE = new RegExp('(?:(?:Prop|Lem|Th|Thm|Corol|Algo|Def|Rem|Assum)\\.\\s+|(?:Lemma|Theorem|Proposition|Corollary|Remark|Algorithm|Assumption|Definition)\\s+|(?:[Ee]qs?)\\.\\s+|[Ll]ines?\\s+|item\\s+)?(' +
  Object.keys(PL).sort((a, b) => b.length - a.length).map(reEsc).join('|') + ')(?![\\w:])(?![^<]*>)', 'g');
const paperRefs = h => h.replace(LABEL_RE, (m, l) => {
  const r = /^[A-Z]/.test(m) ? PL[l].ref[0].toUpperCase() + PL[l].ref.slice(1) : PL[l].ref;
  return `<a class="pref" href="#label=${esc(l)}">${esc(r)}</a>`; });
const pref = l => PL[l] ? PL[l].ref : l;
function typeset(el) {
  if (!window.renderMathInElement) return;
  try {
    renderMathInElement(el, { delimiters: [
      { left: '\\[', right: '\\]', display: true }, { left: '$', right: '$', display: false },
      { left: '\\begin{align}', right: '\\end{align}', display: true },
      { left: '\\begin{gather}', right: '\\end{gather}', display: true }],
      macros: Object.assign({}, PAPER.macros), throwOnError: false,
      ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'option'] });
  } catch (e) {}
}
// The statement of the paper for a label (the enclosing statement for an item or an equation in it).
function paperBlock(l) {
  const info = PL[l];
  if (!info) return '';
  const envL = info.env && PL[info.env] ? info.env : l, env = PL[envL];
  let head = env.ref + (env.title ? ` (${env.title})` : '');
  if (envL !== l) head = info.kind === 'algorithm' ? `${info.ref[0].toUpperCase() + info.ref.slice(1)} (${env.title})` : head + `, ${info.ref}`;
  const body = env.html || info.html;
  return `<div class="paper"><div class="paper-h"><a href="#label=${esc(envL)}">${head}</a><span class="pg">p. ${info.page}</span></div>${body ? `<div class="ptext">${body}</div>` : ''}</div>`;
}
function primaryLabel(n) {
  const ls = n.labels.filter(l => PL[l]);
  return ls.find(l => STATEMENT_KINDS.includes(PL[l].kind) || PL[l].kind === 'algorithm') || ls[0];
}
const notesHTML = ns => ns && ns.length ? `<details class="notes"><summary>Formalization notes (${ns.length})</summary><ul>${ns.map(x => `<li>${paperRefs(inlineCode(x))}</li>`).join('')}</ul></details>` : '';
// longest names first, so that `AnbParams.WithUnknown` is not cut at `AnbParams`
const STRUCT_RE = new RegExp('(?<![\\w.])(' + Object.keys(TARGETS).sort((a, b) => b.length - a.length).map(reEsc).join('|') + ')(?![\\w\'])(?![^<]*>)', 'g');
function leanHL(src, ns = '') {  // ns: namespace of the code (`Ext.`, ...), for bare names
  return esc(src)
    .replace(/\b(theorem|structure|def|noncomputable|abbrev|where|open|in|fun|let|if|then|else|match|with|Type|Prop)\b/g, '<span class="kw">$1</span>')
    .replace(/(<span class="kw">(?:theorem|def|structure|abbrev)<\/span>\s+)([\w.'₀-₉]+)/, '$1<span class="nm">$2</span>')
    .replace(/(∀|∃|→|↔|∧|∨)/g, '<span class="kw">$1</span>')
    .replace(STRUCT_RE, m => `<a class="lnk" href="#${TARGETS[ns + m] || TARGETS[m]}">${m}</a>`);
}

// legend / filters
const active = new Set(Object.keys(CH));
const legend = document.getElementById('legend');
Object.entries(CH).forEach(([k, c]) => {
  const n = NODES.filter(x => chapterOf(x) === k).length;
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.setAttribute('aria-pressed', 'true'); b.id = 'chip-' + k;
  b.innerHTML = `<span class="dot" style="background:var(${c.v})"></span>${c.label} <span class="count">${n}</span>`;
  b.onclick = () => { active.has(k) ? active.delete(k) : active.add(k); b.setAttribute('aria-pressed', active.has(k)); applyFilter(); };
  legend.appendChild(b);
});

const elements = [];
NODES.forEach(n => elements.push({ data: { id: n.id, label: n.short, ch: chapterOf(n) } }));
NODES.forEach(n => n.direct.forEach(d => elements.push({ data: { id: d + '>' + n.id, source: d, target: n.id } })));

function style() {
  const s = [
    { selector: 'node', style: {
      'shape': 'round-rectangle', 'label': 'data(label)', 'font-family': 'JetBrains Mono, monospace', 'font-size': 10,
      'color': css('--node-text'), 'text-valign': 'center', 'text-halign': 'center',
      'background-color': css('--panel'), 'border-width': 2, 'width': 'label', 'height': 22, 'padding': '6px' } },
    { selector: 'edge', style: { 'width': 1, 'line-color': css('--edge'), 'target-arrow-color': css('--edge'),
      'target-arrow-shape': 'triangle', 'arrow-scale': 0.7, 'curve-style': 'bezier' } },
    { selector: '.faded', style: { 'opacity': parseFloat(css('--fade')) } },
    { selector: 'edge.hi', style: { 'line-color': css('--edge-hi'), 'target-arrow-color': css('--edge-hi'), 'width': 1.6, 'opacity': 1 } },
    { selector: 'node.sel', style: { 'background-color': css('--accent-soft'), 'border-width': 3.5, 'font-weight': 'bold' } },
    { selector: 'node.match', style: { 'border-style': 'double', 'border-width': 4 } },
  ];
  Object.entries(CH).forEach(([k, c]) => s.push({ selector: `node[ch = "${k}"]`, style: { 'border-color': css(c.v) } }));
  return s;
}

cytoscape.use(cytoscapeDagre);
const cy = cytoscape({
  container: document.getElementById('cy'), elements, style: style(),
  layout: { name: 'dagre', rankDir: 'TB', nodeSep: 14, rankSep: 46, edgeSep: 6 },
  minZoom: 0.08, maxZoom: 2.5, wheelSensitivity: 0.25,
});

function applyFilter() {
  cy.batch(() => cy.nodes().forEach(n => n.style('display', active.has(n.data('ch')) ? 'element' : 'none')));
}

let current = null;
function select(id, center) {
  current = id;
  const n = BY[id];
  const anc = new Set(n.deps), desc = new Set(usedByAll[id] || []);
  cy.batch(() => {
    cy.elements().removeClass('faded hi sel');
    cy.nodes().forEach(x => { const i = x.id(); if (i !== id && !anc.has(i) && !desc.has(i)) x.addClass('faded'); });
    cy.edges().forEach(e => {
      const s = e.source().id(), t = e.target().id();
      const inA = (t === id || anc.has(t)) && (anc.has(s));
      const inD = (s === id || desc.has(s)) && desc.has(t);
      if (inA || inD) e.addClass('hi'); else e.addClass('faded');
    });
    cy.getElementById(id).addClass('sel');
  });
  if (center) cy.animate({ center: { eles: cy.getElementById(id) }, zoom: Math.max(cy.zoom(), 0.9) }, { duration: 250 });
  renderPanel(n);
  markRow(id);
  try { localStorage.setItem('psm-sel', id); } catch (e) {}
}

function refList(ids) {
  if (!ids || !ids.length) return '<p class="empty">None</p>';
  return '<ul>' + ids.slice().sort().map(i => `<li><button type="button" class="ref" data-id="${esc(i)}">${esc(BY[i].short)}</button></li>`).join('') + '</ul>';
}
function renderPanel(n) {
  const c = CH[chapterOf(n)];
  const p = document.getElementById('panel');
  p.innerHTML = `
    <div class="eyebrow"><span class="tag" style="background:var(${c.v})">${c.label}</span><span class="proved">Proved</span></div>
    ${primaryLabel(n) ? paperBlock(primaryLabel(n)) : ''}
    <h2>${esc(n.short)}</h2>
    <p class="title">${inlineCode(n.title)}</p>
    <p class="source">${paperRefs(inlineCode(n.pub_source))}</p>
    <pre>${leanHL(n.statement, n.id.replace('GuaranteedSubsol.', '').replace(/[^.]*$/, ''))}</pre>
    ${n.pub_doc ? `<details><summary>Docstring</summary><p class="doc">${paperRefs(inlineCode(n.pub_doc))}</p></details>` : ''}
    ${notesHTML(n.notes)}
    ${n.labels.map(l => { const o = NODES.filter(m => m.id !== n.id && m.labels.includes(l)).map(m => m.id);
      const a = ALGOS[l] ? `<button type="button" class="linkbtn" data-algo="${esc(l)}">Show the algorithm</button>` : '';
      return o.length || a ? `<div class="refs"><h3>Other anchors for ${esc(pref(l))}${a}</h3>${o.length ? refList(o) : ''}</div>` : ''; }).join('')}
    <div class="refs"><h3>Uses directly (${n.direct.length}; ${n.deps.length} in all)</h3>${refList(n.direct)}</div>
    <div class="refs"><h3>Used directly by (${(usedBy[n.id] || []).length}; ${(usedByAll[n.id] || []).length} in all)</h3>${refList(usedBy[n.id])}</div>
    <p class="meta">Anchor file <code>${esc(n.file)}</code> · proof <code>${esc(n.provider)}</code></p>`;
  p.querySelectorAll('.ref').forEach(b => b.onclick = () => select(b.dataset.id, true));
  p.querySelectorAll('.linkbtn').forEach(b => b.onclick = () => { location.hash = 'label=' + b.dataset.algo; });
  typeset(p);
}

// An algorithm of the paper: its Lean state, the step of its main loop, the loop itself, and the
// anchors citing it.
function declHTML(d, open) {
  return `<details class="decl"${open ? ' open' : ''}><summary>${esc(d.name)}</summary>
    <p class="ddoc">${paperRefs(inlineCode(d.doc))}</p><pre>${leanHL(d.code, d.name.replace(/[^.]*$/, ''))}</pre>
    ${notesHTML(d.notes)}<p class="meta">${esc(d.file)}</p></details>`;
}
function focusDecl(p, focus) {
  const f = focus && [...p.querySelectorAll('details.decl')].find(e => e.querySelector('summary').textContent.trim() === focus);
  if (f) { f.open = true; f.scrollIntoView({ block: 'start' }); f.querySelector('summary').focus(); }
}
function renderAlgo(l, ids, focus) {
  current = null;
  const a = ALGOS[l], p = document.getElementById('panel');
  const sec = (t, ds, open) => ds.length ? `<div class="algo-sec"><h3>${t}</h3>${ds.map(d => declHTML(d, open)).join('')}</div>` : '';
  p.innerHTML = `
    <div class="eyebrow"><span class="tag" style="background:var(--c-complexity)">${esc(pref(l))}</span>${PL[l] ? `<span>p. ${PL[l].page}</span>` : ''}</div>
    <p class="title">${PL[l] && PL[l].title ? PL[l].title : esc(a.title)}</p>
    <p class="source">The Lean definitions of the algorithm: its state, one step of its main loop, and the loop with its stopping rule. Click a name to fold it.</p>
    ${a.variants.map(v => `${v.name ? `<p class="variant">${esc(v.name)}</p>` : ''}
      ${sec('State', v.state, true)}${sec('Step of the main loop', v.step, true)}${sec('Main loop and stopping', v.loop, false)}`).join('')}
    ${a.termination.length ? `<div class="algo-sec"><h3>Termination</h3>
      <p class="source">The theorems proving that the algorithm stops. Open one to see its hypotheses and the statements its proof rests on.</p>
      ${a.termination.map(i => `<details class="decl" open><summary>${esc(BY[i].short)}<button type="button" class="linkbtn ref-open" data-id="${esc(i)}">Open</button></summary>
        <p class="ddoc">${inlineCode(BY[i].title)}. ${paperRefs(inlineCode(BY[i].pub_source))}</p><pre>${leanHL(BY[i].statement, BY[i].short.replace(/[^.]*$/, ''))}</pre></details>`).join('')}</div>` : ''}
    <div class="refs"><h3>Statements about this algorithm (${ids.length})</h3>${refList(ids)}</div>`;
  p.querySelectorAll('.ref-open').forEach(b => b.onclick = e => { e.preventDefault(); select(b.dataset.id, true); });
  p.querySelectorAll('.ref').forEach(b => b.onclick = () => select(b.dataset.id, true));
  p.scrollTop = 0;
  typeset(p);
  focusDecl(p, focus);
}

// A result of the paper: its statement, and the Lean statements that formalize it.
function renderLabel(l) {
  current = null;
  const ids = anchorsOf(l), p = document.getElementById('panel');
  highlight(ids);
  q.value = '';
  p.innerHTML = `
    <div class="eyebrow"><span class="tag" style="background:var(--accent)">Paper</span><span class="proved">${ids.length ? 'Formalized' : ''}</span></div>
    ${paperBlock(l)}
    <div class="algo-sec"><h3>Lean statements (${ids.length})</h3>
    ${ids.map(i => `<div class="anchor"><h4><span>${esc(BY[i].short)}</span><button type="button" class="linkbtn ref-open" data-id="${esc(i)}">Open</button></h4>
      <p class="atitle">${inlineCode(BY[i].title)}</p><pre>${leanHL(BY[i].statement, BY[i].short.replace(/[^.]*$/, ''))}</pre></div>`).join('') || '<p class="empty">No Lean statement cites it directly.</p>'}</div>`;
  p.querySelectorAll('.ref-open').forEach(b => b.onclick = () => select(b.dataset.id, true));
  p.scrollTop = 0;
  typeset(p);
  markRow(l);
  return true;
}
// The anchors of a label: those citing it, or citing a label inside it (an item, an equation).
function anchorsOf(l) {
  const inside = Object.keys(PL).filter(k => k === l || PL[k].env === l);
  return NODES.filter(n => n.labels.some(x => inside.includes(x))).map(n => n.id);
}
function highlight(ids) {
  cy.batch(() => {
    cy.elements().removeClass('faded hi sel match');
    const hits = cy.collection(ids.map(i => cy.getElementById(i)));
    hits.addClass('match');
    if (ids.length) cy.elements().not(hits).addClass('faded');
  });
  if (ids.length) { cy.zoom(0.9); cy.center(cy.getElementById(ids[0])); }
}

cy.on('tap', 'node', e => select(e.target.id(), false));
cy.on('tap', e => { if (e.target === cy && current) { cy.elements().removeClass('faded hi'); } });
document.getElementById('fit').onclick = () => cy.fit(undefined, 20);

const q = document.getElementById('q');
q.addEventListener('input', () => {
  const s = q.value.trim().toLowerCase();
  document.querySelectorAll('#list .row').forEach(r => { r.hidden = !!s && !r.dataset.text.includes(s); });
  cy.batch(() => {
    cy.nodes().removeClass('match');
    if (!s) return;
    const hits = cy.nodes().filter(x => { const n = BY[x.id()]; return (n.short + ' ' + n.source + ' ' + n.title).toLowerCase().includes(s); });
    hits.addClass('match');
    if (hits.length === 1) select(hits[0].id(), true);
  });
});

function restyle() { cy.style(style()); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', restyle);
new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// URL fragment: `#label=lem:max_min` (a paper label: its anchors are outlined, the first is shown)
// or `#GuaranteedSubsol.u_less_t` / `#u_less_t` (one anchor). Used by `\leancheck` in the paper.
// A data structure: its Lean definition, its operations, and the statements about it.
function renderStruct(name, focus) {
  current = null;
  const t = STRUCTS[name], p = document.getElementById('panel');
  const ids = t.statements ? NODES.filter(n => new RegExp('\\b' + reEsc(name) + '\\b').test(n.statement)).map(n => n.id) : [];
  cy.batch(() => {
    cy.elements().removeClass('faded hi sel match');
    const hits = cy.collection(ids.map(i => cy.getElementById(i)));
    hits.addClass('match');
    if (ids.length) cy.elements().not(hits).addClass('faded');
  });
  if (ids.length) { cy.zoom(0.9); cy.center(cy.getElementById(ids[0])); }
  q.value = name;
  p.innerHTML = `
    <div class="eyebrow"><span class="tag" style="background:var(--c-notes)">Data structure</span><code>${esc(name)}</code></div>
    <p class="title">${esc(t.title)}</p>
    ${t.sections.map(sec => `<div class="algo-sec"><h3>${esc(sec.title)}</h3>${sec.decls.map(d => declHTML(d, sec.open)).join('')}</div>`).join('')}
    ${t.statements ? `<div class="refs"><h3>Statements using it (${ids.length})</h3>${refList(ids)}</div>` : ''}`;
  p.querySelectorAll('.ref').forEach(b => b.onclick = () => select(b.dataset.id, true));
  p.scrollTop = 0;
  typeset(p);
  focusDecl(p, focus);
  markRow('def=' + name);
  return true;
}
function showLabel(l, focus) {
  const ids = NODES.filter(n => n.labels.includes(l)).map(n => n.id);
  if (!ids.length && !ALGOS[l]) return false;
  if (ALGOS[l]) {
    cy.batch(() => {
      cy.elements().removeClass('faded hi sel match');
      const hits = cy.collection(ids.map(i => cy.getElementById(i)));
      hits.addClass('match');
      cy.elements().not(hits).addClass('faded');
    });
    q.value = l;
    renderAlgo(l, ids, focus);
    markRow(l);
    if (ids.length) { cy.zoom(0.9); cy.center(cy.getElementById(ids[0])); }
    return true;
  }
  return null;
}
function fromHash() {
  let h = location.hash.slice(1);
  try { h = decodeURIComponent(h); } catch (e) {}
  if (!h) return false;
  if (h.startsWith('def=')) {
    const [n, ...f] = h.slice(4).split('/');
    return STRUCTS[n] ? renderStruct(n, f.join('/')) : false;
  }
  if (h.startsWith('label=')) {
    const [l, ...f] = h.slice(6).split('/'), ids = NODES.filter(n => n.labels.includes(l)).map(n => n.id);
    if (ALGOS[l]) return showLabel(l, f.join('/'));
    if (!PL[l] && !ids.length) return false;
    return renderLabel(l);
  }
  const id = BY[h] ? h : BY['GuaranteedSubsol.' + h] ? 'GuaranteedSubsol.' + h : null;
  if (!id) return false;
  select(id, true);
  return true;
}
// on a phone the panel is below the list: bring it into view
const toPanel = () => { if (matchMedia('(max-width: 860px)').matches) document.getElementById('panel').scrollIntoView({ block: 'start' }); };
window.addEventListener('hashchange', () => { if (fromHash()) toPanel(); });

// The list view: the results of the paper in order, by section, then the pages of definitions and the
// statements that are not in the paper.
function sectionOf(page) {
  let sec = PAPER.sections[0];
  PAPER.sections.forEach(x => { if (x.page <= page) sec = x; });
  return sec;
}
const numKey = x => (x.num || '').split('.').map(t => t.padStart(4, '0')).join('.');
function buildList() {
  const items = Object.entries(PL).filter(([l, x]) => STATEMENT_KINDS.includes(x.kind) || (x.kind === 'algorithm' && x.env === l)
    || (x.kind === 'equation' && !x.env && anchorsOf(l).length))
    .filter(([l, x]) => !(x.kind === 'algorithm' && !ALGOS[l] && !anchorsOf(l).length))
    .sort((a, b) => a[1].page - b[1].page || numKey(a[1]).localeCompare(numKey(b[1])));
  const groups = [];
  items.forEach(([l, x]) => {
    const sec = sectionOf(x.page);
    if (!groups.length || groups[groups.length - 1].sec !== sec) groups.push({ sec, rows: [] });
    groups[groups.length - 1].rows.push([l, x]);
  });
  const row = (key, ref, title, count, text) => `<button type="button" class="row" data-key="${esc(key)}" data-text="${esc(text.toLowerCase())}"><span class="rref">${ref}</span><span class="rtitle">${title}</span><span class="rcount">${count}</span></button>`;
  const lean = n => n ? `${n} Lean statement${n > 1 ? 's' : ''}` : '—';
  let h = groups.map(g => `<h3>${esc(g.sec.num)}. ${g.sec.title}</h3>` + g.rows.map(([l, x]) => {
    const ids = anchorsOf(l);
    return row('label=' + l, esc(x.kind === 'equation' ? 'Equation ' + x.ref : x.ref), x.title || '', ALGOS[l] ? 'Lean definitions' + (ids.length ? ', ' + lean(ids.length) : '') : lean(ids.length),
      [x.ref, x.title, l, ...ids.map(i => BY[i].short)].join(' '));
  }).join('')).join('');
  h += '<h3>Lean definitions</h3>' + Object.entries(STRUCTS).map(([n, t]) => row('def=' + n, esc(n), esc(t.title), '', n + ' ' + t.title)).join('');
  const other = NODES.filter(n => !n.labels.some(l => PL[l]));
  if (other.length) h += '<h3>Lean statements not in the paper</h3>' + other.map(n => row(n.id, `<code>${esc(n.short)}</code>`, inlineCode(n.title), '', n.short + ' ' + n.title)).join('');
  const el = document.getElementById('list');
  el.innerHTML = h;
  el.querySelectorAll('.row').forEach(b => b.onclick = () => { location.hash = b.dataset.key; });
  typeset(el);
}
function markRow(key) {
  document.querySelectorAll('#list .row').forEach(r => r.setAttribute('aria-current', r.dataset.key === key ? 'true' : 'false'));
}
function setView(v) {
  const list = v === 'list';
  document.getElementById('list').hidden = !list;
  document.getElementById('cy').hidden = list;
  document.getElementById('legend').hidden = list;
  document.getElementById('fit').hidden = list;
  document.getElementById('vList').setAttribute('aria-pressed', list);
  document.getElementById('vGraph').setAttribute('aria-pressed', !list);
  if (!list) { cy.resize(); if (current) cy.center(cy.getElementById(current)); }
  try { localStorage.setItem('psm-view', v); } catch (e) {}
}
document.getElementById('vList').onclick = () => setView('list');
document.getElementById('vGraph').onclick = () => setView('graph');
buildList();

let start = 'GuaranteedSubsol.anbRun_complexity', view = 'list';
try { const s = localStorage.getItem('psm-sel'); if (s && BY[s]) start = s; view = localStorage.getItem('psm-view') || view; } catch (e) {}
setView(view);
cy.fit(undefined, 20);
if (fromHash()) toPanel(); else select(start, false);
</script>
</body>
</html>

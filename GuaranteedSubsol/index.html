of the statement. `X` is finite (standing assumption).", "notes": ["author ruling", "Author ruling: the assumption `ν > 0` is dropped, being unneeded"], "title": "causality implies sub-additivity in Kruzkov coordinates", "source": "Prop. prop:causal_implies_subadd (Subadd.tex), scalar form; `ν > 0` dropped (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.CausalSubaddProof.subAdditive_kruzkovOp_of_causal", "chapter": "Subadd", "statement": "theorem subAdditive_kruzkovOp_of_causal {X : Type*} [Finite X] {Λ : (X → ℝ) → ℝ}\n    (hmono : Monotone Λ) (hcaus : Causal Λ) (hadd : AdditivelyInvariant Λ) {ν C α : ℝ}\n    (hC : 0 < C) (hsubm : SubMultiplicative ν Λ) (hmem : HasMemory C Λ)\n    (hα : 0 < α) :\n    SubAdditive (1 - ν / C * (1 - Real.exp (-C / α))) (kruzkovOp α Λ)", "doc": "Source: Prop. prop:causal_implies_subadd (Subadd.tex), scalar form: if `Λ` is monotone, causal,\nadditively invariant, `ν`-sub-multiplicative and has `C`-memory (`C = C_past`), with `ν, C > 0`,\nthen `Φ_α` is `ρ`-sub-additive for any `α > 0`, where `ρ := 1 - (ν/C)(1 - exp(-C/α))`. The\npaper's remark `ρ < 1` is not part of the statement. Author ruling: the assumption `ν > 0` is\ndropped, being unneeded. `X` is finite (standing assumption).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.Causal.apply_eq_apply_min", "GuaranteedSubsol.HasMemory.apply_eq_apply_max", "GuaranteedSubsol.apply_le_apply_of_causal_memory", "GuaranteedSubsol.apply_le_apply_of_causal_memory_of_lt", "GuaranteedSubsol.subAdditive_of_kruzkov_local", "GuaranteedSubsol.local_iff_local_x"], "labels": ["prop:causal_implies_subadd"], "direct": ["GuaranteedSubsol.apply_le_apply_of_causal_memory", "GuaranteedSubsol.local_iff_local_x", "GuaranteedSubsol.subAdditive_of_kruzkov_local"]}, {"id": "GuaranteedSubsol.parallelAgsiStep_superSolution", "short": "parallelAgsiStep_superSolution", "file": "Anchors/ParallelAgsiStepSuperSolution.lean", "pub_source": "Algo. algo:agsi_parallel, invariant `Φ v ≤ v` (proof of Prop. prop:cplx_agsi_parallel)", "pub_doc": "Source: Algorithm algo:agsi_parallel  and the proof of Prop. prop:cplx_agsi_parallel: for a monotone `Φ`, if `v` is a super-solution (`Φ v ≤ v`), it remains so at all times in the algorithm (via Prop. prop:partialMonotone).", "notes": [], "title": "the parallel AGSI preserves super-solutions", "source": "Algo. algo:agsi_parallel (AGSI2.tex), invariant `Φ v ≤ v` (proof of Prop. prop:cplx_agsi_parallel)", "state": "PROVED", "provider": "GuaranteedSubsol.ParallelAgsiProof.superSolution", "chapter": "AGSI2", "statement": "theorem parallelAgsiStep_superSolution {X : Type*} {Φ : (X → ℝ) → X → ℝ} (hmono : Monotone Φ)\n    (η : ℝ) {s : ParallelAgsiState X} (hs : Φ s.v ≤ s.v) (n : ℕ) :\n    Φ ((parallelAgsiStep Φ η)^[n] s).v ≤ ((parallelAgsiStep Φ η)^[n] s).v", "doc": "Source: Algorithm algo:agsi_parallel (AGSI2.tex) and the proof of Prop. prop:cplx_agsi_parallel:\nfor a monotone `Φ`, if `v` is a super-solution (`Φ v ≤ v`), it remains so at all times in the\nalgorithm (via Prop. prop:partialMonotone).", "deps": ["GuaranteedSubsol.restrictOp_superSolution"], "labels": ["algo:agsi_parallel", "prop:cplx_agsi_parallel"], "direct": ["GuaranteedSubsol.restrictOp_superSolution"]}, {"id": "GuaranteedSubsol.parallelAgsiRun_count_le", "short": "parallelAgsiRun_count_le", "file": "Anchors/ParallelAgsiRunCountLe.lean", "pub_source": "Algo. algo:agsi_parallel, total number of updates; `η > 0` dropped; restated with `parallelAgsiRun`, equal by definition", "pub_doc": "Hence `η` times the total number of updates is at most `∑_X (v - w)`.", "notes": ["V0 formalizationInstruction, removed in V1; author's request", "author ruling", "author ruling", "author ruling", "renamed to the naming scheme", "author's request", "Source: Algorithm algo:agsi_parallel  and a V0 `\\formalizationInstruction` below it, removed in V1 : if `Φ` is monotone, satisfies the comparison principle and admits a sub-solution `w`, and `v` is a super-solution, then `v` stays above `w`, while `∑_X v` decreases by more than `η` at each update `v(x) ← Φ v(x)`", "Author ruling: the assumption `η > 0` is dropped, being unneeded"], "title": "bound on the total number of updates of the parallel AGSI", "source": "Algo. algo:agsi_parallel (AGSI2.tex), total number of updates (V0 formalizationInstruction, removed in V1; author's request); `η > 0` dropped (author ruling); restated with `parallelAgsiRun`, equal by definition (author ruling); renamed to the naming scheme (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.ParallelAgsiProof.count_le", "chapter": "AGSI2", "statement": "theorem parallelAgsiRun_count_le {X : Type*} [Fintype X] {Φ : (X → ℝ) → X → ℝ} (hmono : Monotone Φ)\n    (hcomp : HasComparisonPrinciple Set.univ Φ) {w : X → ℝ} (hw : w ≤ Φ w) {η : ℝ}\n    {v : X → ℝ} (hv : Φ v ≤ v) (n : ℕ) :\n    η * ∑ x, ((parallelAgsiRun Φ η v n).count x : ℝ) ≤ ∑ x, (v x - w x)", "doc": "Source: Algorithm algo:agsi_parallel (AGSI2.tex) and a V0 `\\formalizationInstruction` below it,\nremoved in V1 (author's request): if `Φ` is\nmonotone, satisfies the comparison principle and admits a sub-solution `w`, and `v` is a\nsuper-solution, then `v` stays above `w`, while `∑_X v` decreases by more than `η` at each update\n`v(x) ← Φ v(x)`. Hence `η` times the total number of updates is at most `∑_X (v - w)`.\nAuthor ruling: the assumption `η > 0` is dropped, being unneeded.", "deps": ["GuaranteedSubsol.restrictOp_superSolution", "GuaranteedSubsol.parallelAgsiStep_superSolution"], "labels": ["algo:agsi_parallel"], "direct": ["GuaranteedSubsol.parallelAgsiStep_superSolution"]}, {"id": "GuaranteedSubsol.parallelAgsiRun_terminates", "short": "parallelAgsiRun_terminates", "file": "Anchors/ParallelAgsiRunTerminates.lean", "pub_source": "Algo. algo:agsi_parallel, termination with a bound on the passes; restated with `parallelAgsiRun`, equal by definition", "pub_doc": "", "notes": ["V0 formalizationInstruction, removed in V1; author's request", "author ruling", "author ruling", "renamed to the naming scheme", "author's request", "Source: Algorithm algo:agsi_parallel  and a V0 `\\formalizationInstruction` below it, removed in V1 : under the assumptions of `parallelAgsiRun_count_le`, the while loop terminates, i.e. the stopping criterion `v - Φ v ≤ η` holds after `n` passes, with the explicit bound `n ≤ ⌈∑_X (v - w) / η⌉₊`"], "title": "termination of the parallel AGSI", "source": "Algo. algo:agsi_parallel (AGSI2.tex), termination with a bound on the passes (V0 formalizationInstruction, removed in V1; author's request); restated with `parallelAgsiRun`, equal by definition (author ruling); renamed to the naming scheme (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.ParallelAgsiProof.terminates", "chapter": "AGSI2", "statement": "theorem parallelAgsiRun_terminates {X : Type*} [Fintype X] {Φ : (X → ℝ) → X → ℝ}\n    (hmono : Monotone Φ) (hcomp : HasComparisonPrinciple Set.univ Φ) {w : X → ℝ}\n    (hw : w ≤ Φ w) {η : ℝ} (hη : 0 < η) {v : X → ℝ} (hv : Φ v ≤ v) :\n    ∃ n ≤ ⌈(∑ x, (v x - w x)) / η⌉₊, ∀ x,\n      (parallelAgsiRun Φ η v n).v x - Φ (parallelAgsiRun Φ η v n).v x ≤ η", "doc": "Source: Algorithm algo:agsi_parallel (AGSI2.tex) and a V0 `\\formalizationInstruction` below it,\nremoved in V1 (author's request): under the\nassumptions of `parallelAgsiRun_count_le`, the while loop terminates, i.e. the stopping criterion\n`v - Φ v ≤ η` holds after `n` passes, with the explicit bound `n ≤ ⌈∑_X (v - w) / η⌉₊`.", "deps": ["GuaranteedSubsol.restrictOp_superSolution", "GuaranteedSubsol.parallelAgsiStep_superSolution", "GuaranteedSubsol.parallelAgsiRun_count_le"], "labels": ["algo:agsi_parallel"], "direct": ["GuaranteedSubsol.parallelAgsiRun_count_le"]}, {"id": "GuaranteedSubsol.parallelAgsiRun_count_le_of_subAdditive", "short": "parallelAgsiRun_count_le_of_subAdditive", "file": "Anchors/ParallelAgsiRunCountLeOfSubAdditive.lean", "pub_source": "Prop. prop:cplx_agsi_parallel, super-solution case; `0 < ρ` as in the paper; restated with `parallelAgsiRun`, equal by definition", "pub_doc": "Source: Prop. prop:cplx_agsi_parallel, super-solution case: if `Φ` is monotone and `ρ`-sub-additive with `ρ < 1`, and the input satisfies `0 ≤ v - Φ v ≤ C`, then the parallel AGSI with tolerance `η > 0` performs at most `N''_Φ:= ⌈ln((1 - ρ) C/η) / (-ln ρ)⌉₊ + 2/(1 - ρ)²` updates `v(x) ← Φ v(x)` at any given point `x`, whatever the number `n` of passes. The hypothesis `0 < ρ` (`ln ρ`) is as in the paper. It loses no generality, since a `0`-sub-additive `Φ` is `ρ`-sub-additive for any `ρ > 0`. `X` is finite (standing assumption).", "notes": ["author ruling", "author ruling", "renamed to the naming scheme"], "title": "number of updates per point of the parallel AGSI", "source": "Prop. prop:cplx_agsi_parallel (AGSI2.tex), super-solution case; `0 < ρ` as in V1; restated with `parallelAgsiRun`, equal by definition (author ruling); renamed to the naming scheme (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.ParallelAgsiCplxProof.count_le_of_subAdditive", "chapter": "AGSI2", "statement": "theorem parallelAgsiRun_count_le_of_subAdditive {X : Type*} [Finite X]\n    {Φ : (X → ℝ) → X → ℝ} (hmono : Monotone Φ) {ρ : ℝ} (hρ0 : 0 < ρ) (hρ1 : ρ < 1)\n    (hsub : ∀ x, SubAdditive ρ (Φ · x)) {η C : ℝ} (hη : 0 < η) {v : X → ℝ}\n    (hv : Φ v ≤ v) (hvC : ∀ x, v x - Φ v x ≤ C) (n : ℕ) (x : X) :\n    ((parallelAgsiRun Φ η v n).count x : ℝ) ≤\n      ⌈Real.log ((1 - ρ) * C / η) / (-Real.log ρ)⌉₊ + 2 / (1 - ρ) ^ 2", "doc": "Source: Prop. prop:cplx_agsi_parallel (AGSI2.tex), super-solution case: if `Φ` is monotone and\n`ρ`-sub-additive with `ρ < 1`, and the input satisfies `0 ≤ v - Φ v ≤ C`, then the parallel\nAGSI with tolerance `η > 0` performs at most\n`N''_Φ := ⌈ln((1 - ρ) C/η) / (-ln ρ)⌉₊ + 2/(1 - ρ)²` updates `v(x) ← Φ v(x)` at any given point\n`x`, whatever the number `n` of passes. The hypothesis `0 < ρ` (`ln ρ`) is as in V1. It loses no\ngenerality, since a `0`-sub-additive `Φ` is `ρ`-sub-additive for any `ρ > 0`. `X` is finite\n(standing assumption).", "deps": ["GuaranteedSubsol.restrictOp_superSolution", "GuaranteedSubsol.norm_sub_le_of_subAdditive", "GuaranteedSubsol.existsUnique_fixedPoint_of_subAdditive", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.parallelAgsiStep_superSolution"], "labels": ["prop:cplx_agsi_parallel"], "direct": ["GuaranteedSubsol.existsUnique_fixedPoint_of_subAdditive", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.parallelAgsiStep_superSolution"]}, {"id": "GuaranteedSubsol.parallelAgsiSubStep_iterate", "short": "parallelAgsiSubStep_iterate", "file": "Anchors/ParallelAgsiSubStepIterate.lean", "pub_source": "Algo. algo:agsi_parallel, sub-solution variant = reflected super-solution version", "pub_doc": "Source: Algorithm algo:agsi_parallel, sub-solution variant (`v - Φ v` replaced with `Φ v - v`); After `n` passes, the sub-solution variant on `Φ` from the state `s` is the super-solution version on the reflected operator `reflectOp Φ = (v ↦ -Φ (-v))` from the negated state `s.neg`, negated back.", "notes": ["author's request", "author ruling", "renamed to the naming scheme", "author's request"], "title": "the sub-solution parallel AGSI is the reflected super-solution one", "source": "Algo. algo:agsi_parallel (AGSI2.tex), sub-solution variant = reflected super-solution version (author's request); renamed to the naming scheme (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.ParallelAgsiSubProof.parallelAgsiSubStep_iterate", "chapter": "AGSI2", "statement": "theorem parallelAgsiSubStep_iterate {X : Type*} {Φ : (X → ℝ) → X → ℝ} {η : ℝ}\n    (s : ParallelAgsiState X) (n : ℕ) :\n    (parallelAgsiSubStep Φ η)^[n] s = ((parallelAgsiStep (reflectOp Φ) η)^[n] s.neg).neg", "doc": "Source: Algorithm algo:agsi_parallel (AGSI2.tex), sub-solution variant (`v - Φ v` replaced with\n`Φ v - v`); author's reques nearly ordered (tie-breaking).", "notes": [], "title": "the initial guess of Dijkstra's method in the ANB is a super-solution", "source": "Prop. prop:Dijkstra_band (Complexity.tex), first claim: the guess `uHatInit` (eq. eqdef:Dijkstra_supsol) is a super-solution of `Γ'`; hypotheses on `Λ` not used, `0 ≤ τ` added", "state": "PROVED", "provider": "GuaranteedSubsol.AnbProof.guess_run", "chapter": "Complexity", "statement": "theorem anbRun_guess_superSolution {X : Type*} [Fintype X] [LinearOrder X] {p : AnbParams X}\n    (hΓmono : ∀ x, Monotone (p.Γ · x)) (hΓcaus : ∀ x, Causal (p.Γ · x)) (hα : 0 < p.α)\n    (hτ : 0 ≤ p.τ) (k : ℕ) :\n    anbHatOp p.Γ (anbRun p k).uSub ((anbRun p k).n * p.τ) (anbRun p k).uHatInit ≤\n      (anbRun p k).uHatInit", "doc": "Source: Prop. prop:Dijkstra_band (Complexity.tex), first claim: along the run of the ANB, the\ninitial guess `uHatInit` of Dijkstra's method at line anb:hatu (the map `u` of\neq. eqdef:Dijkstra_supsol, `anbDijkstraGuess`; `0` at `n = 0`) is a super-solution of\n`Γ' = max (ū_n, min (nτ, Γ_∞))`, so that Dijkstra's method computes `û_n`\n(`anbStepData_uHat_eq`). `Γ` is monotone and causal, `α > 0`, `τ ≥ 0`; the hypotheses on `Λ` of\nProp. prop:always_subsol are not used. `X` is finite and linearly ordered (tie-breaking).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbStep_eq_of_notMem_band"], "labels": ["prop:Dijkstra_band", "eqdef:Dijkstra_supsol"], "direct": ["GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbStep_eq_of_notMem_band"]}, {"id": "GuaranteedSubsol.anbRun_hatRun_count_mem", "short": "anbRun_hatRun_count_mem", "file": "Anchors/AnbRunHatRunCountMem.lean", "pub_source": "Prop. prop:Dijkstra_band, last claim: Dijkstra's updates lie in `B'_n` (eq. eqdef:Bpn); hypotheses on `Λ` not used, `0 ≤ τ` added; uses `anbRunData`, `AnbStepData.tMinus`", "pub_doc": "Source: Prop. prop:Dijkstra_band, last claim: the points updated by Dijkstra's method at line anb:hatu of iteration `n = k + 1` belong to `B'_n = {x | t⁻_{n-1} ≤ û_{n-1}(x) ∧ û_n(x) < nτ}` (eq. eqdef:Bpn, `anbDijkstraBand`), with `t⁻_{n-1} = t_{n-1} - Δ_{n-1}` (`AnbStepData.tMinus`). Iteration `n = 0` updates no point (`anbRun_zero_vacuous`). `Γ` is monotone and causal, `α > 0`, `τ ≥ 0`; the hypotheses on `Λ` of Prop. prop:always_subsol are not used. `X` is finite and linearly ordered (tie-breaking).", "notes": [], "title": "Dijkstra's method in the ANB only updates points of `B'_n`", "source": "Prop. prop:Dijkstra_band (Complexity.tex), last claim: Dijkstra's updates lie in `B'_n` (eq. eqdef:Bpn); hypotheses on `Λ` not used, `0 ≤ τ` added; uses `anbRunData`, `AnbStepData.tMinus`", "state": "PROVED", "provider": "GuaranteedSubsol.AnbProof.hatRun_count_mem", "chapter": "Complexity", "statement": "theorem anbRun_hatRun_count_mem {X : Type*} [Fintype X] [LinearOrder X] {p : AnbParams X}\n    (hΓmono : ∀ x, Monotone (p.Γ · x)) (hΓcaus : ∀ x, Causal (p.Γ · x)) (hα : 0 < p.α)\n    (hτ : 0 ≤ p.τ) {k : ℕ} {x : X} (hx : (anbRunData p (k + 1)).hatRun.count x ≠ 0) :\n    x ∈ anbDijkstraBand (anbRunData p k).tMinus (((k + 1 : ℕ) : ℝ) * p.τ)\n      (anbRunData p k).uHat (anbRunData p (k + 1)).uHat", "doc": "Source: Prop. prop:Dijkstra_band (Complexity.tex), last claim: the points updated by Dijkstra's\nmethod at line anb:hatu of iteration `n = k + 1` belong to\n`B'_n = {x | t⁻_{n-1} ≤ û_{n-1}(x) ∧ û_n(x) < nτ}` (eq. eqdef:Bpn, `anbDijkstraBand`), with\n`t⁻_{n-1} = t_{n-1} - Δ_{n-1}` (`AnbStepData.tMinus`). Iteration `n = 0` updates no point\n(`anbRun_zero_vacuous`). `Γ` is monotone and causal, `α > 0`, `τ ≥ 0`; the hypotheses on `Λ` of\nProp. prop:always_subsol are not used. `X` is finite and linearly ordered (tie-breaking).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_count_le_one", "GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbStep_eq_of_notMem_band", "GuaranteedSubsol.anbRun_guess_superSolution"], "labels": ["prop:Dijkstra_band", "eqdef:Bpn"], "direct": ["GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "GuaranteedSubsol.dijkstraRun_count_le_one"]}, {"id": "GuaranteedSubsol.anbRunData_band_bounds", "short": "anbRunData_band_bounds", "file": "Anchors/AnbRunDataBandBounds.lean", "pub_source": "Corol. corol:Bn_comp, first inclusion `B_n ⊂ {t⁻_n ≤ u_* < t⁺_n}`; used parts of assum:all, plus `Λ[0] ≥ 0` (a consequence of assum:all, see the remark after prop:always_subsol), a fixed point `u_*` and the comparison principle (eq. eq:comparison_Lambda, as in the paper; not in assum:all); `Γ` additively invariant, finite super-solution and positive boundary conditions omitted (unused)", "pub_doc": "Source: Corollary corol:Bn_comp, first inclusion: in iteration `n = k` of the ANB, `B_n ⊂ {t⁻_n ≤ u_* < t⁺_n}`, with `t⁻_n = t_n - Δ_n` (`AnbStepData.tMinus`) and `t⁺_n = (1 + ε) t_n + C_past + C'_Γ + C_Γ Δ_n` (`AnbStepData.tPlus`). Hypotheses: the parts of Assumption assum:all used by the proof, in the form of `subsol_growth` (shared Dirichlet data `ubd` outside `I = Int X`; `Λ` monotone with `Λ[0] ≥ 0`, additively invariant, with `C_past`-memory and `C_Γ, C'_Γ`-comparable with `Γ` on `Int X`; `Γ` monotone, causal, `Γ ≤ Λ`), the comparison principle (eq. eq:comparison_Lambda, as in the paper; see `le_of_subSolution_superSolution`), a fixed point `u_*` (`uFix`) of `Λ`, and `α > 0`, `τ ≥ 0`, `ε > 0`. `Γ` additively invariant, the finite super-solution (`u_*` is one) and the positive boundary conditions (beyond `Λ[0] ≥ 0`) are not used, hence omitted. `X` is finite and linearly ordered (tie-breaking).", "notes": [], "title": "the exact solution on the narrow band `B_n` of the ANB", "source": "Corol. corol:Bn_comp (Complexity.tex), first inclusion `B_n ⊂ {t⁻_n ≤ u_* < t⁺_n}`; used parts of assum:all, plus `Λ[0] ≥ 0` (a consequence of assum:all, see the remark after prop:always_subsol), a fixed point `u_*` and the comparison principle (eq. eq:comparison_Lambda, as in V1; not in assum:all); `Γ` additively invariant, finite super-solution and positive boundary conditions omitted (unused)", "state": "PROVED", "provider": "GuaranteedSubsol.AnbBnCompProof.band_bounds", "chapter": "Complexity", "statement": "theorem anbRunData_band_bounds {X : Type*} [Fintype X] [LinearOrder X] {p : AnbParams X}\n    {I : Set X} {ubd : X → ℝ} (hΛbd : ∀ u, ∀ x ∉ I, p.Λ u x = ubd x)\n    (hΓbd : ∀ u, ∀ x ∉ I, p.Γ u x = ubd x) {Cpast CΓ CΓ' : ℝ} (hCpast : 0 ≤ Cpast)\n    (hCΓ : 1 ≤ CΓ) (hCΓ' : 0 ≤ CΓ') (hΛmono : ∀ x, Monotone (p.Λ · x)) (hΛ0 : 0 ≤ p.Λ 0)\n    (hadd : ∀ x ∈ I, AdditivelyInvariant (p.Λ · x)) (hmem : ∀ x ∈ I, HasMemory Cpast (p.Λ · x))\n    (hcmp : ∀ x ∈ I, Comparable CΓ CΓ' (p.Λ · x) (p.Γ · x))\n    (hΓmono : ∀ x, Monotone (p.Γ · x)) (hΓcaus : ∀ x, Causal (p.Γ · x))\n    (hΓΛ : ∀ u, p.Γ u ≤ p.Λ u) (hcomp : ∀ J : Set X, HasComparisonPrinciple J p.Λ)\n    {uFix : X → ℝ} (hfix : p.Λ uFix = uFix) (hα : 0 < p.α) (hτ : 0 ≤ p.τ) (hε : 0 < p.ε)\n    (k : ℕ) {x : X} (hx : x ∈ (anbRunData p k).band) :\n    (anbRunData p k).tMinus ≤ uFix x ∧ uFix x < (anbRunData p k).tPlus p.ε Cpast CΓ CΓ'", "doc": "Source: Corollary corol:Bn_comp (Complexity.tex), first inclusion: in iteration `n = k` of the\nANB, `B_n ⊂ {t⁻_n ≤ u_* < t⁺_n}`, with `t⁻_n = t_n - Δ_n` (`AnbStepData.tMinus`) and\n`t⁺_n = (1 + ε) t_n + C_past + C'_Γ + C_Γ Δ_n` (`AnbStepData.tPlus`).\nHypotheses: the parts of Assumption assum:all used by the proof, in the form of\n`subsol_growth` (shared Dirichlet data `ubd` outside `I = Int X`; `Λ` monotone with `Λ[0] ≥ 0`,\nadditively invariant, with `C_past`-memory and `C_Γ, C'_Γ`-comparable with `Γ` on `Int X`; `Γ`\nmonotone, causal, `Γ ≤ Λ`), the comparison principle (eq. eq:comparison_Lambda, as in V1; see\n`le_of_subSolution_superSolution`), a fixed point `u_*` (`uFix`) of `Λ`, and `α > 0`, `τ ≥ 0`,\n`ε > 0`. `Γ` additively invariant, the finite super-solution (`u_*` is one) and the positive\nboundary conditions (beyond `Λ[0] ≥ 0`) are not used, hence omitted. `X` is finite and linearly\nordered (tie-breaking).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.le_of_causal_real", "GuaranteedSubsol.exists_fixedPoint_of_causal", "GuaranteedSubsol.Causal.max", "GuaranteedSubsol.Causal.min", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.HasMemory.apply_eq_apply_max", "GuaranteedSubsol.subsol_extension", "GuaranteedSubsol.max_min_fixedPoint", "GuaranteedSubsol.Causal.max_min", "GuaranteedSubsol.subsol_growth", "GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbRun_always_subsol", "GuaranteedSubsol.anbStep_eq_of_notMem_band", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.monotone_bandOp"], "labels": ["corol:Bn_comp", "assum:all", "prop:always_subsol", "eq:comparison_Lambda"], "direct": ["GuaranteedSubsol.Causal.max_min", "GuaranteedSubsol.anbRun_always_subsol", "GuaranteedSubsol.exists_fixedPoint_of_causal", "GuaranteedSubsol.max_min_fixedPoint", "GuaranteedSubsol.subsol_extension", "GuaranteedSubsol.subsol_growth"]}, {"id": "GuaranteedSubsol.anbRunData_dijkstraBand_bounds", "short": "anbRunData_dijkstraBand_bounds", "file": "Anchors/AnbRunDataDijkstraBandBounds.lean", "pub_source": "Corol. corol:Bn_comp, second inclusion `B'_n ⊂ {t⁻_{n-1} ≤ u_* < t⁺_n}`; same hypotheses", "pub_doc": "Source: Corollary corol:Bn_comp, second inclusion: in iteration `n = k + 1` of the ANB, `B'_n ⊂ {t⁻_{n-1} ≤ u_* < t⁺_n}`, with `B'_n` from Prop. prop:Dijkstra_band (`anbDijkstraBand`), `t⁻_{n-1} = t_{n-1} - Δ_{n-1}` (`AnbStepData.tMinus`) and `t⁺_n = (1 + ε) t_n + C_past + C'_Γ + C_Γ Δ_n` (`AnbStepData.tPlus`). Hypotheses: the parts of Assumption assum:all used by the proof, in the form of `subsol_growth` (shared Dirichlet data `ubd` outside `I = Int X`; `Λ` monotone with `Λ[0] ≥ 0`, additively invariant, with `C_past`-memory and `C_Γ, C'_Γ`-comparable with `Γ` on `Int X`; `Γ` monotone, causal, `Γ ≤ Λ`), the comparison principle (eq. eq:comparison_Lambda, as in the paper; see `le_of_subSolution_superSolution`), a fixed point `u_*` (`uFix`) of `Λ`, and `α > 0`, `τ ≥ 0`, `ε > 0`. `Γ` additively invariant, the finite super-solution (`u_*` is one) and the positive boundary conditions (beyond `Λ[0] ≥ 0`) are not used, hence omitted. `X` is finite and linearly ordered (tie-breaking).", "notes": [], "title": "the exact solution on the band `B'_n` of Dijkstra's method in the ANB", "source": "Corol. corol:Bn_comp (Complexity.tex), second inclusion `B'_n ⊂ {t⁻_{n-1} ≤ u_* < t⁺_n}`; same hypotheses", "state": "PROVED", "provider": "GuaranteedSubsol.AnbBnCompProof.dijkstraBand_bounds", "chapter": "Complexity", "statement": "theorem anbRunData_dijkstraBand_bounds {X : Type*} [Fintype X] [LinearOrder X] {p : AnbParams X}\n    {I : Set X} {ubd : X → ℝ} (hΛbd : ∀ u, ∀ x ∉ I, p.Λ u x = ubd x)\n    (hΓbd : ∀ u, ∀ x ∉ I, p.Γ u x = ubd x) {Cpast CΓ CΓ' : ℝ} (hCpast : 0 ≤ Cpast)\n    (hCΓ : 1 ≤ CΓ) (hCΓ' : 0 ≤ CΓ') (hΛmono : ∀ x, Monotone (p.Λ · x)) (hΛ0 : 0 ≤ p.Λ 0)\n    (hadd : ∀ x ∈ I, AdditivelyInvariant (p.Λ · x)) (hmem : ∀ x ∈ I, HasMemory Cpast (p.Λ · x))\n    (hcmp : ∀ x ∈ I, Comparable CΓ CΓ' (p.Λ · x) (p.Γ · x))\n    (hΓmono : ∀ x, Monotone (p.Γ · x)) (hΓcaus : ∀ x, Causal (p.Γ · x))\n    (hΓΛ : ∀ u, p.Γ u ≤ p.Λ u) (hcomp : ∀ J : Set X, HasComparisonPrinciple J p.Λ)\n    {uFix : X → ℝ} (hfix : p.Λ uFix = uFix) (hα : 0 < p.α) (hτ : 0 ≤ p.τ) (hε : 0 < p.ε)\n    {k : ℕ} {x : X}\n    (hx : x ∈ anbDijkstraBand (anbRunData p k).tMinus (((k + 1 : ℕ) : ℝ) * p.τ)\n      (anbRunData p k).uHat (anbRunData p (k + 1)).uHat) :\n    (anbRunData p k).tMinus ≤ uFix x ∧\n      uFix x < (anbRunData p (k + 1)).tPlus p.ε Cpast CΓ CΓ'", "doc": "Source: Corollary corol:Bn_comp (Complexity.tex), second inclusion: in iteration `n = k + 1` of\nthe ANB, `B'_n ⊂ {t⁻_{n-1} ≤ u_* < t⁺_n}`, with `B'_n` from Prop. prop:Dijkstra_band\n(`anbDijkstraBand`), `t⁻_{n-1} = t_{n-1} - Δ_{n-1}` (`AnbStepData.tMinus`) and\n`t⁺_n = (1 + ε) t_n + C_past + C'_Γ + C_Γ Δ_n` (`AnbStepData.tPlus`).\nHypotheses: the parts of Assumption assum:all used by the proof, in the form of\n`subsol_growth` (shared Dirichlet data `ubd` outside `I = Int X`; `Λ` monotone with `Λ[0] ≥ 0`,\nadditively invariant, with `C_past`-memory and `C_Γ, C'_Γ`-comparable with `Γ` on `Int X`; `Γ`\nmonotone, causal, `Γ ≤ Λ`), the comparison principle (eq. eq:comparison_Lambda, as in V1; see\n`le_of_subSolution_superSolution`), a fixed point `u_*` (`uFix`) of `Λ`, and `α > 0`, `τ ≥ 0`,\n`ε > 0`. `Γ` additively invariant, the finite super-solution (`u_*` is one) and the positive\nboundary conditions (beyond `Λ[0] ≥ 0`) are not used, hence omitted. `X` is finite and linearly\nordered (tie-breaking).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.le_of_causal_real", "GuaranteedSubsol.exists_fixedPoint_of_causal", "GuaranteedSubsol.Causal.max", "GuaranteedSubsol.Causal.min", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.HasMemory.apply_eq_apply_max", "GuaranteedSubsol.subsol_extension", "GuaranteedSubsol.max_min_fixedPoint", "GuaranteedSubsol.Causal.max_min", "GuaranteedSubsol.subsol_growth", "GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbRun_always_subsol", "GuaranteedSubsol.anbStep_eq_of_notMem_band", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.monotone_bandOp"], "labels": ["corol:Bn_comp"], "direct": ["GuaranteedSubsol.Causal.max_min", "GuaranteedSubsol.anbRun_always_subsol", "GuaranteedSubsol.exists_fixedPoint_of_causal", "GuaranteedSubsol.max_min_fixedPoint", "GuaranteedSubsol.subsol_extension", "GuaranteedSubsol.subsol_growth"]}, {"id": "GuaranteedSubsol.anbRun_first_iter", "short": "anbRun_first_iter", "file": "Anchors/AnbRunFirstIter.lean", "pub_source": "Lemma lem:first_iter, iterations `1 ≤ k` with `kτ ≤ min u_bd`; counters vanish; used parts of assum:all, and `Λ[0] ≥ 0` (a consequence of assum:all, see the remark after prop:always_subsol); causality of `Γ` unused, omitted", "pub_doc": "Source: Lemma lem:first_iter: in an iteration `1 ≤ k` of the ANB with `kτ ≤ min u_bd`, `ū_k = (k-1)τ`, `u̲_k = ∞`, `û_k = kτ`, `t_k = kτ`, `Δ_k = 0` and `B_k = ∅`. In addition, no update of `ū`, `u̲` or `û` is made in the iterations `0, …, k`: the three update counters vanish at the end of iteration `k`. The iterations are numbered from `0` (Remark rem:anb_npos); iteration `0` is covered by `anbRun_zero_vacuous`. Hypotheses: the parts of Assumption assum:all used by the proof, in the form of `subsol_growth`: `Γ` has the Dirichlet data `ubd` outside `I = Int X`, is additively invariant and `C_Γ, C'_Γ`-comparable with `Λ` on `Int X`, with `C_Γ ≥ 1`, and `Γ` is monotone; `α > 0`, `τ ≥ 0`; and `Λ[0] ≥ 0`, a consequence of assum:all (causality and additive invariance of `Γ` give `Γ[0] > 0` on `Int X`, and `Γ ≤ Λ`; see the remark after prop:always_subsol), used here to get `t ≤ Γ[t]` by Prop. prop:cst_subsol, second part. Causality of `Γ` (approved in the statement) is not used, hence omitted: the initial guess of Dijkstra's method is already the fixed point `kτ`. `X` is finite and linearly ordered (tie-breaking).", "notes": ["author's request", "author's request"], "title": "the first iterations of the ANB are vacuous", "source": "Lemma lem:first_iter (Complexity.tex), iterations `1 ≤ k` with `kτ ≤ min u_bd`; counters vanish (author's request); used parts of assum:all, and `Λ[0] ≥ 0` (a consequence of assum:all, see the remark after prop:always_subsol); causality of `Γ` unused, omitted", "state": "PROVED", "provider": "GuaranteedSubsol.AnbFirstIterProof.first_iter", "chapter": "Complexity", "statement": "theorem anbRun_first_iter {X : Type*} [Fintype X] [LinearOrder X] {p : AnbParams X}\n    {I : Set X} {ubd : X → ℝ} (hΓbd : ∀ u, ∀ x ∉ I, p.Γ u x = ubd x) {CΓ CΓ' : ℝ}\n    (hCΓ : 1 ≤ CΓ) (hΛ0 : 0 ≤ p.Λ 0) (hΓadd : ∀ x ∈ I, AdditivelyInvariant (p.Γ · x))\n    (hcmp : ∀ x ∈ I, Comparable CΓ CΓ' (p.Λ · x) (p.Γ · x))\n    (hΓmono : ∀ x, Monotone (p.Γ · x)) (hα : 0 < p.α) (hτ : 0 ≤ p.τ) {k : ℕ} (hk1 : 1 ≤ k)\n    (hk : ∀ x ∉ I, (k : ℝ) * p.τ ≤ ubd x) :\n    (anbRun p k).uSub = (fun _ => ((k : ℝ) - 1) * p.τ) ∧ (anbRun p k).uSup = (fun _ => ⊤) ∧\n    (anbRunData p k).uHat = (fun _ => (k : ℝ) * p.τ) ∧ (anbRunData p k).t = k * p.τ ∧\n    (anbRunData p k).Δ = 0 ∧ (anbRunData p k).band = ∅ ∧\n    (anbRun p (k + 1)).countSub = 0 ∧ (anbRun p (k + 1)).countSup = 0 ∧\n    (anbRun p (k + 1)).countHat = 0", "doc": "Source: Lemma lem:first_iter (Complexity.tex): in an iteration `1 ≤ k` of the ANB with\n`kτ ≤ min u_bd`, `ū_k = (k-1)τ`, `u̲_k = ∞`, `û_k = kτ`, `t_k = kτ`, `Δ_k = 0` and `B_k = ∅`.\nIn addition (author's request), no update of `ū`, `u̲` or `û` is made in the iterations\n`0, …, k`: the three update counters vanish at the end of iteration `k`. The iterations are\nnumbered from `0` (Remark rem:anb_npos); iteration `0` is covered by `anbRun_zero_vacuous`.\nHypotheses: the parts of Assumption assum:all used by the proof, in the form of `subsol_growth`:\n`Γ` has the Dirichlet data `ubd` outside `I = Int X`, is additively invariant and\n`C_Γ, C'_Γ`-comparable with `Λ` on `Int X`, with `C_Γ ≥ 1`, and `Γ` is monotone; `α > 0`,\n`τ ≥ 0`; and `Λ[0] ≥ 0`, a consequence of assum:all (causality and additive invariance of `Γ`\ngive `Γ[0] > 0` on `Int X`, and `Γ ≤ Λ`; see the remark after prop:always_subsol), used\nhere to get `t ≤ Γ[t]` by Prop. prop:cst_subsol, second part. Causality of `Γ` (approved in the\nstatement) is not used, hence omitted: the initial guess of Dijkstra's method is already the\nfixed point `kτ`. `X` is finite and linearly ordered (tie-breaking).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.anbStep_eq_of_notMem_band"], "labels": ["lem:first_iter", "assum:all", "prop:always_subsol"], "direct": ["GuaranteedSubsol.anbStep_eq_of_notMem_band", "GuaranteedSubsol.monotoneExtension_coe"]}, {"id": "GuaranteedSubsol.apply_zero_nonneg_of_causal", "short": "apply_zero_nonneg_of_causal", "file": "Anchors/ApplyZeroNonnegOfCausal.lean", "pub_source": "`Λ[0] ≥ 0` (assumption of prop:always_subsol) from assum:all: `Γ` causal and additively invariant on `Int X`, `Γ ≤ Λ`, `u_bd ≥ 0`", "pub_doc": "If `Λ` has the Dirichlet data `ubd ≥ 0` outside `I = Int X` (non-negative boundary conditions), and `Γ` is additively invariant and causal on `Int X` and underestimates `Λ`, then `Λ[0] ≥ 0` on `X` (in fact `Λ[0] ≥ Γ[0] > 0` on `Int X`). Global operators `(X → ℝ) → X → ℝ`.", "notes": ["the remark after prop:always_subsol, V1; author's request", "Source: the remark after Prop. prop:always_subsol , author's request: the assumption `Λ[0] ≥ 0` of Prop. prop:always_subsol follows from Assumption assum:all"], "title": "`Λ[0] ≥ 0` under Assumption assum:all", "source": "`Λ[0] ≥ 0` (assumption of prop:always_subsol, Complexity.tex) from assum:all: `Γ` causal and additively invariant on `Int X`, `Γ ≤ Λ`, `u_bd ≥ 0` (the remark after prop:always_subsol, V1; author's request)", "state": "PROVED", "provider": "GuaranteedSubsol.ApplyZeroNonnegProof.apply_zero_nonneg_of_causal", "chapter": "Complexity", "statement": "theorem apply_zero_nonneg_of_causal {X : Type*} {Λ Γ : (X → ℝ) → X → ℝ} {I : Set X}\n    {ubd : X → ℝ} (hΛbd : ∀ u, ∀ x ∉ I, Λ u x = ubd x) (hubd : ∀ x ∉ I, 0 ≤ ubd x)\n    (hΓadd : ∀ x ∈ I, AdditivelyInvariant (Γ · x)) (hΓcaus : ∀ x ∈ I, Causal (Γ · x))\n    (hΓΛ : ∀ u, Γ u ≤ Λ u) : 0 ≤ Λ 0", "doc": "Source: the remark after Prop. prop:always_subsol (Complexity.tex, V1), author's request:\nthe assumption `Λ[0] ≥ 0` of Prop. prop:always_subsol follows from Assumption assum:all. If `Λ` has\nthe Dirichlet data `ubd ≥ 0` outside `I = Int X` (non-negative boundary conditions), and `Γ` is\nadditively invariant and causal on `Int X` and underestimates `Λ`, then `Λ[0] ≥ 0` on `X` (in\nfact `Λ[0] ≥ Γ[0] > 0` on `Int X`). Global operators `(X → ℝ) → X → ℝ`.", "deps": ["GuaranteedSubsol.apply_zero_pos_of_causal"], "labels": ["prop:always_subsol", "assum:all"], "direct": ["GuaranteedSubsol.apply_zero_pos_of_causal"]}, {"id": "GuaranteedSubsol.anbRunData_Δ_lt_Δmax", "short": "anbRunData_Δ_lt_Δmax", "file": "Anchors/AnbRunDataDeltaLtDeltaMax.lean", "pub_source": "Corol. corol:max_width, `Δ_n < Δ_max`; `Δ_max:= 2α ln(2e/ε) + 2τ` as in the paper; sub-additivity explicit; memory and finite super-solution unused, omitted", "pub_doc": "Source: Corollary corol:max_width, second claim: in each iteration of the ANB, `Δ_n < Δ_max`. Hypotheses: the parts of Assumption assum:all used by the proof, in the form of `subsol_growth` (`Λ` and `Γ` have the Dirichlet data `ubd` outside `I = Int X`; `Λ` monotone and additively invariant on `Int X`; `Γ` monotone, causal, additively invariant on `Int X`, `Γ ≤ Λ`, and `C_Γ, C'_Γ`-comparable with `Λ`, `C_Γ ≥ 1`); the `ρ`-sub-additivity of `Φ_α` on `Int X` with `α > 0`, `0 ≤ ρ < 1` (the parameters `α`, `ρ` of algo:anb); a fixed point `u_*` (`uFix`) of `Λ`; `τ > 0`, `0 < ε ≤ ε_max` (`AnbParams.εmax`) and `2 Δ_max ≤ min u_bd`. The memory property and the finite super-solution of assum:all are not used, hence omitted; `Λ[0] ≥ 0` and the comparison principle are derived from sub-additivity. `Δ_max:= 2α ln(2e/ε) + 2τ` (`AnbParams.Δmax`), as in the paper. `X` is finite and linearly ordered (tie-breaking).", "notes": ["author ruling: V0's `+ τ` makes the final step fail", "author ruling", "constants renamed with Greek letters", "author ruling; V0 had `2α ln(2e/ε) + τ`, for which the final step of the proof fails", "author ruling, 2026-10-14; statements equal by definition", "Constants renamed with Greek letters (`Δmax`, `ΔplusMax`, `εmax`, `NΛ'`, `NΛ''`, `NΓ`) and inner-loop pass counts written `passesSub`, `passesSup`"], "title": "the half-width of the narrow band of the ANB is bounded", "source": "Corol. corol:max_width (Complexity.tex), `Δ_n < Δ_max`; `Δ_max := 2α ln(2e/ε) + 2τ` as in V1 (author ruling: V0's `+ τ` makes the final step fail); sub-additivity explicit; memory and finite super-solution unused, omitted; constants renamed with Greek letters (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.AnbMaxWidthProof.Δ_lt", "chapter": "Complexity", "statement": "theorem anbRunData_Δ_lt_Δmax {X : Type*} [Fintype X] [LinearOrder X] {p : AnbParams X}\n    {I : Set X} {ubd : X → ℝ} (hΛbd : ∀ u, ∀ x ∉ I, p.Λ u x = ubd x)\n    (hΓbd : ∀ u, ∀ x ∉ I, p.Γ u x = ubd x) {CΓ CΓ' : ℝ} (hCΓ : 1 ≤ CΓ)\n    (hΛmono : ∀ x, Monotone (p.Λ · x)) (hadd : ∀ x ∈ I, AdditivelyInvariant (p.Λ · x))\n    (hcmp : ∀ x ∈ I, Comparable CΓ CΓ' (p.Λ · x) (p.Γ · x))\n    (hΓmono : ∀ x, Monotone (p.Γ · x)) (hΓcaus : ∀ x, Causal (p.Γ · x))\n    (hΓadd : ∀ x ∈ I, AdditivelyInvariant (p.Γ · x)) (hΓΛ : ∀ u, p.Γ u ≤ p.Λ u)\n    (hsub : ∀ x ∈ I, SubAdditive p.ρ (kruzkovOp p.α (p.Λ · x))) (hα : 0 < p.α)\n    (hρ0 : 0 ≤ p.ρ) (hρ1 : p.ρ < 1) (hτ : 0 < p.τ) {uFix : X → ℝ} (hfix : p.Λ uFix = uFix)\n    (hε : 0 < p.ε) (hεmax : p.ε ≤ p.εmax uFix) (hbd : ∀ x ∉ I, 2 * p.Δmax ≤ ubd x)\n    (k : ℕ) : (anbRunData p k).Δ < p.Δmax", "doc": "Source: Corollary corol:max_width (Complexity.tex), second claim: in each iteration of the ANB,\n`Δ_n < Δ_max`.\nHypotheses: the parts of Assumption assum:all used by the proof, in the form of\n`subsol_growth` (`Λ` and `Γ` have the Dirichlet data `ubd` outside `I = Int X`; `Λ` monotone and\nadditively invariant on `Int X`; `Γ` monotone, causal, additively invariant on `Int X`, `Γ ≤ Λ`,\nand `C_Γ, C'_Γ`-comparable with `Λ`, `C_Γ ≥ 1`); the `ρ`-sub-additivity of `Φ_α` on `Int X`\nwith `α > 0`, `0 ≤ ρ < 1` (the parameters `α`, `ρ` of algo:anb); a fixed point `u_*` (`uFix`) of\n`Λ`; `τ > 0`, `0 < ε ≤ ε_max` (`AnbParams.εmax`) and `2 Δ_max ≤ min u_bd`. The memory property\nand the finite super-solution of assum:all are not used, hence omitted; `Λ[0] ≥ 0` and the\ncomparison principle are derived from sub-additivity. `Δ_max := 2α ln(2e/ε) + 2τ`\n(`AnbParams.Δmax`), as in V1 (author ruling; V0 had `2α ln(2e/ε) + τ`, for which the final step\nof the proof fails). `X` is finite and linearly ordered (tie-breaking).\nConstants renamed with Greek letters (`Δmax`, `ΔplusMax`, `εmax`, `NΛ'`, `NΛ''`, `NΓ`) and\ninner-loop pass counts written `passesSub`, `passesSup` (author ruling, 2026-10-14; statements\nequal by definition).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.le_apply_zero_of_kruzkov_subAdditive", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.kruzkovOp_mul", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.le_of_subSolution_superSolution", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.t_advances", "GuaranteedSubsol.globalIterRun_superSolution", "GuaranteedSubsol.globalIterSubRun_subSolution", "GuaranteedSubsol.globalIterRun_le_pow_mul", "GuaranteedSubsol.globalIterSubRun_le_pow_mul", "GuaranteedSubsol.anbRun_zero_vacuous", "GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbRun_always_subsol", "GuaranteedSubsol.anbStep_eq_of_notMem_band", "GuaranteedSubsol.anbRun_guess_superSolution", " s of corol:max_width and `0 < ρ`", "pub_doc": "Source: Prop. prop:niter_while: in each iteration of the ANB, the inner loops of lines anb:while_sub and anb:while_sup (global iterations on the band `B_n`, `AnbStepData.ΦSub`, `AnbStepData.ΦSup`) perform at most `N''_Λ:= ⌈(2Δ_max/α - ln(1 - ρ))/(-ln ρ)⌉` passes (`AnbParams.NΛ''`); in particular they stop, since the number of passes is `⊤` (in `ℕ∞`) for a loop that never stops. The proof uses the termination of the global iteration (`globalIterSubRun_terminates`, `globalIterRun_terminates`) applied on the band. Hypotheses: those of Corollary corol:max_width (see `anbRunData_Δ_lt_Δmax`, with `Δ_max:= 2α ln(2e/ε) + 2τ`, as in the paper), and `ρ > 0` (`ln ρ` appears in `N''_Λ`), as in the paper. `X` is finite and linearly ordered (tie-breaking).", "notes": ["pass counts in `ℕ∞`, `⊤` if a loop never stops, so that the bound expresses termination; author ruling", "author's request", "author ruling", "constants renamed with Greek letters", "author ruling, 2026-10-14: pass counts in `ℕ∞`", "author's request", "author ruling, 2026-10-14; statements equal by definition", "Constants renamed with Greek letters (`Δmax`, `ΔplusMax`, `εmax`, `NΛ'`, `NΛ''`, `NΓ`) and inner-loop pass counts written `passesSub`, `passesSup`"], "title": "the inner loops of the ANB stop after at most `N''_Λ` passes", "source": "Prop. prop:niter_while (Complexity.tex), the inner loops perform at most `N''_Λ` passes (pass counts in `ℕ∞`, `⊤` if a loop never stops, so that the bound expresses termination; author ruling), via the termination of the global iteration on the band (author's request); hypotheses of corol:max_width and `0 < ρ`; constants renamed with Greek letters (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.AnbNiterProof.passes_le", "chapter": "Complexity", "statement": "theorem anbRunData_passes_le {X : Type*} [Fintype X] [LinearOrder X] {p : AnbParams X}\n    {I : Set X} {ubd : X → ℝ} (hΛbd : ∀ u, ∀ x ∉ I, p.Λ u x = ubd x)\n    (hΓbd : ∀ u, ∀ x ∉ I, p.Γ u x = ubd x) {CΓ CΓ' : ℝ} (hCΓ : 1 ≤ CΓ)\n    (hΛmono : ∀ x, Monotone (p.Λ · x)) (hadd : ∀ x ∈ I, AdditivelyInvariant (p.Λ · x))\n    (hcmp : ∀ x ∈ I, Comparable CΓ CΓ' (p.Λ · x) (p.Γ · x))\n    (hΓmono : ∀ x, Monotone (p.Γ · x)) (hΓcaus : ∀ x, Causal (p.Γ · x))\n    (hΓadd : ∀ x ∈ I, AdditivelyInvariant (p.Γ · x)) (hΓΛ : ∀ u, p.Γ u ≤ p.Λ u)\n    (hsub : ∀ x ∈ I, SubAdditive p.ρ (kruzkovOp p.α (p.Λ · x))) (hα : 0 < p.α)\n    (hρ0 : 0 ≤ p.ρ) (hρ1 : p.ρ < 1) (hτ : 0 < p.τ) {uFix : X → ℝ} (hfix : p.Λ uFix = uFix)\n    (hε : 0 < p.ε) (hεmax : p.ε ≤ p.εmax uFix) (hbd : ∀ x ∉ I, 2 * p.Δmax ≤ ubd x)\n    (hρpos : 0 < p.ρ) (k : ℕ) :\n    (anbRunData p k).passesSub ≤ (p.NΛ'' : ℕ∞) ∧\n      (anbRunData p k).passesSup ≤ (p.NΛ'' : ℕ∞)", "doc": "Source: Prop. prop:niter_while (Complexity.tex): in each iteration of the ANB, the inner loops of\nlines anb:while_sub and anb:while_sup (global iterations on the band `B_n`, `AnbStepData.ΦSub`,\n`AnbStepData.ΦSup`) perform at most `N''_Λ := ⌈(2Δ_max/α - ln(1 - ρ))/(-ln ρ)⌉` passes\n(`AnbParams.NΛ''`); in particular they stop, since the number of passes is `⊤` (in `ℕ∞`)\nfor a loop that never stops (author ruling, 2026-10-14: pass counts in `ℕ∞`). The proof uses the\ntermination of the global iteration (`globalIterSubRun_terminates`, `globalIterRun_terminates`)\napplied on the band (author's request).\nHypotheses: those of Corollary corol:max_width (see `anbRunData_Δ_lt_Δmax`, with\n`Δ_max := 2α ln(2e/ε) + 2τ`, as in V1), and `ρ > 0` (`ln ρ` appears in `N''_Λ`), as in V1. `X` is\nfinite and linearly ordered (tie-breaking). Constants renamed with Greek letters (`Δmax`,\n`ΔplusMax`, `εmax`, `NΛ'`, `NΛ''`, `NΓ`) and inner-loop pass counts written `passesSub`, `passesSup`\n(author ruling, 2026-10-14; statements equal by definition).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.le_apply_zero_of_kruzkov_subAdditive", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.kruzkovOp_mul", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.le_of_subSolution_superSolution", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.t_advances", "GuaranteedSubsol.globalIterRun_superSolution", "GuaranteedSubsol.globalIterSubRun_subSolution", "GuaranteedSubsol.globalIterRun_le_pow_mul", "GuaranteedSubsol.globalIterSubRun_le_pow_mul", "GuaranteedSubsol.globalIterRun_terminates", "GuaranteedSubsol.globalIterSubRun_terminates", "GuaranteedSubsol.anbRun_zero_vacuous", "GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbRun_always_subsol", "GuaranteedSubsol.anbStep_eq_of_notMem_band", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.anbRun_first_iter", "GuaranteedSubsol.monotone_bandOp", "GuaranteedSubsol.subAdditive_bandOp"], "labels": ["prop:niter_while", "corol:max_width"], "direct": ["GuaranteedSubsol.anbRun_always_subsol", "GuaranteedSubsol.anbRun_first_iter", "GuaranteedSubsol.anbRun_zero_vacuous", "GuaranteedSubsol.globalIterRun_terminates", "GuaranteedSubsol.globalIterSubRun_terminates", "GuaranteedSubsol.le_apply_zero_of_kruzkov_subAdditive", "GuaranteedSubsol.le_of_subSolution_superSolution", "GuaranteedSubsol.subAdditive_bandOp", "GuaranteedSubsol.t_advances"]}, {"id": "GuaranteedSubsol.anbRun_countSub_countSup_le", "short": "anbRun_countSub_countSup_le", "file": "Anchors/AnbRunCountSubCountSupLe.lean", "pub_source": "Th. th:complexity, at most `N_Λ = N'_Λ N''_Λ` updates of `ū` and of `u̲` at each point; counters in `ℕ∞`; hypotheses of corol:NGamma and `0 < ρ`", "pub_doc": "The counters take values in `ℕ∞`, so that the bound also expresses termination. Hypotheses: those of Corollary corol:max_width (see `anbRunData_Δ_lt_Δmax`, with `Δ_max:= 2α ln(2e/ε) + 2τ`, as in the paper), the `C_past`-memory of `Λ` on `Int X`, `C_past ≥ 0`, `C'_Γ ≥ 0`, and `ρ > 0` (as in Prop. prop:niter_while). `X` is finite and linearly ordered (tie-breaking).", "notes": ["author's request", "author ruling", "author ruling", "constants renamed with Greek letters", "`⊤` if an inner loop involving the point never stops; author ruling, 2026-10-14", "author ruling, 2026-10-14; statements equal by definition", "Source: Theorem th:complexity  and its proof , author's request: over the whole run of the ANB, the counters `countSub` and `countSup` of the updates `ū(x) ← Λ ū(x)` and `u̲(x) ← Λ u̲(x)` are at most `N_Λ := N'_Λ N''_Λ` at every point (`AnbParams.NΛ'`, `AnbParams.NΛ''`): at most `N''_Λ` passes per iteration (Prop. prop:niter_while), in at most `N'_Λ` iterations with `x ∈ B_n` (Corollary corol:NGamma)", "Constants renamed with Greek letters (`Δmax`, `ΔplusMax`, `εmax`, `NΛ'`, `NΛ''`, `NΓ`) and inner-loop pass counts written `passesSub`, `passesSup`"], "title": "at most `N_Λ` updates of `ū` and of `u̲` at each point in the ANB", "source": "Th. th:complexity (Intro.tex), at most `N_Λ = N'_Λ N''_Λ` updates of `ū` and of `u̲` at each point (author's request); counters in `ℕ∞` (author ruling); hypotheses of corol:NGamma and `0 < ρ`; constants renamed with Greek letters (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.AnbNiterProof.countSub_countSup_le", "chapter": "Intro", "statement": "theorem anbRun_countSub_countSup_le {X : Type*} [Fintype X] [LinearOrder X] {p : AnbParams X}\n    {I : Set X} {ubd : X → ℝ} (hΛbd : ∀ u, ∀ x ∉ I, p.Λ u x = ubd x)\n    (hΓbd : ∀ u, ∀ x ∉ I, p.Γ u x = ubd x) {CΓ CΓ' : ℝ} (hCΓ : 1 ≤ CΓ)\n    (hΛmono : ∀ x, Monotone (p.Λ · x)) (hadd : ∀ x ∈ I, AdditivelyInvariant (p.Λ · x))\n    (hcmp : ∀ x ∈ I, Comparable CΓ CΓ' (p.Λ · x) (p.Γ · x))\n    (hΓmono : ∀ x, Monotone (p.Γ · x)) (hΓcaus : ∀ x, Causal (p.Γ · x))\n    (hΓadd : ∀ x ∈ I, AdditivelyInvariant (p.Γ · x)) (hΓΛ : ∀ u, p.Γ u ≤ p.Λ u)\n    (hsub : ∀ x ∈ I, SubAdditive p.ρ (kruzkovOp p.α (p.Λ · x))) (hα : 0 < p.α)\n    (hρ0 : 0 ≤ p.ρ) (hρ1 : p.ρ < 1) (hτ : 0 < p.τ) {uFix : X → ℝ} (hfix : p.Λ uFix = uFix)\n    (hε : 0 < p.ε) (hεmax : p.ε ≤ p.εmax uFix) (hbd : ∀ x ∉ I, 2 * p.Δmax ≤ ubd x)\n    {Cpast : ℝ} (hCpast : 0 ≤ Cpast) (hCΓ' : 0 ≤ CΓ')\n    (hmem : ∀ x ∈ I, HasMemory Cpast (p.Λ · x)) (hρpos : 0 < p.ρ) (k : ℕ) (x : X) :\n    (anbRun p k).countSub x ≤ ((p.NΛ' Cpast CΓ CΓ' uFix * p.NΛ'' : ℕ) : ℕ∞) ∧\n      (anbRun p k).countSup x ≤\n        ((p.NΛ' Cpast CΓ CΓ' uFix * p.NΛ'' : ℕ) : ℕ∞)", "doc": "Source: Theorem th:complexity (Intro.tex) and its proof (Complexity.tex), author's request: over\nthe whole run of the ANB, the counters `countSub` and `countSup` of the updates\n`ū(x) ← Λ ū(x)` and `u̲(x) ← Λ u̲(x)` are at most `N_Λ := N'_Λ N''_Λ` at every point\n(`AnbParams.NΛ'`, `AnbParams.NΛ''`): at most `N''_Λ` passes per iteration\n(Prop. prop:niter_while), in at most `N'_Λ` iterations with `x ∈ B_n` (Corollary corol:NGamma).\nThe counters take values in `ℕ∞` (`⊤` if an inner loop involving the point never stops; author\nruling, 2026-10-14), so that the bound also expresses termination.\nHypotheses: those of Corollary corol:max_width (see `anbRunData_Δ_lt_Δmax`, with\n`Δ_max := 2α ln(2e/ε) + 2τ`, as in V1), the `C_past`-memory of `Λ` on `Int X`,\n`C_past ≥ 0`, `C'_Γ ≥ 0`, and `ρ > 0` (as in Prop. prop:niter_while). `X` is finite and linearly\nordered (tie-breaking). Constants renamed with Greek letters (`Δmax`, `ΔplusMax`, `εmax`, `NΛ'`,\n`NΛ''`, `NΓ`) and inner-loop pass counts written `passesSub`, `passesSup` (author ruling,\n2026-10-14; statements equal by definition).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.le_apply_zero_of_kruzkov_subAdditive", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.kruzkovOp_mul", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.le_of_subSolution_superSolution", "GuaranteedSubsol.le_of_causal_real", " g test `(1 + ε) ū ≥ u̲` holds, `⊤` in `ℕ∞` if it never holds) is at most `⌈n_max⌉₊ + 1`, i.e. the ANB terminates after at most `⌈n_max⌉₊` iterations of the paper (the iteration `0` of the Lean version is vacuous)", "Constants renamed with Greek letters (`Δmax`, `ΔplusMax`, `εmax`, `NΛ'`, `NΛ''`, `NΓ`) and inner-loop pass counts written `passesSub`, `passesSup`"], "title": "the ANB terminates within `⌈n_max⌉ + 1` iterations", "source": "Corol. corol:max_width (Complexity.tex), termination: `anbStopIndex ≤ ⌈n_max⌉₊ + 1` in `ℕ∞` (author's request); hypotheses of corol:max_width; constants renamed with Greek letters (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.AnbMaxWidthProof.stopIndex_le", "chapter": "Complexity", "statement": "theorem anbStopIndex_le {X : Type*} [Fintype X] [LinearOrder X] {p : AnbParams X}\n    {I : Set X} {ubd : X → ℝ} (hΛbd : ∀ u, ∀ x ∉ I, p.Λ u x = ubd x)\n    (hΓbd : ∀ u, ∀ x ∉ I, p.Γ u x = ubd x) {CΓ CΓ' : ℝ} (hCΓ : 1 ≤ CΓ)\n    (hΛmono : ∀ x, Monotone (p.Λ · x)) (hadd : ∀ x ∈ I, AdditivelyInvariant (p.Λ · x))\n    (hcmp : ∀ x ∈ I, Comparable CΓ CΓ' (p.Λ · x) (p.Γ · x))\n    (hΓmono : ∀ x, Monotone (p.Γ · x)) (hΓcaus : ∀ x, Causal (p.Γ · x))\n    (hΓadd : ∀ x ∈ I, AdditivelyInvariant (p.Γ · x)) (hΓΛ : ∀ u, p.Γ u ≤ p.Λ u)\n    (hsub : ∀ x ∈ I, SubAdditive p.ρ (kruzkovOp p.α (p.Λ · x))) (hα : 0 < p.α)\n    (hρ0 : 0 ≤ p.ρ) (hρ1 : p.ρ < 1) (hτ : 0 < p.τ) {uFix : X → ℝ} (hfix : p.Λ uFix = uFix)\n    (hε : 0 < p.ε) (hεmax : p.ε ≤ p.εmax uFix) (hbd : ∀ x ∉ I, 2 * p.Δmax ≤ ubd x) :\n    anbStopIndex p ≤ ((⌈p.nMax uFix⌉₊ + 1 : ℕ) : ℕ∞)", "doc": "Source: Corollary corol:max_width (Complexity.tex), first claim, author's request: the stopping\nindex `anbStopIndex` of the ANB (the first iteration at whose start the stopping test\n`(1 + ε) ū ≥ u̲` holds, `⊤` in `ℕ∞` if it never holds) is at most `⌈n_max⌉₊ + 1`, i.e. the ANB\nterminates after at most `⌈n_max⌉₊` iterations of the paper (the iteration `0` of the Lean version\nis vacuous); `⌈n_max⌉₊` is V1's `n_max`, which has a ceiling. Same hypotheses as\n`anbRun_done_of_maxWidth` (with `Δ_max := 2α ln(2e/ε) + 2τ`, as in V1). `X` is finite and linearly\nordered (tie-breaking). Constants renamed with Greek letters (`Δmax`, `ΔplusMax`, `εmax`, `NΛ'`,\n`NΛ''`, `NΓ`) and inner-loop pass counts written `passesSub`, `passesSup` (author ruling,\n2026-10-14; statements equal by definition).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.le_apply_zero_of_kruzkov_subAdditive", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.kruzkovOp_mul", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.le_of_subSolution_superSolution", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.t_advances", "GuaranteedSubsol.globalIterRun_superSolution", "GuaranteedSubsol.globalIterSubRun_subSolution", "GuaranteedSubsol.globalIterRun_le_pow_mul", "GuaranteedSubsol.globalIterSubRun_le_pow_mul", "GuaranteedSubsol.anbRun_zero_vacuous", "GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbRun_always_subsol", "GuaranteedSubsol.anbStep_eq_of_notMem_band", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.anbRun_first_iter", "GuaranteedSubsol.monotone_bandOp", "GuaranteedSubsol.subAdditive_bandOp"], "labels": ["corol:max_width"], "direct": ["GuaranteedSubsol.anbRun_always_subsol", "GuaranteedSubsol.anbRun_first_iter", "GuaranteedSubsol.anbRun_zero_vacuous", "GuaranteedSubsol.globalIterRun_le_pow_mul", "GuaranteedSubsol.globalIterSubRun_le_pow_mul", "GuaranteedSubsol.le_apply_zero_of_kruzkov_subAdditive", "GuaranteedSubsol.le_of_subSolution_superSolution", "GuaranteedSubsol.subAdditive_bandOp", "GuaranteedSubsol.t_advances"]}, {"id": "GuaranteedSubsol.anbRun_complexity", "short": "anbRun_complexity", "file": "Anchors/AnbRunComplexity.lean", "pub_source": "Th. th:complexity, packaged", "pub_doc": "Source: Theorem th:complexity, packaged. Under Assumption assum:all (Dirichlet data `ubd` outside `I = Int X`; `Λ` monotone, additively invariant, with `C_past`-memory and a finite super-solution `w`; `Γ` monotone, additively invariant, causal, `Γ ≤ Λ`, `C_Γ, C'_Γ`-comparable with `Λ`), assuming that `Φ_α` is `ρ`-sub-additive (with the parameters `α`, `ρ` of algo:anb), `τ > 0`, `ε > 0` and `2 Δ_max ≤ min u_bd`: `Λ` has a unique fixed point `u_*` and satisfies the comparison principle (eq. eq:comparison_Lambda); and if `ε ≤ ε_max`, then the ANB stops within `n_max` iterations (the iteration `0` of the Lean version is vacuous), producing a sub-solution `ū` and a super-solution `u̲` with `(1 + ε) ū ≥ u̲`; in every iteration `Δ_n < Δ_max` and each inner loop performs at most `N''_Λ` passes; any `x` lies in at most `N'_Λ` narrow bands; and at every point there are at most `N_Λ = N'_Λ N''_Λ` updates of `ū`, at most `N_Λ` updates of `u̲`, and at most `N_Γ` updates of `û`. The bounds in `ℕ∞` also express termination. As in the paper: `Δ_max:= 2α ln(2e/ε) + 2τ`; `n_max:= ⌈(‖u_*‖_∞ + Δ_max)/τ⌉`; `2 Δ_max ≤ min u_bd`; `0 < ρ`; `Δ_max` in `N''_Λ`; the bound `N_Λ` for each of the two counters. The positivity of the boundary data `u_bd` is not assumed: it follows from `2 Δ_max ≤ min u_bd` when `ε ≤ ε_max`. `X` is finite and linearly ordered (tie-breaking).", "notes": ["author's request", "`Δ_max` with `+ 2τ`, `n_max` with a ceiling, `2 Δ_max ≤ min u_bd`, `ρ > 0`, `Δ_max` in `N''_Λ`, `N_Λ` per counter; author rulings", "the former departures from V0  are as in V1", "author's request", "author rulings, fixes of V0, now in the paper"], "title": "complexity of the ANB (Theorem th:complexity)", "source": "Th. th:complexity (Intro.tex), packaged (author's request); the former departures from V0 (`Δ_max` with `+ 2τ`, `n_max` with a ceiling, `2 Δ_max ≤ min u_bd`, `ρ > 0`, `Δ_max` in `N''_Λ`, `N_Λ` per counter; author rulings) are as in V1", "state": "PROVED", "provider": "GuaranteedSubsol.AnbComplexityProof.complexity", "chapter": "Intro", "statement": "theorem anbRun_complexity {X : Type*} [Fintype X] [LinearOrder X] {p : AnbParams X}\n    {I : Set X} {ubd : X → ℝ} (hΛbd : ∀ u, ∀ x ∉ I, p.Λ u x = ubd x)\n    (hΓbd : ∀ u, ∀ x ∉ I, p.Γ u x = ubd x) {Cpast CΓ CΓ' : ℝ} (hCpast : 0 ≤ Cpast)\n    (hCΓ : 1 ≤ CΓ) (hCΓ' : 0 ≤ CΓ') (hΛmono : ∀ x, Monotone (p.Λ · x))\n    (hadd : ∀ x ∈ I, AdditivelyInvariant (p.Λ · x)) (hmem : ∀ x ∈ I, HasMemory Cpast (p.Λ · x))\n    {w : X → ℝ} (hw : p.Λ w ≤ w) (hΓmono : ∀ x, Monotone (p.Γ · x))\n    (hΓcaus : ∀ x, Causal (p.Γ · x)) (hΓadd : ∀ x ∈ I, AdditivelyInvariant (p.Γ · x))\n    (hΓΛ : ∀ u, p.Γ u ≤ p.Λ u) (hcmp : ∀ x ∈ I, Comparable CΓ CΓ' (p.Λ · x) (p.Γ · x))\n    (hsub : ∀ x ∈ I, SubAdditive p.ρ (kruzkovOp p.α (p.Λ · x))) (hα : 0 < p.α)\n    (hρ0 : 0 < p.ρ) (hρ1 : p.ρ < 1) (hτ : 0 < p.τ) (hε : 0 < p.ε)\n    (hbd : ∀ x ∉ I, 2 * p.Δmax ≤ ubd x) :\n    ∃ uFix : X → ℝ, p.Λ uFix = uFix ∧ (∀ v, p.Λ v = v → v = uFix) ∧\n      (∀ J : Set X, HasComparisonPrinciple J p.Λ) ∧\n      (p.ε ≤ p.εmax uFix →\n        anbStopIndex p ≤ ((⌈p.nMax uFix⌉₊ + 1 : ℕ) : ℕ∞) ∧\n        ((anbRun p (anbStopIndex p).toNat).uSub ≤ p.Λ (anbRun p (anbStopIndex p).toNat).uSub ∧\n          Global.monotoneExtension p.Λ (anbRun p (anbStopIndex p).toNat).uSup ≤\n            (anbRun p (anbStopIndex p).toNat).uSup ∧\n          anbDone p (anbRun p (anbStopIndex p).toNat)) ∧\n        (∀ k, (anbRunData p k).Δ < p.Δmax) ∧\n        (∀ k, (anbRunData p k).passesSub ≤ (p.NΛ'' : ℕ∞) ∧\n          (anbRunData p k).passesSup ≤ (p.NΛ'' : ℕ∞)) ∧\n        (∀ (x : X) (S : Finset ℕ), (∀ k ∈ S, x ∈ (anbRunData p k).band) →\n          S.card ≤ p.NΛ' Cpast CΓ CΓ' uFix) ∧\n        (∀ (k : ℕ) (x : X),\n          (anbRun p k).countSub x ≤ ((p.NΛ' Cpast CΓ CΓ' uFix * p.NΛ'' : ℕ) : ℕ∞) ∧\n          (anbRun p k).countSup x ≤ ((p.NΛ' Cpast CΓ CΓ' uFix * p.NΛ'' : ℕ) : ℕ∞) ∧\n          (anbRun p k).countHat x ≤ p.NΓ Cpast CΓ CΓ' uFix))", "doc" _comparison", "GuaranteedSubsol.le_of_subSolution_superSolution", "GuaranteedSubsol.existsUnique_fixedPoint_of_kruzkov", "GuaranteedSubsol.le_of_causal_real", "GuaranteedSubsol.exists_fixedPoint_of_causal", "GuaranteedSubsol.Causal.max", "GuaranteedSubsol.Causal.min", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.HasMemory.apply_eq_apply_max", "GuaranteedSubsol.subsol_extension", "GuaranteedSubsol.max_min_fixedPoint", "GuaranteedSubsol.Causal.max_min", "GuaranteedSubsol.subsol_growth", "GuaranteedSubsol.t_advances", "GuaranteedSubsol.globalIterRun_superSolution", "GuaranteedSubsol.globalIterSubRun_subSolution", "GuaranteedSubsol.globalIterRun_le_pow_mul", "GuaranteedSubsol.globalIterSubRun_le_pow_mul", "GuaranteedSubsol.globalIterRun_terminates", "GuaranteedSubsol.globalIterSubRun_terminates", "GuaranteedSubsol.anbRun_zero_vacuous", "GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbRun_always_subsol", "GuaranteedSubsol.anbStep_eq_of_notMem_band", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.anbRun_hatRun_count_mem", "GuaranteedSubsol.anbRunData_band_bounds", "GuaranteedSubsol.anbRunData_dijkstraBand_bounds", "GuaranteedSubsol.anbRun_first_iter", "GuaranteedSubsol.anbRunData_Δ_lt_Δmax", "GuaranteedSubsol.anbRun_done_of_maxWidth", "GuaranteedSubsol.anbRunData_card_band_le", "GuaranteedSubsol.anbRun_countHat_le", "GuaranteedSubsol.anbRunData_passes_le", "GuaranteedSubsol.anbRun_countSub_countSup_le", "GuaranteedSubsol.anbStopIndex_le", "GuaranteedSubsol.monotone_bandOp", "GuaranteedSubsol.subAdditive_bandOp"], "labels": ["th:complexity"], "direct": ["GuaranteedSubsol.anbRunData_card_band_le", "GuaranteedSubsol.anbRunData_Δ_lt_Δmax", "GuaranteedSubsol.anbRun_countHat_le", "GuaranteedSubsol.anbRun_countSub_countSup_le", "GuaranteedSubsol.anbRun_done_of_maxWidth", "GuaranteedSubsol.anbStopIndex_le", "GuaranteedSubsol.existsUnique_fixedPoint_of_kruzkov"]}, {"id": "GuaranteedSubsol.globalIterRun_passes_le_withUnknown", "short": "globalIterRun_passes_le_withUnknown", "file": "Anchors/GlobalIterRunPassesLeWithUnknown.lean", "pub_source": "Lemma lem:cplx_global_iteration_withUnknown: the global iteration for `Φ_α` stops within `⌈(ln(C/η) + ln(β/α))/(-ln σ)⌉` passes when `Φ_β` is `σ`-sub-additive; replaces `globalIterRun_passes_le_of_kruzkov`, via lem:pow_cvx", "pub_doc": "Source: Lemma lem:cplx_global_iteration_withUnknown: if `Λ` is monotone and `Φ_β` is `σ`-sub-additive, with `0 < α ≤ β` and `0 < σ < 1`, then the global iteration (algo:global_iteration) for `Φ_α`, started from `E_α ū` (sub-solution variant) or from `E_α u̲` (super-solution version), stops within `⌈(ln(C/η) + ln(β/α))/(-ln σ)⌉` passes, where `ū ≤ Λ ū`, `Λ u̲ ≤ u̲` (`u̲` with values in `ℝ_∞`, `Λ_∞` its extension) and `E_α ū ≥ -C`. the proof uses lem:pow_cvx. The numbers of passes are in `ℕ∞` (`⊤` if a loop never stops), so the bound expresses termination. The order `ū ≤ u̲`, used for the super-solution version, follows from the comparison principle; the paper's `C ≥ 0` is not needed (`C` only enters through `max(C, 0)`). `X` is finite.", "notes": ["V0 bound `⌈(ln(C/η) + (β/α) ln 2)/(-ln σ)⌉`, removed by the author's ruling 2026-10-16", "author's ruling 2026-10-16", "It replaces the anchor `globalIterRun_passes_le_of_kruzkov`, which stated the weaker V0 bound `⌈(ln(C/η) + (β/α) ln 2)/(-ln σ)⌉`"], "title": "the global iteration for `Φ_α` stops when `Φ_β` is `σ`-sub-additive (V1)", "source": "Lemma lem:cplx_global_iteration_withUnknown (Complexity.tex, V1): the global iteration for `Φ_α` stops within `⌈(ln(C/η) + ln(β/α))/(-ln σ)⌉` passes when `Φ_β` is `σ`-sub-additive; replaces `globalIterRun_passes_le_of_kruzkov` (V0 bound `⌈(ln(C/η) + (β/α) ln 2)/(-ln σ)⌉`, removed by the author's ruling 2026-10-16), via lem:pow_cvx", "state": "PROVED", "provider": "GuaranteedSubsol.GlobalIterKruzkovProof.passes_le", "chapter": "Complexity", "statement": "theorem globalIterRun_passes_le_withUnknown {X : Type*} [Finite X] {Λ : (X → ℝ) → X → ℝ}\n    (hΛmono : ∀ x, Monotone (Λ · x)) {α β σ : ℝ} (hα : 0 < α) (hαβ : α ≤ β)\n    (hσ0 : 0 < σ) (hσ1 : σ < 1) (hsub : ∀ x, SubAdditive σ (kruzkovOp β (Λ · x)))\n    {uSub : X → ℝ} {uSup : X → WithTop ℝ} (huSub : uSub ≤ Λ uSub)\n    (huSup : Global.monotoneExtension Λ uSup ≤ uSup)\n    {C η : ℝ} (hC : ∀ x, -C ≤ kruzkov (1 / α) (uSub x)) (hη : 0 < η) :\n    globalIterSubPasses (Global.kruzkovOp α Λ) η (fun x => kruzkov (1 / α) (uSub x)) ≤\n        (⌈(Real.log (C / η) + Real.log (β / α)) / (-Real.log σ)⌉₊ : ℕ∞) ∧\n      globalIterPasses (Global.kruzkovOp α Λ) η (fun x => kruzkov (1 / α) (uSup x)) ≤\n        (⌈(Real.log (C / η) + Real.log (β / α)) / (-Real.log σ)⌉₊ : ℕ∞)", "doc": "Source: Lemma lem:cplx_global_iteration_withUnknown (Complexity.tex, V1): if `Λ` is monotone and\n`Φ_β` is `σ`-sub-additive, with `0 < α ≤ β` and `0 < σ < 1`, then the global iteration\n(algo:global_iteration) for `Φ_α`, started from `E_α ū` (sub-solution variant) or from `E_α u̲`\n(super-solution version), stops within `⌈(ln(C/η) + ln(β/α))/(-ln σ)⌉` passes, where `ū ≤ Λ ū`,\n`Λ u̲ ≤ u̲` (`u̲` with values in `ℝ_∞`, `Λ_∞` its extension) and `E_α ū ≥ -C`. It replaces the\nanchor `globalIterRun_passes_le_of_kruzkov`, which stated the weaker V0 bound\n`⌈(ln(C/η) + (β/α) ln 2)/(-ln σ)⌉` (author's ruling 2026-10-16); the proof uses lem:pow_cvx.\nThe numbers of passes are in `ℕ∞` (`⊤` if a loop never stops), so the bound\nexpresses termination. The order `ū ≤ u̲`, used for the super-solution version, follows from the\ncomparison principle; the paper's `C ≥ 0` is not needed (`C` only enters through `max(C, 0)`).\n`X` is finite.", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.kruzkov_mul_eq_neg_rpow", "GuaranteedSubsol.rpow_le_rpow_add_mul_sub"], "labels": ["lem:cplx_global_iteration_withUnknown", "lem:pow_cvx"], "direct": ["Guara .α (p.Λ · x))) (hα : 0 < p.α)\n    (hρ0 : 0 < p.ρ) (hρ1 : p.ρ < 1) (hτ : 0 < p.τ) (hε : 0 < p.ε)\n    (hbd : ∀ x ∉ I, 2 * p.Δmax ≤ ubd x) :\n    ∃ uFix : X → ℝ, p.Λ uFix = uFix ∧ (∀ v, p.Λ v = v → v = uFix) ∧\n      (∀ J : Set X, HasComparisonPrinciple J p.Λ) ∧\n      (p.ε ≤ p.εmax uFix →\n        anbAgsiStopIndex p ≤ ((⌈p.nMax uFix⌉₊ + 1 : ℕ) : ℕ∞) ∧\n        ((anbAgsiRun p (anbAgsiStopIndex p).toNat).uSub ≤\n            p.Λ (anbAgsiRun p (anbAgsiStopIndex p).toNat).uSub ∧\n          Global.monotoneExtension p.Λ (anbAgsiRun p (anbAgsiStopIndex p).toNat).uSup ≤\n            (anbAgsiRun p (anbAgsiStopIndex p).toNat).uSup ∧\n          anbDone p (anbAgsiRun p (anbAgsiStopIndex p).toNat)) ∧\n        (∀ k, (anbAgsiRunData p k).Δ < p.Δmax) ∧\n        (∀ (k : ℕ) (x : X),\n          (anbAgsiRun p (k + 1)).countSub x ≤ (anbAgsiRun p k).countSub x + (p.NΛ''agsi : ℕ∞) ∧\n          (anbAgsiRun p (k + 1)).countSup x ≤ (anbAgsiRun p k).countSup x + (p.NΛ''agsi : ℕ∞)) ∧\n        (∀ (x : X) (S : Finset ℕ), (∀ k ∈ S, x ∈ (anbAgsiRunData p k).band) →\n          S.card ≤ p.NΛ' Cpast CΓ CΓ' uFix) ∧\n        (∀ (k : ℕ) (x : X),\n          (anbAgsiRun p k).countSub x ≤ ((p.NΛ' Cpast CΓ CΓ' uFix * p.NΛ''agsi : ℕ) : ℕ∞) ∧\n          (anbAgsiRun p k).countSup x ≤ ((p.NΛ' Cpast CΓ CΓ' uFix * p.NΛ''agsi : ℕ) : ℕ∞) ∧\n          (anbAgsiRun p k).countHat x ≤ p.NΓ Cpast CΓ CΓ' uFix))", "doc": "Source: Theorem th:complexity_with_agsi (AGSI2.tex), packaged as `anbRun_complexity` (author's\nrequest): the statement of Theorem th:complexity holds when lines anb:while_sub and anb:while_sup\nof algo:anb are replaced with parallel AGSI on the band `B_n` (`anbAgsiRun`, the ANB with the inner\nsolver `anbAgsi`), with the modified constant `N''_Λ := ⌈2Δ_max/(-α ln ρ)⌉ + ⌊2/(1 - ρ)²⌋`\n(`AnbParams.NΛ''agsi`). As in V1 (author rulings now in the paper): `Δ_max := 2α ln(2e/ε) + 2τ`,\n`n_max` with a ceiling, `2 Δ_max ≤ min u_bd`, `0 < ρ < 1`, the bound `N_Λ` for each of the two\ncounters, and `Δ_max` in `N''_Λ`. Departures from V1: the second term `2/(1 - ρ)²` of `N''_Λ` is\nrounded down since the update counts are integers; the joint \"Until\" loop of the paper is modelled\nas two separate AGSI runs, for `ū` and for `u̲`, which is equivalent since the two updates do not\ninteract. The AGSI bounds the number of updates at each point of the band, not the number of passes\nof the inner loops (a pass may update a single point): the bound on the passes of the inner loops in\n`anbRun_complexity` is replaced with the bound `N''_Λ` on the number of updates at each point in\neach iteration (the counters increase by at most `N''_Λ`). `X` is finite and linearly ordered\n(tie-breaking).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.le_apply_zero_of_kruzkov_subAdditive", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_count_le_one", "GuaranteedSubsol.dijkstraRun_count_eq_one_iff", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.kruzkovOp_mul", "GuaranteedSubsol.restrictOp_superSolution", "GuaranteedSubsol.norm_sub_le_of_subAdditive", "GuaranteedSubsol.existsUnique_fixedPoint_of_subAdditive", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.le_of_subSolution_superSolution", "GuaranteedSubsol.existsUnique_fixedPoint_of_kruzkov", "GuaranteedSubsol.le_of_causal_real", "GuaranteedSubsol.exists_fixedPoint_of_causal", "GuaranteedSubsol.Causal.max", "GuaranteedSubsol.Causal.min", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.HasMemory.apply_eq_apply_max", "GuaranteedSubsol.subsol_extension", "GuaranteedSubsol.max_min_fixedPoint", "GuaranteedSubsol.Causal.max_min", "GuaranteedSubsol.subsol_growth", "GuaranteedSubsol.t_advances", "GuaranteedSubsol.parallelAgsiStep_superSolution", "GuaranteedSubsol.parallelAgsiRun_count_le_of_subAdditive", "GuaranteedSubsol.parallelAgsiSubStep_iterate", "Guarante

"The quantities of the iteration of algo:anb started from the state `s` (lines anb:hatu to algoline:etan, with line anb:hatu2 skipped). `û_n` is finite in the analysis; the conversion from `ℝ_∞` uses the junk value `0` otherwise.", "notes": [], "code": "noncomputable def anbStepData [Fintype X] [LinearOrder X] (p : AnbParams X) (s : AnbState X) :\n    AnbStepData X :=\n  let T : ℝ := s.n * p.τ\n  let D := dijkstraRun (anbHatOp p.Γ s.uSub T) s.uHatInit (Nat.card X)\n  let uHat : X → ℝ := fun x => (D.u x).untopD 0\n  let t := anbLevel p.ε T uHat s.uSup\n  let B := anbBand T (T - t) uHat\n  { hatRun := D, uHat := uHat, t := t, Δ := T - t, band := B\n    η := (1 - p.ρ) * Real.exp (-T / p.α)\n    vSub := fun x => kruzkov (1 / p.α) (uHat x)\n    vSup := fun x => kruzkov (1 / p.α) (s.uSup x)\n    ΦSub := bandOp (Global.kruzkovOp p.α p.Λ) B fun x => kruzkov (1 / p.α) (uHat x)\n    ΦSup := bandOp (Global.kruzkovOp p.α p.Λ) B fun x => kruzkov (1 / p.α) (s.uSup x) }"}, {"name": "AnbStepData.tMinus", "file": "Anb.lean", "doc": "`t⁻_n:= t_n - Δ_n` (Prop. prop:Dijkstra_band); for the data computed by `anbStepData`, this is `nτ - 2Δ_n`, the lower end of the band `B_n`.", "notes": [], "code": "def AnbStepData.tMinus (d : AnbStepData X) : ℝ := d.t - d.Δ"}, {"name": "AnbStepData.tPlus", "file": "Anb.lean", "doc": "`t⁺_n:= (1 + ε) t_n + C_past + C'_Γ + C_Γ Δ_n` (Corollary corol:Bn_comp), the upper bound of the exact solution `u_*` on the bands `B_n` and `B'_n`.", "notes": [], "code": "def AnbStepData.tPlus (d : AnbStepData X) (ε Cpast CΓ CΓ' : ℝ) : ℝ :=\n  (1 + ε) * d.t + Cpast + CΓ' + CΓ * d.Δ"}, {"name": "AnbStepData.passesSub", "file": "Anb.lean", "doc": "The number of passes of the inner loop of line anb:while_sub (the global iteration on the band `B_n`, sub-solution variant, started from `E_α û_n`), in `ℕ∞` (`⊤` if it never stops).", "notes": [], "code": "noncomputable def AnbStepData.passesSub (d : AnbStepData X) : ℕ∞ :=\n  globalIterSubPasses d.ΦSub d.η fun x => d.vSub x"}, {"name": "AnbStepData.passesSup", "file": "Anb.lean", "doc": "The number of passes of the inner loop of line anb:while_sup (the global iteration on the band `B_n`, super-solution version, started from `E_α u̲`), in `ℕ∞` (`⊤` if it never stops).", "notes": [], "code": "noncomputable def AnbStepData.passesSup (d : AnbStepData X) : ℕ∞ :=\n  globalIterPasses d.ΦSup d.η fun x => d.vSup x"}, {"name": "anbDijkstraGuess", "file": "Anb.lean", "doc": "Eq. eqdef:Dijkstra_supsol (Prop. prop:Dijkstra_band): the initial guess `uHatInit` for Dijkstra's method at line anb:hatu of iteration `n + 1`, built at the end of iteration `n`: `u(x):= û_n(x)` if `û_n(x) < t⁻_n`, and `u(x):= max (ū_{n+1}(x), T)` otherwise, with `T = (n + 1)τ` and `t⁻_n:= t_n - Δ_n`.", "notes": [], "code": "open Classical in\nnoncomputable def anbDijkstraGuess (T tMinus : ℝ) (uHat uSub : X → ℝ) : X → WithTop ℝ :=\n  fun x => if uHat x < tMinus then (uHat x : WithTop ℝ) else ((max (uSub x) T : ℝ) : WithTop ℝ)"}, {"name": "anbDijkstraBand", "file": "Anb.lean", "doc": "Eq. eqdef:Bpn: `B'_n:= {x | t⁻_{n-1} ≤ û_{n-1}(x) ∧ û_n(x) < T}`, with `T = nτ`, the band containing the points updated by Dijkstra's method in iteration `n` (Prop. prop:Dijkstra_band).", "notes": [], "code": "def anbDijkstraBand (tMinus T : ℝ) (uHatPrev uHat : X → ℝ) : Set X :=\n  {x | tMinus ≤ uHatPrev x ∧ uHat x < T}"}, {"name": "AnbInnerSolver", "file": "Anb.lean", "doc": "The inner solver of lines anb:while_sub and anb:while_sup, acting on the maps on a band `B` with operator `Φ`, tolerance `η` and initial map `v`: the result, and the number of updates at each point of `B` (`⊤` if the loop never stops; the values at the points outside `B` are not used), for the sub-solution variant and the super-solution version.", "notes": [], "code": "structure AnbInnerSolver (X : Type*) where\n  subResult : (B : Set X) → ((B → ℝ) → B → ℝ) → ℝ → (B → ℝ) → B → ℝ\n  subCount : (B : Set X) → ((B → ℝ) → B → ℝ) → ℝ → (B → ℝ) → X → ℕ∞\n  supResult : (B : Set X) → ((B → ℝ) → B → ℝ) → ℝ → (B → ℝ) → B → ℝ\n  supCount : (B : Set X) → ((B → ℝ) → B → ℝ) → ℝ → (B → ℝ) → X → ℕ∞"}, {"name": "anbStepWith", "file": "Anb.lean", "doc": "One iteration of the main loop of algo:anb (its body, lines anb:hatu to anb:while_sup; the stopping test of line anb:for is not applied here, see `anbDone`), with the inner solver `S`: compute the quantities of the iteration (`anbStepData`), run the two inner loops on the band `B_n` (on the subtype), extend their results by the frozen values outside `B_n`, convert back from Kruzkov coordinates, update the counters, set the initial guess for `û` of the next iteration (`anbDijkstraGuess`, eq. eqdef:Dijkstra_supsol), and increment `n`.", "notes": [], "code": "open Classical in\nnoncomputable def anbStepWith [Fintype X] [LinearOrder X] (S : AnbInnerSolver X) (p : AnbParams X)\n    (s : AnbState X) : AnbState X :=\n  let d := anbStepData p s\n  let wSub : X → ℝ :=\n    bandExtend d.band d.vSub (S.subResult d.band d.ΦSub d.η fun x => d.vSub x)\n  let wSup : X → ℝ := bandExtend d.band d.vSup (S.supResult d.band d.ΦSup d.η fun x => d.vSup x)\n  let uSub : X → ℝ := fun x => -p.α * Real.log (-wSub x)\n  { n := s.n + 1\n    uSub := uSub\n    uSup := fun x => kruzkovInv p.α (wSup x)\n    uHatInit := anbDijkstraGuess (((s.n + 1 : ℕ) : ℝ) * p.τ) d.tMinus d.uHat uSub\n    countSub := fun x =>\n      s.countSub x + if x ∈ d.band then S.subCount d.band d.ΦSub d.η (fun y => d.vSub y) x else 0\n    countSup := fun x =>\n      s.countSup x + if x ∈ d.band then S.supCount d.band d.ΦSup d.η (fun y => d.vSup y) x else 0\n    countHat := fun x => s.countHat x + d.hatRun.count x }"}, {"name": "anbStep", "file": "Anb.lean", "doc": "One iteration of the main loop of algo:anb (its body, lines anb:hatu to anb:while_sup; the stopping test of line anb:for is not applied here, see `anbDone`): the inner loops are global iterations on the band `B_n` (`anbGlobalIter`).", "notes": [], "code": "noncomputable def anbStep [Fintype X] [LinearOrder X] (p : AnbParams X) (s : AnbState X) :\n    AnbState X :=\n  anbStepWith anbGlobalIter p s"}, {"name": "anbSubCount", "file": "Anb.lean", "doc": "The number of updates at each point of the band `B_n` of the inner loop of line anb:while_sub (inner solver `S`) in the iteration started from `s` (`⊤` if the loop never stops).", "notes": [], "code": "noncomputable def anbSubCount [Fintype X] [LinearOrder X] (S : AnbInnerSolver X) (p : AnbParams X)\n    (s : AnbState X) : X → ℕ∞ :=\n  S.subCount (anbStepData p s).band (anbStepData p s).ΦSub (anbStepData p s).η\n    fun y => (anbStepData p s).vSub y"}, {"name": "anbSupCount", "file": "Anb.lean", "doc": "The number of updates at each point of the band `B_n` of the inner loop of line anb:while_sup (inner solver `S`) in the iteration started from `s` (`⊤` if the loop never stops).", "notes": [], "code": "noncomputable def anbSupCount [Fintype X] [LinearOrder X] (S : AnbInnerSolver X) (p : AnbParams X)\n    (s : AnbState X) : X → ℕ∞ :=\n  S.supCount (anbStepData p s).band (anbStepData p s).ΦSup (anbStepData p s).η\n    fun y => (anbStepData p s).vSup y"}], "loop": [{"name": "anbDone", "file": "Anb.lean", "doc": "Stopping criterion of line anb:for: `(1 + ε) ū ≥ u̲` on `X`.", "notes": [], "code": "def anbDone (p : AnbParams X) (s : AnbState X) : Prop :=\n  ∀ x, s.uSup x ≤ (((1 + p.ε) * s.uSub x : ℝ) : WithTop ℝ)"}, {"name": "anbRunWith", "file": "Anb.lean", "doc": "The state of the ANB with the inner solver `S` after `k` iterations of its main loop (at the start of iteration `n = k`).", "notes": [], "code": "noncomputable def anbRunWith [Fintype X] [LinearOrder X] (S : AnbInnerSolver X) (p : AnbParams X)\n    (k : ℕ) : AnbState X :=\n  (anbStepWith S p)^[k] anbInit"}, {"name": "anbStopIndexWith", "file": "Anb.lean", "doc": "The iteration at which the ANB with the inner solver `S` terminates: the first `k` such that the stopping test `(1 + ε) ū ≥ u̲` holds at the start of iteration `k` (`⊤` if it never holds).", "notes": [], "code": "open Classical in\nnoncomputable def anbStopIndexWith [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    (p : AnbParams X) : ℕ∞ :=\n  if h : ∃ k, anbDone p (anbRunWith S p k) then (Nat.find h : ℕ∞) else ⊤"}, {"name": "anbRun", "file": "Anb.lean", "doc": "The state of algo:anb after `k` iterations of its main loop (at the start of iteration `n = k`). The iterations are not stopped by the test `anbDone`; the algorithm terminates at the first `k` such that `anbDone p (anbRun p k)` (`anbStopIndex`).", "notes": [], "code": "noncomputable def anbRun [Fintype X] [LinearOrder X] (p : AnbParams X) (k : ℕ) : AnbState X :=\n  anbRunWith anbGlobalIter p k"}, {"name": "anbStopIndex", "file": "Anb.lean", "doc": "The iteration at which algo:anb terminates: the first `k` such that the stopping test `(1 + ε) ū ≥ u̲` holds at the start of iteration `k` (`⊤` if it never holds).", "notes": [], "code": "noncomputable def anbStopIndex [Fintype X] [LinearOrder X] (p : AnbParams X) : ℕ∞ :=\n  anbStopIndexWith anbGlobalIter p"}, {"name": "anbRunDataWith", "file": "Anb.lean", "doc": "The quantities of iteration `n = k` of the ANB with the inner solver `S`.", "notes": [], "code": "noncomputable def anbRunDataWith [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    (p : AnbParams X) (k : ℕ) : AnbStepData X :=\n  anbStepData p (anbRunWith S p k)"}, {"name": "anbRunData", "file": "Anb.lean", "doc": "The quantities of iteration `n = k` of algo:anb (`û_k`, `t_k`, `Δ_k`, `B_k`,...), computed from the state at its start.", "notes": [], "code": "noncomputable def anbRunData [Fintype X] [LinearOrder X] (p : AnbParams X) (k : ℕ) :\n    AnbStepData X :=\n  anbRunDataWith anbGlobalIter p k"}, {"name": "anbAgsiRun", "file": "Anb.lean", "doc": "The state of the variant of algo:anb of Theorem th:complexity_with_agsi, whose inner loops are parallel AGSI on the band `B_n` (`anbAgsi`), after `k` iterations of its main loop.", "notes": [], "code": "noncomputable def anbAgsiRun [Fintype X] [LinearOrder X] (p : AnbParams X) (k : ℕ) :\n    AnbState X :=\n  anbRunWith anbAgsi p k"}, {"name": "anbAgsiRunData", "file": "Anb.lean", "doc": "The quantities of iteration `n = k` of the variant of algo:anb with the parallel AGSI.", "notes": [], "code": "noncomputable def anbAgsiRunData [Fintype X] [LinearOrder X] (p : AnbParams X) (k : ℕ) :\n    AnbStepData X :=\n  anbRunDataWith anbAgsi p k"}, {"name": "anbAgsiStopIndex", "file": "Anb.lean", "doc": "The iteration at which the variant of algo:anb with the parallel AGSI terminates (`⊤` if the stopping test never holds).", "notes": [], "code": "noncomputable def anbAgsiStopIndex [Fintype X] [LinearOrder X] (p : AnbParams X) : ℕ∞ :=\n  anbStopIndexWith anbAgsi p"}]}]}, "algo:anb_lazy": {"title": "Adaptive Narrow Band (ANB), complete implementation", "termination": ["GuaranteedSubsol.anbHeapRun_equiv", "GuaranteedSubsol.anbLazyRun_equiv", "GuaranteedSubsol.anbStopIndex_le"], "variants": [{"name": "With the sorted lists L, M, S, Sc", "state": [{"name": "AnbHeapState", "file": "AnbHeap.lean", "doc": "State of the ANB with sorted lists: the iteration index `n`, the map `ũ` (`uTilde`; `none` is the placeholder `⋄`, standing for `(n-1)τ`), the super-solution `u̲~` (`uSup`), the state of Dijkstra's method (`ǔ`, the list `L`, the acceptance counts, the number of evaluations of `Γ`), the lists `M`, `S`, `Sc`, the previous band `B_{n-1}` (`bandPrev`), and the numbers of updates of `ū` and `u̲~` at each point.", "notes": [], "code": "structure AnbHeapState (X : Type*) where\n  n : ℕ\n  uTilde : X → Option ℝ\n  uSup : X → WithTop ℝ\n  dij : DijkstraHeapState X\n  M : OrderedPartialMap X ℝ\n  S : OrderedPartialMap X ℝ\n  Sc : OrderedPartialMap X (WithTop ℝ)ᵒᵈ\n  bandPrev : Finset X\n  countSub : X → ℕ∞\n  countSup : X → ℕ∞"}, {"name": "AnbHeapState.uSub", "file": "AnbHeap.lean", "doc": "The sub-solution `ū:= ũ^{⋄→(n-1)τ}`.", "notes": [], "code": "def uSub (s : AnbHeapState X) (τ : ℝ) : X → ℝ :=\n  fun x => (s.uTilde x).getD (((s.n : ℝ) - 1) * τ)"}, {"name": "anbHeapInit", "file": "AnbHeap.lean", "doc": "Initial state: `ũ = ⋄`, `ǔ = u̲~ = ∞`, `M = S = ∅`, `Sc` holds all the points (`#X` operations), `B_{-1} = ∅`, and `L` holds the keys of `max {0, Γ_∞}` at `ǔ = ∞` (`#X` evaluations of `Γ` and operations; `0 = ⋄→0` is the value of the placeholder in the first effective iteration `n = 1`).", "notes": [], "code": "noncomputable def anbHeapInit (Γ : (X → ℝ) → X → ℝ) : AnbHeapState X :=\n  { n := 0, uTilde := fun _ => none, uSup := fun _ => ⊤\n    dij := dijkstraHeapInit (anbHeapOp Γ 0) fun _ => ⊤\n    M := ⟨fun _ => none, 0⟩, S := ⟨fun _ => none, 0⟩\n    Sc := (⟨fun _ => none, 0⟩ : OrderedPartialMap X (WithTop ℝ)ᵒᵈ).set Finset.univ\n      (anbKeySc (fun _ => none) fun _ => ⊤)\n    bandPrev := ∅, countSub := 0, countSup := 0 }"}], "step": [{"name": "anbKeyS", "file": "AnbHeap.lean", "doc": "The key of `x` in the list `S` (eq. eqdef:S_heap): `ũ(x)` if it is not the placeholder (the map `ũ` itself).", "notes": [], "code": "def anbKeyS (u : X → Option ℝ) : X → Option ℝ := u"}, {"name": "anbKeyM", "file": "AnbHeap.lean", "doc": "The key of `x` in the list `M` (eq. eqdef:M_heap): `ũ(x)` if it is not the placeholder and `(1 + ε) ũ(x) < u̲~(x)`.", "notes": [], "code": "noncomputable def anbKeyM (ε : ℝ) (u : X → Option ℝ) (uSup : X → WithTop ℝ) : X → Option ℝ :=\n  fun x => match u x with\n    | none => none\n    | some r => if (((1 + ε) * r : ℝ) : WithTop ℝ) < uSup x then some r else none"}, {"name": "anbKeySc", "file": "AnbHeap.lean", "doc": "The key of `x` in the list `Sc`: `u̲~(x)`, in the reverse order, if `ũ(x)` is the placeholder.", "notes": [], "code": "def anbKeySc (u : X → Option ℝ) (uSup : X → WithTop ℝ) : X → Option (WithTop ℝ)ᵒᵈ :=\n  fun x => match u x with\n    | none => some (OrderDual.toDual (uSup x))\n    | some _ => none"}, {"name": "anbHeapOp", "file": "AnbHeap.lean", "doc": "The operator `max {ū, Γ_∞}` of the Dijkstra step, without the cutoff (the threshold `nτ` is the stopping test of the loop).", "notes": [], "code": "noncomputable def anbHeapOp (Γ : (X → ℝ) → X → ℝ) (uSub : X → ℝ) :\n    (X → WithTop ℝ) → X → WithTop ℝ :=\n  fun u x => max (uSub x : WithTop ℝ) (Global.monotoneExtension Γ u x)"}, {"name": "AnbHeapStepData", "file": "AnbHeap.lean", "doc": "The quantities of one iteration of the ANB with sorted lists, in the order of the program.", "notes": [], "code": "structure AnbHeapStepData (X : Type*) where\n  /-- The state of Dijkstra's method after line anb_lazy:Dijkstra. -/\n  dij : DijkstraHeapState X\n  /-- The points selected in line anb_lazy:Dijkstra (line Dijkstra:accept of algo:Dijkstra). -/\n  selected : Finset X\n  /-- The points updated in line anb_lazy:olu_gets_hatu. -/\n  updated : Finset X\n  /-- `ũ` after line anb_lazy:olu_gets_hatu. -/\n  uTildeInit : X → Option ℝ\n  /-- The lists `M`, `S`, `Sc` before line anb_lazy:update_MS. -/\n  M : OrderedPartialMap X ℝ\n  S : OrderedPartialMap X ℝ\n  Sc : OrderedPartialMap X (WithTop ℝ)ᵒᵈ\n  t : ℝ\n  Δ : ℝ\n  band : Finset X\n  η : ℝ\n  vSub : X → ℝ\n  vSup : X → ℝ\n  ΦSub : (↥(band : Set X) → ℝ) → ↥(band : Set X) → ℝ\n  ΦSup : (↥(band : Set X) → ℝ) → ↥(band : Set X) → ℝ"}, {"name": "anbHeapStepData", "file": "AnbHeap.lean", "doc": "The quantities of the iteration started from the state `s`, with stencils `𝒱` (see the module docstring).", "notes": [], "code": "open Classical in\nnoncomputable def anbHeapStepData (p : AnbParams X) (𝒱 : X → Set X) (s : AnbHeapState X) :\n    AnbHeapStepData X :=\n  let T : ℝ := s.n * p.τ\n  let D := dijkstraHeapLoop (anbHeapOp p.Γ (s.uSub p.τ)) 𝒱 T s.dij\n  let sel := Finset.univ.filter fun x => D.count x ≠ s.dij.count x\n  let W := s.S.entriesIco ((s.n - 1) * p.τ) T\n  let P := s.bandPrev ∪ sel ∪ W.1\n  let uTildeInit : X → Option ℝ := fun x =>\n    if x ∈ P then\n      (if D.u x = ⊤ ∧ s.uSub p.τ x < T then none\n        else some (max (s.uSub p.τ x) (min T ((D.u x).untopD T))))\n    else s.uTilde x\n  let M₁ := s.M.set P (anbKeyM p.ε uTildeInit s.uSup)\n  let S₁ := W.2.set P (anbKeyS uTildeInit)\n  let Sc₁ := s.Sc.set P (anbKeySc uTildeInit s.uSup)\n  let bM := M₁.bot\n  let t : ℝ := match bM.1 with\n    | none => T\n    | some (t, _) => min T t\n  let B := S₁.entriesIco (T - 2 * (T - t)) T\n  let uHat : X → ℝ := fun x => (uTildeInit x).getD T\n  { dij := D, selected := sel, updated := P, uTildeInit := uTildeInit, M := bM.2, S := B.2\n    Sc := Sc₁, t := t, Δ := T - t, band := B.1\n    η := (1 - p.ρ) * Real.exp (-T / p.α)\n    vSub := fun x => kruzkov (1 / p.α) (uHat x)\n    vSup := fun x => kruzkov (1 / p.α) (s.uSup x)\n    ΦSub := bandOp (Global.kruzkovOp p.α p.Λ) B.1 fun x => kruzkov (1 / p.α) (uHat x)\n    ΦSup := bandOp (Global.kruzkovOp p.α p.Λ) B.1 fun x => kruzkov (1 / p.α) (s.uSup x) }"}, {"name": "anbHeapStepWith", "file": "AnbHeap.lean", "doc": "One iteration of the ANB with sorted lists, inner solver `S` and stencils `𝒱`: the inner loops on the band (as in `AnbLazy`), the update of `M`, `S`, `Sc`, the reset of `ǔ` on the band, and the update of the keys of `L`.", "notes": [], "code": "open Classical in\nnoncomputable def anbHeapStepWith (S : AnbInnerSolver X) (p : AnbParams X) (𝒱 : X → Set X)\n    (s : AnbHeapState X) : AnbHeapState X :=\n  let d := anbHeapStepData p 𝒱 s\n  let T : ℝ := s.n * p.τ\n  let B : Set X := d.band\n  let wSub : X → ℝ := bandExtend B d.vSub (S.subResult B d.ΦSub d.η fun x => d.vSub x)\n  let wSup : X → ℝ := bandExtend B d.vSup (S.supResult B d.ΦSup d.η fun x => d.vSup x)\n  let uTilde : X → Option ℝ := fun x =>\n    if x ∈ d.band then some (-p.α * Real.log (-wSub x)) else d.uTildeInit x\n  let uSup : X → WithTop ℝ := fun x => kruzkovInv p.α (wSup x)\n  let uCheck : X → WithTop ℝ := fun x => if x ∈ d.band then ⊤ else d.dij.u x\n  let uSubNext : X → ℝ := fun x => (uTilde x).getD T\n  let R := d.band ∪ d.band.biUnion (Global.Ext.revStencil 𝒱)\n  { n := s.n + 1\n    uTilde := uTilde\n    uSup := uSup\n    dij := { u := uCheck, count := d.dij.count\n             L := d.dij.L.set R (dijkstraKey (anbHeapOp p.Γ uSubNext) uCheck)\n             evalCount := d.dij.evalCount + R.card }\n    M := d.M.set d.band (anbKeyM p.ε uTilde uSup)\n    S := d.S.set d.band (anbKeyS uTilde)\n    Sc := d.Sc.set d.band (anbKeySc uTilde uSup)\n    bandPrev := d.band\n    countSub := fun x =>\n      s.countSub x + if x ∈ d.band then S.subCount B d.ΦSub d.η (fun y => d.vSub y) x else 0\n    countSup := fun x =>\n      s.countSup x + if x ∈ d.band then S.supCount B d.ΦSup d.η (fun y => d.vSup y) x else 0 }"}], "loop": [{"name": "anbHeapDone", "file": "AnbHeap.lean", "doc": "Stopping test: `M = ∅`, and the largest key `u̲~(x)` of `Sc` (if any) is `≤ (1 + ε)(n-1)τ`.", "notes": [], "code": "def anbHeapDone (p : AnbParams X) (s : AnbHeapState X) : Prop :=\n  (∀ x, s.M.v x = none) ∧ ∀ t x, OrderedPartialMap.botVal s.Sc.v = some (t, x) →\n    OrderDual.ofDual t ≤ (((1 + p.ε) * (((s.n : ℝ) - 1) * p.τ) : ℝ) : WithTop ℝ)"}, {"name": "anbHeapRunWith", "file": "AnbHeap.lean", "doc": "The state of the ANB with sorted lists after `k` iterations.", "notes": [], "code": "noncomputable def anbHeapRunWith (S : AnbInnerSolver X) (p : AnbParams X) (𝒱 : X → Set X)\n    (k : ℕ) : AnbHeapState X :=\n  (anbHeapStepWith S p 𝒱)^[k] (anbHeapInit p.Γ)"}, {"name": "anbHeapStopIndexWith", "file": "AnbHeap.lean", "doc": "The iteration at which the ANB with sorted lists terminates: the first `k` such that the stopping test holds at the start of iteration `k` (`⊤` if it never holds).", "notes": [], "code": "open Classical in\nnoncomputable def anbHeapStopIndexWith (S : AnbInnerSolver X) (p : AnbParams X)\n    (𝒱 : X → Set X) : ℕ∞ :=\n  if h : ∃ k, anbHeapDone p (anbHeapRunWith S p 𝒱 k) then (Nat.find h : ℕ∞) else ⊤"}, {"name": "anbHeapRunDataWith", "file": "AnbHeap.lean", "doc": "The quantities of iteration `n = k` of the ANB with sorted lists.", "notes": [], "code": "noncomputable def anbHeapRunDataWith (S : AnbInnerSolver X) (p : AnbParams X) (𝒱 : X → Set X)\n    (k : ℕ) : AnbHeapStepData X :=\n  anbHeapStepData p 𝒱 (anbHeapRunWith S p 𝒱 k)"}, {"name": "anbHeapCountB'", "file": "AnbHeap.lean", "doc": "`countB'(x)`: the number of selections of `x` in line anb_lazy:Dijkstra (line Dijkstra:accept; updates by Dijkstra's method) in the iterations `k < K` of the ANB with sorted lists. By Prop. prop:Dijkstra_band, they lie in the bands `B'_n` (formalized for algo:anb with the global iteration, `anbRun_hatRun_count_mem`).", "notes": [], "code": "noncomputable def anbHeapCountB' (S : AnbInnerSolver X) (p : AnbParams X) (𝒱 : X → Set X) (K : ℕ)\n    (x : X) : ℕ :=\n  (anbHeapRunWith S p 𝒱 K).dij.count x"}, {"name": "anbHeapCountB", "file": "AnbHeap.lean", "doc": "`countB(x)`: the number of iterations `k < K` of the ANB with sorted lists in which `x` is in the narrow band `B_k`.", "notes": [], "code": "noncomputable def anbHeapCountB (S : AnbInnerSolver X) (p : AnbParams X) (𝒱 : X → Set X) (K : ℕ)\n    (x : X) : ℕ :=\n  ((Finset.range K).filter fun k => x ∈ (anbHeapRunDataWith S p 𝒱 k).band).card"}, {"name": "AnbHeapCostBound", "file": "AnbHeapComplexity.lean", "doc": "The bounds of Prop. prop:complexity_lazy at termination of the ANB with sorted lists, with inner solver `S`: at most `2 #X N_Λ` updates by the inner loops, `#X + Ñ N_Γ + (#X + Ñ) N'_Λ` evaluations of `Γ`, and `2 #X + 4 Kmax + N_Γ (5 #X + Ñ) + N'_Λ (12 #X + Ñ)` operations on the lists, `Ñ:= ∑ₓ #𝒱̃(x)`.", "notes": [], "code": "def AnbHeapCostBound (S : AnbInnerSolver X) (p : AnbParams X) (𝒱 : X → Set X)\n    (NΓ NΛ' NΛ Kmax : ℕ) : Prop :=\n  ∑ x, ((anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).countSub x +\n      (anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).countSup x) ≤\n    ((2 * Fintype.card X * NΛ : ℕ) : ℕ∞) ∧\n  (anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).dij.evalCount ≤\n    Fintype.card X + (∑ x, (Global.Ext.revStencil 𝒱 x).card) * NΓ +\n      (Fintype.card X + ∑ x, (Global.Ext.revStencil 𝒱 x).card) * NΛ' ∧\n  (anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).dij.L.count +\n    (anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).M.count +\n    (anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).S.count +\n    (anbHeapRunWith S p 𝒱 (anbHeapStopIndexWith S p 𝒱).toNat).Sc.count ≤\n    2 * Fintype.card X + 4 * Kmax +\n      NΓ * (5 * Fintype.card X + ∑ x, (Global.Ext.revStencil 𝒱 x).card) +\n      NΛ' * (12 * Fintype.card X + ∑ x, (Global.Ext.revStencil 𝒱 x).card)"}]}, {"name": "With the placeholder ⋄, without the lists (intermediate version)", "state": [{"name": "AnbLazyState", "file": "AnbLazy.lean", "doc": "State of the ANB with a placeholder: the iteration index `n`, the map `ũ` (`uTilde`), whose value `none` (`⋄`) is a placeholder for `(n-1)τ`, the super-solution `u̲~` (`uSup`), the initial guess `ǔ^init` (`uCheckInit`) for Dijkstra's method, and the numbers of updates of `ū`, `u̲~` and `ǔ` at each point.", "notes": [], "code": "structure AnbLazyState (X : Type*) where\n  n : ℕ\n  uTilde : X → Option ℝ\n  uSup : X → WithTop ℝ\n  uCheckInit : X → WithTop ℝ\n  countSub : X → ℕ∞\n  countSup : X → ℕ∞\n  countHat : X → ℕ"}, {"name": "AnbLazyState.uSub", "file": "AnbLazy.lean", "doc": "The sub-solution `ū:= ũ^{⋄→(n-1)τ}`: the placeholder `⋄ = none` stands for `(n-1)τ`.", "notes": [], "code": "def uSub (s : AnbLazyState X) (τ : ℝ) : X → ℝ :=\n  fun x => (s.uTilde x).getD (((s.n : ℝ) - 1) * τ)"}, {"name": "AnbLazyState.uHatInit", "file": "AnbLazy.lean", "doc": "The initial guess of the ANB, `û^init:= min {ǔ^init, max {ū, nτ}}`.", "notes": [], "code": "def uHatInit (s : AnbLazyState X) (τ : ℝ) : X → WithTop ℝ :=\n  fun x => min (s.uCheckInit x) ((max (s.uSub τ x) (s.n * τ) : ℝ) : WithTop ℝ)"}, {"name": "anbLazyInit", "file": "AnbLazy.lean", "doc": "Initial state: `ũ_0 = 0` (no placeholder), `u̲~_0 = ∞`, `ǔ_0^init = ∞`, no updates.", "notes": [], "code": "def anbLazyInit : AnbLazyState X := ⟨0, fun _ => some 0, fun _ => ⊤, fun _ => ⊤, 0, 0, 0⟩"}], "step": [{"name": "anbCheckOp", "file": "AnbLazy.lean", "doc": "The operator `u ↦ max {ū, Γ_∞ u}^{<T}` of the Dijkstra step.", "notes": [], "code": "noncomputable def anbCheckOp (Γ : (X → ℝ) → X → ℝ) (uSub : X → ℝ) (T : ℝ) :\n    (X → WithTop ℝ) → X → WithTop ℝ :=\n  fun u x => cutoffLt T (max (uSub x : WithTop ℝ) (Global.monotoneExtension Γ u x))"}, {"name": "anbLazyLevel", "file": "AnbLazy.lean", "doc": "`t_n:= min {T, min {ũ^init(x) | (1 + ε) ũ^init(x) < u̲~(x)}}`, the placeholder `none` never satisfying the condition; it is `T` if the set is empty.", "notes": [], "code": "open Classical in\nnoncomputable def anbLazyLevel [Fintype X] (ε T : ℝ) (uTildeInit : X → Option ℝ)\n    (uSup : X → WithTop ℝ) : ℝ :=\n  let S := Finset.univ.filter fun x =>\n    uTildeInit x ≠ none ∧ (((1 + ε) * (uTildeInit x).getD T : ℝ) : WithTop ℝ) < uSup x\n  if h : S.Nonempty then min T (S.inf' h fun x => (uTildeInit x).getD T) else T"}, {"name": "AnbLazyStepData", "file": "AnbLazy.lean", "doc": "The quantities of one iteration of the ANB with a placeholder, computed from the state at its start: Dijkstra's run, `ǔ`, `ũ^init`, its value `û:= (ũ^init)^{⋄→T}` (`uHat`), `t_n`, `Δ_n`, `B_n`, `η_n`, the inputs of the inner loops in Kruzkov coordinates, and the operators acting on the band.", "notes": [], "code": "structure AnbLazyStepData (X : Type*) where\n  checkRun : DijkstraState X\n  uCheck : X → WithTop ℝ\n  uTildeInit : X → Option ℝ\n  uHat : X → ℝ\n  t : ℝ\n  Δ : ℝ\n  band : Set X\n  η : ℝ\n  vSub : X → ℝ\n  vSup : X → ℝ\n  ΦSub : (band → ℝ) → band → ℝ\n  ΦSup : (band → ℝ) → band → ℝ"}, {"name": "anbLazyStepData", "file": "AnbLazy.lean", "doc": "The quantities of the iteration started from the state `s` (see the module docstring).", "notes": [], "code": "open Classical in\nnoncomputable def anbLazyStepData [Fintype X] [LinearOrder X] (p : AnbParams X)\n    (s : AnbLazyState X) : AnbLazyStepData X :=\n  let T : ℝ := s.n * p.τ\n  let D := dijkstraRun (anbCheckOp p.Γ (s.uSub p.τ) T) s.uCheckInit (Nat.card X)\n  let uTildeInit : X → Option ℝ := fun x =>\n    if D.u x = ⊤ ∧ s.uSub p.τ x < T then none\n    else some (max (s.uSub p.τ x) (min ((D.u x).untopD T) T))\n  let uHat : X → ℝ := fun x => (uTildeInit x).getD T\n  let t := anbLazyLevel p.ε T uTildeInit s.uSup\n  let B : Set X := {x | ∃ r, uTildeInit x = some r ∧ T - 2 * (T - t) ≤ r ∧ r < T}\n  { checkRun := D, uCheck := D.u, uTildeInit := uTildeInit, uHat := uHat, t := t, Δ := T - t,\n    band := B\n    η := (1 - p.ρ) * Real.exp (-T / p.α)\n    vSub := fun x => kruzkov (1 / p.α) (uHat x)\n    vSup := fun x => kruzkov (1 / p.α) (s.uSup x)\n    ΦSub := bandOp (Global.kruzkovOp p.α p.Λ) B fun x => kruzkov (1 / p.α) (uHat x)\n    ΦSup := bandOp (Global.kruzkovOp p.α p.Λ) B fun x => kruzkov (1 / p.α) (s.uSup x) }"}, {"name": "anbLazyStepWith", "file": "AnbLazy.lean", "doc": "One iteration of the ANB with a placeholder, with the inner solver `S`: on the band, the results of the inner loops (extended by the frozen values outside the band), converted back from Kruzkov coordinates; outside the band, `ũ:= ũ^init` (placeholders included); the next guess `ǔ^{<t⁻_n}`; the counters.", "notes": [], "code": "open Classical in\nnoncomputable def anbLazyStepWith [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    (p : AnbParams X) (s : AnbLazyState X) : AnbLazyState X :=\n  let d := anbLazyStepData p s\n  let T : ℝ := s.n * p.τ\n  let wSub : X → ℝ :=\n    bandExtend d.band d.vSub (S.subResult d.band d.ΦSub d.η fun x => d.vSub x)\n  let wSup : X → ℝ := bandExtend d.band d.vSup (S.supResult d.band d.ΦSup d.η fun x => d.vSup x)\n  { n := s.n + 1\n    uTilde := fun x => if x ∈ d.band then some (-p.α * Real.log (-wSub x))\n      else d.uTildeInit x\n    uSup := fun x => kruzkovInv p.α (wSup x)\n    uCheckInit := fun x => cutoffLt (T - 2 * d.Δ) (d.uCheck x)\n    countSub := fun x =>\n      s.countSub x + if x ∈ d.band then S.subCount d.band d.ΦSub d.η (fun y => d.vSub y) x else 0\n    countSup := fun x =>\n      s.countSup x + if x ∈ d.band then S.supCount d.band d.ΦSup d.η (fun y => d.vSup y) x else 0\n    countHat := fun x => s.countHat x + d.checkRun.count x }"}], "loop": [{"name": "anbLazyDone", "file": "AnbLazy.lean", "doc": "Stopping test `(1 + ε) ũ^{⋄→(n-1)τ} ≥ u̲~`.", "notes": [], "code": "def anbLazyDone (p : AnbParams X) (s : AnbLazyState X) : Prop :=\n  ∀ x, s.uSup x ≤ (((1 + p.ε) * s.uSub p.τ x : ℝ) : WithTop ℝ)"}, {"name": "anbLazyRunWith", "file": "AnbLazy.lean", "doc": "The state of the ANB with a placeholder and inner solver `S`, after `k` iterations.", "notes": [], "code": "noncomputable def anbLazyRunWith [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    (p : AnbParams X) (k : ℕ) : AnbLazyState X :=\n  (anbLazyStepWith S p)^[k] anbLazyInit"}, {"name": "anbLazyRunDataWith", "file": "AnbLazy.lean", "doc": "The quantities of iteration `n = k` of the ANB with a placeholder and inner solver `S`.", "notes": [], "code": "noncomputable def anbLazyRunDataWith [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    (p : AnbParams X) (k : ℕ) : AnbLazyStepData X :=\n  anbLazyStepData p (anbLazyRunWith S p k)"}, {"name": "anbLazyStopIndexWith", "file": "AnbLazy.lean", "doc": "The iteration at which the ANB with a placeholder terminates: the first `k` such that the stopping test holds at the start of iteration `k` (`⊤` if it never holds).", "notes": [], "code": "open Classical in\nnoncomputable def anbLazyStopIndexWith [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    (p : AnbParams X) : ℕ∞ :=\n  if h : ∃ k, anbLazyDone p (anbLazyRunWith S p k) then (Nat.find h : ℕ∞) else ⊤"}]}]}}, "structs": {"OrderedPartialMap": {"title": "Ordered partial map: a sorted list of pairs (v x, x) with an operation counter", "link_decls": false, "statements": true, "sections": [{"title": "Structure", "open": true, "decls": [{"name": "OrderedPartialMap", "file": "OrderedPartialMap.lean", "doc": "An ordered partial map: the partial map `v` (`none` is absent) and an operation counter.", "notes": [], "code": "structure OrderedPartialMap (X V : Type*) where\n  v : X → Option V\n  count : ℕ"}]}, {"title": "Operations, with their costs", "open": true, "decls": [{"name": "empty", "file": "OrderedPartialMap.lean", "doc": "Whether there is no entry; cost `1`.", "notes": [], "code": "def empty (m : OrderedPartialMap X V) : Bool × OrderedPartialMap X V :=\n  (decide (∀ x, m.v x = none), ⟨m.v, m.count + 1⟩)"}, {"name": "bot", "file": "OrderedPartialMap.lean", "doc": "The smallest entry (`none` if there is none); cost `1`.", "notes": [], "code": "def bot (m : OrderedPartialMap X V) : Option (V × X) × OrderedPartialMap X V :=\n  (botVal m.v, ⟨m.v, m.count + 1⟩)"}, {"name": "set1", "file": "OrderedPartialMap.lean", "doc": "`v x:= t` (`t = none` erases `x`); cost `1`.", "notes": [], "code": "def set1 (m : OrderedPartialMap X V) (x : X) (t : Option V) : OrderedPartialMap X V :=\n  ⟨Function.update m.v x t, m.count + 1⟩"}, {"name": "set", "file": "OrderedPartialMap.lean", "doc": "`v x:= v' x` for `x ∈ Y`; cost `#Y`.", "notes": [], "code": "def set (m : OrderedPartialMap X V) (Y : Finset X) (v' : X → Option V) :\n    OrderedPartialMap X V :=\n  ⟨fun x => if x ∈ Y then v' x else m.v x, m.count + Y.card⟩"}, {"name": "erase1", "file": "OrderedPartialMap.lean", "doc": "Erase the entry of `x`; cost `1`.", "notes": [], "code": "def erase1 (m : OrderedPartialMap X V) (x : X) : OrderedPartialMap X V := m.set1 x none"}, {"name": "erase", "file": "OrderedPartialMap.lean", "doc": "Erase the entries of the points of `Y`; cost `#Y`.", "notes": [], "code": "def erase (m : OrderedPartialMap X V) (Y : Finset X) : OrderedPartialMap X V :=\n  m.set Y fun _ => none"}, {"name": "pop", "file": "OrderedPartialMap.lean", "doc": "The smallest entry (`none` if there is none), which is erased; cost `2` (`1` if there is no entry).", "notes": [], "code": "def pop (m : OrderedPartialMap X V) : Option (V × X) × OrderedPartialMap X V :=\n  match botVal m.v with\n  | none => (none, ⟨m.v, m.count + 1⟩)\n  | some (t, x) => (some (t, x), ⟨Function.update m.v x none, m.count + 2⟩)"}, {"name": "entriesIco", "file": "OrderedPartialMap.lean", "doc": "The points `x` whose value satisfies `Tm ≤ v x < Tp` (closed-open interval); cost `1 + #W`, where `W` is the output.", "notes": [], "code": "open Classical in\nnoncomputable def entriesIco (m : OrderedPartialMap X V) (Tm Tp : V) :\n    Finset X × OrderedPartialMap X V :=\n  let W := Finset.univ.filter fun x => ∃ t, m.v x = some t ∧ Tm ≤ t ∧ t < Tp\n  (W, ⟨m.v, m.count + 1 + W.card⟩)"}]}, {"title": "Auxiliary definitions", "open": false, "decls": [{"name": "entries", "file": "OrderedPartialMap.lean", "doc": "The entries `(v x, x)`, in the lexicographic order of `V ×ₗ X`.", "notes": [], "code": "def entries (v : X → Option V) : Finset (V ×ₗ X) :=\n  Finset.univ.filterMap (fun x => (v x).map fun t => toLex (t, x)) (by …)"}, {"name": "botVal", "file": "OrderedPartialMap.lean", "doc": "The smallest entry `(t, x)` for the lexicographic order (`none` if there is no entry).", "notes": [], "code": "def botVal (v : X → Option V) : Option (V × X) := WithTop.map ofLex (entries v).min"}]}]}, "AnbParams": {"title": "Parameters of the ANB: the scheme Λ, its causal underestimate Γ, the tolerance ε, and τ, α, ρ", "link_decls": false, "statements": true, "sections": [{"title": "Structure", "open": true, "decls": [{"name": "AnbParams", "file": "Anb.lean", "doc": "Parameters of algo:anb: the scheme `Λ`, its causal underestimate `Γ` (line anb:hatu), the tolerance `ε`, and the constants `τ`, `α`, `ρ` of line anb:input.", "notes": [], "code": "structure AnbParams (X : Type*) where\n  Λ : (X → ℝ) → X → ℝ\n  Γ : (X → ℝ) → X → ℝ\n  ε : ℝ\n  τ : ℝ\n  α : ℝ\n  ρ : ℝ"}]}, {"title": "Derived constants", "open": false, "decls": [{"name": "AnbParams.Δmax", "file": "Anb.lean", "doc": "`Δ_max:= 2α ln(2e/ε) + 2τ`, the bound on the half-width of the narrow band.", "notes": ["Corollary corol:max_width, as in V1; V0 had `2α ln(2e/ε) + τ`"], "code": "noncomputable def AnbParams.Δmax (p : AnbParams X) : ℝ :=\n  2 * p.α * Real.log (2 * Real.exp 1 / p.ε) + 2 * p.τ"}, {"name": "AnbParams.nMax", "file": "Anb.lean", "doc": "`(‖u_*‖_∞ + Δ_max) / τ`, for the fixed point `u_*`: the paper's `n_max` (Corollary corol:max_width) is its ceiling `⌈nMax⌉₊`.", "notes": [], "code": "noncomputable def AnbParams.nMax [Fintype X] (p : AnbParams X) (uFix : X → ℝ) : ℝ :=\n  (‖uFix‖ + p.Δmax) / p.τ"}, {"name": "AnbParams.εmax", "file": "Anb.lean", "doc": "`ε_max:= min (α / (‖u_*‖_∞ + Δ_max), 2)` (Corollary corol:max_width), for the fixed point `u_*`. Note that `Δ_max` depends on `ε`.", "notes": [], "code": "noncomputable def AnbParams.εmax [Fintype X] (p : AnbParams X) (uFix : X → ℝ) : ℝ :=\n  min (p.α / (‖uFix‖ + p.Δmax)) 2"}, {"name": "AnbParams.ΔplusMax", "file": "Anb.lean", "doc": "`Δ⁺_max:= (C_Γ - 1) Δ_max + ε ‖u_*‖_∞ + C_past + C'_Γ` (Corollary corol:NGamma).", "notes": [], "code": "noncomputable def AnbParams.ΔplusMax [Fintype X] (p : AnbParams X) (Cpast CΓ CΓ' : ℝ)\n    (uFix : X → ℝ) : ℝ :=\n  (CΓ - 1) * p.Δmax + p.ε * ‖uFix‖ + Cpast + CΓ'"}, {"name": "AnbParams.NΛ'", "file": "Anb.lean", "doc": "`N'_Λ:= ⌈(2 Δ_max + Δ⁺_max) / τ⌉`, the bound on the number of iterations with `x ∈ B_n` (Corollary corol:NGamma).", "notes": [], "code": "noncomputable def AnbParams.NΛ' [Fintype X] (p : AnbParams X) (Cpast CΓ CΓ' : ℝ)\n    (uFix : X → ℝ) : ℕ :=\n  ⌈(2 * p.Δmax + p.ΔplusMax Cpast CΓ CΓ' uFix) / p.τ⌉₊"}, {"name": "AnbParams.NΓ", "file": "Anb.lean", "doc": "`N_Γ:= N'_Λ + 1`, the bound on the number of iterations with `x ∈ B'_n` (Corollary corol:NGamma).", "notes": [], "code": "noncomputable def AnbParams.NΓ [Fintype X] (p : AnbParams X) (Cpast CΓ CΓ' : ℝ)\n    (uFix : X → ℝ) : ℕ :=\n  p.NΛ' Cpast CΓ CΓ' uFix + 1"}, {"name": "AnbParams.NΛ''", "file": "Anb.lean", "doc": "`N''_Λ:= ⌈(2 Δ_max / α - ln (1 - ρ)) / (-ln ρ)⌉`, the bound on the number of passes of the inner loops (Prop. prop:niter_while).", "notes": [], "code": "noncomputable def AnbParams.NΛ'' (p : AnbParams X) : ℕ :=\n  ⌈(2 * p.Δmax / p.α - Real.log (1 - p.ρ)) / (-Real.log p.ρ)⌉₊"}, {"name": "AnbParams.NΛ''agsi", "file": "Anb.lean", "doc": "`N''_Λ:= ⌈2 Δ_max / (-α ln ρ)⌉₊ + 2/(1-ρ)²` (Theorem th:complexity_with_agsi), the bound on the number of updates at each point of the band in each iteration of the variant with the parallel AGSI; its second term is rounded down, since the update counts are integers.", "notes": [], "code": "noncomputable def AnbParams.NΛ''agsi (p : AnbParams X) : ℕ :=\n  ⌈2 * p.Δmax / (-(p.α * Real.log p.ρ))⌉₊ + ⌊2 / (1 - p.ρ) ^ 2⌋₊"}]}, {"title": "Unknown constants regime", "open": true, "decls": [{"name": "AnbParams.withUnknown", "file": "Anb.lean", "doc": "The parameters `p` of algo:anb, together with unknown constants `β`, `σ`.", "notes": [], "code": "def AnbParams.withUnknown (p : AnbParams X) (β σ : ℝ) : AnbParams.WithUnknown X := ⟨p, β, σ⟩"}]}]}, "AnbInnerSolver": {"title": "Inner solver of the ANB: the loops on the narrow band (lines anb:while_sub and anb:while_sup)", "link_decls": false, "statements": true, "sections": [{"title": "Structure", "open": true, "decls": [{"name": "AnbInnerSolver", "file": "Anb.lean", "doc": "The inner solver of lines anb:while_sub and anb:while_sup, acting on the maps on a band `B` with operator `Φ`, tolerance `η` and initial map `v`: the result, and the number of updates at each point of `B` (`⊤` if the loop never stops; the values at the points outside `B` are not used), for the sub-solution variant and the super-solution version.", "notes": [], "code": "structure AnbInnerSolver (X : Type*) where\n  subResult : (B : Set X) → ((B → ℝ) → B → ℝ) → ℝ → (B → ℝ) → B → ℝ\n  subCount : (B : Set X) → ((B → ℝ) → B → ℝ) → ℝ → (B → ℝ) → X → ℕ∞\n  supResult : (B : Set X) → ((B → ℝ) → B → ℝ) → ℝ → (B → ℝ) → B → ℝ\n  supCount : (B : Set X) → ((B → ℝ) → B → ℝ) → ℝ → (B → ℝ) → X → ℕ∞"}]}, {"title": "The two instances", "open": true, "decls": [{"name": "anbGlobalIter", "file": "Anb.lean", "doc": "The inner solver of algo:anb: the global iteration (algo:global_iteration), which updates each point of the band once per pass.", "notes": [], "code": "noncomputable def anbGlobalIter : AnbInnerSolver X :=\n  ⟨fun _ Φ η v => globalIterSubResult Φ η v, fun _ Φ η v _ => globalIterSubPasses Φ η v,\n    fun _ Φ η v => globalIterResult Φ η v, fun _ Φ η v _ => globalIterPasses Φ η v⟩"}, {"name": "anbAgsi", "file": "Anb.lean", "doc": "The inner solver of the variant of Theorem th:complexity_with_agsi: the parallel AGSI (algo:agsi_parallel).", "notes": [], "code": "open Classical in\nnoncomputable def anbAgsi : AnbInnerSolver X :=\n  ⟨fun _ => parallelAgsiSubResult,\n    fun B Φ η v x => if h : x ∈ B then parallelAgsiSubCount Φ η v ⟨x, h⟩ else 0,\n    fun _ => parallelAgsiResult,\n    fun B Φ η v x => if h : x ∈ B then parallelAgsiCount Φ η v ⟨x, h⟩ else 0⟩"}]}, {"title": "Properties used in the analysis", "open": false, "decls": [{"name": "AnbInnerSolver.Valid", "file": "Anb.lean", "doc": "The properties of an inner solver used in the analysis of algo:anb: its outputs lie in any set of maps which contains the input and is closed under partial updates `w(y) ← Φ w(y)`, and when the numbers of updates are finite at all the points of the band, the outputs satisfy the stopping criteria.", "notes": [], "code": "class AnbInnerSolver.Valid (S : AnbInnerSolver X) : Prop where\n  subResult_mem : ∀ (B : Set X) (Φ : (B → ℝ) → B → ℝ) (η : ℝ) (v : B → ℝ) (N : Set (B → ℝ)),\n    v ∈ N → (∀ w ∈ N, ∀ w' : B → ℝ, (∀ y, w' y = w y ∨ w' y = Φ w y) → w' ∈ N) →\n      S.subResult B Φ η v ∈ N\n  supResult_mem : ∀ (B : Set X) (Φ : (B → ℝ) → B → ℝ) (η : ℝ) (v : B → ℝ) (N : Set (B → ℝ)),\n    v ∈ N → (∀ w ∈ N, ∀ w' : B → ℝ, (∀ y, w' y = w y ∨ w' y = Φ w y) → w' ∈ N) →\n      S.supResult B Φ η v ∈ N\n  subResult_crit : ∀ (B : Set X) (Φ : (B → ℝ) → B → ℝ) (η : ℝ) (v : B → ℝ),\n    (∀ x ∈ B, S.subCount B Φ η v x < ⊤) →\n      ∀ y, Φ (S.subResult B Φ η v) y - S.subResult B Φ η v y ≤ η\n  supResult_crit : ∀ (B : Set X) (Φ : (B → ℝ) → B → ℝ) (η : ℝ) (v : B → ℝ),\n    (∀ x ∈ B, S.supCount B Φ η v x < ⊤) →\n      ∀ y, S.supResult B Φ η v y - Φ (S.supResult B Φ η v) y ≤ η"}]}]}, "AnbParams.WithUnknown": {"title": "ANB parameters with unknown constants β, σ (Theorem th:complexity_withUnknown)", "link_decls": false, "statements": true, "sections": [{"title": "Structure", "open": true, "decls": [{"name": "AnbParams.WithUnknown", "file": "Anb.lean", "doc": "The parameters `p` of algo:anb, together with constants `β`, `σ` such that `Φ_β` is `σ`-sub-additive (Theorem th:complexity_withUnknown). These constants are *unknown*: they are not parameters of the algorithm, which only uses `p`; they only enter the complexity analysis.", "notes": [], "code": "structure AnbParams.WithUnknown (X : Type*) where\n  p : AnbParams X\n  β : ℝ\n  σ : ℝ"}, {"name": "AnbParams.withUnknown", "file": "Anb.lean", "doc": "The parameters `p` of algo:anb, together with unknown constants `β`, `σ`.", "notes": [], "code": "def AnbParams.withUnknown (p : AnbParams X) (β σ : ℝ) : AnbParams.WithUnknown X := ⟨p, β, σ⟩"}]}, {"title": "Derived constants", "open": false, "decls": [{"name": "AnbParams.WithUnknown.C", "file": "Anb.lean", "doc": "`C:= (1 - ρ)^(α/β) / (1 - σ)` (Prop. prop:t_advances_withUnknown).", "notes": [], "code": "noncomputable def C (q : AnbParams.WithUnknown X) : ℝ :=\n  (1 - q.p.ρ) ^ (q.p.α / q.β) / (1 - q.σ)"}, {"name": "AnbParams.WithUnknown.Δmax", "file": "Anb.lean", "doc": "`Δ_max:= 2β ln(2eC/ε) + 2τ` (Corollary corol:max_width_withUnknown).", "notes": [], "code": "noncomputable def Δmax (q : AnbParams.WithUnknown X) : ℝ :=\n  2 * q.β * Real.log (2 * Real.exp 1 * q.C / q.p.ε) + 2 * q.p.τ"}, {"name": "AnbParams.WithUnknown.nMax", "file": "Anb.lean", "doc": "`(‖u_*‖_∞ + Δ_max) / τ`: the paper's `n_max` (Corollary corol:max_width_withUnknown) is its ceiling `⌈nMax⌉₊`.", "notes": [], "code": "noncomputable def nMax [Fintype X] (q : AnbParams.WithUnknown X) (uFix : X → ℝ) : ℝ :=\n  (‖uFix‖ + q.Δmax) / q.p.τ"}, {"name": "AnbParams.WithUnknown.εmax", "file": "Anb.lean", "doc": "`ε_max:= min (α / (‖u_*‖_∞ + Δ_max), 2)` (Corollary corol:max_width_withUnknown).", "notes": [], "code": "noncomputable def εmax [Fintype X] (q : AnbParams.WithUnknown X) (uFix : X → ℝ) : ℝ :=\n  min (q.p.α / (‖uFix‖ + q.Δmax)) 2"}, {"name": "AnbParams.WithUnknown.NΛ''", "file": "Anb.lean", "doc": "`N''_Λ:= ⌈(2 Δ_max / α + ln (β / α) - ln (1 - ρ)) / (-ln σ)⌉`, the bound on the number of passes of the inner loops.", "notes": ["Prop. prop:niter_while_withUnknown, V1; author's ruling 2026-10-16: the V0 constant `⌈((2 Δ_max + β ln 2) / α - ln (1 - ρ)) / (-ln σ)⌉` is discarded"], "code": "noncomputable def NΛ'' (q : AnbParams.WithUnknown X) : ℕ :=\n  ⌈(2 * q.Δmax / q.p.α + Real.log (q.β / q.p.α) - Real.log (1 - q.p.ρ)) / (-Real.log q.σ)⌉₊"}, {"name": "AnbParams.WithUnknown.ΔplusMax", "file": "Anb.lean", "doc": "`Δ⁺_max:= (C_Γ - 1) Δ_max + ε ‖u_*‖_∞ + C_past + C'_Γ`, with the modified `Δ_max` (Corollary corol:max_width_withUnknown, last sentence; Theorem th:complexity_withUnknown).", "notes": [], "code": "noncomputable def ΔplusMax [Fintype X] (q : AnbParams.WithUnknown X) (Cpast CΓ CΓ' : ℝ)\n    (uFix : X → ℝ) : ℝ :=\n  (CΓ - 1) * q.Δmax + q.p.ε * ‖uFix‖ + Cpast + CΓ'"}, {"name": "AnbParams.WithUnknown.NΛ'", "file": "Anb.lean", "doc": "`N'_Λ:= ⌈(2 Δ_max + Δ⁺_max) / τ⌉`, with the modified `Δ_max`.", "notes": [], "code": "noncomputable def NΛ' [Fintype X] (q : AnbParams.WithUnknown X) (Cpast CΓ CΓ' : ℝ)\n    (uFix : X → ℝ) : ℕ :=\n  ⌈(2 * q.Δmax + q.ΔplusMax Cpast CΓ CΓ' uFix) / q.p.τ⌉₊"}, {"name": "AnbParams.WithUnknown.NΓ", "file": "Anb.lean", "doc": "`N_Γ:= N'_Λ + 1`, with the modified `Δ_max`.", "notes": [], "code": "noncomputable def NΓ [Fintype X] (q : AnbParams.WithUnknown X) (Cpast CΓ CΓ' : ℝ)\n    (uFix : X → ℝ) : ℕ :=\n  q.NΛ' Cpast CΓ CΓ' uFix + 1"}]}]}, "AnbAlwaysSubsolWith": {"title": "The properties of Prop. prop:always_subsol for one iteration of the ANB", "link_decls": false, "statements": true, "sections": [{"title": "Structure", "open": true, "decls": [{"name": "AnbAlwaysSubsolWith", "file": "Anb.lean", "doc": "The properties of Prop. prop:always_subsol for the iteration of the ANB with the inner solver `S` started from the state `s`: with `û:= (anbStepData p s).uHat` and the next state `s':= anbStepWith S p s`, `ū ≤ Λ ū`, `Λ u̲ ≤ u̲`, `û ≤ Λ û`, `ū ≤ û ≤ ū'` and `u̲' ≤ u̲` (eq. (always_subsol)).", "notes": [], "code": "structure AnbAlwaysSubsolWith [Fintype X] [LinearOrder X] (S : AnbInnerSolver X)\n    (p : AnbParams X) (s : AnbState X) : Prop where\n  uSub_le : s.uSub ≤ p.Λ s.uSub\n  uSup_ge : Global.monotoneExtension p.Λ s.uSup ≤ s.uSup\n  uHat_le : (anbStepData p s).uHat ≤ p.Λ (anbStepData p s).uHat\n  uSub_le_uHat : s.uSub ≤ (anbStepData p s).uHat\n  uHat_le_uSub_step : (anbStepData p s).uHat ≤ (anbStepWith S p s).uSub\n  uSup_step_le : (anbStepWith S p s).uSup ≤ s.uSup"}, {"name": "AnbAlwaysSubsol", "file": "Anb.lean", "doc": "The properties of Prop. prop:always_subsol for the iteration of algo:anb started from the state `s`: with `û:= (anbStepData p s).uHat` and the next state `s':= anbStep p s`, `ū ≤ Λ ū`, `Λ u̲ ≤ u̲`, `û ≤ Λ û`, `ū ≤ û ≤ ū'` and `u̲' ≤ u̲` (eq. (always_subsol)).", "notes": [], "code": "def AnbAlwaysSubsol [Fintype X] [LinearOrder X] (p : AnbParams X) (s : AnbState X) : Prop :=\n  AnbAlwaysSubsolWith anbGlobalIter p s"}]}]}, "Axioms": {"title": "The axioms of the schemes (Introduction): additive invariance, memory, causality, sub-additivity, ...", "link_decls": true, "statements": false, "sections": [{"title": "Scalar form: Λ : ℝ^X → ℝ (one point of a scheme)", "open": true, "decls": [{"name": "AdditivelyInvariant", "file": "Axioms.lean", "doc": "(Additive invariance, axioms of `Λ` and `Γ`, scalar form) `Λ (u + t) = Λ u + t` for all `t: ℝ`, `u: X → ℝ`.", "notes": [], "code": "def AdditivelyInvariant (Λ : (X → ℝ) → ℝ) : Prop :=\n  ∀ (u : X → ℝ) (t : ℝ), Λ (fun y => u y + t) = Λ u + t"}, {"name": "HasMemory", "file": "Axioms.lean", "doc": "(`C_past`-memory eq. eqdef:Cpast_memory, scalar form) `max {u,t} = max {v,t} ⇒ max {Λ u, t + C} = max {Λ v, t + C}`, for all `u v: X → ℝ` and `t: ℝ`.", "notes": [], "code": "def HasMemory (C : ℝ) (Λ : (X → ℝ) → ℝ) : Prop :=\n  ∀ (u v : X → ℝ) (t : ℝ), (∀ y, max (u y) t = max (v y) t) →\n    max (Λ u) (t + C) = max (Λ v) (t + C)"}, {"name": "Causal", "file": "Axioms.lean", "doc": "(Causality eq. eqdef:causality, scalar form) `min {u,t} = min {v,t} ⇒ ∃ δ > 0, min {Λ u, t + δ} = min {Λ v, t + δ}`, for all `u v: X → ℝ` and `t: ℝ`.", "notes": ["REVIEW: here `δ` may depend on the point `x`; this is equivalent to the paper's global causality because `X` is finite (take the minimum of the `δ`'s)."], "code": "def Causal (Λ : (X → ℝ) → ℝ) : Prop :=\n  ∀ (u v : X → ℝ) (t : ℝ), (∀ y, min (u y) t = min (v y) t) →\n    ∃ δ > 0, min (Λ u) (t + δ) = min (Λ v) (t + δ)"}, {"name": "StrictlyCausal", "file": "Axioms.lean", "doc": "(`δ`-strict causality Remark rem:submult_strictcaus, scalar form) Like causality, but `δ` is independent of `u`, `v` and `t`.", "notes": [], "code": "def StrictlyCausal (δ : ℝ) (Λ : (X → ℝ) → ℝ) : Prop :=\n  ∀ (u v : X → ℝ) (t : ℝ), (∀ y, min (u y) t = min (v y) t) →\n    min (Λ u) (t + δ) = min (Λ v) (t + δ)"}, {"name": "SubMultiplicative", "file": "Axioms.lean", "doc": "(`ν`-sub-multiplicativity Remark rem:submult_strictcaus, scalar form) `Λ [(1+t) u] ≤ (1+t) Λ u - ν t` for all `t ≥ 0`, `u: X → ℝ`.", "notes": [], "code": "def SubMultiplicative (ν : ℝ) (Λ : (X → ℝ) → ℝ) : Prop :=\n  ∀ (t : ℝ), 0 ≤ t → ∀ (u : X → ℝ), Λ (fun y => (1 + t) * u y) ≤ (1 + t) * Λ u - ν * t"}, {"name": "SubAdditive", "file": "Axioms.lean", "doc": "(`ρ`-sub-additivity, axiom after eq. eqdef:Phi, scalar form) `Φ (v + t) ≤ Φ v + ρ t` for all `t ≥ 0`, `v: X → ℝ`.\n\nStated for an arbitrary operator `Φ`, as in the paper (Prop. prop:contractivity, Lemma lem:monDom). The paper's assumption \"`Φ_α` is `ρ`-sub-additive\" is this property applied to the Kruzkov-transformed operator `Φ_α = E_α Λ_∞ E_α⁻¹`.", "notes": ["REVIEW: on `∂X` the paper's global property reduces to `0 ≤ ρ t`, so the scalar form recovers the global one only when `ρ ≥ 0`."], "code": "def SubAdditive (ρ : ℝ) (Φ : (X → ℝ) → ℝ) : Prop :=\n  ∀ (v : X → ℝ) (t : ℝ), 0 ≤ t → Φ (fun y => v y + t) ≤ Φ v + ρ * t"}, {"name": "HasStencil", "file": "Axioms.lean", "doc": "(Stencil eq. eqdef:Cpast_dependency, left, scalar form) `Λ u` only depends on the restriction of `u` to the stencil `V`: `u_{|V} = v_{|V} ⇒ Λ u = Λ v`.", "notes": [], "code": "def HasStencil (V : Set X) (Λ : (X → ℝ) → ℝ) : Prop :=\n  ∀ (u v : X → ℝ), (∀ y ∈ V, u y = v y) → Λ u = Λ v"}, {"name": "HasDependency", "file": "Axioms.lean", "doc": "(`C_past`-dependency eq. eqdef:Cpast_dependency, scalar form) `Λ` has stencil `V`, and `Λ u ≤ C + min_V u` for all `u: X → ℝ`.", "notes": ["REVIEW: `Λ u ≤ C + min_V u` is written `∀ y ∈ V, Λ u ≤ C + u y`. This is the same inequality when `V` is finite and nonempty, and avoids an infimum over `V`, which in `ℝ` would take a junk value when `V` is empty or `u` is unbounded below on `V`."], "code": "def HasDependency (C : ℝ) (V : Set X) (Λ : (X → ℝ) → ℝ) : Prop :=\n  HasStencil V Λ ∧ ∀ (u : X → ℝ), ∀ y ∈ V, Λ u ≤ C + u y"}, {"name": "Comparable", "file": "Axioms.lean", "doc": "(`C_Γ,C'_Γ`-comparison, axioms of `Γ`, scalar form) `C Λ u - C' ≤ Λ [C u] ≤ C Γ u` for all `u: X → ℝ`.", "notes": [], "code": "def Comparable (C C' : ℝ) (Λ Γ : (X → ℝ) → ℝ) : Prop :=\n  ∀ u : X → ℝ, C * Λ u - C' ≤ Λ (fun y => C * u y) ∧ Λ (fun y => C * u y) ≤ C * Γ u"}, {"name": "HasComparisonPrinciple", "file": "Axioms.lean", "doc": "(Comparison principle, eq. eq:comparison_Lambda of Prop. prop:comparison_Lambda) For the partition `X = I ⊔ Iᶜ`, a sub-solution on `I` lies below a super-solution on `I` as soon as it does on the complement: `(u ≤ Λ u and Λ v ≤ v on I, u ≤ v outside I) ⇒ u ≤ v`. The paper's \"for any partition\" is `∀ I, HasComparisonPrinciple I Λ`. Unlike the other axioms, this is a property of the global operator `Λ: (X → ℝ) → X → ℝ`.", "notes": [], "code": "def HasComparisonPrinciple (I : Set X) (Λ : (X → ℝ) → X → ℝ) : Prop :=\n  ∀ (u v : X → ℝ), (∀ x ∈ I, u x ≤ Λ u x) → (∀ x ∈ I, Λ v x ≤ v x) →\n    (∀ x ∉ I, u x ≤ v x) → u ≤ v"}]}, {"title": "Values in ℝ_∞ = WithTop ℝ (namespace Ext)", "open": false, "decls": [{"name": "Ext.AdditivelyInvariant", "file": "AxiomsExt.lean", "doc": "(Additive invariance, axioms of `Λ` and `Γ`, on `ℝ_∞`) `Λ (u + t) = Λ u + t` for all `t: ℝ`.", "notes": [], "code": "def AdditivelyInvariant (Λ : (X → WithTop ℝ) → WithTop ℝ) : Prop :=\n  ∀ (u : X → WithTop ℝ) (t : ℝ), Λ (fun y => u y + t) = Λ u + t"}, {"name": "Ext.HasMemory", "file": "AxiomsExt.lean", "doc": "(`C_past`-memory eq. eqdef:Cpast_memory, on `ℝ_∞`) `max {u,t} = max {v,t} ⇒ max {Λ u, t + C} = max {Λ v, t + C}`, for all `t: ℝ`.", "notes": [], "code": "def HasMemory (C : ℝ) (Λ : (X → WithTop ℝ) → WithTop ℝ) : Prop :=\n  ∀ (u v : X → WithTop ℝ) (t : ℝ), (∀ y, max (u y) t = max (v y) t) →\n    max (Λ u) ((t + C : ℝ) : WithTop ℝ) = max (Λ v) ((t + C : ℝ) : WithTop ℝ)"}, {"name": "Ext.Causal", "file": "AxiomsExt.lean", "doc": "(Causality eq. eqdef:causality, on `ℝ_∞`) `min {u,t} = min {v,t} ⇒ ∃ δ > 0, min {Λ u, t + δ} = min {Λ v, t + δ}`, for all `t: ℝ`.", "notes": [], "code": "def Causal (Λ : (X → WithTop ℝ) → WithTop ℝ) : Prop :=\n  ∀ (u v : X → WithTop ℝ) (t : ℝ), (∀ y, min (u y) t = min (v y) t) →\n    ∃ δ > (0 : ℝ),\n      min (Λ u) ((t + δ : ℝ) : WithTop ℝ) = min (Λ v) ((t + δ : ℝ) : WithTop ℝ)"}, {"name": "Ext.StrictlyCausal", "file": "AxiomsExt.lean", "doc": "(`δ`-strict causality Remark rem:submult_strictcaus, on `ℝ_∞`) Like causality, but `δ` is independent of `u`, `v` and `t`.", "notes": [], "code": "def StrictlyCausal (δ : ℝ) (Λ : (X → WithTop ℝ) → WithTop ℝ) : Prop :=\n  ∀ (u v : X → WithTop ℝ) (t : ℝ), (∀ y, min (u y) t = min (v y) t) →\n    min (Λ u) ((t + δ : ℝ) : WithTop ℝ) = min (Λ v) ((t + δ : ℝ) : WithTop ℝ)"}, {"name": "Ext.SubMultiplicative", "file": "AxiomsExt.lean", "doc": "(`ν`-sub-multiplicativity Remark rem:submult_strictcaus, on `ℝ_∞`) `Λ [(1+t) u] ≤ (1+t) Λ u - ν t` for all real `t ≥ 0`, written `Λ [(1+t) u] + ν t ≤ (1+t) Λ u`.", "notes": [], "code": "def SubMultiplicative (ν : ℝ) (Λ : (X → WithTop ℝ) → WithTop ℝ) : Prop :=\n  ∀ (t : ℝ), 0 ≤ t → ∀ (u : X → WithTop ℝ),\n    Λ (fun y => ((1 + t : ℝ) : WithTop ℝ) * u y) + ((ν * t : ℝ) : WithTop ℝ) ≤\n      ((1 + t : ℝ) : WithTop ℝ) * Λ u"}, {"name": "Ext.SubAdditive", "file": "AxiomsExt.lean", "doc": "(`ρ`-sub-additivity, axiom after eq. eqdef:Phi, on `ℝ_∞`) `Φ (v + t) ≤ Φ v + ρ t` for all real `t ≥ 0`.", "notes": [], "code": "def SubAdditive (ρ : ℝ) (Φ : (X → WithTop ℝ) → WithTop ℝ) : Prop :=\n  ∀ (v : X → WithTop ℝ) (t : ℝ), 0 ≤ t → Φ (fun y => v y + t) ≤ Φ v + ((ρ * t : ℝ) : WithTop ℝ)"}, {"name": "Ext.HasStencil", "file": "AxiomsExt.lean", "doc": "(Stencil eq. eqdef:Cpast_dependency, left, on `ℝ_∞`) `u_{|V} = v_{|V} ⇒ Λ u = Λ v`.", "notes": [], "code": "def HasStencil (V : Set X) (Λ : (X → WithTop ℝ) → WithTop ℝ) : Prop :=\n  ∀ (u v : X → WithTop ℝ), (∀ y ∈ V, u y = v y) → Λ u = Λ v"}, {"name": "Ext.HasDependency", "file": "AxiomsExt.lean", "doc": "(`C_past`-dependency eq. eqdef:Cpast_dependency, on `ℝ_∞`) `Λ` has stencil `V`, and `Λ u ≤ C + u y` for all `y ∈ V`.", "notes": [], "code": "def HasDependency (C : ℝ) (V : Set X) (Λ : (X → WithTop ℝ) → WithTop ℝ) : Prop :=\n  HasStencil V Λ ∧ ∀ (u : X → WithTop ℝ), ∀ y ∈ V, Λ u ≤ (C : WithTop ℝ) + u y"}, {"name": "Ext.Comparable", "file": "AxiomsExt.lean", "doc": "(`C_Γ,C'_Γ`-comparison, axioms of `Γ`, on `ℝ_∞`) `C Λ u - C' ≤ Λ [C u] ≤ C Γ u`, written `C Λ u ≤ Λ [C u] + C'` and `Λ [C u] ≤ C Γ u`.", "notes": [], "code": "def Comparable (C C' : ℝ) (Λ Γ : (X → WithTop ℝ) → WithTop ℝ) : Prop :=\n  ∀ u : X → WithTop ℝ,\n    (C : WithTop ℝ) * Λ u ≤ Λ (fun y => (C : WithTop ℝ) * u y) + (C' : WithTop ℝ) ∧\n      Λ (fun y => (C : WithTop ℝ) * u y) ≤ (C : WithTop ℝ) * Γ u"}, {"name": "Ext.HasComparisonPrinciple", "file": "AxiomsExt.lean", "doc": "(Comparison principle on `ℝ_∞` eq. eq:comparison_Lambda) For the partition `X = I ⊔ Iᶜ`: `(u ≤ Λ u and Λ v ≤ v on I, u ≤ v outside I) ⇒ u ≤ v`, for the global operator `Λ: (X → ℝ_∞) → X → ℝ_∞`.", "notes": [], "code": "def HasComparisonPrinciple (I : Set X) (Λ : (X → WithTop ℝ) → X → WithTop ℝ) : Prop :=\n  ∀ (u v : X → WithTop ℝ), (∀ x ∈ I, u x ≤ Λ u x) → (∀ x ∈ I, Λ v x ≤ v x) →\n    (∀ x ∉ I, u x ≤ v x) → u ≤ v"}]}, {"title": "Global operators ℝ^X → ℝ^X (namespace Global)", "open": false, "decls": [{"name": "Global.HasMemory", "file": "Global.lean", "doc": "(`C_past`-memory eq. (Cpast_memory), global form) `max {u,t} = max {v,t} ⇒ max {Λ u, t + C} = max {Λ v, t + C}` on `X`.", "notes": [], "code": "def HasMemory (C : ℝ) (Λ : (X → ℝ) → X → ℝ) : Prop :=\n  ∀ (u v : X → ℝ) (t : ℝ), (∀ y, max (u y) t = max (v y) t) →\n    ∀ x, max (Λ u x) (t + C) = max (Λ v x) (t + C)"}, {"name": "Global.Causal", "file": "Global.lean", "doc": "(Causality eq. (causality), global form) `min {u,t} = min {v,t} ⇒ ∃ δ > 0, min {Λ u, t + δ} = min {Λ v, t + δ}` on `X`.", "notes": [], "code": "def Causal (Λ : (X → ℝ) → X → ℝ) : Prop :=\n  ∀ (u v : X → ℝ) (t : ℝ), (∀ y, min (u y) t = min (v y) t) →\n    ∃ δ > 0, ∀ x, min (Λ u x) (t + δ) = min (Λ v x) (t + δ)"}, {"name": "Global.StrictlyCausal", "file": "Global.lean", "doc": "(`δ`-strict causality Remark rem:submult_strictcaus, global form) Like causality, but `δ` is independent of `u`, `v` and `t`.", "notes": [], "code": "def StrictlyCausal (δ : ℝ) (Λ : (X → ℝ) → X → ℝ) : Prop :=\n  ∀ (u v : X → ℝ) (t : ℝ), (∀ y, min (u y) t = min (v y) t) →\n    ∀ x, min (Λ u x) (t + δ) = min (Λ v x) (t + δ)"}, {"name": "Global.SubAdditive", "file": "Global.lean", "doc": "(`ρ`-sub-additivity, axiom after eq. eqdef:Phi, global form) `Φ (v + t) ≤ Φ v + ρ t` on `X`, for all `t ≥ 0`.", "notes": [], "code": "def SubAdditive (ρ : ℝ) (Φ : (X → ℝ) → X → ℝ) : Prop :=\n  ∀ (v : X → ℝ) (t : ℝ), 0 ≤ t → ∀ x, Φ (fun y => v y + t) x ≤ Φ v x + ρ * t"}]}, {"title": "Global operators on ℝ_∞^X (namespace Global.Ext)", "open": false, "decls": [{"name": "Global.Ext.HasMemory", "file": "GlobalExt.lean", "doc": "(Global `C_past`-memory on `ℝ_∞`) `max {u,t} = max {v,t} ⇒ max {Λ u, t + C} = max {Λ v, t + C}` at every point `x`.", "notes": [], "code": "def HasMemory (C : ℝ) (Λ : (X → WithTop ℝ) → X → WithTop ℝ) : Prop :=\n  ∀ (u v : X → WithTop ℝ) (t : ℝ), (∀ y, max (u y) t = max (v y) t) →\n    ∀ x, max (Λ u x) ((t + C : ℝ) : WithTop ℝ) = max (Λ v x) ((t + C : ℝ) : WithTop ℝ)"}, {"name": "Global.Ext.Causal", "file": "GlobalExt.lean", "doc": "(Global causality on `ℝ_∞`) `min {u,t} = min {v,t} ⇒ ∃ δ > 0, min {Λ u, t + δ} = min {Λ v, t + δ}` at every point `x`, with `δ` independent of `x`.", "notes": [], "code": "def Causal (Λ : (X → WithTop ℝ) → X → WithTop ℝ) : Prop :=\n  ∀ (u v : X → WithTop ℝ) (t : ℝ), (∀ y, min (u y) t = min (v y) t) →\n    ∃ δ > (0 : ℝ), ∀ x,\n      min (Λ u x) ((t + δ : ℝ) : WithTop ℝ) = min (Λ v x) ((t + δ : ℝ) : WithTop ℝ)"}, {"name": "Global.Ext.StrictlyCausal", "file": "GlobalExt.lean", "doc": "(Global `δ`-strict causality on `ℝ_∞`) Like causality, with `δ` independent of `u`, `v`, `t`.", "notes": [], "code": "def StrictlyCausal (δ : ℝ) (Λ : (X → WithTop ℝ) → X → WithTop ℝ) : Prop :=\n  ∀ (u v : X → WithTop ℝ) (t : ℝ), (∀ y, min (u y) t = min (v y) t) →\n    ∀ x, min (Λ u x) ((t + δ : ℝ) : WithTop ℝ) = min (Λ v x) ((t + δ : ℝ) : WithTop ℝ)"}, {"name": "Global.Ext.SubAdditive", "file": "GlobalExt.lean", "doc": "(Global `ρ`-sub-additivity on `ℝ_∞`) `Φ (v + t) ≤ Φ v + ρ t` pointwise, for real `t ≥ 0`.", "notes": [], "code": "def SubAdditive (ρ : ℝ) (Φ : (X → WithTop ℝ) → X → WithTop ℝ) : Prop :=\n  ∀ (v : X → WithTop ℝ) (t : ℝ), 0 ≤ t →\n    ∀ x, Φ (fun y => v y + t) x ≤ Φ v x + ((ρ * t : ℝ) : WithTop ℝ)"}, {"name": "Global.Ext.HasStencil", "file": "GlobalExt.lean", "doc": "(Stencil eq. (Cpast_dependency), left, global form on `ℝ_∞`) `Γ u x` only depends on the restriction of `u` to the stencil `𝒱 x`.", "notes": [], "code": "def HasStencil (𝒱 : X → Set X) (Γ : (X → WithTop ℝ) → X → WithTop ℝ) : Prop :=\n  ∀ x, GuaranteedSubsol.Ext.HasStencil (𝒱 x) (Γ · x)"}, {"name": "Global.Ext.revStencil", "file": "GlobalExt.lean", "doc": "The reversed stencil `𝒱̃ y:= {x | y ∈ 𝒱 x}` (, eq. eqdef:stencil, without the restriction to `Int X`): the points whose value `Γ u x` may change when `u y` changes. It is a `Finset`, since its cardinality is the cost of updating the corresponding values.", "notes": [], "code": "open Classical in\nnoncomputable def revStencil [Fintype X] (𝒱 : X → Set X) (y : X) : Finset X :=\n  Finset.univ.filter fun x => y ∈ 𝒱 x"}]}]}, "Definitions": {"title": "Auxiliary definitions: cutoffs, Kruzkov transform, monotone extension, restrictions, constructions, stencils", "link_decls": true, "statements": false, "sections": [{"title": "Cutoffs (eq. eqdef:u_less_t)", "open": true, "decls": [{"name": "cutoffLt", "file": "Cutoff.lean", "doc": "Cutoff `a^{<t}` (, eq. eqdef:u_less_t, left): `a` if `a < t`, and `∞` otherwise.", "notes": [], "code": "noncomputable def cutoffLt (t : ℝ) (a : WithTop ℝ) : WithTop ℝ :=\n  if a < t then a else ⊤"}, {"name": "cutoffLe", "file": "Cutoff.lean", "doc": "Cutoff `a^{≤t}` (, eq. eqdef:u_less_t, right): `a` if `a ≤ t`, and `∞` otherwise.", "notes": [], "code": "noncomputable def cutoffLe (t : ℝ) (a : WithTop ℝ) : WithTop ℝ :=\n  if a ≤ t then a else ⊤"}]}, {"title": "Kruzkov transform and monotone extension", "open": true, "decls": [{"name": "kruzkov", "file": "Kruzkov.lean", "doc": "Kruzkov transform `E_α: ℝ_∞ → ℝ` (eq. (Kruzkov)), with `αinv = 1/α`: `E_α u = -exp(-αinv * u)` if `u < ∞`, and `0` otherwise.", "notes": [], "code": "noncomputable def kruzkov (αinv : ℝ) : WithTop ℝ → ℝ\n  | ⊤ => 0\n  | (u : ℝ) => -Real.exp (-αinv * u)"}, {"name": "kruzkovInv", "file": "Kruzkov.lean", "doc": "Left inverse `E_α⁻¹: ℝ → ℝ_∞` of the Kruzkov transform (eq. (Kruzkov)): `E_α⁻¹ v = -α ln(-v)` if `v < 0`, and `∞` otherwise.", "notes": [], "code": "noncomputable def kruzkovInv (α : ℝ) (v : ℝ) : WithTop ℝ :=\n  if v < 0 then ((-α * Real.log (-v) : ℝ) : WithTop ℝ) else ⊤"}, {"name": "monotoneExtension", "file": "Kruzkov.lean", "doc": "Extension `Λ_∞: ℝ_∞^X → ℝ_∞` of an operator to positively infinite values (eq. eqdef:monotone_extension), defined as the supremum of `Λ w` over all finite minorants `w ≤ u`.", "notes": ["REVIEW: this generalizes the paper, which defines `Λ_∞ u := lim_{t→∞} Λ min {u,t}` only for monotone `Λ`. Here `Λ` is arbitrary; agreement with the paper's limit for monotone `Λ` is proved in `MonotoneExtension.lean`. The supremum is taken over a subtype (never empty) rather than with a `Prop` binder, because in `WithTop ℝ` the supremum of the empty set is `0`, not `⊥`."], "code": "noncomputable def monotoneExtension (Λ : (X → ℝ) → ℝ) (u : X → WithTop ℝ) : WithTop ℝ :=\n  ⨆ w : {w : X → ℝ // ∀ y, (w y : WithTop ℝ) ≤ u y}, ((Λ w : ℝ) : WithTop ℝ)"}, {"name": "kruzkovOp", "file": "Kruzkov.lean", "doc": "Operator in Kruzkov coordinates `Φ_α:= E_α Λ_∞ E_α⁻¹` (eq. (Phi)), scalar form.", "notes": [], "code": "noncomputable def kruzkovOp (α : ℝ) (Λ : (X → ℝ) → ℝ) (v : X → ℝ) : ℝ :=\n  kruzkov (1 / α) (monotoneExtension Λ fun y => kruzkovInv α (v y))"}, {"name": "Global.monotoneExtension", "file": "Kruzkov.lean", "doc": "Global form of `monotoneExtension`: the extension `Λ_∞: ℝ_∞^X → ℝ_∞^X` of a global operator `Λ: ℝ^X → ℝ^X`, applied pointwise, `Λ_∞ u (x):= (Λ · x)_∞ u` (eq. eqdef:monotone_extension).", "notes": ["It agrees with the paper's limit when `Λ` is monotone, see the REVIEW note of `monotoneExtension`"], "code": "noncomputable def monotoneExtension (Λ : (X → ℝ) → X → ℝ) (u : X → WithTop ℝ) : X → WithTop ℝ :=\n  fun x => _root_.GuaranteedSubsol.monotoneExtension (Λ · x) u"}, {"name": "Global.kruzkovOp", "file": "Kruzkov.lean", "doc": "Global form of `kruzkovOp`: the operator in Kruzkov coordinates `Φ_α:= E_α Λ_∞ E_α⁻¹` of a global operator `Λ: ℝ^X → ℝ^X` (eq. (Phi)), `Φ_α v x:= kruzkovOp α (Λ · x) v`.", "notes": [], "code": "noncomputable def kruzkovOp (α : ℝ) (Λ : (X → ℝ) → X → ℝ) (v : X → ℝ) : X → ℝ :=\n  fun x => _root_.GuaranteedSubsol.kruzkovOp α (Λ · x) v"}]}, {"title": "Restriction to a band (eq. eqdef:Lambda_B): Λ_B (restrictOp) and Λ_B^v (bandOp)", "open": true, "decls": [{"name": "restrictOp", "file": "Restriction.lean", "doc": "Restriction `Λ_B` of an operator `Λ` to a subdomain `B` (, after Prop. prop:monotonic_Phi): `Λ_B u (x):= Λ u (x)` if `x ∈ B`, and `u (x)` otherwise.", "notes": [], "code": "open Classical in\nnoncomputable def restrictOp (Λ : (X → ℝ) → X → ℝ) (B : Set X) (u : X → ℝ) : X → ℝ :=\n  B.piecewise (Λ u) u"}, {"name": "bandExtend", "file": "Band.lean", "doc": "The map equal to `v` on `B` and to `w` outside `B` (in eq. eqdef:Lambda_B, the map on `X` made of `w ∈ ℝ^B` and of the boundary data `v ∈ ℝ^{X∖B}`: the letters are swapped).", "notes": [], "code": "open Classical in\nnoncomputable def bandExtend (B : Set X) (w : X → ℝ) (v : B → ℝ) : X → ℝ :=\n  fun y => if h : y ∈ B then v ⟨y, h⟩ else w y"}, {"name": "bandOp", "file": "Band.lean", "doc": "The operator `Φ` acting on the maps on the band `B`, the values outside `B` being frozen to `w`: `bandOp Φ B w v x:= Φ (bandExtend B w v) x` for `x ∈ B`. This is `Λ_B^v: ℝ^B → ℝ^B` of eq. eqdef:Lambda_B (right), whose boundary data `v ∈ ℝ^{X∖B}` is here `w` (only its values outside `B` are used), and whose argument `w ∈ ℝ^B` is here `v`.", "notes": [], "code": "noncomputable def bandOp (Φ : (X → ℝ) → X → ℝ) (B : Set X) (w : X → ℝ) : (B → ℝ) → B → ℝ :=\n  fun v x => Φ (bandExtend B w v) x"}]}, {"title": "Constructions of operators", "open": true, "decls": [{"name": "constrGamma", "file": "ConstrGamma.lean", "doc": "The operator `Γ u:= c + min_V u`, with `c:= Λ[0]`, built from a scalar operator `Λ` and a nonempty finite stencil `V` (eq. (constr_Gamma), at an interior point).", "notes": [], "code": "noncomputable def constrGamma (Λ : (X → ℝ) → ℝ) (V : Finset X) (hV : V.Nonempty)\n    (u : X → ℝ) : ℝ :=\n  Λ 0 + V.inf' hV u"}, {"name": "reflectOp", "file": "Reflect.lean", "doc": "Reflected operator `Λ' u:= -Λ[-u]`, for `Λ` valued in `ℝ` (scalar operator) or in `X → ℝ` (global operator).", "notes": [], "code": "def reflectOp {β : Type*} [Neg β] (Λ : (X → ℝ) → β) (u : X → ℝ) : β :=\n  -Λ (-u)"}, {"name": "rescaleOp", "file": "Rescale.lean", "doc": "Rescaled operator `Λ' u:= (1/α) Λ[α u]`.", "notes": [], "code": "noncomputable def rescaleOp (α : ℝ) (Λ : (X → ℝ) → ℝ) (u : X → ℝ) : ℝ :=\n  Λ (fun y => α * u y) / α"}]}, {"title": "Stencils", "open": true, "decls": [{"name": "stencilReach", "file": "StencilDist.lean", "doc": "`stencilReach I V n x`: there is a path of `n` stencil edges from `x` to the boundary `Iᶜ`, `x = x₀ → x₁ → … → xₙ ∉ I`, with `x_{i+1} ∈ V xᵢ` and `xᵢ ∈ I` for `i < n`.", "notes": [], "code": "def stencilReach (I : Set X) (V : X → Set X) : ℕ → X → Prop\n  | 0, x => x ∉ I\n  | n + 1, x => x ∈ I ∧ ∃ y ∈ V x, stencilReach I V n y"}, {"name": "stencilDist", "file": "StencilDist.lean", "doc": "Number of stencil edges `d_V(x, ∂X)` from `x` to the boundary (`0` if the boundary is unreachable from `x`).", "notes": [], "code": "open Classical in\nnoncomputable def stencilDist (I : Set X) (V : X → Set X) (x : X) : ℕ :=\n  if h : ∃ n, stencilReach I V n x then Nat.find h else 0"}]}]}}}</script>
<script id="paper" type="application/json">{"macros": {"\\diff": "\\mathrm{d}", "\\bbone": "\\mathbb{1}", "\\ve": "\\varepsilon", "\\<": "\\langle", "\\>": "\\rangle", "\\interp": "\\mathrm I", "\\sm": "\\setminus", "\\bN": "{\\mathbb N}", "\\bR": "{\\mathbb R}", "\\bZ": "{\\mathbb Z}", "\\cD": "{\\mathcal D}", "\\cF": "{\\mathcal F}", "\\cO": "{\\mathcal O}", "\\cS": "{\\mathcal S}", "\\cT": "{\\mathcal T}", "\\cV": "{\\mathcal V}", "\\bV": "{\\mathbb V}", "\\Kruzkov": "\\text{Kruzkov}", "\\ol": "\\overline", "\\ul": "\\underline", "\\Int": "\\mathring", "\\past": "\\mathrm{past}", "\\rE": "\\mathrm{E}", "\\lin": "\\mathrm{lin}", "\\loc": "\\mathrm{loc}", "\\LF": "\\mathrm{LF}", "\\SL": "\\mathrm{SL}", "\\UD": "\\mathrm{UD}", "\\bd": "\\mathrm{bd}", "\\sign": "\\mathrm{sign}", "\\opt": "\\mathrm{opt}", "\\case": "\\mathrm{case}", "\\init": "\\mathrm{init}", "\\Lip": "\\operatorname{Lip}", "\\Cost": "\\operatorname{Cost}", "\\mathbbm": "\\mathbb", "\\undertilde": "\\utilde"}, "sections": [{"num": "1", "title": "Introduction", "page": 1}, {"num": "2", "title": "Complexity estimate", "page": 14}, {"num": "3", "title": "Numerical results", "page": 35}], "labels": {"algo:agsi_parallel": {"kind": "algorithm", "num": "5", "page": 47, "plain": "5", "ref": "Algorithm 5", "env": "algo:agsi_parallel", "title": "Parallel AGSI, for computing a super-solution", "html": ""}, "algoline:agsi_parallel_for": {"kind": "algorithm", "num": "5", "page": 47, "plain": "4", "ref": "line 4 of Algorithm 5", "env": "algo:agsi_parallel", "title": "", "html": ""}, "prop:cplx_agsi_parallel": {"kind": "proposition", "num": "A.1", "page": 47, "plain": "A.1", "ref": "Proposition A.1", "env": "prop:cplx_agsi_parallel", "title": "", "html": "Assume that $\\Phi : \\bR^X \\to \\bR^X$ is monotone and $\\rho$-sub-additive, with $0&lt;\\rho&lt;1$. Then\n<a class=\"pref\" href=\"#label=algo:agsi_parallel\">Algorithm 5<\/a> (and likewise the variant adapted to sub-solutions) terminates using at most \n$N&#x27;&#x27;_\\Phi$ elementary updates $v(x) \\gets \\Phi v(x)$ at any given point $x\\in X$. We denoted\n\\[\n\tN_\\Phi&#x27;&#x27; := \\Big\\lceil \\frac{\\ln ((1-\\rho) C/\\eta)}{-\\ln \\rho} \\Big\\rceil_+ + \\frac{2}{(1-\\rho)^2}. \n\\]"}, "eq:vnp1_eq_Phi_Bb_vn": {"kind": "equation", "num": "71", "page": 48, "plain": "71", "ref": "(71)", "env": "", "title": "", "html": "\\[\\begin{aligned}\t\n\n\nv_n &amp;\\leq \\Phi v_n + C_n,  &amp;\n\\Phi v_n \\leq v_{n+1} := \\Phi_{B_n} v_n &amp; \\leq \\Phi v_n + \\eta,\n\\end{aligned}\\]"}, "th:complexity_with_agsi": {"kind": "theorem", "num": "A.2", "page": 48, "plain": "A.2", "ref": "Theorem A.2", "env": "th:complexity_with_agsi", "title": "", "html": "The statement of <a class=\"pref\" href=\"#label=th:complexity\">Theorem 1.11<\/a> still holds if lines <a class=\"pref\" href=\"#label=anb:while_sub\">11<\/a> and <a class=\"pref\" href=\"#label=anb:while_sup\">12<\/a> of <a class=\"pref\" href=\"#label=algo:anb\">Algorithm 1<\/a> are replaced with the three lines below, with the following modified constant which now bounds the number of updates at any given point in the inner loops (rather than the number of inner loops)\n\\[\nN&#x27;&#x27;_\\Lambda :=  \\Big\\lceil \\frac{2 \\Delta_{\\max}}{-\\alpha \\ln \\rho}\\Big\\rceil_+ + \\frac 2{(1-\\rho)^2}.\t\n\\]\n<ol class=\"alg\" start=\"11\"><li>\n<strong>Until<\/strong> $\\exp(-\\ol u / \\alpha) \\leq \\exp(-\\Lambda \\ol u / \\alpha) + \\eta_n$ and $\\exp(-\\Lambda \\ul u / \\alpha) \\leq \\exp(-\\ul u / \\alpha) + \\eta_n$ on $B_n$ <strong>do:<\/strong><\/li><li>  \n<strong>For all<\/strong> $x \\in B_n$ such that $\\exp(-\\ol u / \\alpha) &gt; \\exp(-\\Lambda \\ol u / \\alpha) + \\eta_n$ <strong>do in parallel<\/strong>: $\\ol u(x) \\gets \\Lambda \\ol u(x)$<\/li><li> \n<strong>For all<\/strong> $x \\in B_n$ such that $\\exp(-\\Lambda \\ul u / \\alpha) &gt; \\exp(-\\ul u / \\alpha) + \\eta_n$ <strong>do in parallel<\/strong>: $\\ul u(x) \\gets \\Lambda \\ul u(x)$<\/li><\/ol>"}, "algo:agsik": {"kind": "algorithm", "num": "6", "page": 49, "plain": "6", "ref": "Algorithm 6", "env": "algo:agsik", "title": "AGSI with Kruzkov based intermediate stopping criteria (AGSIK)", "html": ""}, "agsik:until": {"kind": "algorithm", "num": "6", "page": 49, "plain": "5", "ref": "line 5 of Algorithm 6", "env": "algo:agsik", "title": "", "html": ""}, "agsik:parallel_for": {"kind": "algorithm", "num": "6", "page": 49, "plain": "6", "ref": "Algorithm 6", "env": "algo:agsik", "title": "", "html": ""}, "eqdef:agsik_L": {"kind": "equation", "num": "72", "page": 49, "plain": "72", "ref": "(72)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\tL &amp;= \\big\\{(x,\\eta(u,x)) \\mid x\\in X,\\ \\eta(u,x)&gt;0\\big\\}, &amp;\n\t\\eta(u,x) &amp;:= \\exp(-\\frac{\\Lambda u(x)} \\alpha) - \\exp(\\frac{\\ve-u(x)} \\alpha)\n\\end{aligned}\\]"}, "eq:log_approx": {"kind": "equation", "num": "73", "page": 49, "plain": "73", "ref": "(73)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n-\\ln_2 \\eta(u,x) &amp;= \\frac{\\Lambda u(x)}{\\alpha\\ln 2} -\n\\mathrm{L}_2(\\frac{u(x)-\\Lambda u(x)-\\ve} \\alpha), &amp;\n\n\\mathrm{L}_2 (x) &amp;:= \\ln_2(1-e^{-x}) \\approx\n\\begin{cases}\n0 \\hfill \\text{if } x\\geq 1,\\\\\n\\lfloor\\ln_2 x\\rfloor \\text{ else}.\n\\end{cases}\\!\\!\\!\\!\\!\\!\\!\n\\end{aligned}\\]"}, "prop:monotonic_Phi": {"kind": "proposition", "num": "2.1", "page": 15, "plain": "2.1", "ref": "Proposition 2.1", "env": "prop:monotonic_Phi", "title": "", "html": "Let $\\Lambda : \\bR^X \\to \\bR^X$ be a monotone operator. Define $\\Lambda_\\infty : \\bR_\\infty^X \\to \\bR_\\infty^X$  as in <a class=\"pref\" href=\"#label=eqdef:monotone_extension\">(8)<\/a>, and $\\Phi_\\alpha := \\rE_\\alpha \\Lambda_\\infty \\rE_\\alpha^{-1} : \\bR^X \\to \\bR^X$ as in <a class=\"pref\" href=\"#label=eqdef:Phi\">(10)<\/a>. Then $\\Lambda_\\infty u = \\Lambda u$ for all $u \\in \\bR^X$, and $\\Lambda_\\infty$ and $\\Phi_\\alpha$ are monotone.\n\tIf in addition $\\Lambda$ is additively invariant, then $\\Phi_\\alpha$ is multiplicatively invariant in the sense that $\\Phi_\\alpha(\\gamma v) (x) = \\gamma \\Phi_\\alpha v (x)$ for all $\\gamma&gt;0$, $v \\in \\bR^X$, and $x \\in \\Int X$. If $\\Lambda$ is monotone and causal, then so is $\\Lambda_\\infty$."}, "eqdef:Lambda_B": {"kind": "equation", "num": "21", "page": 15, "plain": "21", "ref": "(21)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\t\\Lambda_B u(x) &amp;:= \\begin{cases}\n\t\t\\Lambda u(x) &amp; \\text{if } x \\in B,\\\\\n\t\tu(x) &amp; \\text{else,}\n\t\\end{cases}\n\t&amp;\n\t\\text{resp. }\n\t\\Lambda_B^v w(x) &amp;:= \n\t\\Lambda [\\bbone_B w + \\bbone_{X\\sm B} v](x)\n\\end{aligned}\\]"}, "lem:monDom": {"kind": "lemma", "num": "2.2", "page": 16, "plain": "2.2", "ref": "Lemma 2.2", "env": "lem:monDom", "title": "", "html": "Using the notations of <a class=\"pref\" href=\"#label=eqdef:Lambda_B\">(21)<\/a>.\nIf $\\Lambda : \\bR^X \\to \\bR^X$ is monotone, then so are $\\Lambda_B$ and $\\Lambda_B^v$. If in addition $\\Lambda$ is $\\rho$-sub-additive, then so is $\\Lambda_B^v$."}, "prop:partialMonotone": {"kind": "proposition", "num": "2.3", "page": 16, "plain": "2.3", "ref": "Proposition 2.3", "env": "prop:partialMonotone", "title": "Partial application preserves sub- and super-solutions, [MM24, Prop 2.9]", "html": "Let $\\Lambda : \\bR^X \\to \\bR^X$ be a monotone operator, and let $B \\subset X$ be a subset.\nLet $u \\in \\bR^X$ and $u&#x27; := \\Lambda_B u$.  If $\\Lambda u \\leq u$ then $\\Lambda u&#x27; \\leq u&#x27;$. Likewise if $\\Lambda u \\geq u$ then $\\Lambda u&#x27; \\geq u&#x27;$."}, "prop:contractivity": {"kind": "proposition", "num": "2.4", "page": 16, "plain": "2.4", "ref": "Proposition 2.4", "env": "prop:contractivity", "title": "Contraction, see [MM24, Corollary 2.3]", "html": "Let $\\Phi : \\bR^X \\to \\bR^X$ be monotone and $\\rho$-sub-additive. Then $\\|\\Phi u - \\Phi v\\|_\\infty \\leq \\rho \\|u-v\\|_\\infty$ for all $u,v \\in \\bR^X$. If $\\rho&lt;1$, then $\\Phi$ admits a unique fixed point $v_*\\in \\bR^X$, and $\\|\\Phi^n v - v_*\\|_\\infty \\leq \\rho^n \\|\\Phi v - v\\|_\\infty/(1-\\rho)$ for all $v \\in \\bR^X$."}, "prop:pertSubSuper": {"kind": "proposition", "num": "2.5", "page": 16, "plain": "2.5", "ref": "Proposition 2.5", "env": "prop:pertSubSuper", "title": "[MM24, Proposition 2.6]", "html": "Let $\\Phi : \\bR^X\\to \\bR^X$ be a $\\rho$-sub-additive operator, for some $\\rho&lt;1$. Let $u \\in \\bR^X$ and $\\ol c,\\ul c \\geq 0$ be such that $u-\\ol c \\leq \\Phi u \\leq u + \\ul c$.\n\tThen $\\ol u:= u-\\ol c/(1-\\rho)$ and $\\ul u :=u+\\ul c/(1-\\rho)$ are a sub-solution and a super-solution respectively: $\\ol u \\leq \\Phi \\ol u$ and $\\Phi \\ul u \\leq \\ul u$."}, "prop:comparison_Phi": {"kind": "proposition", "num": "2.6", "page": 16, "plain": "2.6", "ref": "Proposition 2.6", "env": "prop:comparison_Phi", "title": "Comparison principle, see [MM24, Proposition 2.7]", "html": "Let $\\Phi : \\bR^X \\to \\bR^X$ be monotone and $\\rho$-sub-additive, with $\\rho&lt;1$.\nThen for any partition $X = \\Int Y \\sqcup \\partial Y$ and $u, v \\in \\bR^X$:\n\\[\n\t(u - \\Phi u \\leq v - \\Phi v \\text{ on } \\Int Y, \\text{ and } u \\leq v \\text{ on } \\partial Y)\\ \\Rightarrow \\ u \\leq v.\n\\]"}, "prop:comparison_Lambda": {"kind": "proposition", "num": "2.7", "page": 16, "plain": "2.7", "ref": "Proposition 2.7", "env": "prop:comparison_Lambda", "title": "", "html": "Assume that $\\Lambda : \\bR^X \\to \\bR^X$ is monotone, and that $\\Phi_\\alpha := \\rE_\\alpha \\Lambda_\\infty \\rE_\\alpha^{-1}$ is $\\rho$-sub-additive for some $\\alpha&gt;0$ and $\\rho&lt;1$.\n\tThen for any partition $X = \\Int Y \\sqcup \\partial Y$ and any $u, v \\in \\bR^X$:\n\\[\n\n\t(u \\leq \\Lambda u \\text{ and } \\Lambda v \\leq v \\text{ on } \\Int Y, \\text{ and } u \\leq v \\text{ on } \\partial Y)\\ \\Rightarrow \\ u \\leq v.\n\\]\nIf $\\Lambda \\ul u \\leq \\ul u$ for some $\\ul u \\in \\bR^X$, <br><br>then $\\Lambda$ admits a unique fixed point $u_* \\in \\bR^X$, and $u_* \\leq \\ul u$."}, "eq:comparison_Lambda": {"kind": "equation", "num": "22", "page": 16, "plain": "22", "ref": "(22)", "env": "prop:comparison_Lambda", "title": "", "html": ""}, "corol:tol": {"kind": "corollary", "num": "2.8", "page": 17, "plain": "2.8", "ref": "Corollary 2.8", "env": "corol:tol", "title": "Convergence tolerance", "html": "Consider an operator $\\Lambda : \\bR^X \\to \\bR^X$ which obeys the comparison principle <a class=\"pref\" href=\"#label=eq:comparison_Lambda\">(22)<\/a>, and admits a fixed point $u_*\\in \\bR^X$. Let also $\\ve\\geq 0$.\n<ul><li> Assume that $\\Lambda$ is monotone. If $\\ol u, \\ul u \\in \\bR^X$ obey $\\ol u \\leq \\Lambda \\ol u$, $\\Lambda \\ul u \\leq \\ul u$, and $(1+\\ve) \\ol u \\geq \\ul u$, then \n\t\\[\\begin{aligned}\n\t\t(1+\\ve)^{-1} u_* &amp; \\leq \\ol u \\leq u_*, &amp;\n\t\tu_* &amp; \\leq \\ul u \\leq (1+\\ve) u_*, &amp;\n\t\t0 \\leq \\Lambda \\ol u - \\ol u &amp; \\leq \\tfrac \\ve {1+\\ve} u_*, &amp;\n\t\t0 \\leq \\ul u-\\Lambda \\ul u &amp;\\leq \\ve u_*.\n\t\\end{aligned}\\]<\/li><li> \n\tAssume in addition that $\\Lambda$ is $\\nu$-sub-multiplicative, for some $\\nu &gt;0$, and has non-negative boundary conditions $u_\\bd \\geq 0$.\n\tIf $\\ul u \\in \\bR^X$ obeys $0 \\leq \\ul u - \\Lambda \\ul u \\leq \\ve$ (resp. \n\t$\\ol u \\in \\bR^X$ obeys $0 \\leq \\Lambda \\ol u - \\ol u\\leq \\ve $, where $0 \\leq \\ve &lt; \\nu$), and $\\ul u = u_\\bd$ (resp. $\\ol u=u_\\bd$) on $\\partial X$ then \n\t\\[\\begin{aligned}\n\t\tu_* &amp;\\leq \\ul u \\leq \\big(1+\\frac \\ve \\nu\\big) u_*,  &amp;\n\t\t\\Big(\\text{resp.}\\ \\big(1-\\frac \\ve \\nu\\big) u_* \\leq \\ol u \\leq u_*\\Big).\n\t\\end{aligned}\\]<\/li><\/ul>"}, "eqdef:stencil": {"kind": "equation", "num": "23", "page": 18, "plain": "23", "ref": "(23)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\t\\forall u, v \\in \\bR^X, \\big(u_{|\\cV(x)} &amp;= v_{|\\cV(x)} \\Rightarrow \\Gamma u(x) = \\Gamma v(x)\\big), &amp;\n\t\\widetilde \\cV(y) &amp;:= \\{x \\in \\Int X \\mid y\\in \\cV(x)\\}.\n\\end{aligned}\\]"}, "eqdef:u_less_t": {"kind": "equation", "num": "24", "page": 18, "plain": "24", "ref": "(24)", "env": "", "title": "", "html": "\\[\\begin{aligned}\n\n\tu^{&lt;T} (x) &amp;:=\n\t\\begin{cases}\n\t\tu(x) \\!\\!&amp; \\text{if } u(x) &lt; T\\\\\n\t\t\\infty  &amp;\\text{else}\n\t\\end{cases} &amp;\n\tu^{\\leq T} (x) &amp;:=\n\t\\begin{cases}\n\t\tu(x) \\!\\!&amp; \\text{if } u(x) \\leq T\\\\\n\t\t\\infty &amp; \\text{else}\n\t\\end{cases}\n\\end{aligned}\\]"}, "algo:Dijkstra": {"kind": "algorithm", "num": "2", "page": 18, "plain": "2", "ref": "Algorithm 2", "env": "algo:Dijkstra", "title": "Generalized Dijkstra algorithm, with stopping time $T \\in \\bR_\\infty$", "html": ""}, "Dijkstra:ensure": {"kind": "algorithm", "num": "2", "page": 18, "plain": "2", "ref": "Algorithm 2", "env": "algo:Dijkstra", "title": "", "html": ""}, "Dijkstra:accept": {"kind": "algorithm", "num": "2", "page": 18, "plain": "6", "ref": "line 6 of Algorithm 2", "env": "algo:Dijkstra", "title": "", "html": ""}, "prop:Dijkstra_correct": {"kind": "proposition", "num": "2.9", "page": 18, "plain": "2.9", "ref": "Proposition 2.9", "env": "prop:Dijkstra_correct", "title": "Correctness of generalized Dijkstra", "html": "Let $\\Gamma : \\bR^X \\to \\bR^X$ be monotone and causal, extended to $\\bR_\\infty^X$ as in <a class=\"pref\" href=\"#label=eqdef:monotone_extension\">(8)<\/a>. Consider a stopping time $T \\in \\bR_\\infty$, and let $u \\in \\bR^X_\\infty$ satisfy $(\\Gamma u)^{&lt;T} \\leq u$.\nDenote by $L_n, u_n$ the state of $L, u$ before executing line <a class=\"pref\" href=\"#label=Dijkstra:accept\">6<\/a> of the $n$-th iteration, and by $(t_n,x_n)$ the pair removed from $L$ in that line.\nThen \n\\[\\begin{aligned}\n\n\t\\Gamma u_n &amp;\\leq u_n, &amp;\n\tL_n &amp;= \\{(\\Gamma u_n(x),x) \\mid x  \\in X,\\ \\Gamma u_n(x) &lt; u_n(x)\\},\n\

<style>
/* Layout: header with legend, then a two-pane workspace — dependency graph (left) and the selected statement (right); stacks on phones. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #1b2230; --muted: #5d6779; --line: #d9dee7;
  --accent: #2d5bd7; --accent-soft: #e3eafb; --code-bg: #f1f3f7;
  --c-intro: #b4532a; --c-subadd: #7a4bb3; --c-complexity: #2d6fb8; --c-agsi: #1f8a6a; --c-notes: #8a6d1f;
  --edge: #b7bfcc; --edge-hi: #2d5bd7; --node-text: #1b2230; --fade: 0.14;
  --f-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-code: "JetBrains Mono", "Noto Sans Math", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161d; --panel: #1a1f28; --fg: #e3e7ee; --muted: #9aa4b5; --line: #2c3442;
  --accent: #7ea2ff; --accent-soft: #233150; --code-bg: #141920;
  --c-intro: #e58a5f; --c-subadd: #b48ae8; --c-complexity: #6fa6e8; --c-agsi: #5cc6a3; --c-notes: #d4b25a;
  --edge: #4a5466; --edge-hi: #7ea2ff; --node-text: #e3e7ee; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161d; --panel: #1a1f28; --fg: #e3e7ee; --muted: #9aa4b5; --line: #2c3442;
  --accent: #7ea2ff; --accent-soft: #233150; --code-bg: #141920;
  --c-intro: #e58a5f; --c-subadd: #b48ae8; --c-complexity: #6fa6e8; --c-agsi: #5cc6a3; --c-notes: #d4b25a;
  --edge: #4a5466; --edge-hi: #7ea2ff; --node-text: #e3e7ee; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 14px; line-height: 1.5; }
.wrap { padding-inline: 16px; padding-block: 18px 16px; display: flex; flex-direction: column; gap: 14px; height: 100%; box-sizing: border-box; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 24px; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: 1.9rem; line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 70ch; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 999px; padding: 3px 10px; font: 500 12px var(--f-ui); cursor: pointer; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }
.chip[aria-pressed="false"] { opacity: 0.45; }
.chip:focus-visible, input:focus-visible, button:focus-visible, .ref:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; }
input[type=search] { font: 14px var(--f-ui); padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg); min-width: 0; width: 15rem; max-width: 100%; }
.btn { font: 500 12px var(--f-ui); padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg); cursor: pointer; }
main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 14px; flex: 1; min-height: 0; }
#cy { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 420px; }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; overflow: auto; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font: 600 11px var(--f-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tag { border-radius: 4px; padding: 1px 7px; color: var(--bg); font-weight: 600; letter-spacing: 0.04em; }
.proved { color: var(--c-agsi); }
h2 { font-family: var(--f-code); font-size: 1.02rem; font-weight: 500; margin: 0; overflow-wrap: anywhere; }
.title { font-family: var(--f-display); font-size: 1.2rem; margin: 0; text-wrap: balance; }
.source { color: var(--muted); margin: 0; overflow-wrap: anywhere; }
pre { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; font: 12.5px/1.55 var(--f-code); color: var(--fg); }
code { font-family: var(--f-code); font-size: 0.92em; background: var(--code-bg); padding: 0 3px; border-radius: 3px; }
.kw { color: var(--accent); font-weight: 500; }
.nm { color: var(--c-intro); }
details summary { cursor: pointer; font-weight: 500; }
.doc { white-space: pre-wrap; color: var(--fg); margin: 8px 0 0; overflow-wrap: anywhere; }
.refs h3 { font: 600 12px var(--f-ui); margin: 0 0 6px; color: var(--muted); }
.refs ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.ref { font: 12px var(--f-code); border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 2px 7px; cursor: pointer; overflow-wrap: anywhere; text-align: left; }
.ref:hover { border-color: var(--accent); }
.meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.empty { color: var(--muted); font-style: italic; }
.algo-sec h3 { font: 600 12px var(--f-ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 6px 0 8px; }
.variant { font-family: var(--f-display); font-size: 1.05rem; margin: 4px 0 0; border-top: 1px solid var(--line); padding-top: 10px; }
.decl { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 0 0 8px; }
.decl summary { font: 500 12.5px var(--f-code); overflow-wrap: anywhere; }
.decl .ddoc { color: var(--muted); margin: 6px 0 8px; overflow-wrap: anywhere; }
.decl pre { font-size: 12px; }
.lnk { color: inherit; text-decoration: underline dotted var(--accent); text-underline-offset: 3px; }
.lnk:hover { color: var(--accent); }
.linkbtn { font: 500 12px var(--f-ui); border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 6px; padding: 2px 8px; cursor: pointer; margin-left: 6px; }
@media (max-width: 860px) {
  main { grid-template-columns: minmax(0, 1fr); }
  #cy { height: 62vh; min-height: 340px; }
  .wrap { height: auto; }
}
</style>

 in V1 (author ruling; the V0 form was false)", "state": "PROVED", "provider": "GuaranteedSubsol.ComparisonLambdaProof.le_of_subSolution_superSolution", "chapter": "Complexity", "statement": "theorem le_of_subSolution_superSolution {X : Type*} [Finite X] {Λ : (X → ℝ) → X → ℝ}\n    {α ρ : ℝ} (hα : 0 < α) (hρ : ρ < 1) {I : Set X} (hmono : ∀ x ∈ I, Monotone (Λ · x))\n    (hsub : ∀ x ∈ I, SubAdditive ρ (kruzkovOp α (Λ · x))) {u v : X → ℝ}\n    (hu : ∀ x ∈ I, u x ≤ Λ u x) (hv : ∀ x ∈ I, Λ v x ≤ v x) (hbd : ∀ x ∉ I, u x ≤ v x) :\n    u ≤ v", "doc": "Source: Prop. prop:comparison_Lambda (Complexity.tex), eq. eq:comparison_Lambda, in the sub- vs.\nsuper-solution form of V1 (author ruling; the V0 form was false): if `Λ` is\nmonotone and `Φ_α` is `ρ`-sub-additive with `α > 0`, `ρ < 1`, then for any partition\n`X = Int Y ⊔ ∂Y`, `(u ≤ Λ u and Λ v ≤ v on Int Y, u ≤ v on ∂Y) ⇒ u ≤ v`.\n\n`Int Y` is the set `I`, `∂Y` its complement, and `Φ_α` at `x` is `kruzkovOp α (Λ · x)`.\nMonotonicity and sub-additivity are only assumed at the points of `I`.", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.le_of_comparison"], "labels": ["prop:comparison_Lambda", "eq:comparison_Lambda"], "direct": ["GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_kruzkovOp"]}, {"id": "GuaranteedSubsol.existsUnique_fixedPoint_of_kruzkov", "short": "existsUnique_fixedPoint_of_kruzkov", "file": "Anchors/ExistsUniqueFixedPointOfKruzkov.lean", "title": "unique fixed point of `Λ`, below any super-solution", "source": "Prop. prop:comparison_Lambda (Complexity.tex), unique fixed point below a super-solution; bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.ComparisonLambdaProof.existsUnique_fixedPoint_of_kruzkov", "chapter": "Complexity", "statement": "theorem existsUnique_fixedPoint_of_kruzkov {X tex, second point): if `Λ` is `ν`-sub-multiplicative with\n`ν > 0`, `ε ≥ 0` and `u x - ε ≤ Λ u`, then `(1 - η) u` with `η := ε / (ν + ε)`, i.e.\n`ν / (ν + ε) • u`, satisfies the sub-solution inequality at `x`. Scalar form: `Λ : (X → ℝ) → ℝ`\nstands for `(Λ · x)`.", "deps": [], "labels": ["prop:pertSubSuper", "corol:tol"], "direct": []}, {"id": "GuaranteedSubsol.superSolution_of_subMultiplicative", "short": "superSolution_of_subMultiplicative", "file": "Anchors/SuperSolutionOfSubMultiplicative.lean", "title": "rescaling into a super-solution, sub-multiplicative case", "source": "Analogue of prop:pertSubSuper, sub-multiplicative, super-solution (from proof of corol:tol), pointwise", "state": "PROVED", "provider": "GuaranteedSubsol.TolProof.superSolution_of_subMultiplicative", "chapter": "Notes", "statement": "theorem superSolution_of_subMultiplicative {X : Type*} {Λ : (X → ℝ) → ℝ} {ν : ℝ}\n    (hmul : SubMultiplicative ν Λ) {u : X → ℝ} {x : X} {ε : ℝ} (hε : 0 ≤ ε) (hεν : ε < ν)\n    (hu : Λ u ≤ u x + ε) :\n    Λ (fun y => ν / (ν - ε) * u y) ≤ ν / (ν - ε) * u x", "doc": "Analogue of Prop. prop:pertSubSuper with sub-multiplicativity in place of sub-additivity, from the\nproof of Corol. corol:tol (Complexity.tex, second point): if `Λ` is `ν`-sub-multiplicative,\n`0 ≤ ε < ν` and `Λ u ≤ u x + ε`, then `(1 + η) u` with `η := ε / (ν - ε)`, i.e.\n`ν / (ν - ε) • u`, satisfies the super-solution inequality at `x`. Scalar form:\n`Λ : (X → ℝ) → ℝ` stands for `(Λ · x)`.", "deps": [], "labels": ["prop:pertSubSuper", "corol:tol"], "direct": []}, {"id": "GuaranteedSubsol.tol_of_subSolution_superSolution", "short": "tol_of_subSolution_superSolution", "file": "Anchors/TolOfSubSolutionSuperSolution.lean", "title": "tolerance from a sub- and a super-solution", "source": "Corol. corol:tol (Complexity.tex), first point; bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.TolProof.tol_of_subSolution_superSolution", "chapter": "Complexity", "statement": "theorem tol_of_subSolution_superSolution {X : Type*} {Λ : (X → ℝ) → X → ℝ}\n    (hmono : Monotone Λ) (hcomp : HasComparisonPrinciple Set.univ Λ)\n    {uFix : X → ℝ} (hfix : Λ uFix = uFix) {ε : ℝ} (hε : 0 ≤ ε) {uSub uSup : X → ℝ}\n    (hsub : uSub ≤ Λ uSub) (hsup : Λ uSup ≤ uSup) (htol : ∀ x, uSup x ≤ (1 + ε) * uSub x) :\n    ∀ x, ((1 + ε)⁻¹ * uFix x ≤ uSub x ∧ uSub x ≤ uFix x) ∧\n      (uFix x ≤ uSup x ∧ uSup x ≤ (1 + ε) * uFix x) ∧\n      (0 ≤ Λ uSub x - uSub x ∧ Λ uSub x - uSub x ≤ ε * uFix x) ∧\n      (0 ≤ uSup x - Λ uSup x ∧ uSup x - Λ uSup x ≤ ε * uFix x)", "doc": "Source: Corol. corol:tol (Complexity.tex), first point. `Λ` is monotone, obeys the comparison\nprinciple (in the sub-solution vs. super-solution form of V1 eq:comparison_Lambda, `hcomp`),\nand has a fixed point `u_*`. If `ū ≤ Λ ū`, `Λ u̲ ≤ u̲` and `(1 + ε) ū ≥ u̲` with `ε ≥ 0`, then\n`(1+ε)⁻¹ u_* ≤ ū ≤ u_*`, `u_* ≤ u̲ ≤ (1+ε) u_*`, `0 ≤ Λ ū - ū ≤ ε u_*`, `0 ≤ u̲ - Λ u̲ ≤ ε u_*`.", "deps": [], "labels": ["corol:tol"], "direct": []}, {"id": "GuaranteedSubsol.tol_of_superSolution_subMultiplicative", "short": "tol_of_superSolution_subMultiplicative", "file": "Anchors/TolOfSuperSolutionSubMultiplicative.lean", "title": "tolerance from a super-solution, sub-multiplicative case", "source": "Corol. corol:tol (Complexity.tex), second point, super-solution; bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.TolProof.tol_of_superSolution_subMultiplicative", "chapter": "Complexity", "statement": "theorem tol_of_superSolution_subMultiplicative {X : Type*} {Λ : (X → ℝ) → X → ℝ} {I : Set X}\n    {ubd : X → ℝ} (hbd : ∀ u, ∀ x ∉ I, Λ u x = ubd x) (hubd : ∀ x ∉ I, 0 ≤ ubd x)\n    {ν : ℝ} (hν : 0 < ν) (hmul : ∀ x ∈ I, SubMultiplicative ν (Λ · x))\n    (hcomp : HasComparisonPrinciple Set.univ Λ)\n    {uFix : X → ℝ} (hfix : Λ uFix = uFix) {ε : ℝ} (hε : 0 ≤ ε) {uSup : X → ℝ}\n    (hsup : Λ uSup ≤ uSup) (htol : ∀ x, uSup x - Λ uSup x ≤ ε)\n    (hsupbd : ∀ x ∉ I, uSup x = ubd x) :\n    ∀ x, uFix x ≤ uSup x ∧ uSup x ≤ (1 + ε / ν) * uFix x", "doc": "Source: Corol. corol:tol (Complexity.tex), second point, super-solution case. `Λ` obeys the\ncomparison principle (sub-solution vs. super-solution form of V1 eq:comparison_Lambda, `hcomp`), has\na fixed point `u_*`, Dirichlet boundary conditions `ubd ≥ 0` on `∂X` (complement of `I = Int X`),\nand is `ν`-sub-multiplicative on `Int X` with `ν > 0`. If `0 ≤ u̲ - Λ u̲ ≤ ε` and `u̲ = ubd` on\n`∂X`, then `u_* ≤ u̲ ≤ (1 + ε/ν) u_*`.", "deps": ["GuaranteedSubsol.subSolution_of_subMultiplicative"], "labels": ["corol:tol"], "direct": ["GuaranteedSubsol.subSolution_of_subMultiplicative"]}, {"id": "GuaranteedSubsol.tol_of_subSolution_subMultiplicative", "short": "tol_of_subSolution_subMultiplicative", "file": "Anchors/TolOfSubSolutionSubMultiplicative.lean", "title": "tolerance from a sub-solution, sub-multiplicative case", "source": "Corol. corol:tol (Complexity.tex), second point, sub-solution; bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.TolProof.tol_of_subSolution_subMultiplicative", "chapter": "Complexity", "statement": "theorem tol_of_subSolution_subMultiplicative {X : Type*} {Λ : (X → ℝ) → X → ℝ} {I : Set X}\n    {ubd : X → ℝ} (hbd : ∀ u, ∀ x ∉ I, Λ u x = ubd x) (hubd : ∀ x ∉ I, 0 ≤ ubd x)\n    {ν : ℝ} (hmul : ∀ x ∈ I, SubMultiplicative ν (Λ · x))\n    (hcomp : HasComparisonPrinciple Set.univ Λ)\n    {uFix : X → ℝ} (hfix : Λ uFix = uFix) {ε : ℝ} (hε : 0 ≤ ε) (hεν : ε < ν)\n    {uSub : X → ℝ} (hsub : uSub ≤ Λ uSub) (htol : ∀ x, Λ uSub x - uSub x ≤ ε)\n    (hsubbd : ∀ x ∉ I, uSub x = ubd x) :\n    ∀ x, (1 - ε / ν) * uFix x ≤ uSub x ∧ uSub x ≤ uFix x", "doc": "Source: Corol. corol:tol (Complexity.tex), second point, sub-solution case. `Λ` obeys the comparison\nprinciple (sub-solution vs. super-solution form of V1 eq:comparison_Lambda, `hcomp`), has a fixed\npoint `u_*`, Dirichlet boundary conditions `ubd ≥ 0` I, Γ v x ≤ v x)\n    (hbd : ∀ x ∉ I, u x ≤ v x) :\n    u ≤ v", "doc": "Source: Prop. prop:comp_of_causal (Complexity.tex), with values in `ℝ_∞ = WithTop ℝ`: if `Γ` is\nmonotone and causal, then for any partition `X = Int Y ⊔ ∂Y` and `u, v ∈ ℝ_∞^X`,\n`(u ≤ Γ u and Γ v ≤ v on Int Y, and u ≤ v on ∂Y) ⇒ u ≤ v`.\n\nHere `Γ : (X → ℝ_∞) → X → ℝ_∞` acts directly on `ℝ_∞^X`, and causality is `Ext.Causal`\n(`AxiomsExt.lean`). `Int Y` is the set `I`, `∂Y` its complement. Monotonicity and causality are\nonly assumed at the points of `I`.", "deps": [], "labels": ["prop:comp_of_causal"], "direct": []}, {"id": "GuaranteedSubsol.exists_fixedPoint_of_causal", "short": "exists_fixedPoint_of_causal", "file": "Anchors/ExistsFixedPointOfCausal.lean", "title": "fixed point of a monotone causal operator with a super-solution", "source": "Prop. prop:comp_of_causal (Complexity.tex, V1; with Prop. prop:Dijkstra_correct): a monotone causal operator with a finite super-solution has a fixed point, above every sub-solution and below every super-solution (author's request)", "state": "PROVED", "provider": "GuaranteedSubsol.CausalFixedPointProof.exists_fixedPoint_of_causal", "chapter": "Complexity", "statement": "theorem exists_fixedPoint_of_causal {X : Type*} [Finite X] {Γ : (X → ℝ) → X → ℝ}\n    (hmono : ∀ x, Monotone (Γ · x)) (hcaus : ∀ x, Causal (Γ · x)) {w : X → ℝ} (hw : Γ w ≤ w) :\n    ∃ u : X → ℝ, Γ u = u ∧ (∀ v, v ≤ Γ v → v ≤ u) ∧ (∀ v, Γ v ≤ v → u ≤ v)", "doc": "Source: Prop. prop:comp_of_causal (Complexity.tex, V1), last claims (author's request, now stated\nin V1): Dijkstra's method started from a super-solution computes the unique fixed point\n(Prop. prop:Dijkstra_correct), by the comparison principle for causal operators with `Int Y = X`:\nif `Γ` is monotone and\ncausal (at every point) and `Γ w ≤ w` for some finite `w`, then `Γ` has a fixed point `u` which\nlies above every sub-solution and below every super-solution; in particular `u` is the unique\nfixed point, and `u ≤ w`. `X` is  "Prop. prop:causal_formulation (Complexity.tex), eq. (causal_old), scalar form", "state": "PROVED", "provider": "GuaranteedSubsol.CausalCutoffProof.causal_iff_cutoff", "chapter": "Complexity", "statement": "theorem causal_iff_cutoff {X : Type*} (Γ : (X → ℝ) → ℝ) :\n    Causal Γ ↔ ∀ (u v : X → ℝ) (t : ℝ),\n      (∀ y, cutoffLt t (u y) = cutoffLt t (v y)) → cutoffLe t (Γ u) = cutoffLe t (Γ v)", "doc": "Source: Prop. prop:causal_formulation (Complexity.tex), eq. (causal_old), scalar form: causality is\nequivalent to `∀ u v t, u^{<t} = v^{<t} ⇒ (Γ u)^{≤t} = (Γ v)^{≤t}`. The scalar operator\n`Γ : (X → ℝ) → ℝ` stands for `(Γ · x)`; values are compared in `ℝ_∞ = WithTop ℝ` through the\ncutoffs `cutoffLt`, `cutoffLe`.", "deps": ["GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq", "GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq"], "labels": ["prop:causal_formulation", "eq:causal_old"], "direct": ["GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq", "GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq"]}, {"id": "GuaranteedSubsol.Ext.causal_iff_cutoff", "short": "Ext.causal_iff_cutoff", "file": "Anchors/ExtCausalIffCutoff.lean", "title": "causality on `ℝ_∞` in terms of cutoffs", "source": "Prop. prop:causal_formulation (Complexity.tex), eq. (causal_old), scalar form on `ℝ_∞`", "state": "PROVED", "provider": "GuaranteedSubsol.ExtCausalCutoffProof.causal_iff_cutoff", "chapter": "Complexity", "statement": "theorem causal_iff_cutoff {X : Type*} (Γ : (X → WithTop ℝ) → WithTop ℝ) :\n    Causal Γ ↔ ∀ (u v : X → WithTop ℝ) (t : ℝ),\n      (∀ y, cutoffLt t (u y) = cutoffLt t (v y)) → cutoffLe t (Γ u) = cutoffLe t (Γ v)", "doc": "Source: Prop. prop:causal_formulation (Complexity.tex), eq. (causal_old), scalar form on\n`ℝ_∞ = WithTop ℝ`: `Ext.Causal Γ` is equivalent to\n`∀ u v t, u^{<t} = v^{<t} ⇒ (Γ u)^{≤t} = (Γ v)^{≤t}`, for `Γ : (X → ℝ_∞) → ℝ_∞`.", "deps": ["GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq", "GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq"], "labels": ["prop:causal_formulati mory implies eq. (Lambda_max_u_t)", "source": "Prop. prop:Cpast_formulation (Complexity.tex), direct implication, scalar form", "state": "PROVED", "provider": "GuaranteedSubsol.CpastFormulationProof.apply_eq_apply_max", "chapter": "Complexity", "statement": "theorem HasMemory.apply_eq_apply_max {X : Type*} {Λ : (X → ℝ) → ℝ} {C : ℝ}\n    (hmono : Monotone Λ) (hadd : AdditivelyInvariant Λ) (h : HasMemory C Λ)\n    (u : X → ℝ) {t : ℝ} (ht : t ≤ Λ u - C) :\n    Λ u = Λ (fun y => max (u y) t)", "doc": "Source: Prop. prop:Cpast_formulation (Complexity.tex), direct implication, scalar form: if `Λ` is\nmonotone, additively invariant and has `C_past`-memory, then `Λ u = Λ max {u,t}` for all\n`t ≤ Λ u - C_past`. The scalar operator `Λ : (X → ℝ) → ℝ` stands for `(Λ · x)`.", "deps": [], "labels": ["prop:Cpast_formulation"], "direct": []}, {"id": "GuaranteedSubsol.hasMemory_of_apply_eq_apply_max", "short": "hasMemory_of_apply_eq_apply_max", "file": "Anchors/HasMemoryOfApplyMax.lean", "title": "eq. (Lambda_max_u_t) implies `C_past`-memory", "source": "Prop. prop:Cpast_formulation (Complexity.tex), converse (finite `X`), scalar form", "state": "PROVED", "provider": "GuaranteedSubsol.CpastFormulationProof.hasMemory_of_apply_eq_apply_max", "chapter": "Complexity", "statement": "theorem hasMemory_of_apply_eq_apply_max {X : Type*} [Finite X] {Λ : (X → ℝ) → ℝ} {C : ℝ}\n    (hmono : Monotone Λ) (hadd : AdditivelyInvariant Λ)\n    (h : ∀ (u : X → ℝ) (t : ℝ), t ≤ Λ u - C → Λ u = Λ (fun y => max (u y) t)) :\n    HasMemory C Λ", "doc": "Source: Prop. prop:Cpast_formulation (Complexity.tex), converse implication, scalar form: if `Λ` is\nmonotone, additively invariant, and `Λ u = Λ max {u,t}` for all `u` and `t ≤ Λ u - C_past`, then\n`Λ` has `C_past`-memory. `X` is finite (the proof needs `u - n ε 1_{u ≤ t} ≤ v` for some `n`).\nThe scalar operator `Λ : (X → ℝ) → ℝ` stands for `(Λ · x)`.", "deps": [], "labels": ["prop:Cpast_formulation"], "direct": []}, {"id": "GuaranteedSubsol.apply_le_apply_ nt.lean", "title": "fixed point of the truncated operator `max {ū, min {T, Γ}}`", "source": "Lemma lem:max_min (Complexity.tex), first two conclusions, under causality only (V1 also assumes `Γ` monotone and states uniqueness, which follows from `le_of_causal_real`; author's ruling 2026-10-20, annotation); bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.MaxMinProof.max_min_fixedPoint", "chapter": "Complexity", "statement": "theorem max_min_fixedPoint {X : Type*} {Γ : (X → ℝ) → X → ℝ} (hcaus : ∀ x, Causal (Γ · x))\n    (uSub : X → ℝ) (T : ℝ) {u uHat : X → ℝ} (hu : u = fun x => max (uSub x) (Γ u x))\n    (huHat : uHat = fun x => max (uSub x) (min T (u x))) :\n    ((fun x => max (uSub x) (min T (Γ uHat x))) = uHat) ∧ ∀ x, min (u x) T = min (uHat x) T", "doc": "Source: Lemma lem:max_min (Complexity.tex): let `Γ` be causal, `Γ' := max {ū, min {T, Γ}}`. If\n`u = max {ū, Γ u}`, then `û := max {ū, min {T, u}}` satisfies `Γ' û = û`, and\n`min {u,T} = min {û,T}`. (The paper's last consequence, `{u < t} = {û < t}` for `t ≤ T`, is\nomitted as trivial; author ruling.) Global operator `Γ : (X → ℝ) → X → ℝ`, causal at every point;\n`Γ'` and `û` are written out explicitly.\nAnnotation (author's ruling 2026-10-20): V1 lem:max_min assumes `Γ` monotone and causal and states\nthat `û` is the unique fixed point; the anchor proves the fixed-point identity under causality\nonly. Uniqueness is not part of the anchor; it follows from `le_of_causal_real`.", "deps": [], "labels": ["lem:max_min"], "direct": []}, {"id": "GuaranteedSubsol.max_min_unique", "short": "max_min_unique", "file": "Anchors/MaxMinUnique.lean", "title": "uniqueness of the fixed point in lem:max_min", "source": "Lemma lem:max_min (Complexity.tex, V1), uniqueness: every fixed point of `max {ū, min {T, Γ}}` equals `û`, `Γ` monotone and causal (author's request 2026-10-20, completes `max_min_fixedPoint`)", "state": "PROVED", "provider": "GuaranteedSubsol.ExistsUniqueProof.max_min_unique", "chapter": "Complexity", "statement": "theorem max_min_unique {X : Type*} [Finite X] {Γ : (X → ℝ) → X → ℝ}\n    (hmono : ∀ x, Monotone (Γ · x)) (hcaus : ∀ x, Causal (Γ · x)) (uSub : X → ℝ) (T : ℝ)\n    {u uHat v : X → ℝ} (hu : u = fun x => max (uSub x) (Γ u x))\n    (huHat : uHat = fun x => max (uSub x) (min T (u x)))\n    (hv : v = fun x => max (uSub x) (min T (Γ v x))) : v = uHat", "doc": "Source: Lemma lem:max_min (Complexity.tex, V1), uniqueness part (author's request 2026-10-20,\ncompleting the anchor `max_min_fixedPoint`): let `Γ : ℝ^X → ℝ^X` be monotone and causal (at every\npoint), `ū ∈ ℝ^X`, `T ∈ ℝ`. If `u = max {ū, Γ u}` and `û := max {ū, min {T, u}}`, then every fixed\npoint `v` of `Γ' := max {ū, min {T, Γ}}` equals `û`. (That `û` is a fixed point is\n`max_min_fixedPoint`.) `X` is finite.", "deps": ["GuaranteedSubsol.le_of_causal_real", "GuaranteedSubsol.Causal.max", "GuaranteedSubsol.Causal.min", "GuaranteedSubsol.max_min_fixedPoint", "GuaranteedSubsol.monotone_max_min", "GuaranteedSubsol.Causal.max_min"], "labels": ["lem:max_min"], "direct": ["GuaranteedSubsol.Causal.max_min", "GuaranteedSubsol.le_of_causal_real", "GuaranteedSubsol.max_min_fixedPoint", "GuaranteedSubsol.monotone_max_min"]}, {"id": "GuaranteedSubsol.monotone_max_min", "short": "monotone_max_min", "file": "Anchors/MonotoneMaxMin.lean", "title": "monotonicity of `max {ū, min {T, Γ}}`", "source": "Lemma lem:max_min_mon_causal (Complexity.tex), monotone part, scalar form", "state": "PROVED", "provider": "GuaranteedSubsol.MaxMinMonCausalProof.monotone_max_min", "chapter": "Complexity", "statement": "theorem monotone_max_min {X : Type*} {Γ : (X → ℝ) → ℝ} (hmono : Monotone Γ) (c T : ℝ) :\n    Monotone (fun u => max c (min T (Γ u)))", "doc": "Source: Lemma lem:max_min_mon_causal (Complexity.tex), monotone part, scalar form: if `Γ` is\nmonotone, so is `u ↦ max {c, min {T, Γ u}}`, where `c` stands for `ū (x)`. The scalar operator\n`Γ : (X → ℝ) → ℝ` stands for `(Γ · x)`.", "deps": [], "labels": ["lem:max_min_mon_causal"], "direct": []}, {"id": "GuaranteedSubsol.Causal.max_min", "short": "Causal.max_min", "file": "Anchors/CausalMaxMin.lean", "title": "causality of `max {ū, min {T, Γ}}`", "source": "Lemma lem:max_min_mon_causal (Complexity.tex), causal part, scalar form", "state": "PROVED", "provider": "GuaranteedSubsol.MaxMinMonCausalProof.causal_max_min", "chapter": "Complexity", "statement": "theorem Causal.max_min {X : Type*} {Γ : (X → ℝ) → ℝ} (hcaus : Causal Γ) (c T : ℝ) :\n    Causal (fun u => max c (min T (Γ u)))", "doc": "Source: Lemma lem:max_min_mon_causal (Complexity.tex), causal part, scalar form: if `Γ` is causal,\nso is `u ↦ max {c, min {T, Γ u}}`, where `c` stands for `ū (x)`. The scalar operator\n`Γ : (X → ℝ) → ℝ` stands for `(Γ · x)`.", "deps": ["GuaranteedSubsol.Causal.max", "GuaranteedSubsol.Causal.min"], "labels": ["lem:max_min_mon_causal"], "direct": ["GuaranteedSubsol.Causal.max", "GuaranteedSubsol.Causal.min"]}, {"id": "GuaranteedSubsol.subsol_growth", "short": "subsol_growth", "file": "Anchors/SubsolGrowth.lean", "title": "growth of a sub-solution above a level", "source": "Prop. prop:olu_ge_ustar (Complexity.tex), comparison principle in the sub- vs super-solution form of V1 eq:comparison_Lambda; bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.SubsolGrowthProof.subsol_growth", "chapter": "Complexity", "statement": "theorem subsol_growth {X : Type*} {Λ Γ : (X → ℝ) → X → ℝ} {I : Set X} {ubd : X → ℝ}\n    (hΛbd : ∀ u, ∀ x ∉ I, Λ u x = ubd x) (hΓbd : ∀ u, ∀ x ∉ I, Γ u x = ubd x)\n    {Cpast CΓ CΓ' : ℝ} (hCpast : 0 ≤ Cpast) (hCΓ : 1 ≤ CΓ) (hCΓ' : 0 ≤ CΓ')\n    (hmono : ∀ x ∈ I, Monotone (Λ · x)) (hadd : ∀ x ∈ I, AdditivelyInvariant (Λ · x))\n    (hmem : ∀ x ∈ I, HasMemory Cpast (Λ · x))\n    (hcmp : ∀ x ∈ I, Comparable CΓ CΓ' (Λ · x) (Γ · x))\n    (hcomp : ∀ J : Set X, HasComparisonPrinciple J Λ)\n    {uSub : X → ℝ} (huSub : uSub ≤ Λ uSub) {u : X → ℝ} {t ε : ℝ} (ht : 0 ≤ t) (hε : 0 < ε)\n    (hlow : ∀ x, u x < t → uSub x ≤ (1 + ε) * u x) (hΓu : ∀ x, Γ u x ≤ u x)\n    (huΛ : ∀ x, u x ≤ Λ u x) :\n    ∀ x, t ≤ u x → t + (uSub x - (1 + ε) * t - Cpast - CΓ') / CΓ ≤ u x", "doc": "Source: Prop. prop:olu_ge_ustar (Complexity.tex). Global operators `Λ, Γ : (X → ℝ) → X → ℝ` with\nthe same Dirichlet data `ubd` outside `I = Int X` (the \"implicit additional assumption\" of the\npaper's proof). `Λ` is monotone, additively invariant, has `C_past`-memory and is\n`C_Γ, C'_Γ`-comparable with `Γ` on `Int X`. The comparison principle is assumed in the form of\nV1 eq:comparison_Lambda (`hcomp`: sub-solution vs. super-solution, on any partition `J ⊔ Jᶜ`). The\npaper's `u_*` is only a sub-solution, named `uSub`. The assumption `Γ ≤ Λ` is not used, hence\nomitted. Conclusion: `u ≥ t + (u_* - (1+ε) t - C_past - C'_Γ) / C_Γ` on `{u ≥ t}`.", "deps": ["GuaranteedSubsol.HasMemory.apply_eq_apply_max"], "labels": ["prop:olu_ge_ustar", "eq:comparison_Lambda"], "direct": ["GuaranteedSubsol.HasMemory.apply_eq_apply_max"]}, {"id": "GuaranteedSubsol.le_mul_iff_kruzkov", "short": "le_mul_iff_kruzkov", "file": "Anchors/TolIffKruzkov.lean", "title": "the tolerance criterion in Kruzkov coordinates", "source": "Complexity.tex eq. (tol_as_Kruzkov), scalar form, `u̲` in `ℝ_∞`; bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.TolKruzkovProof.le_mul_iff_kruzkov", "chapter": "Complexity", "statement": "theorem le_mul_iff_kruzkov {αinv ε : ℝ} (hα : 0 < αinv) (uSub : ℝ) (uSup : WithTop ℝ) :\n    uSup ≤ (((1 + ε) * uSub : ℝ) : WithTop ℝ) ↔\n      kruzkov αinv uSup ≤ kruzkov αinv uSub * Real.exp (-ε * αinv * uSub)", "doc": "Source: Complexity.tex, eq. (tol_as_Kruzkov), scalar form:\n`(1+ε) ū ≥ u̲ ⇔ v̄ exp(-ε ū/α) ≥ v̲`, where `v̄ := E_α ū` and `v̲ := E_α u̲`.\nHere `E_α = kruzkov αinv`, with `αinv = 1/α > 0`. The value `u̲ ∈ ℝ_∞ = WithTop ℝ` may be\ninfinite (as for the super-solution of the ANB method), while `ū ∈ ℝ`.", "deps": [], "labels": ["eq:tol_as_Kruzkov"], "direct": []}, {"id": "GuaranteedSubsol.t_advances", "short": "t_advances", "file": "Anchors/TAdvances.lean", "title": "the tolerance criterion advances in the narrow band", "source": "Prop. prop:t_advances (Complexity.tex); unused hypotheses dropped (author ruling); bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.TAdvancesProof.t_advances", "chapter": "Complexity", "statement": "theorem t_advances {X : Type*} [Finite X] {Λ : (X → ℝ) → X → ℝ} {I : Set X} {ubd : X → ℝ}\n    (hΛbd : ∀ u, ∀ x ∉ I, Λ u x = ubd x) {α αinv ρ : ℝ} (hα : 0 < α) (hααinv : α * αinv = 1)\n    (hρ₀ : 0 ≤ ρ) (hρ₁ : ρ < 1) (hadd : ∀ x ∈ I, AdditivelyInvariant (Λ · x))\n    (hsub : ∀ x ∈ I, SubAdditive ρ (kruzkovOp α (Λ · x)))\n    {uSub vsub vsup : X → ℝ} (hvsub : ∀ x, vsub x = kruzkov αinv (uSub x))\n    (hvsup : ∀ x, vsup x ≤ 0) {Tm Tp ξ ε C t Δ : ℝ} (hTm : 0 ≤ Tm) (hξ : 0 ≤ ξ)\n    (hε : 0 < ε) (hC : 1 ≤ C) (ht : t = (Tp + Tm) / 2) (hΔ : Δ = (Tp - Tm) / 2)\n    (ha₁ : ∀ x, Tm ≤ uSub x → uSub x < Tp → -((1 - ρ) * ξ) ≤ vsub x - kruzkovOp α (Λ · x) vsub)\n    (ha₂ : ∀ x, Tm ≤ uSub x → uSub x < Tp → vsup x - kruzkovOp α (Λ · x) vsup ≤ (1 - ρ) * ξ)\n    (hb : ∀ x, Tp ≤ uSub x → -ξ ≤ vsub x)\n    (hc : ∀ x, uSub x < Tm → vsup x ≤ vsub x * Real.exp (-ε * αinv * uSub x))\n    (hξC : ξ ≤ C * Real.exp (-αinv * Tp)) (hεT : ε * Tp ≤ α)\n    (hΔlarge : 2 * α * max 1 (Real.log (2 * Real.exp 1 * C / ε)) ≤ Δ) :\n    ∀ x, t - Δ / 2 ≤ uSub x → uSub x ≤ t + Δ / 2 →\n      vsup x ≤ vsub x * Real.exp (-ε * αinv * uSub x)", "doc": "Source: Prop. prop:t_advances (Complexity.tex). Global operator `Λ : (X → ℝ) → X → ℝ` with\nDirichlet data `ubd` outside `I = Int X`; `Φ` at `x` is `kruzkovOp α (Λ · x)`. The Kruzkov\ntransform of `ū` is `v̄ = kruzkov αinv ū`, with `α * αinv = 1`. Author rulings: the monotonicity\nof `Λ` is not needed (the generalized `monotoneExtension` makes `Φ` monotone), and the\nassumptions `v̄ - Φ v̄ ≤ 0` and `0 ≤ v̲ - Φ v̲` of (a) are dropped, being unused. The assumption\n`T⁻ < T⁺` is dropped as well: it follows from the constraint on `Δ`.\n`t = (T⁺ + T⁻)/2` and `Δ = (T⁺ - T⁻)/2` are given by their definitions.", "deps": ["GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.kruzkovOp_mul", "GuaranteedSubsol.le_of_comparison"], "labels": ["prop:t_advances"], "direct": ["GuaranteedSubsol.kruzkovOp_mul", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.monotone_kruzkovOp"]}, {"id": "GuaranteedSubsol.abs_rpow_sub_rpow_le", "short": "abs_rpow_sub_rpow_le", "file": "Anchors/PowrDiff.lean", "title": "difference of powers", "source": "Lemma lem:powr_diff (Complexity.tex), `0 ≤ r` (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.PowrDiffProof.abs_rpow_sub_rpow_le", "chapter": "Complexity", "statement": "theorem abs_rpow_sub_rpow_le {a b r : ℝ} (ha : 0 ≤ a) (hb : 0 ≤ b) (hr₀ : 0 ≤ r) (hr₁ : r ≤ 1) :\n    |a ^ r - b ^ r| ≤ |a - b| ^ r", "doc": "Source: Lemma lem:powr_diff (Complexity.tex): for all `a, b ≥ 0` and `r ∈ [0,1]`,\n`|a^r - b^r| ≤ |a - b|^r` (real powers `Real.rpow`). The paper assumes `r ∈ ]0,1]`; the case\n`r = 0` also holds (author ruling: `0 ≤ r`).", "deps": [], "labels": ["lem:powr_diff"], "direct": []}, {"id": "GuaranteedSubsol.kruzkov_mul_eq_neg_rpow", "short": "kruzkov_mul_eq_neg_rpow", "file": "Anchors/KruzkovMulEqNegRpow.lean", "title": "change of Kruzkov timescale", "source": "Complexity.tex, equation before lem:powr_diff (`E_β u = -(-E_α u)^r`), scalar form", "state": "PROVED", "provider": "GuaranteedSubsol.KruzkovRpowProof.kruzkov_mul_eq_neg_rpow", "chapter": "Complexity", "statement": "theorem kruzkov_mul_eq_neg_rpow (αinv r u : ℝ) :\n    kruzkov (r * αinv) u = -(-kruzkov αinv u) ^ r", "doc": "Source: Complexity.tex, subsection \"Complexity with unknown property constants\" (equation before\nLemma lem:powr_diff), scalar form: if `v := E_α u` and `w := E_β u`, then `w = -(-v)^r` with\n`r := α/β`. With inverse timescales, `E_α = kruzkov αinv` and `E_β = kruzkov (r * αinv)`.\nReal `u`, as in the paper.", "deps": [], "labels": ["lem:powr_diff"], "direct": []}, {"id": "GuaranteedSubsol.t_advances_withUnknown", "short": "t_advances_withUnknown", "file": "Anchors/TAdvancesWithUnknown.lean", "title": "the tolerance criterion advances, unknown parameters", "source": "Prop. prop:t_advances_withUnknown (Complexity.tex); unused hypotheses and the unused `βinv` dropped (author ruling); bound variables renamed to lowerCamelCase (author ruling); renamed from `t_advances_small_alpha` (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.TAdvancesWithUnknownProof.t_advances_withUnknown", "chapter": "Complexity", "statement": "theorem t_advances_withUnknown {X : Type*} [Finite X] {Λ : (X → ℝ) → X → ℝ} {I : Set X}\n    {ubd : X → ℝ} (hΛbd : ∀ u, ∀ x ∉ I, Λ u x = ubd x) {α β αinv ρ σ r C : ℝ}\n    (hα : 0 < α) (hβ : 0 < β) (hααinv : α * αinv = 1)\n    (hρ₁ : ρ < 1) (hσ₀ : 0 ≤ σ) (hσ₁ : σ < 1) (hr : r = α / β) (hr₁ : r ≤ 1)\n    (hCdef : C = (1 - ρ) ^ r / (1 - σ)) (hC : 1 ≤ C)\n    (hadd : ∀ x ∈ I, AdditivelyInvariant (Λ · x))\n    (hsub : ∀ x ∈ I, SubAdditive σ (kruzkovOp β (Λ · x)))\n    {uSub vsub vsup : X → ℝ} (hvsub : ∀ x, vsub x = kruzkov αinv (uSub x))\n    (hvsup : ∀ x, vsup x ≤ 0) {Tm Tp ξ ε t Δ : ℝ} (hTm : 0 ≤ Tm) (hξ : 0 ≤ ξ) (hε : 0 < ε)\n    (ht : t = (Tp + Tm) / 2) (hΔ : Δ = (Tp - Tm) / 2)\n    (ha₁ : ∀ x, Tm ≤ uSub x → uSub x < Tp → -((1 - ρ) * ξ) ≤ vsub x - kruzkovOp α (Λ · x) vsub)\n    (ha₂ : ∀ x, Tm ≤ uSub x → uSub x < Tp → vsup x - kruzkovOp α (Λ · x) vsup ≤ (1 - ρ) * ξ)\n    (hb : ∀ x, Tp ≤ uSub x → -ξ ≤ vsub x)\n    (hc : ∀ x, uSub x < Tm → vsup x ≤ vsub x * Real.exp (-ε * αinv * uSub x))\n    (hξT : ξ ≤ Real.exp (-αinv * Tp)) (hεT : ε * Tp ≤ α)\n    (hΔlarge : 2 * β * max 1 (Real.log (2 * Real.exp 1 * C / ε)) ≤ Δ) :\n    ∀ x, t - Δ / 2 ≤ uSub x → uSub x ≤ t + Δ / 2 →\n      vsup x ≤ vsub x * Real.exp (-ε * αinv * uSub x)", "doc": "Source: Prop. prop:t_advances_withUnknown (Complexity.tex). Same conventions as `t_advances`:\nglobal operator `Λ` with Dirichlet data `ubd` outside `I = Int X`; `Φ_α` (resp. `Φ_β`) at `x` is\n`kruzkovOp α (Λ · x)` (resp. `kruzkovOp β (Λ · x)`); `v̄ = kruzkov αinv ū`; `α * αinv = 1`;\n`r = α / β`, `C = (1-ρ)^r / (1-σ)`, `t` and `Δ` given by their definitions.\nAuthor rulings: the monotonicity of `Λ`, the assumptions `v̄ - Φ_α v̄ ≤ 0` and `0 ≤ v̲ - Φ_α v̲`\nof (a), `T⁻ < T⁺` and `0 < ρ` are dropped, being unused (V1 assumes `ρ, σ ∈ ]0,1[`; here\n`0 ≤ σ < 1`). Renamed from `t_advances_small_alpha`\n(author ruling, 2026-10-14: `WithUnknown` in place of `small_alpha`; statement unchanged).", "deps": ["GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.kruzkovOp_mul", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.t_advances", "GuaranteedSubsol.abs_rpow_sub_rpow_le", "GuaranteedSubsol.kruzkov_mul_eq_neg_rpow"], "labels": ["prop:t_advances_withUnknown"], "direct": ["GuaranteedSubsol.abs_rpow_sub_rpow_le", "GuaranteedSubsol.kruzkov_mul_eq_neg_rpow", "GuaranteedSubsol.t_advances"]}, {"id": "GuaranteedSubsol.Ext.max_min_fixedPoint", "short": "Ext.max_min_fixedPoint", "file": "Anchors/ExtMaxMinFixedPoint.lean", "title": "fixed point of `max {ū, min {T, Γ}}` on `ℝ_∞`", "source": "Lemma lem:max_min (Complexity.tex), on `ℝ_∞`, under causality only (V1 also assumes `Γ` monotone and states uniqueness, which follows from `le_of_causal_ext`; author's ruling 2026-10-20, annotation); bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.ULessTProof.ext_max_min_fixedPoint", "chapter": "Complexity", "statement": "theorem max_min_fixedPoint {X : Type*} {Γ : (X → WithTop ℝ) → X → WithTop ℝ}\n    (hcaus : ∀ x, Causal (Γ · x)) (uSub : X → ℝ) (T : ℝ) {u uHat : X → WithTop ℝ}\n    (hu : u = fun x => max (uSub x : WithTop ℝ) (Γ u x))\n    (huHat : uHat = fun x => max (uSub x : WithTop ℝ) (min (T : WithTop ℝ) (u x))) :\n    ((fun x => max (uSub x : WithTop ℝ) (min (T : WithTop ℝ) (Γ uHat x))) = uHat) ∧\n      ∀ x, min (u x) T = min (uHat x) T", "doc": "Source: Lemma lem:max_min (Complexity.tex), on `ℝ_∞ = WithTop ℝ` (as used in the proof of\nLemma lem:u_less_t): let `Γ : (X → ℝ_∞) → X → ℝ_∞` be causal (`Ext.Causal` at every point). If\n`u = max {ū, Γ u}`, then `û := max {ū, min {T, u}}` satisfies `max {ū, min {T, Γ û}} = û`, and\n`min {u,T} = min {û,T}`. Here `ū` and `T` are real.\nAnnotation (author's ruling 2026-10-20): V1 lem:max_min assumes `Γ` monotone and causal and states\nthat `û` is the unique fixed point; the anchor proves the fixed-point identity under causality\nonly. Uniqueness is not part of the anchor; it follows from `le_of_causal_ext`.", "deps": [], "labels": ["lem:max_min"], "direct": []}, {"id": "GuaranteedSubsol.u_less_t", "short": "u_less_t", "file": "Anchors/ULessT.lean", "title": "cutting a fixed point of `max {ū, Γ}` at a level `T`", "source": "Lemma lem:u_less_t (Complexity.tex); monotonicity of `Γ` dropped (author ruling); the identities for a given fixed point `u` of `max {ū, Γ}`, existence and uniqueness of the three fixed points (stated in V1) not part of the anchor (author's ruling 2026-10-20, annotation); bound variables renamed to lowerCamelCase (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.ULessTProof.u_less_t", "chapter": "Complexity", "statement": "theorem u_less_t {X : Type*} {Γ : (X → WithTop ℝ) → X → WithTop ℝ}\n    (hcaus : ∀ x, Ext.Causal (Γ · x)) (uSub : X → ℝ) (T : ℝ) {u ucheck uHat : X → WithTop ℝ}\n    (hu : u = fun x => max (uSub x : WithTop ℝ) (Γ u x))\n    (hucheck : ucheck = fun x => cutoffLt T (u x))\n    (huHat : uHat = fun x => max (uSub x : WithTop ℝ) (min (T : WithTop ℝ) (ucheck x))) :\n    (ucheck = fun x => cutoffLt T (max (uSub x : WithTop ℝ) (Γ ucheck x))) ∧\n      (uHat = fun x => max (uSub x : WithTop ℝ) (min (T : WithTop ℝ) (Γ uHat x))) ∧\n      ucheck = fun x => cutoffLt T (uHat x)", "doc": "Source: Lemma lem:u_less_t (Complexity.tex): let `Γ : ℝ_∞^X → ℝ_∞^X` be causal (`Ext.Causal` at\nevery point), `ū ∈ ℝ^X`, `T ∈ ℝ`, and `u = max {ū, Γ u}`. Then `ǔ := u^{<T}` satisfies\n`ǔ = max {ū, Γ ǔ}^{<T}`; `û := max {ū, min {T, ǔ}}` satisfies `û = max {ū, min {T, Γ û}}`; and\n`ǔ = û^{<T}`. Cutoffs are `cutoffLt` pointwise. Author ruling: the monotonicity of `Γ` is\ndropped, being unused.\nAnnotation (author's ruling 2026-10-20): V1 lem:u_less_t states that the three operators are\nmonotone and causal and have unique fixed points `u`, `ǔ`, `û`; the anchor proves the identities\n`ǔ = u^{<T}`, `û = max {ū, min {T, ǔ}}`, `ǔ = û^{<T}` for a given fixed point `u` of\n`Γ' = max {ū, Γ}`, under causality only. Existence and uniqueness are not part of the anchor; they\nfollow from the comparison principle for causal operators and Dijkstra's method.", "deps": ["GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq", "GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.Ext.max_min_fixedPoint"], "labels": ["lem:u_less_t"], "direct": ["GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.Ext.max_min_fixedPoint"]}, {"id": "GuaranteedSubsol.u_less_t_existsUnique", "short": "u_less_t_existsUnique", "file": "Anchors/ULessTExistsUnique.lean", "title": "the three fixed points of lem:u_less_t exist and are unique", "source": "Lemma lem:u_less_t (Complexity.tex, V1), first sentence: `max {ū, Γ}`, `max {ū, Γ}^{<T}`, `max {ū, min {T, Γ}}` are monotone and causal and each has a unique fixed point in `ℝ_∞^X` (author's request 2026-10-20, completes `u_less_t`)", "state": "PROVED", "provider": "GuaranteedSubsol.ExistsUniqueProof.u_less_t_existsUnique", "chapter": "Complexity", "statement": "theorem u_less_t_existsUnique {X : Type*} [Finite X] {Γ : (X → WithTop ℝ) → X → WithTop ℝ}\n    (hmono : ∀ x, Monotone (Γ · x)) (hcaus : ∀ x, Ext.Causal (Γ · x)) (uSub : X → ℝ) (T : ℝ) :\n    (∀ x, Monotone (fun u => max (uSub x : WithTop ℝ) (Γ u x)) ∧\n      Ext.Causal (fun u => max (uSub x : WithTop ℝ) (Γ u x))) ∧\n    (∀ x, Monotone (fun u => cutoffLt T (max (uSub x : WithTop ℝ) (Γ u x))) ∧\n      Ext.Causal (fun u => cutoffLt T (max (uSub x : WithTop ℝ) (Γ u x)))) ∧\n    (∀ x, Monotone (fun u => max (uSub x : WithTop ℝ) (min (T : WithTop ℝ) (Γ u x))) ∧\n      Ext.Causal (fun u => max (uSub x : WithTop ℝ) (min (T : WithTop ℝ) (Γ u x)))) ∧\n    (∃! u : X → WithTop ℝ, u = fun x => max (uSub x : WithTop ℝ) (Γ u x)) ∧\n    (∃! u : X → WithTop ℝ, u = fun x => cutoffLt T (max (uSub x : WithTop ℝ) (Γ u x))) ∧\n    (∃! u : X → WithTop ℝ,\n      u = fun x => max (uSub x : WithTop ℝ) (min (T : WithTop ℝ) (Γ u x)))", "doc": "Source: Lemma lem:u_less_t (Complexity.tex, V1), first sentence (author's request 2026-10-20,\ncompleting the anchor `u_less_t`): let `Γ : ℝ_∞^X → ℝ_∞^X` be monotone and causal (at every\npoint), `ū ∈ ℝ^X`, `T ∈ ℝ`. Then the operators `Γ' := max {ū, Γ}`, `Γ̌ := max {ū, Γ}^{<T}` and\n`Γ̂ := max {ū, min {T, Γ}}` are monotone and causal, and each has a unique fixed point in `ℝ_∞^X`\n(the fixed points `u`, `ǔ`, `û` of the lemma). The operators are written out pointwise; the fixed\npoints are stated in the form `u = fun x => …` of the hypotheses of `u_less_t`. Cutoffs are\n`cutoffLt` (eq. eqdef:u_less_t). `X` is finite.", "deps": ["GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.min_eq_min_iff_cutoffLt_eq", "GuaranteedSubsol.exists_min_eq_min_iff_cutoffLe_eq", "GuaranteedSubsol.le_of_causal_ext", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.Ext.causal_iff_cutoff"], "labels": ["lem:u_less_t"], "direct": ["GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.Ext.causal_iff_cutoff", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.le_of_causal_ext"]}, {"id": "GuaranteedSubsol.kruzkov_local_of_subAdditive", "short": "kruzkov_local_of_subAdditive", "file": "Anchors/KruzkovLocalOfSubAdditive.lean", "title": "sub-additivity of `Φ_α` implies the local expansion, with `O(t²)`", "source": "Prop. prop:subadd_local (Subadd.tex), (⇒) with `O(t²)`, scalar form; continuity (V1; V0: local Lipschitz) and finiteness dropped (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.SubaddLocalFwdProof.kruzkov_local_of_subAdditive", "chapter": "Subadd", "statement": "theorem kruzkov_local_of_subAdditive {X : Type*} {Λ : (X → ℝ) → ℝ} (hmono : Monotone Λ)\n    {α αinv ρ : ℝ} (hα : 0 < α) (hααinv : α * αinv = 1) (hρ : 0 ≤ ρ)\n    (h : SubAdditive ρ (kruzkovOp α Λ)) (u : X → ℝ) :\n    ∃ K : ℝ, ∀ᶠ t in 𝓝[>] (0 : ℝ),\n      Λ (fun y => u y + t * Real.exp (αinv * u y)) ≤\n        Λ u + ρ * t * Real.exp (αinv * Λ u) + K * t ^ 2", "doc": "Source: Prop. prop:subadd_local (Subadd.tex), direct implication, scalar form, with the strongest\nconclusion (the `O(t²)` variant): if `Λ` is monotone and\n`Φ_α = kruzkovOp α Λ` is `ρ`-sub-additive, then for every `u`,\n`Λ [u + t exp(u/α)] ≤ Λ u + ρ t exp(Λ u / α) + O(t²)` as `t → 0⁺`. Here `α * αinv = 1`.\nAuthor ruling: the continuity assumption of V1 (V0: local Lipschitz) and the finiteness of `X` are\ndropped, being unused in this direction; `0 ≤ ρ` in place of V1's `ρ > 0`.", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp"], "labels": ["prop:subadd_local"], "direct": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_kruzkovOp"]}, {"id": "GuaranteedSubsol.subAdditive_of_kruzkov_local", "short": "subAdditive_of_kruzkov_local", "file": "Anchors/SubAdditiveOfKruzkovLocal.lean", "title": "the local expansion implies sub-additivity of `Φ_α`", "source": "Prop. prop:subadd_local (Subadd.tex), (⇐) from `o(t)`, scalar form; continuity, as in V1 (author ruling; V0: local Lipschitz)", "state": "PROVED", "provider": "GuaranteedSubsol.SubaddLocalBwdProof.subAdditive_of_kruzkov_local", "chapter": "Subadd", "statement": "theorem subAdditive_of_kruzkov_local {X : Type*} [Finite X] {Λ : (X → ℝ) → ℝ}\n    (hmono : Monotone Λ) (hcont : Continuous Λ) {α αinv ρ : ℝ} (hα : 0 < α)\n    (hααinv : α * αinv = 1) (hρ : 0 ≤ ρ)\n    (h : ∀ (u : X → ℝ), ∀ η > (0 : ℝ), ∀ᶠ t in 𝓝[>] (0 : ℝ),\n      Λ (fun y => u y + t * Real.exp (αinv * u y)) ≤\n        Λ u + ρ * t * Real.exp (αinv * Λ u) + η * t) :\n    SubAdditive ρ (kruzkovOp α Λ)", "doc": "Source: Prop. prop:subadd_local (Subadd.tex), converse implication, scalar form, with the weakest\nhypothesis (the `o(t)` variant): if `Λ` is monotone and continuous and, for every `u`,\n`Λ [u + t exp(u/α)] ≤ Λ u + ρ t exp(Λ u / α) + o(t)` as `t → 0⁺`, then `Φ_α = kruzkovOp α Λ`\nis `ρ`-sub-additive. The `o(t)` is written `∀ η > 0, ∀ᶠ t in 𝓝[>] 0, … + η t`;\n`α * αinv = 1`.\nAs in V1, `Λ` is continuous (author ruling; V0 assumed it locally Lipschitz); `X` is `Finite`\n(only continuity and finiteness are used); `0 ≤ ρ` in place of V1's `ρ > 0`.", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp"], "labels": ["prop:subadd_local"], "direct": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_kruzkovOp"]}, {"id": "GuaranteedSubsol.local_iff_local_x", "short": "local_iff_local_x", "file": "Anchors/LocalIffLocalX.lean", "title": "the two local formulations of sub-additivity in Kruzkov coordinates", "source": "Prop. prop:subadd_local (Subadd.tex), (subadd_local) ⇔ (subadd_local_x), `o(t)`", "state": "PROVED", "provider": "GuaranteedSubsol.LocalXProof.local_iff_local_x", "chapter": "Subadd", "statement": "theorem local_iff_local_x {X : Type*} (Λ : (X → ℝ) → ℝ) {αinv ρ : ℝ} :\n    (∀ (u : X → ℝ), ∀ η > (0 : ℝ), ∀ᶠ t in 𝓝[>] (0 : ℝ),\n        Λ (fun y => u y + t * Real.exp (αinv * u y)) ≤\n          Λ u + ρ * t * Real.exp (αinv * Λ u) + η * t) ↔\n      ∀ (u : X → ℝ), ∀ η > (0 : ℝ), ∀ᶠ t in 𝓝[>] (0 : ℝ),\n        Λ (fun y => u y + t * Real.exp (αinv * (u y - Λ u))) ≤ Λ u + ρ * t + η * t", "doc": "Source: Prop. prop:subadd_local (Subadd.tex), equivalence of (subadd_local) and (subadd_local_x),\nscalar form, with `o(t)` remainders written `∀ η > 0, ∀ᶠ t in 𝓝[>] 0, … + η t`. It is the change\nof variable `t' = t exp(-Λ u / α)`, valid for any operator `Λ`; `αinv = 1/α`.", "deps": [], "labels": ["prop:subadd_local"], "direct": []}, {"id": "GuaranteedSubsol.local_iff_local_x_sq", "short": "local_iff_local_x_sq", "file": "Anchors/LocalIffLocalXSq.lean", "title": "the two local formulations of sub-additivity, with `O(t²)` remainders", "source": "Prop. prop:subadd_local (Subadd.tex), (subadd_local) ⇔ (subadd_local_x), `O(t²)`", "state": "PROVED", "provider": "GuaranteedSubsol.LocalXProof.local_iff_local_x_sq", "chapter": "Subadd", "statement": "theorem local_iff_local_x_sq {X : Type*} (Λ : (X → ℝ) → ℝ) {αinv ρ : ℝ} :\n    (∀ (u : X → ℝ), ∃ K : ℝ, ∀ᶠ t in 𝓝[>] (0 : ℝ),\n        Λ (fun y => u y + t * Real.exp (αinv * u y)) ≤\n          Λ u + ρ * t * Real.exp (αinv * Λ u) + K * t ^ 2) ↔\n      ∀ (u : X → ℝ), ∃ K : ℝ, ∀ᶠ t in 𝓝[>] (0 : ℝ),\n        Λ (fun y => u y + t * Real.exp (αinv * (u y - Λ u))) ≤ Λ u + ρ * t + K * t ^ 2", "doc": "Source: Prop. prop:subadd_local (Subadd.tex), equivalence of (subadd_local) and (subadd_local_x)\nin the variant where `o(t)` is replaced with `O(t²)` (\"The equivalence also holds if the\nremainder `o(t)` is replaced with `O(t²)`\"), scalar form. `O(t²)` is written\n`∃ K, ∀ᶠ t in 𝓝[>] 0, … + K t²`. It is the change of variable `t' = t exp(-Λ u / α)`, valid for\nany operator `Λ`; `αinv = 1/α`. Together with `kruzkov_local_of_subAdditive`, it gives\n(subadd_local_x) with `O(t²)` from the `ρ`-sub-additivity of `Φ_α`.", "deps": [], "labels": ["prop:subadd_local"], "direct": []}, {"id": "GuaranteedSubsol.subAdditive_kruzkovOp_iff_of_concave", "short": "subAdditive_kruzkovOp_iff_of_concave", "file": "Anchors/SubAdditiveIffOfConcave.lean", "title": "sub-additivity of `Φ_α` for a concave operator", "source": "Corol. corol:subadd_concave (Subadd.tex), scalar form", "state": "PROVED", "provider": "GuaranteedSubsol.SubaddConcaveProof.subAdditive_kruzkovOp_iff_of_concave", "chapter": "Subadd", "statement": "theorem subAdditive_kruzkovOp_iff_of_concave {X : Type*} [Finite X] {Λ : (X → ℝ) → ℝ}\n    (hmono : Monotone Λ) (hconc : ConcaveOn ℝ Set.univ Λ) {α αinv ρ : ℝ} (hα : 0 < α)\n    (hααinv : α * αinv = 1) (hρ : 0 ≤ ρ) :\n    SubAdditive ρ (kruzkovOp α Λ) ↔\n      ∀ (u : X → ℝ) (t : ℝ), 0 ≤ t →\n        Λ (fun y => u y + t * Real.exp (αinv * u y)) ≤ Λ u + ρ * t * Real.exp (αinv * Λ u)", "doc": "Source: Corol. corol:subadd_concave (Subadd.tex), scalar form: if `Λ` is monotone and concave,\nthen `Φ_α = kruzkovOp α Λ` is `ρ`-sub-additive iff\n`Λ [u + t exp(u/α)] ≤ Λ u + ρ t exp(Λ u / α)` for all `u` and all `t ≥ 0`. Here `α * αinv = 1`\nand `X` is finite (standing assumption).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.kruzkov_local_of_subAdditive", "GuaranteedSubsol.subAdditive_of_kruzkov_local"], "labels": ["corol:subadd_concave"], "direct": ["GuaranteedSubsol.kruzkov_local_of_subAdditive", "GuaranteedSubsol.subAdditive_of_kruzkov_local"]}, {"id": "GuaranteedSubsol.subAdditive_kruzkovOp_of_le", "short": "subAdditive_kruzkovOp_of_le", "file": "Anchors/SubAdditiveKruzkovOpOfLe.lean", "title": "sub-additivity in Kruzkov coordinates at a larger timescale", "source": "Prop. prop:subadd_alpha_beta (Subadd.tex), scalar form; no restriction `ρ < 1`, `σ < 1`, as in V1 (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.SubaddConcaveProof.subAdditive_kruzkovOp_of_le", "chapter": "Subadd", "statement": "theorem subAdditive_kruzkovOp_of_le {X : Type*} [Finite X] {Λ : (X → ℝ) → ℝ}\n    (hmono : Monotone Λ) (hsub1 : SubAdditive 1 Λ) {α β ρ σ : ℝ} (hα : 0 < α) (hαβ : α ≤ β)\n    (hρ : 0 ≤ ρ) (hσ : (1 - α / β) + ρ * (α / β) ≤ σ) (h : SubAdditive ρ (kruzkovOp α Λ)) :\n    SubAdditive σ (kruzkovOp β Λ)", "doc": "Source: Prop. prop:subadd_alpha_beta (Subadd.tex), scalar form: if `Λ` is monotone and\n`1`-sub-additive and `Φ_α` is `ρ`-sub-additive, with `α > 0` and `ρ ≥ 0`, then `Φ_β` is\n`σ`-sub-additive for every `β ≥ α` and `σ ≥ (1 - α/β) + ρ α/β`, without restrictions `ρ < 1`,\n`σ < 1`, as in V1 (author ruling). `X` is finite (standing assumption).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.kruzkov_local_of_subAdditive", "GuaranteedSubsol.subAdditive_of_kruzkov_local", "GuaranteedSubsol.local_iff_local_x", "GuaranteedSubsol.local_iff_local_x_sq"], "labels": ["prop:subadd_alpha_beta"], "direct": ["GuaranteedSubsol.kruzkov_local_of_subAdditive", "GuaranteedSubsol.local_iff_local_x", "GuaranteedSubsol.local_iff_local_x_sq", "GuaranteedSubsol.subAdditive_of_kruzkov_local"]}, {"id": "GuaranteedSubsol.subAdditive_kruzkovOp_of_strictlyCausal", "short": "subAdditive_kruzkovOp_of_strictlyCausal", "file": "Anchors/SubAdditiveKruzkovOpOfStrictlyCausal.lean", "title": "strict causality implies sub-additivity in Kruzkov coordinates", "source": "Prop. prop:strict_causal_implies_subadd (Subadd.tex), scalar form; `δ > 0` dropped (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.StrictCausalSubaddProof.subAdditive_kruzkovOp_of_strictlyCausal", "chapter": "Subadd", "statement": "theorem subAdditive_kruzkovOp_of_strictlyCausal {X : Type*} [Finite X] {Λ : (X → ℝ) → ℝ}\n    (hmono : Monotone Λ) (hsub1 : SubAdditive 1 Λ) {δ α : ℝ}\n    (hcaus : StrictlyCausal δ Λ) (hα : 0 < α) :\n    SubAdditive (Real.exp (-δ / α)) (kruzkovOp α Λ)", "doc": "Source: Prop. prop:strict_causal_implies_subadd (Subadd.tex), scalar form: if `Λ` is\n`δ`-strictly-causal, monotone and `1`-sub-additive, with gsiProof.count_le", "chapter": "AGSI2", "statement": "theorem parallelAgsiRun_count_le {X : Type*} [Fintype X] {Φ : (X → ℝ) → X → ℝ} (hmono : Monotone Φ)\n    (hcomp : HasComparisonPrinciple Set.univ Φ) {w : X → ℝ} (hw : w ≤ Φ w) {η : ℝ}\n    {v : X → ℝ} (hv : Φ v ≤ v) (n : ℕ) :\n    η * ∑ x, ((parallelAgsiRun Φ η v n).count x : ℝ) ≤ ∑ x, (v x - w x)", "doc": "Source: Algorithm algo:agsi_parallel (AGSI2.tex) and a V0 `\\formalizationInstruction` below it,\nremoved in V1 (author's request): if `Φ` is\nmonotone, satisfies the comparison principle and admits a sub-solution `w`, and `v` is a\nsuper-solution, then `v` stays above `w`, while `∑_X v` decreases by more than `η` at each update\n`v(x) ← Φ v(x)`. Hence `η` times the total number of updates is at most `∑_X (v - w)`.\nAuthor ruling: the assumption `η > 0` is dropped, being unneeded.", "deps": ["GuaranteedSubsol.restrictOp_superSolution", "GuaranteedSubsol.parallelAgsiStep_superSolution"], "labels": ["algo:agsi_parallel"], "direct": ["GuaranteedSubsol.parallelAgsiStep_superSolution"]}, {"id": "GuaranteedSubsol.parallelAgsiRun_terminates", "short": "parallelAgsiRun_terminates", "file": "Anchors/ParallelAgsiRunTerminates.lean", "title": "termination of the parallel AGSI", "source": "Algo. algo:agsi_parallel (AGSI2.tex), termination with a bound on the passes (V0 formalizationInstruction, removed in V1; author's request); restated with `parallelAgsiRun`, equal by definition (author ruling); renamed to the naming scheme (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.ParallelAgsiProof.terminates", "chapter": "AGSI2", "statement": "theorem parallelAgsiRun_terminates {X : Type*} [Fintype X] {Φ : (X → ℝ) → X → ℝ}\n    (hmono : Monotone Φ) (hcomp : HasComparisonPrinciple Set.univ Φ) {w : X → ℝ}\n    (hw : w ≤ Φ w) {η : ℝ} (hη : 0 < η) {v : X → ℝ} (hv : Φ v ≤ v) :\n    ∃ n ≤ ⌈(∑ x, (v x - w x)) / η⌉₊, ∀ x,\n      (parallelAgsiRun Φ η v n).v x - Φ (parallelAgsiRun Φ η v n).v x ≤ η", "doc": "Source: Algor he finite super-solution (`u_*` is one) and the positive\nboundary conditions (beyond `Λ[0] ≥ 0`) are not used, hence omitted. `X` is finite and linearly\nordered (tie-breaking).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.le_of_causal_real", "GuaranteedSubsol.exists_fixedPoint_of_causal", "GuaranteedSubsol.Causal.max", "GuaranteedSubsol.Causal.min", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.HasMemory.apply_eq_apply_max", "GuaranteedSubsol.subsol_extension", "GuaranteedSubsol.max_min_fixedPoint", "GuaranteedSubsol.Causal.max_min", "GuaranteedSubsol.subsol_growth", "GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbRun_always_subsol", "GuaranteedSubsol.anbStep_eq_of_notMem_band", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.monotone_bandOp"], "labels": ["corol:Bn_comp"], "direct": ["GuaranteedSubsol.Causal.max_min", "GuaranteedSubsol.anbRun_always_subsol", "GuaranteedSubsol.exists_fixedPoint_of_causal", "GuaranteedSubsol.max_min_fixedPoint", "GuaranteedSubsol.subsol_extension", "GuaranteedSubsol.subsol_growth"]}, {"id": "GuaranteedSubsol.anbRun_first_iter", "short": "anbRun_first_iter", "file": "Anchors/AnbRunFirstIter.lean", "title": "the first iterations of the ANB are vacuous", "source": "Lemma lem:first_iter (Complexity.tex), iterations `1 ≤ k` with `kτ ≤ min u_bd`; counters vanish (author's request); used parts of assum:all, and `Λ[0] ≥ 0` (a consequence of assum:all, see the remark after prop:always_subsol); causality of `Γ` unused, omitted", "state": "PROVED", "provider": "GuaranteedSubsol.AnbFirstIterProof.first_iter", "chapter": "Complexity", "statement": "theorem anbRun_first_iter {X : Type*} [Fintype X] [LinearOrder X] {p : AnbParams X}\n    {I : Set X} {ubd : X → ℝ} (hΓbd : ∀ u, ∀  inner loops of the ANB stop after at most `N''_Λ` passes", "source": "Prop. prop:niter_while (Complexity.tex), the inner loops perform at most `N''_Λ` passes (pass counts in `ℕ∞`, `⊤` if a loop never stops, so that the bound expresses termination; author ruling), via the termination of the global iteration on the band (author's request); hypotheses of corol:max_width and `0 < ρ`; constants renamed with Greek letters (author ruling)", "state": "PROVED", "provider": "GuaranteedSubsol.AnbNiterProof.passes_le", "chapter": "Complexity", "statement": "theorem anbRunData_passes_le {X : Type*} [Fintype X] [LinearOrder X] {p : AnbParams X}\n    {I : Set X} {ubd : X → ℝ} (hΛbd : ∀ u, ∀ x ∉ I, p.Λ u x = ubd x)\n    (hΓbd : ∀ u, ∀ x ∉ I, p.Γ u x = ubd x) {CΓ CΓ' : ℝ} (hCΓ : 1 ≤ CΓ)\n    (hΛmono : ∀ x, Monotone (p.Λ · x)) (hadd : ∀ x ∈ I, AdditivelyInvariant (p.Λ · x))\n    (hcmp : ∀ x ∈ I, Comparable CΓ CΓ' (p.Λ · x) (p.Γ · x))\n    (hΓmono : ∀ x, Monotone (p.Γ · x)) (hΓcaus : ∀ x, Causal (p.Γ · x))\n    (hΓadd : ∀ x ∈ I, AdditivelyInvariant (p.Γ · x)) (hΓΛ : ∀ u, p.Γ u ≤ p.Λ u)\n    (hsub : ∀ x ∈ I, SubAdditive p.ρ (kruzkovOp p.α (p.Λ · x))) (hα : 0 < p.α)\n    (hρ0 : 0 ≤ p.ρ) (hρ1 : p.ρ < 1) (hτ : 0 < p.τ) {uFix : X → ℝ} (hfix : p.Λ uFix = uFix)\n    (hε : 0 < p.ε) (hεmax : p.ε ≤ p.εmax uFix) (hbd : ∀ x ∉ I, 2 * p.Δmax ≤ ubd x)\n    (hρpos : 0 < p.ρ) (k : ℕ) :\n    (anbRunData p k).passesSub ≤ (p.NΛ'' : ℕ∞) ∧\n      (anbRunData p k).passesSup ≤ (p.NΛ'' : ℕ∞)", "doc": "Source: Prop. prop:niter_while (Complexity.tex): in each iteration of the ANB, the inner loops of\nlines anb:while_sub and anb:while_sup (global iterations on the band `B_n`, `AnbStepData.ΦSub`,\n`AnbStepData.ΦSup`) perform at most `N''_Λ := ⌈(2Δ_max/α - ln(1 - ρ))/(-ln ρ)⌉` passes\n(`AnbParams.NΛ''`); in particular they stop, since the number of passes is `⊤` (in `ℕ∞`)\nfor a loop that never stops (author ruling, 2026-10-14: pass counts in `ℕ∞`). The proof uses the\ntermination of the global iteration (`globalIterSubRun_terminates`, `globalIterRun_terminates`)\napplied on the band (author's request).\nHypotheses: those of Corollary corol:max_width (see `anbRunData_Δ_lt_Δmax`, with\n`Δ_max := 2α ln(2e/ε) + 2τ`, as in V1), and `ρ > 0` (`ln ρ` appears in `N''_Λ`), as in V1. `X` is\nfinite and linearly ordered (tie-breaking). Constants renamed with Greek letters (`Δmax`,\n`ΔplusMax`, `εmax`, `NΛ'`, `NΛ''`, `NΓ`) and inner-loop pass counts written `passesSub`, `passesSup`\n(author ruling, 2026-10-14; statements equal by definition).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.le_apply_zero_of_kruzkov_subAdditive", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_fixedPoint", "GuaranteedSubsol.monotone_monotoneExtension", "GuaranteedSubsol.monotone_kruzkovOp", "GuaranteedSubsol.kruzkovOp_mul", "GuaranteedSubsol.le_of_comparison", "GuaranteedSubsol.le_of_subSolution_superSolution", "GuaranteedSubsol.Ext.Causal.max", "GuaranteedSubsol.Ext.Causal.min", "GuaranteedSubsol.t_advances", "GuaranteedSubsol.globalIterRun_superSolution", "GuaranteedSubsol.globalIterSubRun_subSolution", "GuaranteedSubsol.globalIterRun_le_pow_mul", "GuaranteedSubsol.globalIterSubRun_le_pow_mul", "GuaranteedSubsol.globalIterRun_terminates", "GuaranteedSubsol.globalIterSubRun_terminates", "GuaranteedSubsol.anbRun_zero_vacuous", "GuaranteedSubsol.anbStepData_uHat_eq", "GuaranteedSubsol.anbRun_always_subsol", "GuaranteedSubsol.anbStep_eq_of_notMem_band", "GuaranteedSubsol.anbRun_guess_superSolution", "GuaranteedSubsol.anbRun_first_iter", "GuaranteedSubsol.monotone_bandOp", "GuaranteedSubsol.subAdditive_bandOp"], "labels": ["prop:niter_while", "corol:max_width"], "direct": ["GuaranteedSubsol.anbRun_always_subsol", "GuaranteedSubsol.anbRun_first_iter", "GuaranteedSubsol.anbRun_zero_vacuous", "GuaranteedSubsol.globalIterRun_terminates", "GuaranteedSubsol.globalIterSubRun_terminates", "GuaranteedSubsol.le_apply_zero_of_kruzkov_subAdditive", "GuaranteedSubsol.l     (anbAgsiRun p (k + 1)).countSup x ≤ (anbAgsiRun p k).countSup x + (p.NΛ''agsi : ℕ∞)) ∧\n        (∀ (x : X) (S : Finset ℕ), (∀ k ∈ S, x ∈ (anbAgsiRunData p k).band) →\n          S.card ≤ p.NΛ' Cpast CΓ CΓ' uFix) ∧\n        (∀ (k : ℕ) (x : X),\n          (anbAgsiRun p k).countSub x ≤ ((p.NΛ' Cpast CΓ CΓ' uFix * p.NΛ''agsi : ℕ) : ℕ∞) ∧\n          (anbAgsiRun p k).countSup x ≤ ((p.NΛ' Cpast CΓ CΓ' uFix * p.NΛ''agsi : ℕ) : ℕ∞) ∧\n          (anbAgsiRun p k).countHat x ≤ p.NΓ Cpast CΓ CΓ' uFix))", "doc": "Source: Theorem th:complexity_with_agsi (AGSI2.tex), packaged as `anbRun_complexity` (author's\nrequest): the statement of Theorem th:complexity holds when lines anb:while_sub and anb:while_sup\nof algo:anb are replaced with parallel AGSI on the band `B_n` (`anbAgsiRun`, the ANB with the inner\nsolver `anbAgsi`), with the modified constant `N''_Λ := ⌈2Δ_max/(-α ln ρ)⌉ + ⌊2/(1 - ρ)²⌋`\n(`AnbParams.NΛ''agsi`). As in V1 (author rulings now in the paper): `Δ_max := 2α ln(2e/ε) + 2τ`,\n`n_max` with a ceiling, `2 Δ_max ≤ min u_bd`, `0 < ρ < 1`, the bound `N_Λ` for each of the two\ncounters, and `Δ_max` in `N''_Λ`. Departures from V1: the second term `2/(1 - ρ)²` of `N''_Λ` is\nrounded down since the update counts are integers; the joint \"Until\" loop of the paper is modelled\nas two separate AGSI runs, for `ū` and for `u̲`, which is equivalent since the two updates do not\ninteract. The AGSI bounds the number of updates at each point of the band, not the number of passes\nof the inner loops (a pass may update a single point): the bound on the passes of the inner loops in\n`anbRun_complexity` is replaced with the bound `N''_Λ` on the number of updates at each point in\neach iteration (the counters increase by at most `N''_Λ`). `X` is finite and linearly ordered\n(tie-breaking).", "deps": ["GuaranteedSubsol.monotoneExtension_coe", "GuaranteedSubsol.le_apply_zero_of_kruzkov_subAdditive", "GuaranteedSubsol.dijkstraStep_superSolution", "GuaranteedSubsol.dijkstraRun_count_le_one
